sue #3313):\n\n1. Populates kernel with two canned history entries (user + assistant messages)\n2. Client sends `LoadSessionRequest` with a stable session ID (`\"reconnecting-session\"`)\n3. The server looks up the session, fetches history via `fetch_session_history`, and emits `SessionUpdate` notifications\n4. Asserts two notifications arrive — first a `UserMessageChunk` with `\"previous question\"`, then an `AgentMessageChunk` with `\"previous answer\"`\n\n## Conventions\n\n- All tests use `#[tokio::test(flavor = \"current_thread\")]` with `LocalSet` to support `spawn_local` for the server task.\n- The server task is fire-and-forget (`let _ = run_with_transport(...).await`) — tests don't depend on clean shutdown.\n- Timing-sensitive assertions use polling loops (up to 40 iterations × 25ms = ~1s) rather than fixed sleeps where possible, improving reliability without excessive wait times.","other-librefang-acp":"# Other — librefang-acp\n\n# librefang-acp\n\nAgent Client Protocol (ACP) adapter for LibreFang — provides the bridge layer that lets LibreFang agents run inside editors (Zed, VS Code, JetBrains) over a stdio JSON-RPC transport.\n\n## Overview\n\nThis crate implements the editor-facing side of the [Agent Client Protocol](https://github.com/Aider-AI/agent-client-protocol) for LibreFang. Editors that support ACP communicate with agents over JSON-RPC, typically piped through stdin/stdout. `librefang-acp` translates those protocol messages into LibreFang kernel operations and back.\n\nThe crate is intentionally split into a **protocol core** (always compiled) and an optional **kernel binding** (behind the `kernel-adapter` feature). This separation lets integration tests and alternative kernel implementations use the protocol layer without pulling in the full `librefang-kernel` dependency tree.\n\n## Architecture\n\n```mermaid\ngraph TD\n    Editor[\"Editor (Zed / VS Code / JetBrains)\"]\n    ACP[\"agent-client-protocol<br/>(workspace crate)\"]\n    ACPTokio[\"agent-client-protocol-tokio\"]\n    LFA[\"librefang-acp<br/>(this crate)\"]\n    AK[\"AcpKernel trait\"]\n    KA[\"KernelAdapter<br/>(feature: kernel-adapter)\"]\n    LFK[\"librefang-kernel\"]\n    LFT[\"librefang-types\"]\n    LLD[\"librefang-llm-driver\"]\n    LKH[\"librefang-kernel-handle\"]\n\n    Editor -->|\"stdio JSON-RPC\"| ACPTokio\n    ACPTokio --> ACP\n    LFA --> ACP\n    LFA --> ACPTokio\n    LFA --> AK\n    KA -.->|\"implements\"| AK\n    KA --> LFK\n    LFA --> LFT\n    LFA --> LLD\n    LFA --> LKH\n```\n\n## Key Abstractions\n\n### `AcpKernel` trait\n\nThe central trait that decouples ACP protocol handling from any specific kernel backend. Anything implementing `AcpKernel` can serve as the agent engine behind the ACP server. The trait captures the operations an editor client needs: initiating sessions, sending prompts, handling approval requests, and streaming responses.\n\nPure-protocol consumers (integration tests, alternative backends) implement this trait directly against their own infrastructure, avoiding the `librefang-kernel` dependency entirely.\n\n### `KernelAdapter` (feature-gated)\n\nBehind the `kernel-adapter` feature, this struct wraps `Arc<LibreFangKernel>` and implements `AcpKernel`. This is the production path: `librefang-cli` and `librefang-api` both enable this feature so they can host an in-process ACP server without duplicating the kernel binding logic.\n\n## Feature Flags\n\n| Flag | Default | Description |\n|------|---------|-------------|\n| `kernel-adapter` | off | Pulls in `librefang-kernel`. Provides `KernelAdapter` that implements `AcpKernel` over a real kernel instance. |\n\n## Dependencies — why each one\n\n| Dependency | Role in this crate |\n|---|---|\n| `agent-client-protocol` | Core ACP types, JSON-RPC method definitions, request/response schemas |\n| `agent-client-protocol-tokio` | Tokio-based transport layer for the stdio JSON-RPC duplex |\n| `librefang-types` | Shared domain types used across all LibreFang crates |\n| `librefang-llm-driver` | LLM abstraction — the kernel delegates model calls through this |\n| `librefang-kernel-handle` | Lightweight handle type for referencing a kernel without owning it |\n| `dashmap` | Concurrent `HashMap` for tracking in-flight sessions and approval callbacks |\n| `uuid` | Session and request identifiers |\n| `tokio` / `tokio-util` | Async runtime, I/O adapters for the stdio transport |\n| `tracing` | Structured logging throughout the protocol layer |\n| `thiserror` | Error types for protocol and kernel adapter failures |\n| `serde_json` | JSON serialization for protocol messages and dynamic payload handling |\n\n## Integration Points\n\n### From `librefang-cli`\n\nThe CLI enables `kernel-adapter` and runs the ACP server in-process. When launched with the appropriate subcommand, it wires stdin/stdout to an `agent-client-protocol-tokio` transport, constructs a `KernelAdapter` around a freshly initialized `LibreFangKernel`, and serves requests until the pipe closes.\n\n### From `librefang-api`\n\nThe API server (daemon mode) enables `kernel-adapter` to attach to a long-running kernel instance and expose ACP over a managed transport — useful for scenarios where the editor connects to a persistent agent process rather than spawning a new one.\n\n### From integration tests\n\nThe `tests/acp_integration.rs` test file leaves `kernel-adapter` off and implements `AcpKernel` with a stub or mock backend. It uses `futures` (for `AsyncRead`/`AsyncWrite` duplex construction) and `chrono` (for timestamping `ApprovalRequest` fixtures) — both kept as dev-dependencies to minimize the release dependency tree.\n\n## Error Handling\n\nErrors are modeled with `thiserror` enums covering:\n\n- **Protocol errors** — malformed JSON-RPC messages, unexpected method names, serialization failures.\n- **Kernel adapter errors** — forwarded from `librefang-kernel` when the `kernel-adapter` feature is active (session creation failures, model errors, tool execution failures).\n- **Transport errors** — I/O failures on the stdio pipe, unexpected disconnects.\n\nAll errors are traced through the `tracing` subscriber before being serialized back to the client as JSON-RPC error responses.\n\n## Adding a New Kernel Backend\n\n1. Implement `AcpKernel` for your backend type.\n2. Construct your backend and pass it to the ACP server entry point in this crate.\n3. No need to enable `kernel-adapter` — that feature exists solely for the `LibreFangKernel` binding.\n\n## Conventions\n\n- **No direct kernel dependency by default.** The base crate compiles without `librefang-kernel`. Only enable `kernel-adapter` if you need the real kernel.\n- **All state is thread-safe.** Session tracking uses `DashMap` so the server handles concurrent editor requests without a global mutex.\n- **Stdio is the expected transport.** The crate is designed around the duplex byte-stream model that ACP editors provide. Other transports are theoretically possible but not a primary target.","other-librefang-api-dashboard":"# Other — librefang-api-dashboard\n\n# LibreFang Dashboard\n\n## Overview\n\nThe dashboard is a single-page application for managing the LibreFang autonomous agent operating system. Built on **React 19**, **TanStack Router v1**, and **TanStack Query v5**, it provides real-time visibility and control over agents, sessions, workflows, channels, skills, schedules, and more.\n\n**Entry point:** `src/main.tsx`  \n**Pages:** `src/pages/`  \n**PWA manifest:** `public/manifest.json`  \n**Service worker:** `public/sw.js` (stale-while-revalidate for static assets; network-only for `/api/`)\n\n---\n\n## Architecture\n\n```mermaid\ngraph TD\n    A[Pages & Components] -->|useQuery / useMutation| B[Queries & Mutations Layer]\n    B -->|queryOptions + hooks| C[Query Key Factories]\n    B -->|mutationFn| D[HTTP Client]\n    D -->|typed fetch| E[src/api.ts]\n    E -->|REST / WebSocket| F[LibreFang API Server]\n    A -->|direct fetch only| G[Streaming / SSE exceptions]\n    C -->|invalidation targets| H[TanStack Query Cache]\n    B -->|onSuccess invalidation| H\n```\n\nPages and components never call `fetch()` or `api.*` directly. All data access flows through the shared hooks layer in `src/lib/queries/` and `src/lib/mutations/`. The only exceptions are streaming/SSE connections and imperative fire-and-forget control channels (e.g., `TerminalTabs.tsx`), which may call `fetch` directly with an explanatory comment.\n\n---\n\n## Data Layer\n\nThe data layer is the most structurally important part of this codebase. It is organized under `src/lib/` with a strict separation of concerns.\n\n### Directory Layout\n\n```\nsrc/lib/\n  http/\n    client.ts        # Thin wrapper over src/api.ts + typed re-exports\n    errors.ts        # ApiError class used by the wrapper\n  queries/\n    keys.ts          # All query-key factories — edit when adding a domain\n    keys.test.ts     # Smoke tests — add cases when adding a factory\n    <domain>.ts      # queryOptions + useXxx hooks per domain\n  mutations/\n    <domain>.ts      # useXxx mutation hooks with invalidation\n```\n\n**Current domains:** `agents`, `analytics`, `approvals`, `channels`, `config`, `goals`, `hands`, `mcp`, `media`, `memory`, `models`, `network`, `overview`, `plugins`, `providers`, `runtime`, `schedules`, `sessions`, `skills`, `workflows`.\n\n### Query Key Factories\n\nEvery domain has a hierarchical key factory in `src/lib/queries/keys.ts`. All sub-keys are anchored with `...fooKeys.all` so broad invalidation works correctly:\n\n```ts\nexport const fooKeys = {\n  all: [\"foo\"] as const,\n  lists: () => [...fooKeys.all, \"list\"] as const,\n  list: (filters: FooFilters = {}) => [...fooKeys.lists(), filters] as const,\n  details: () => [...fooKeys.all, \"detail\"] as const,\n  detail: (id: string) => [...fooKeys.details(), id] as const,\n};\n```\n\nNever construct a `queryKey` inline — always call the factory. Never subscribe to the same endpoint with a different key just to get a subset; use `select` on the shared `queryOptions`.\n\n### Query Hooks\n\nEach domain file (`src/lib/queries/<domain>.ts`) exports a `queryOptions` factory and a `useFoo` hook:\n\n```ts\nexport const fooQueryOptions = (filters?: FooFilters) =>\n  queryOptions({\n    queryKey: fooKeys.list(filters ?? {}),\n    queryFn: () => listFoo(filters),\n    staleTime: 30_000,\n  });\n\nexport function useFoo(filters?: FooFilters, options: UseFooOptions = {}) {\n  const { enabled, staleTime, refetchInterval } = options;\n  return useQuery({\n    ...fooQueryOptions(filters),\n    enabled,\n    staleTime,\n    refetchInterval,\n  });\n}\n```\n\nThe `UseFooOptions` parameter (`{ enabled?, staleTime?, refetchInterval? }`) allows call sites to override polling/gating behavior per-page. Examples:\n\n| Hook | Override | Reason |\n|------|----------|--------|\n| `useApprovals({ enabled: open })` | `enabled` | Only poll when the approvals panel is open |\n| `useCommsEvents(50, { refetchInterval: 5_000 })` | `refetchInterval` | Fast polling for live comms |\n| `useModels({}, { enabled: isModelArg })` | `enabled` | Gate on context |\n| `useApprovalCount({ refetchInterval: 5_000 })` | `refetchInterval` | Bell-icon badge polling |\n\nEvery call-site override must carry a short inline comment explaining why.\n\n### Mutation Hooks and Cache Invalidation\n\nMutations live in `src/lib/mutations/<domain>.ts`. **Every write must invalidate**, and invalidation must live inside the hook, not at the call site. Call sites may additionally attach `onSuccess`/`onError` for UI feedback (toasts, modal dismissal), which is orthogonal to cache invalidation.\n\n**Prefer the narrowest matching keys.** Use `fooKeys.all` only when the mutation truly dirties every sub-key in the domain:\n\n| Invalidation scope | When to use |\n|---|---|\n| `fooKeys.detail(id)` + `fooKeys.lists()` | **Default template** — per-id update where the list projection also changes (patch, rename, status flag) |\n| `fooKeys.lists()` | List-shape change with no existing detail to refresh (create, delete, reorder) |\n| `fooKeys.detail(id)` or nested sub-key | Change is genuinely scoped to one detail and list projection is unaffected |\n| `fooKeys.all` | Bulk import, cache reset, cross-cutting schema migration — **not the default** |\n\nFan-out trade-off: invalidating `fooKeys.all` while N items are cached will refetch the list plus every cached sub-key for each of the N items. Use it only when that is the desired effect.\n\n### Adding a New Endpoint\n\n1. Add the raw call in `src/api.ts` (or re-export via `src/lib/http/client.ts`).\n2. If it's a new domain, add a factory in `src/lib/queries/keys.ts` following the hierarchical pattern above.\n3. Add the query in `src/lib/queries/<domain>.ts`.\n4. Add mutations in `src/lib/mutations/<domain>.ts` with invalidation.\n5. Update `src/lib/queries/keys.test.ts` — add the new factory to the \"all factories exist\" list and add anchoring/hierarchy tests for non-trivial factories.\n\n### Type Source\n\n`src/api.ts` is the canonical, hand-maintained type source for the SPA. Do not import from `openapi/generated.ts` — it is a regenerable cross-reference only (refresh via `pnpm openapi:types`).\n\n---\n\n## Navigation & Pages\n\nThe dashboard uses TanStack Router for client-side routing. The sidebar exposes these top-level sections (verified by E2E in `e2e/dashboard.spec.ts`):\n\nOverview, Agents, Sessions, Approvals, Comms, Providers, Channels, Skills, Hands, Workflows, Scheduler, Goals, Analytics, Memory, Runtime, Logs\n\nAuthentication is handled via a sign-in dialog that appears when the backend requires credentials (mode `credentials` from `/api/auth/dashboard-check`). Tokens are stored in `sessionStorage` (not `localStorage`) under the key `librefang-api-key`.\n\n---\n\n## UI Component Library\n\n### Shared Components\n\nThe `src/components/ui/` directory contains reusable primitives:\n\n- **`Button`** — Variants: `primary`, `secondary`, `ghost`, `danger`, `success`. Sizes: `sm`, `md`, `lg`. Supports `isLoading` spinner and `leftIcon`/`rightIcon` slots.\n- **`Modal`** — Supports `centered`, `panel-right`, and `drawer-right` variants. Auto-focus defaults to the close button for side panels and first focusable descendant for centered modals. Overridable via `autoFocus` prop.\n- **`PushDrawer`** — Global drawer slot powered by Zustand (`src/lib/drawerStore`). Renders desktop `<aside>` on `≥1000px` and mobile overlay on `<1000px`. The breakpoint literal (`999px`) is locked to the CSS `--breakpoint-lg: 1000px` override.\n- **`DrawerPanel`** — Declarative wrapper around `PushDrawer`'s global slot. Handles parent-driven open/close, external close (Esc/X/backdrop), and ownership arbitration when sibling drawers transition in the same React commit (see issue #4714).\n- **`MultiSelectCmdk`** — Combobox-based multi-select with chip removal, search filtering, optional `optionMeta` descriptions, and `allowFreeText` mode for free-form entries.\n\n### Domain Components\n\n- **`NotificationCenter`** — Bell-icon dropdown with WAI-ARIA menu button pattern, roving tabindex, Home/End jumps, and wrap-around Arrow key navigation.\n- **`AgentManifestForm`** — Form for agent manifests with catalog-driven comboboxes for tools, skills, and MCP servers. Falls back to `TagInput` when no catalog is supplied.\n- **`AgentSchedulePanel`** — Displays and edits agent schedule modes (manual, continuous, periodic, proactive). Supports cron job and trigger CRUD. Non-cron schedule kinds (`every`, `at`) disable the edit pencil with a tooltip directing users to `agent.toml`.\n- **`PromptsExperimentsModal`** — Tabbed modal for prompt version management and A/B experiments with traffic splitting.\n- **`WorkflowStepImageGallery`** — Renders image galleries from workflow step output when `image_urls` are present.\n\n---\n\n## Authentication & WebSocket\n\nThe `src/api.ts` module handles auth token management:\n\n- **`setApiKey(token)`** — Stores the token in `sessionStorage`.\n- **`verifyStoredAuth()`** — Probes a protected endpoint; clears stale tokens on 401.\n- **`buildAuthenticatedWebSocket(path)`** — Returns `{ url, protocols }` with the token as a `Sec-WebSocket-Protocol` bearer sub-protocol (`bearer.<token>`).\n\nAll HTTP helper functions attach `Authorization: Bearer <token>` automatically.\n\n---\n\n## Testing Strategy\n\n### Unit & Integration Tests (Vitest)\n\n```bash\npnpm test --run    # Run all vitest tests\npnpm test:watch    # Watch mode\n```\n\nTest infrastructure:\n- **`src/lib/test/query-client.tsx`** — Exports `createQueryClientWrapper` for React Query hook tests. Disables retry, sets `gcTime: 0`, and disables structural sharing.\n- **`src/lib/__tests__/locale-parity.test.ts`** — Gates CI; ensures all locale files have key parity with `en.json`.\n- Query key factory tests in `src/lib/queries/keys.test.ts` verify anchoring (all sub-keys contain `...fooKeys.all`).\n\nCommon test patterns:\n- `vi.mock(\"react-i18next\", ...)` — Returns `defaultValue` when supplied, otherwise the key.\n- `vi.mock(\"../lib/store\", ...)` — Replaces `useUIStore` with a no-op `addToast` to avoid zustand persist errors in jsdom.\n- `vi.mock(\"motion/react\", ...)` — Shims `AnimatePresence` and `motion.*` as pass-through elements for jsdom.\n\n### E2E Tests (Playwright)\n\n```bash\npnpm e2e\n```\n\nConfigured in `playwright.config.ts` — starts the dev server on `127.0.0.1:4173`, runs tests from `e2e/`. The smoke test (`e2e/dashboard.spec.ts`) verifies the shell loads with all sidebar navigation links and that the sign-in dialog appears when credentials are required.\n\n### i18n Parity\n\n```bash\npnpm test:i18n-parity    # Standalone CLI check (no vitest needed)\n```\n\nThe script (`scripts/i18n-parity.mjs`) flattens each locale JSON, compares key sets against `en.json`, and reports missing/extra keys with a non-zero exit code on drift.\n\n---\n\n## Build & Verification\n\nRun all four commands after any change to `src/lib/queries/`, `src/lib/mutations/`, or `src/api.ts`:\n\n```bash\npnpm lint        # ESLint 9 — errors must be green; warnings allowed\npnpm typecheck   # tsc --noEmit — must be green\npnpm test --run  # vitest — all tests pass\npnpm build       # vite build — must succeed\n```\n\nA passing typecheck alone is not sufficient — the key-factory tests catch anchoring regressions that the compiler does not.\n\n### ESLint Policy\n\n`eslint.config.js` uses ESLint 9 flat config. The two security-critical rules are **`error`**:\n\n- `react/jsx-no-target-blank` — Prevents `target=\"_blank\"` without `rel=\"noopener noreferrer\"` (regression guard for issue #5390).\n- `react/no-danger-with-children` — Rejects `dangerouslySetInnerHTML` combined with `children`.\n\nBaseline violations (`react-hooks/rules-of-hooks`, `no-unused-expressions`, `no-irregular-whitespace`, `no-control-regex`) are demoted to `warn` for the initial bootstrap. Clean them up incrementally rather than adding `eslint-disable` comments.\n\n---\n\n## Service Worker\n\n`public/sw.js` implements a basic cache-first strategy:\n\n- **API requests (`/api/*`)**: Network only (no caching).\n- **Static GET requests**: Stale-while-revalidate — serves from cache, updates in background.\n- **Non-GET requests**: Not cached.\n- Precaches `/dashboard/` on install.\n\n---\n\n## Dependency Audit Management\n\nAudit ignores are documented in `AUDIT_IGNORES.md`. Each ignored GHSA entry includes:\n\n- **Why ignored** — rationale for the false positive or accepted risk.\n- **Risk if wrong** — impact assessment.\n- **Unlock condition** — specific criteria for removing the ignore.\n- **Owner / last review** — PR reference and re-evaluation trigger.\n\nCurrently ignored: `GHSA-rmmr-r34h-pfm5` (`@tanstack/history`) — the advisory's `>= 0` range flags the clean `1.161.6` version we pin to via `@tanstack/react-router`.\n\n---\n\n## Commit Convention\n\nFollows the root repo format with dashboard-scoped paths:\n\n```\nfeat(dashboard/<area>): ...\nrefactor(dashboard/queries): ...\nfix(dashboard/<area>): ...\n```\n\nNever include a `Co-Authored-By` footer.","other-librefang-api-src":"# Other — librefang-api-src\n\n# librefang-api — Login Page (`login_page.html`)\n\n## Overview\n\nA self-contained, single-file HTML login page for the LibreFang dashboard. It ships no external dependencies — all CSS and JavaScript are inlined. The page collects username/password credentials (and optionally a TOTP code), authenticates against the backend API, stores the returned token in `localStorage`, and redirects the user to the dashboard SPA.\n\nThis page is served at `/dashboard` and `/dashboard/` (see routing notes below).\n\n## Architecture\n\n```mermaid\nsequenceDiagram\n    participant Browser\n    participant Server as Static Server\n    participant API as /api/auth/dashboard-login\n\n    Browser->>Server: GET /dashboard\n    Server-->>Browser: login_page.html\n    Browser->>API: POST {username, password}\n    API-->>Browser: {requires_totp: true}\n    Note over Browser: Show TOTP field\n    Browser->>API: POST {username, password, totp_code}\n    API-->>Browser: {ok: true, token: \"...\"}\n    Note over Browser: Store token in localStorage<br/>Redirect to /\n```\n\n## Authentication Flow\n\n### 1. Credential Submission\n\nWhen the user submits the form, the JavaScript handler:\n\n1. Prevents default form submission.\n2. Disables the submit button to prevent double-posts.\n3. Builds a JSON payload with `username` and `password`.\n4. If TOTP has been requested by a prior attempt, includes `totp_code` in the payload.\n5. POSTs to `/api/auth/dashboard-login` with `Content-Type: application/json` and `credentials: 'same-origin'`.\n\n### 2. Response Handling\n\nThe API response is a JSON object. Three outcomes are handled:\n\n| Response Shape | Behavior |\n|---|---|\n| `{ ok: true, token: \"...\" }` | Store token in `localStorage` under key `librefang-api-key`, then redirect. |\n| `{ requires_totp: true }` | Reveal the TOTP input field, set `requiresTotp = true`, focus the TOTP input, and prompt the user. |\n| Any other response | Display `d.error` or a fallback `\"Sign in failed.\"` message in the error div. |\n\nNetwork-level failures display `\"Network error.\"`\n\n### 3. Token Storage\n\nOn successful authentication, the token is written to:\n\n```\nlocalStorage['librefang-api-key']\n```\n\nThe `try/catch` around `localStorage.setItem` silently handles cases where storage is unavailable (e.g., Safari private browsing).\n\n### 4. Post-Login Redirect\n\nAfter storing the token, the page redirects via `location.replace()`. The redirect target is determined by the current `location.pathname`:\n\n- **`/`, `/dashboard`, `/dashboard/`** — redirects to `/`. These paths host the inline login page (and SPA build assets under `/dashboard/<asset>`), not meaningful application destinations. Redirecting back to them would land on a 404. See issue **#4860**.\n- **Any other path** — redirects to `pathname + search + hash`, preserving the original destination the user was trying to reach before being intercepted by the login gate.\n\n> **Note:** Search and hash fragments are intentionally dropped on the collapse branches (`/`, `/dashboard`, `/dashboard/`) because those URLs were 404s before the fix — any query string or hash on them is not meaningful application state.\n\n## UI Components\n\n### Form Fields\n\n| Element | ID | Name | Notes |\n|---|---|---|---|\n| Username input | `u` | `username` | `autofocus`, `autocomplete=\"username\"` |\n| Password input | `p` | `password` | `type=\"password\"`, `autocomplete=\"current-password\"` |\n| TOTP input | `t` | `totp_code` | Hidden by default. `inputmode=\"numeric\"`, `pattern=\"[0-9]{6}\"`, `maxlength=\"6\"` |\n| Submit button | `btn` | — | Disabled during in-flight requests |\n| Error display | `err` | — | `aria-live=\"polite\"` for screen reader announcements |\n\n### Theming\n\nThe page supports both dark and light mode via `prefers-color-scheme`:\n\n- **Dark (default):** Dark background (`#0b0d12`), card (`#12151c`), light text (`#e6e8ee`).\n- **Light:** Inverted via `@media (prefers-color-scheme: light)` override block. Background `#f6f7fb`, card `#fff`.\n\nThe `:root { color-scheme: light dark; }` declaration ensures native form controls (scrollbars, focus rings) also respect the user's preference.\n\n### Responsive Behavior\n\nThe card container uses `width: min(92vw, 380px)` to fit small mobile screens while capping at 380px on wider viewports. The page body uses `display: grid; place-items: center` for vertical and horizontal centering.\n\n## Key DOM Elements and IDs\n\nAll element IDs are minimal single-character names (`f`, `u`, `p`, `t`, `btn`, `err`, `totp-row`). This is intentional — the page is self-contained and these IDs are not referenced outside this file. If this page is ever templated or embedded, these IDs should be namespaced to avoid collisions.\n\n## Integration Points\n\n### Backend API Contract\n\nThe page expects the endpoint `POST /api/auth/dashboard-login` to accept and return:\n\n**Request:**\n```json\n{\n  \"username\": \"string\",\n  \"password\": \"string\",\n  \"totp_code\": \"string (optional, 6 digits)\"\n}\n```\n\n**Response (success):**\n```json\n{ \"ok\": true, \"token\": \"jwt-token-here\" }\n```\n\n**Response (TOTP required):**\n```json\n{ \"requires_totp\": true }\n```\n\n**Response (error):**\n```json\n{ \"error\": \"Human-readable error message\" }\n```\n\n### Token Consumption\n\nOther parts of the LibreFang system (likely the dashboard SPA and/or API client helpers) read the token from `localStorage.getItem('librefang-api-key')` and attach it to subsequent API requests, presumably as an `Authorization` header.\n\n## Configuration Reference\n\nThe footer of the login page displays:\n\n> Auth required — configured in `config.toml`.\n\nThis is a static hint to administrators. Authentication behavior (enabled/disabled, user credentials, TOTP enforcement) is controlled by the backend's `config.toml`, not by this page.\n\n## Security Considerations\n\n- **`autocomplete` attributes** are set appropriately (`username`, `current-password`, `one-time-code`) to work with password managers and browser autofill.\n- **`robots` meta tag** is set to `noindex, nofollow` to prevent search engine indexing of the login page.\n- **Credentials** are sent via `fetch` with `credentials: 'same-origin'`, ensuring cookies (if any) are included but credentials are not leaked to cross-origin requests.\n- **No inline secrets** — the page contains no hardcoded API keys, secrets, or tokens.\n- **The token in localStorage** is accessible to any JavaScript running on the same origin. This is standard for SPAs but be aware of XSS implications.\n\n## Maintenance Notes\n\n- This file has **no build step** and **no external dependencies**. It can be edited directly.\n- The `#4860` reference in the redirect logic comments tracks a bug where post-login redirects to `/dashboard` or `/dashboard/` resulted in a 404. Do not change the redirect collapse logic without understanding that history.\n- The `<meta name=\"robots\">` tag and inline styles are intentional — this page is deliberately standalone to avoid loading external CSS/JS on the login screen, reducing attack surface and eliminating external dependency failures on the authentication critical path.","other-librefang-api-static":"# Other — librefang-api-static\n\n# librefang-api-static — Static Frontend Assets (Locales)\n\n## Overview\n\nThis module provides the **internationalization (i18n) locale files** for the LibreFang dashboard UI. It contains all user-facing text strings as structured JSON, organized by page and component. The dashboard's React frontend loads these files at boot via an i18n library, enabling full multi-language support without embedding strings in component code.\n\n## File Structure\n\n```\nlibrefang-api/static/\n└── locales/\n    ├── en.json    # English (primary/default)\n    └── ja.json    # Japanese\n```\n\n## How It Works\n\nThe i18n initialization sequence ties into the application boot flow. The main bundle (`index-D7Z5I_nR.js`) calls `use()` on the i18n module (`i18n-4qyNqnlA.js`) during startup. Various server-side boot functions (test harnesses, integration tests) invoke `nest()` on the i18n module to register locale resources before the dashboard is served.\n\nComponents reference translations by dot-path keys (e.g., `agentChat.cmd.help`). Interpolation parameters like `{count}`, `{name}`, and `{message}` are replaced at render time by the i18n library.\n\n## Locale Key Hierarchy\n\nThe JSON is organized into top-level namespaces that map to dashboard sections. Below is a structural reference for all namespaces.\n\n### Global UI Elements\n\n| Namespace | Purpose |\n|---|---|\n| `nav` | Sidebar navigation labels (chat, agents, sessions, settings, etc.) |\n| `status` | Connection status indicators (`connecting`, `ready`, `error`, `notConfigured`) |\n| `btn` | Reusable button labels (`refresh`, `save`, `delete`, `send`, `copy`, `copied`) |\n| `label` | Generic field labels (`status`, `provider`, `model`, `agent`, `name`, `key`, `value`) |\n| `auth` | API key authentication prompt and hint text |\n| `page` | Page-level titles used in headers |\n| `health` | Health check status labels (`healthy`, `unreachable`) |\n| `time` | Relative time formatting (`now`, `{count}s ago`, `{count}m ago`, etc.) |\n| `confirm` | Confirmation dialog buttons (`cancel`, `confirm`) |\n| `theme` | Theme selector labels (`light`, `dark`, `system`) |\n| `sidebar` | Sidebar shortcut hints |\n\n### Statistics & Cards\n\n| Namespace | Purpose |\n|---|---|\n| `stat` | Dashboard stat card labels (agents running, tokens used, total cost, uptime, etc.) |\n| `card` | Dashboard card titles (Getting Started, LLM Providers, System Health, etc.) |\n\n### Agent System\n\n| Namespace | Purpose |\n|---|---|\n| `agents` | Agent list actions (new agent, stop all, start chatting) |\n| `detail` | Agent detail view (info, files, config tabs; tool filters with allowlist/blocklist) |\n| `mode` | Agent operation modes: `observe`, `assist`, `full` |\n| `category` | Agent categories: `general`, `development`, `research`, `writing`, `business` |\n| `profile` | Tool profile descriptions (9 profiles from `minimal` to `full`) |\n| `template` | 10 built-in agent templates with name and description each |\n\n**Tool Profiles** — Each profile defines a capability set:\n\n```\nminimal → read-only file access\ncoding  → files + shell + web fetch\nresearch → web search + file read/write\nmessaging → agents + memory access\nautomation → all tools except custom\nbalanced → general-purpose tool set\nprecise → focused tool set for accuracy\ncreative → full tools with creative emphasis\nfull → all 35+ tools\n```\n\n**Agent Templates** — Predefined starting points: `GeneralAssistant`, `CodeHelper`, `Researcher`, `Writer`, `DataAnalyst`, `DevOpsEngineer`, `CustomerSupport`, `Tutor`, `APIDesigner`, `MeetingNotes`.\n\n### Chat Interface (`agentChat`)\n\nThe largest namespace. Covers the full agent chat experience:\n\n- **Session management**: create, switch, reset, reboot sessions\n- **Message display**: generating states, tool usage indicators, thinking/reasoning panels\n- **Slash commands** (`agentChat.cmd`): 17 commands — `/help`, `/new`, `/reboot`, `/compact`, `/model`, `/stop`, `/usage`, `/think`, `/context`, `/verbose`, `/queue`, `/status`, `/clear`, `/exit`, `/budget`, `/peers`, `/a2a`\n- **File handling**: drag-and-drop uploads, size/type validation (10MB limit)\n- **Voice input**: recording indicator, transcription, microphone permission errors\n- **Toast notifications** (`agentChat.toast`): model switches, session resets, failures\n- **System messages** (`agentChat.sys`): compaction status, usage stats, thinking mode descriptions, budget/OFP/A2A status displays\n\n### Page-Level Namespaces\n\nEach page has its own namespace with loading states, error messages, CRUD toasts, and empty-state descriptions:\n\n| Namespace | Page | Key Sub-sections |\n|---|---|---|\n| `sessionsPage` | Sessions | Conversation sessions, agent memory key-value store |\n| `agentsPage` | Agents | Create wizard, raw TOML, archetype/vibe selectors, clone/history |\n| `approvals` | Approvals | Pending/approved/rejected filter, approve/reject actions |\n| `logsPage` | Logs | Live stream + audit trail, chain verification |\n| `runtimePage` | Runtime | System info, providers, models, latency display |\n| `workflowsPage` | Workflows | Sequential/fan-out/conditional/loop step modes |\n| `workflowBuilder` | Visual Builder | Node palette (7 node types), canvas controls, TOML export |\n| `schedulerPage` | Scheduler | Cron jobs, event triggers, run history, cron presets |\n| `channelsPage` | Channels | Setup steps (configure → verify → ready), WhatsApp QR, categories |\n| `skillsPage` | Skills | Installed/ClawHub/MCP/Quick Start tabs, security scanning |\n| `handsPage` | Hands | Available/Active tabs, dependency installer, setup wizard steps |\n| `pluginsPage` | Plugins | Installed/Registry tabs, install sources (registry/local/git) |\n| `commsPage` | Agent Comms | Topology, live event feed, message/task posting |\n| `goalsPage` | Goals | Hierarchical goals with sub-goals, status tracking |\n| `analyticsPage` | Analytics | Token/cost breakdown by model, agent, provider, daily costs |\n| `memoryPage` | Memory | Proactive memory browser, search, CRUD, version history |\n\n### Settings (`settingsPage`)\n\nThe most complex namespace, reflecting the settings page's multi-tab layout:\n\n- **Providers**: API key management for 12+ LLM providers, custom provider support (OpenAI-compatible), GitHub Copilot OAuth flow\n- **Models**: Model catalog with sync, search/filter, custom model addition, cost tiers\n- **Tools**: Tool registry browser with search\n- **Security** (`settingsPage.coreFeatures`, `configurableFeatures`, `monitoringFeatures`): 15 security features documented with descriptions and threat models\n- **Network**: OFP peer networking, A2A external agent discovery\n- **Budget**: Hourly/daily/monthly cost limits, per-agent token limits, alert thresholds, top spenders\n- **Proactive Memory**: Auto-memorize, auto-retrieve, extraction thresholds, confidence decay, duplicate detection\n- **Migration**: Import from OpenClaw/OpenFang installations\n\n### Onboarding (`setupWizard`)\n\n5-step wizard flow: **Welcome → Provider → Agent → Try It → Channel → Done**\n\nEach step has its own strings for instructions, validation errors, and success states.\n\n## Interpolation Parameters\n\nStrings use `{param}` placeholders resolved at runtime. Common parameters:\n\n| Parameter | Usage |\n|---|---|\n| `{count}` | Numeric counts (agents, sessions, tokens, entries) |\n| `{name}` | Entity names (agents, channels, skills, schedules) |\n| `{message}` | Error messages from API responses |\n| `{provider}` | LLM provider names |\n| `{model}` | Model identifiers |\n| `{key}` | Memory key names |\n| `{time}` | Timestamps |\n| `{url}` | URLs |\n| `{tool}` | Tool names |\n\n## Adding a New Locale\n\n1. Create a new file at `locales/<locale-code>.json` (e.g., `de.json` for German)\n2. Copy the full structure from `en.json` as the starting point\n3. Translate all string values — do **not** change keys or structural nesting\n4. Preserve all `{param}` placeholders exactly as they appear\n5. Register the locale in the i18n configuration (in the frontend i18n module)\n\n## Adding New Strings\n\nWhen adding UI features that require new text:\n\n1. Identify the appropriate namespace (existing page namespace or create a new one)\n2. Add the key to **every** locale file, not just `en.json`\n3. Use interpolation parameters rather than string concatenation\n4. Follow the naming convention: `snake_case` for object keys within a namespace\n\n## Relationship to Other Modules\n\n```mermaid\ngraph LR\n    A[locales/*.json] -->|loaded by| B[i18n module]\n    B -->|use call| C[App Bootstrap]\n    B -->|t key path| D[React Components]\n    E[Agent Loop] -->|events| D\n    F[API Routes] -->|responses| D\n    G[Plugin Manager] -->|metadata| D\n```\n\nThe locale files are pure static data — they contain no logic. The frontend i18n library reads them at boot, and React components consume translated strings via key paths. API route handlers and the agent loop produce events whose display text comes from these locale files, keeping the server side locale-agnostic.","other-librefang-api-tests":"# Other — librefang-api-tests\n\n# librefang-api Integration Tests\n\n## Purpose\n\nThis module is the integration test suite for the `librefang-api` HTTP layer. It exercises the **production router** (`server::build_router`) end-to-end — route registration, auth middleware, handler wiring, validation, error envelopes, and security boundaries — without making real LLM calls. Every test is hermetic: the kernel boots with a fake `ollama` provider, a temporary home directory, and no outbound network access.\n\nThese tests serve as the canonical regression guard for the API contract, replacing the older manual curl checklist referenced in CLAUDE.md (#3721).\n\n## Test Files and Route Coverage\n\n| File | Routes / Surface |\n|------|-----------------|\n| `agents_routes_integration.rs` | `GET /api/agents`, `GET/PATCH /api/agents/{id}`, `PUT …/suspend`, `PUT …/resume`, `PUT …/mode`, schedule field |\n| `agents_capabilities_files_integration.rs` | `GET/PUT/DELETE /api/agents/{id}/files/{filename}`, `GET/PUT …/tools`, `…/skills`, `…/mcp_servers` |\n| `agents_clone_bulk_integration.rs` | `POST …/clone`, `POST …/reload`, `POST …/push`, `POST/DELETE /api/agents/bulk`, `POST …/bulk/start`, `POST …/bulk/stop` |\n| `a2a_routes_integration.rs` | `GET /a2a/agents`, `GET /api/a2a/agents`, `GET …/{id}`, `POST /discover`, `POST /send`, `GET /tasks/{id}/status`, `POST …/approve` |\n| `agent_identity_registry_test.rs` | Agent UUID registry: spawn registers, delete with/without confirm, respawn recovery, `GET /identities`, `POST …/reset` |\n| `agent_kv_authz_integration.rs` | Owner-scoping on KV endpoints: `GET/PUT/DELETE /memory/agents/{id}/kv*`, `GET/POST …/memory/{export,import}` |\n| `access_log_agent_id_test.rs` | `AgentIdField` response extension marker for access-log emission |\n| `access_log_session_id_test.rs` | `SessionIdField` response extension marker for access-log emission |\n\n## Architecture\n\n```mermaid\ngraph TD\n    subgraph \"Full-Stack Harness\"\n        A[server::build_router] --> B[Auth Middleware]\n        B --> C[Route Handlers]\n        C --> D[LibreFangKernel]\n    end\n    subgraph \"Mock-Kernel Harness\"\n        E[MockKernelBuilder] --> F[TestAppState]\n        F --> G[Sub-router nest]\n        G --> C2[Route Handlers]\n    end\n    H[tower::oneshot] --> A\n    H2[tower::oneshot] --> G\n    I[reqwest::Client] -->|TCP loopback| J[TcpListener + axum::serve]\n    J --> A\n```\n\n## Two Harness Patterns\n\n### Full Production Router\n\nUsed by most test files. Boots the real kernel and the complete middleware stack:\n\n```rust\nasync fn boot(api_key: &str) -> Harness {\n    let tmp = tempfile::tempdir().expect(\"tempdir\");\n    librefang_kernel::registry_sync::sync_registry(tmp.path(), /* … */);\n\n    let config = KernelConfig {\n        home_dir: tmp.path().to_path_buf(),\n        api_key: api_key.to_string(),\n        default_model: DefaultModelConfig { provider: \"ollama\", model: \"test-model\", /* … */ },\n        ..KernelConfig::default()\n    };\n\n    let kernel = Arc::new(LibreFangKernel::boot_with_config(config).expect(\"kernel boot\"));\n    kernel.set_self_handle();\n\n    let (app, state) = server::build_router(kernel, \"127.0.0.1:0\".parse().unwrap()).await;\n    Harness { app, _tmp: tmp, state, /* … */ }\n}\n```\n\nRequests go through `tower::ServiceExt::oneshot` — no TCP socket, no ConnectInfo. This means loopback auth bypass does **not** apply; requests are treated as remote, which is the strictest auth posture.\n\n**Files using this pattern:** `agents_routes_integration.rs`, `agents_capabilities_files_integration.rs`, `agents_clone_bulk_integration.rs`, `a2a_routes_integration.rs`.\n\n### Mock Kernel with Sub-Router Nesting\n\nUsed by access-log and KV authz tests that only need specific route modules, not the full stack:\n\n```rust\nfn boot_agents() -> Harness {\n    let test = TestAppState::with_builder(MockKernelBuilder::new().with_config(|cfg| { /* … */ }));\n    let state = test.state.clone();\n    let app = Router::new()\n        .nest(\"/api\", routes::agents::router())\n        .with_state(state);\n    Harness { app, _test: test }\n}\n```\n\n**Files using this pattern:** `access_log_agent_id_test.rs`, `access_log_session_id_test.rs`, `agent_kv_authz_integration.rs`.\n\n### TCP Listener Variant\n\n`agent_identity_registry_test.rs` uses a real `tokio::net::TcpListener` with `reqwest::Client` so that `into_make_service_with_connect_info::<SocketAddr>()` injects peer address data the auth middleware needs for loopback classification.\n\n## Key Testing Conventions\n\n### Auth Configuration\n\n- **Empty `api_key`** (`\"\"`) → single-user dev fast-path: all routes accessible without a Bearer token.\n- **Non-empty `api_key`** → token auth enforced. Tests pass `format!(\"Bearer {}\", api_key)` via the `authorization` header.\n\n### Request Helpers\n\nMost files define a common `send()` function:\n\n```rust\nasync fn send(app: Router, req: Request<Body>) -> (StatusCode, serde_json::Value)\n```\n\nAnd convenience builders: `get(path)`, `post_json(path, body)`, `put_json(path, body)`, `delete(path)`, `patch_json(path, body)` — each attaching the Bearer token from `TEST_TOKEN`.\n\n### Cleanup\n\nEvery `Harness` implements `Drop` to call `state.kernel.shutdown()`, ensuring no leaked kernel tasks between tests. `_tmp: tempfile::TempDir` is held for the same lifetime so the temp directory persists until the harness drops.\n\n### Agent Spawning\n\n```rust\nfn spawn_named(state: &Arc<AppState>, name: &str) -> AgentId {\n    let manifest = AgentManifest { name: name.to_string(), ..AgentManifest::default() };\n    state.kernel.spawn_agent_typed(manifest).expect(\"spawn_agent\")\n}\n```\n\nThis bypasses the HTTP layer to create agents directly in the kernel registry. It is the standard way to set up test preconditions for GET/PATCH/DELETE tests.\n\n## Security Boundaries Tested\n\n### Path Traversal Defense (`agents_capabilities_files_integration.rs`)\n\nThe `KNOWN_IDENTITY_FILES` whitelist rejects filenames like `../../etc/passwd` before any filesystem resolution. Tests assert the rejection is a clean 400, not a 500, and confirm via read-back that nothing was written outside the sandbox.\n\n### SSRF Guard (`a2a_routes_integration.rs`)\n\n`/api/a2a/discover` calls `is_url_safe_for_ssrf` which blocks localhost/private-network URLs. Tests verify `http://localhost:1/agent` returns 400 before any outbound socket is opened.\n\n### Trust Gate (`a2a_routes_integration.rs`)\n\n`/api/a2a/send` and `/api/a2a/tasks/{id}/status` enforce that the target URL is an approved/trusted A2A peer. Unapproved targets are rejected with 400 and an error message containing \"trusted\" or \"approve\" — this is a regression guard for #3786.\n\n### Owner-Scoping on KV (`agent_kv_authz_integration.rs`)\n\nThe helper `assert_kv_owner_or_admin` gates per-agent KV operations. A viewer (`UserRole::Viewer`) who is not the agent's author receives 404; the agent's owner and admins proceed. This covers list, single-key get/set/delete, and bulk export/import.\n\n### Auth Layer on Identity Routes (`agent_identity_registry_test.rs`)\n\nWith a configured `api_key`, unauthenticated writes (spawn, identity reset) are rejected 401 before reaching the handler. GET `/api/agents/identities` is also auth-gated because it is not in the dashboard-reads allowlist. This was a gap the mock-router approach could not catch.\n\n## Response Shape Contracts\n\n### PaginatedResponse Envelope\n\nA2A listing endpoints and agent listings return the canonical `PaginatedResponse` shape:\n\n```json\n{ \"items\": [], \"total\": 0, \"offset\": 0, \"limit\": null }\n```\n\nTests in `a2a_routes_integration.rs` explicitly assert the legacy `{ \"agents\": […] }` field is **absent** to prevent dual-shape regressions (#3842).\n\n### Error Envelopes\n\nAll error responses carry at least one of `error` or `message` fields. Tests assert the presence and content of these fields rather than just checking status codes.\n\n### Access Log Extension Markers\n\nHandlers set `AgentIdField` and `SessionIdField` as response extensions so the `request_logging` middleware can emit structured fields. Tests assert on `resp.extensions().get::<AgentIdField>()` directly — the precise contract the middleware reads.\n\nKey invariant: **the marker must be present even on 404 responses** where the path contained a valid but unknown ID (the handler resolved the ID from the path and tagged it before the kernel lookup failed). The marker must be **absent** when the path ID was malformed (the `AgentIdPath` extractor rejected before the handler ran).\n\n## Running the Tests\n\n```bash\n# All integration tests in the crate\ncargo test -p librefang-api\n\n# Individual test files\ncargo test -p librefang-api --test agents_routes_integration\ncargo test -p librefang-api --test a2a_routes_integration\ncargo test -p librefang-api --test agent_identity_registry_test\ncargo test -p librefang-api --test agents_capabilities_files_integration\ncargo test -p librefang-api --test agents_clone_bulk_integration\ncargo test -p librefang-api --test agent_kv_authz_integration\ncargo test -p librefang-api --test access_log_agent_id_test\ncargo test -p librefang-api --test access_log_session_id_test\n```\n\nAll tests use `#[tokio::test(flavor = \"multi_thread\")]` because the kernel spawns background tasks during boot.\n\n## Out-of-Scope Paths\n\nSeveral endpoints initiate real outbound HTTP that the hermetic harness cannot satisfy:\n\n- **A2A `/discover` happy path** — requires a live external A2A server responding with an agent card.\n- **A2A `/send` happy path** — requires an approved, reachable target peer.\n- **A2A `/tasks/{id}/status` happy path** — same outbound dependency.\n- **`/push` happy path** — requires a wired channel adapter (Telegram, Slack, etc.). Tests cover the 502 BAD_GATEWAY response when no adapter is configured.\n\nThese are covered only on their validation, trust-gate, and error paths. Happy-path coverage would require either a mock HTTP server or an external test fixture, which is intentionally deferred.","other-librefang-api":"# Other — librefang-api\n\n# librefang-api\n\nHTTP/WebSocket API server for the LibreFang Agent OS daemon. Exposes agent management, sessions, channels, approvals, MCP, peer/A2A networking, and the React dashboard SPA over JSON REST and WebSocket endpoints. The kernel runs in-process; CLI, desktop, and mobile clients connect over this surface.\n\n## Architecture Overview\n\n```mermaid\ngraph TD\n    Clients[\"CLI / Desktop / Mobile Clients\"]\n    API[\"librefang-api<br/>(axum HTTP + WebSocket)\"]\n    Kernel[\"librefang-kernel<br/>(in-process)\"]\n    Sidecars[\"Channel Sidecars<br/>(out-of-process)\"]\n    SPA[\"Dashboard SPA<br/>(embedded static)\"]\n\n    Clients -->|REST / WS| API\n    API --> Kernel\n    API -->|SIDECAR_CATALOG| Sidecars\n    API --> SPA\n```\n\nThe server is an axum application assembled by `server::build_router`. It embeds the kernel directly and communicates with channel adapters through out-of-process sidecars rather than in-process adapters.\n\n## Entry Points\n\n- **`server::build_router(kernel, addr)`** — Assembles the full axum router with all routes, shared `AppState`, middleware stack, and starts listening on the given address.\n- **`routes::*`** — Endpoint handlers organized by domain (agents, sessions, channels, approvals, MCP, peers, etc.).\n- **`middleware`** — Authentication, rate limiting, and telemetry. Auth is governed by three route-classification lists:\n  - `PUBLIC_ROUTES_ALWAYS` — accessible without any auth\n  - `PUBLIC_ROUTES_GET_ONLY` — accessible unauthenticated for GET requests only\n  - `PUBLIC_ROUTES_DASHBOARD_READS` — read-only dashboard access without auth\n- **`ws`** — WebSocket authentication and streaming handlers for real-time session and event communication.\n\n## Dashboard SPA\n\nThe React/TypeScript dashboard lives in `dashboard/` and uses TanStack Query. It is built externally via `cargo xtask build-web` and embedded into the binary using `include_dir!` from the `static/react` directory.\n\nThe build script (`build.rs`) ensures `static/react` exists at compile time (creating it if absent on fresh clones). When the embedded directory is empty, the runtime falls back to serving assets from `~/.librefang/dashboard/`.\n\n## Channel Adapter Architecture\n\nChannel adapters run exclusively as out-of-process sidecars. The historical in-process features (`core-channels`, `all-channels`, `channel-*`, `mini`, `all-channels-no-email`) have been removed. Sidecar definitions live in `SIDECAR_CATALOG` within `src/routes/channels.rs`, and the corresponding SDK is at `sdk/python/` with the `librefang.sidecar.adapters.*` namespace.\n\n## Features\n\n### Default: `telemetry`\n\nEnabled by default. Pulls in OpenTelemetry tracing export and Prometheus metrics:\n\n- `opentelemetry`, `opentelemetry_sdk`, `opentelemetry-otlp` — OTLP trace export\n- `tracing-opentelemetry` — bridges `tracing` spans to OpenTelemetry\n- `metrics` + `metrics-exporter-prometheus` — Prometheus metrics endpoint\n\n### Removed features\n\n`channel-*`, `core-channels`, `all-channels`, `all-channels-no-email`, and `mini` no longer exist. All channel adapters are sidecars.\n\n## Build Script (`build.rs`)\n\nThe build script performs four tasks before compilation:\n\n1. **Creates the dashboard embed directory** — Ensures `static/react` exists so `include_dir!` compiles on fresh clones where the gitignored build artifacts haven't been produced yet.\n\n2. **Captures the git commit hash** into `GIT_SHA` — Resolution order:\n   - `GITHUB_SHA` environment variable (GitHub Actions, full 40-char SHA truncated to 7)\n   - `CI_COMMIT_SHA` environment variable (GitLab CI, same truncation)\n   - `git rev-parse --short HEAD` with `git` located via `which::which`\n   - `\"unknown\"` if none of the above succeed\n\n3. **Captures the build date** into `BUILD_DATE` — Uses `chrono::Utc::now()` formatted as `%Y-%m-%d` instead of shelling out to the platform-specific `date` command.\n\n4. **Captures the rustc version** into `RUSTC_VERSION` — Via `rustc --version`, falling back to `\"unknown\"`.\n\nThe `resolve_git_sha()` function feeds into `short_sha()` for consistent 7-character truncation. Rebuilds are triggered by changes to `GITHUB_SHA`, `CI_COMMIT_SHA`, or `SOURCE_DATE_EPOCH`.\n\n## Platform-Specific Dependencies\n\n**Unix** — `rustix` (with `process` feature) and `libc` for Unix process operations.\n\n**Windows** — `windows-sys` with `Win32_Foundation`, `Win32_Security`, and `Win32_Security_Authorization` features. Used for SDDL → `SECURITY_DESCRIPTOR` conversion on the ACP named-pipe listener, restricting the pipe DACL to the daemon's owner SID.\n\n## Key Internal Dependencies\n\n| Crate | Role |\n|---|---|\n| `librefang-kernel` | Core agent OS logic, runs in-process |\n| `librefang-kernel-handle` | Handle abstraction for kernel interaction |\n| `librefang-types` | Shared type definitions |\n| `librefang-acp` | Agent Client Protocol (with `kernel-adapter` feature) |\n| `librefang-wire` | Wire protocol types |\n| `librefang-llm-driver` / `librefang-llm-drivers` | LLM provider abstraction and driver implementations |\n| `librefang-memory` | Agent memory subsystem |\n| `librefang-channels` | Channel types (no default features — adapters are sidecars) |\n| `librefang-skills` | Skill system |\n| `librefang-hands` | Tool/action execution |\n| `librefang-extensions` | Extension loading |\n| `librefang-import` | Import functionality |\n| `librefang-http` | Shared HTTP utilities |\n| `librefang-telemetry` | Telemetry infrastructure |\n\n## OpenAPI\n\nThe committed `openapi.json` at the workspace root is generated by `cargo xtask codegen --openapi` using `utoipa`. Drift is verified in CI against hash baselines in `xtask/baselines/`.","other-librefang-channels-benches":"# Other — librefang-channels-benches\n\n# librefang-channels-benches: Dispatch Hot-Path Benchmarks\n\nCriterion microbenchmark suite covering the performance-critical paths in `librefang-channels`: JSON (de)serialization of channel messages, agent routing resolution, and cross-platform message formatting.\n\n**File:** `librefang-channels/benches/dispatch.rs`\n\n## Purpose\n\nThese benchmarks guard against regressions in the three operations that execute on every inbound or outbound message:\n\n| Operation | Why it matters |\n|---|---|\n| `ChannelMessage` serde | Every persisted or transmitted message is serialized at least once |\n| `AgentRouter::resolve` / `resolve_with_context` | Runs per-incoming-message to determine which agent handles it |\n| `format_for_channel` / `split_message` / `default_phase_emoji` | Runs per-outgoing-message to adapt content for the target platform |\n\n## Running\n\n```bash\n# All groups\ncargo bench -p librefang-channels\n\n# Single group\ncargo bench -p librefang-challenges -- serialization\ncargo bench -p librefang-channels -- routing\ncargo bench -p librefang-channels -- formatting\n\n# Individual benchmark\ncargo bench -p librefang-channels -- router_resolve_direct\n```\n\nResults are saved under `target/criterion/` with HTML reports.\n\n## Benchmark Groups\n\n### Serialization (`serialization`)\n\nMeasures `serde_json` throughput on `ChannelMessage`.\n\n| Benchmark | What it does |\n|---|---|\n| `message_serialize` | `serde_json::to_string` on a sample `ChannelMessage` |\n| `message_deserialize` | `serde_json::from_str::<ChannelMessage>` from pre-serialized JSON |\n| `message_roundtrip` | Serialize then immediately deserialize — catches combined overhead |\n\n**Fixture:** `make_sample_message()` constructs a Telegram `ChannelMessage` with a text payload, a sender (`ChannelUser` with `platform_id` and `display_name`), a timestamp, and empty metadata. The `black_box` wrapper prevents the compiler from eliding the work.\n\n### Routing (`routing`)\n\nMeasures `AgentRouter` resolution under increasingly complex configurations.\n\n| Benchmark | Router setup | Resolution path |\n|---|---|---|\n| `router_resolve_direct` | One default agent + one direct route (`Telegram`/`user-42` → agent) | Direct-route hit — fastest path |\n| `router_resolve_default_fallback` | One default agent, no channel/user routes | Falls through to default |\n| `router_resolve_binding_match` | Agent registered as `\"support\"`, binding matches `telegram` + `vip-user` | Binding rule match via `load_bindings` |\n| `router_resolve_with_context` | Agent registered as `\"admin-bot\"`, binding matches `discord` + `guild_id` + `roles` | Context-aware resolution with `BindingContext` including guild and role data |\n\nThe progression is intentional: each successive benchmark exercises additional matching logic in the router, so comparing them reveals the marginal cost of binding evaluation and context matching.\n\n### Formatting (`formatting`)\n\nMeasures the `format_for_channel` conversion pipeline and related utilities.\n\n| Benchmark | Input | Output format |\n|---|---|---|\n| `format_markdown_passthrough` | Multi-paragraph markdown (`SAMPLE_MARKDOWN`) | `OutputFormat::Markdown` |\n| `format_telegram_html` | Same markdown | `OutputFormat::TelegramHtml` |\n| `format_slack_mrkdwn` | Same markdown | `OutputFormat::SlackMrkdwn` |\n| `format_plain_text` | Same markdown | `OutputFormat::PlainText` |\n| `format_telegram_html_short` | `\"Hello world!\"` | `OutputFormat::TelegramHtml` |\n| `split_message_short` | `\"Hello!\"` with limit 4096 | No split needed |\n| `split_message_long` | 500 repeated lines with limit 4096 | Multiple chunks |\n| `default_phase_emoji_all` | All six `AgentPhase` variants | Emoji lookup per phase |\n\nThe `SAMPLE_MARKDOWN` constant exercises bold, italic, code spans, links, and bullet lists — the full set of markup constructs the formatter must handle.\n\n## Dependencies on Library Code\n\n```mermaid\ngraph LR\n    dispatch_rs[\"dispatch.rs<br/>(benchmarks)\"]\n    dispatch_rs --> types[\"types module<br/>ChannelMessage, split_message,<br/>default_phase_emoji, AgentPhase\"]\n    dispatch_rs --> router[\"router module<br/>AgentRouter, BindingContext\"]\n    dispatch_rs --> formatter[\"formatter module<br/>format_for_channel\"]\n    dispatch_rs --> librefang_types[\"librefang-types<br/>AgentId, AgentBinding,<br/>BindingMatchRule, OutputFormat\"]\n```\n\nKey API surfaces exercised:\n\n- **`librefang_channels::types`** — `ChannelMessage`, `ChannelUser`, `ChannelContent`, `ChannelType`, `split_message`, `default_phase_emoji`, `AgentPhase`\n- **`librefang_channels::router`** — `AgentRouter::new`, `set_default`, `set_direct_route`, `register_agent`, `load_bindings`, `resolve`, `resolve_with_context`; `BindingContext`\n- **`librefang_channels::formatter`** — `format_for_channel`\n- **`librefang_types::agent`** — `AgentId`\n- **`librefang_types::config`** — `OutputFormat`, `AgentBinding`, `BindingMatchRule`\n\n## Adding New Benchmarks\n\n1. Place the benchmark function in the appropriate section of `dispatch.rs` (or create a new section with a comment header).\n2. Add the function to the relevant `criterion_group!` macro invocation, or define a new group and include it in `criterion_main!`.\n3. Use `black_box` on all inputs and outputs to prevent dead-code elimination.\n4. For router benchmarks, construct the `AgentRouter` setup inside the benchmark function (before the `bench_function` closure) so setup cost is excluded from the measurement. The closure should contain only the `resolve`/`resolve_with_context` call.","other-librefang-channels-src":"# Other — librefang-channels-src\n\n# librefang-channels-src — Channel Adapter Allowlist\n\n## Purpose\n\nThis module contains a single file, `channels-allowlist.txt`, which acts as a **policy ratchet** governing which channel adapters may be compiled in-process within the `librefang-channels` crate. It enforces LibreFang's **sidecar-first architecture**: all new channel adapters must be implemented as out-of-process sidecar adapters, not as in-process modules.\n\nThe allowlist exists to grandfather in adapters that predate this policy. It is not a security boundary — it is a development guardrail.\n\n## How It Works\n\n### Enforcement Points\n\nTwo mechanisms read this file and reject violations:\n\n1. **Pre-commit hook** — runs locally before a commit is finalized.\n2. **`cargo xtask channel-policy`** — executed in CI on every pull request.\n\nBoth check every file under `crates/librefang-channels/src/` (both `<name>.rs` and `<name>/*.rs` patterns). If a file contains the token `ChannelAdapter for` and its basename (without `.rs`) is **not** listed in `channels-allowlist.txt`, the check fails.\n\n### Current Allowlist\n\n```\nsidecar\n```\n\nOnly the `sidecar` module is permitted to contain an in-process `ChannelAdapter` implementation. This is the bootstrap/bridge module that connects the in-process world to the sidecar world.\n\n## Policy Rules\n\n| Rule | Detail |\n|---|---|\n| **List only shrinks** | When an adapter is migrated to a sidecar and its source module deleted, its name is removed from this file. |\n| **No re-addition** | Once a name is removed, it can never be reintroduced without explicit maintainer approval. |\n| **One name per line** | Basenames only — no `.rs` extension. Entries are kept sorted alphabetically. |\n\n## Known Limitations\n\nThe detection is text-based: it looks for the literal string `ChannelAdapter for` in source files. The following cases are **not** caught:\n\n- **Macro-generated implementations.** A proc macro that expands to `impl ChannelAdapter for X` will not trigger the check.\n- **New adapters in already-allowlisted files.** Adding a second `ChannelAdapter for Y` inside a file whose basename is already listed will pass the check.\n\nThese are accepted gaps. The allowlist is a ratchet to prevent *growth*, not a comprehensive audit tool.\n\n## Migration Path for Contributors\n\nWhen migrating an in-process adapter to a sidecar:\n\n1. Implement the adapter as an out-of-process sidecar (see `librefang.sidecar.adapters.*` in the SDK or `examples/sidecar-channel-python/adapter.py` for a generic template).\n2. Delete the in-process module (`crates/librefang-channels/src/<name>.rs` or `crates/librefang-channels/src/<name>/`).\n3. Remove the module's basename from `channels-allowlist.txt`.\n4. Verify that `cargo xtask channel-policy` passes.\n\n```mermaid\nflowchart LR\n    A[In-process adapter] -->|migrate| B[Sidecar adapter]\n    A -->|delete source| C[Remove module]\n    C -->|shrink| D[channels-allowlist.txt]\n    B --> E[SDK: librefang.sidecar.adapters]\n```\n\n## Relationship to the Codebase\n\n```\nlibrefang-channels/\n└── src/\n    ├── channels-allowlist.txt   ← this file (policy)\n    ├── sidecar.rs               ← only allowlisted in-process module\n    └── ...\n```\n\nThe allowlist is referenced by:\n- **Pre-commit hooks** — local enforcement.\n- **`xtask channel-policy`** — CI enforcement.\n- **Contributor workflow** — anyone adding or migrating channel adapters.\n\nOut-of-process adapters live outside this crate entirely and are not subject to this allowlist. They interact with LibreFang through the sidecar protocol defined in the SDK.","other-librefang-channels-tests":"# Other — librefang-channels-tests\n\n# librefang-channels-tests\n\nIntegration and conformance tests for the `librefang-channels` crate. Two test files cover distinct concerns:\n\n- **`bridge_integration_test.rs`** — end-to-end dispatch pipeline tests exercising `BridgeManager` with mock adapters and kernel handles\n- **`sidecar_protocol_conformance.rs`** — protocol serialization/deserialization conformance against a shared JSON corpus used by both the Rust sidecar implementation and the Python SDK\n\nNo external services are contacted. All communication is in-process via tokio channels and tasks.\n\n---\n\n## Test Infrastructure (`bridge_integration_test.rs`)\n\n### `wait_until` — Deadline-Bounded Condition Polling\n\n```rust\nasync fn wait_until<F>(label: &str, mut cond: F)\nwhere\n    F: FnMut() -> bool,\n```\n\nReplaces fixed `sleep()` waits with a 2-second deadline loop polling every 5ms. Gives the dispatch pipeline exactly as much time as it needs while failing fast on regressions. The 2s budget is well above the ~tens-of-ms in-process latency but tight enough that a stuck dispatch surfaces quickly.\n\nPanics with a labeled message on timeout.\n\n### Mock Adapters\n\nAll mock adapters implement `ChannelAdapter`. They inject test messages via an `mpsc::Sender<ChannelMessage>` and capture outbound responses in an `Arc<Mutex<Vec<...>>>` for assertion.\n\n| Adapter | Streaming | `send_streaming` behavior | Purpose |\n|---|---|---|---|\n| `MockAdapter` | No | Default (collect → `send()`) | Basic text/command dispatch tests |\n| `MockStreamingAdapter` | Yes (`supports_streaming() → true`) | Assembles deltas, records in `streamed` | Verifies streaming path is taken |\n| `MockFailingStreamingAdapter` | Yes | Drains deltas then returns `Err` | Exercises fallback on transport failure |\n| `NotifyingAdapter` | No | N/A | Approval listener tests; overrides `notification_recipients()` and `account_id()` |\n\nEach adapter's `new()` returns `(Arc<Self>, mpsc::Sender<ChannelMessage>)`. The sender injects `ChannelMessage` instances into the adapter's inbound stream; the adapter captures all `send()` output as `(platform_id, text)` pairs.\n\n`MockAdapter::send()` also flattens `ChannelContent::Interactive` button labels into text for assertion convenience.\n\n### Mock Kernel Handles\n\nAll implement `ChannelBridgeHandle`. They serve agent lists, record received messages, and optionally provide streaming or event-bus support.\n\n| Handle | Streaming | Event Bus | Key Behavior |\n|---|---|---|---|\n| `MockHandle` | No | No | Echoes messages: `Ok(\"Echo: {message}\")` |\n| `MockStreamingHandle` | Yes (word-at-a-time deltas) | No | Splits response into space-delimited word deltas via `mpsc::channel` |\n| `MockProgressHandle` | With status | No | Emits `🔧 tool_name` progress line + prose; simulates tool-use streaming |\n| `MockKernelErrorHandle` | With status | No | Emits partial deltas + progress, then reports `Err(\"rate limit hit\")` via status oneshot |\n| `MockKernelOkHandle` | With status | No | Emits clean text, reports `Ok(())` via status oneshot; records `record_delivery` calls for metric contract assertions |\n| `EventBusHandle` | No | Yes (`broadcast::Sender`) | Exposes `subscribe_events()` with a real broadcast channel for approval listener tests |\n\n### Message Constructors\n\n```rust\nfn make_text_msg(channel: ChannelType, user_id: &str, text: &str) -> ChannelMessage\nfn make_command_msg(channel: ChannelType, user_id: &str, cmd: &str, args: Vec<&str>) -> ChannelMessage\n```\n\nBuild `ChannelMessage` instances with sensible defaults (`platform_message_id: \"msg1\"`, `is_group: false`, current timestamp, empty metadata). `make_command_msg` constructs a `ChannelContent::Command` variant; `make_text_msg` constructs `ChannelContent::Text`.\n\n---\n\n## Dispatch Pipeline Tests\n\n### Message Routing\n\n| Test | Verifies |\n|---|---|\n| `test_bridge_dispatch_text_message` | Text message reaches the correct agent (pre-routed via `router.set_user_default`); echo response returns through the adapter |\n| `test_bridge_dispatch_no_agent_assigned` | Unrouted user gets \"No agents available\" error message |\n| `test_bridge_dispatch_slash_command_in_text` | Plain text \"/agents\" is intercepted and handled as a command (not forwarded to an agent) |\n\n### Command Handling\n\n| Test | Command | Verifies |\n|---|---|---|\n| `test_bridge_dispatch_agents_command` | `/agents` | Response lists all registered agents by name |\n| `test_bridge_dispatch_help_command` | `/help` | Response mentions `/agents` and `/agent` |\n| `test_bridge_dispatch_agent_select_command` | `/agent coder` | Confirmation message; `router.resolve()` returns the selected agent for subsequent messages |\n| `test_bridge_dispatch_status_command` | `/status` | Response contains \"N agent(s) running\" |\n\n### Lifecycle and Concurrency\n\n| Test | Verifies |\n|---|---|\n| `test_bridge_manager_lifecycle` | Start adapter → send 5 messages → verify 5 echo responses in order → `stop()` completes without hanging |\n| `test_bridge_multiple_adapters` | Two adapters (Telegram + Discord) run simultaneously in one `BridgeManager`; messages routed to correct adapter |\n\n---\n\n## Streaming Tests\n\nThe streaming tests exercise the interaction between three capabilities: adapter streaming support, kernel streaming support, and error fallback paths.\n\n### Happy Paths\n\n```\nKernel supports     Adapter supports      Path taken\n─────────────────   ──────────────────   ──────────────────────\nstreaming           streaming             send_streaming (delta-by-delta)\nstreaming           non-streaming         send() (collected text)\nnon-streaming       streaming             send() (collected text)\nnon-streaming       non-streaming         send() (collected text)\n```\n\n| Test | Scenario |\n|---|---|\n| `test_bridge_streaming_adapter_uses_send_streaming` | Streaming adapter + streaming handle → `send_streaming` called, `send` not called |\n| `test_bridge_non_streaming_adapter_falls_back_to_send` | Non-streaming adapter + streaming handle → falls back to `send()` |\n| `test_default_send_streaming_collects_and_sends` | Direct call to default `send_streaming` on `MockAdapter`; verifies deltas assemble into `\"Hello world!\"` before `send()` is called |\n\n### Error and Fallback Paths\n\nThese tests cover the V2 dispatch pipeline's error handling matrix:\n\n| Test | Kernel | Transport (`send_streaming`) | Expected |\n|---|---|---|---|\n| `test_bridge_non_streaming_adapter_sees_progress_markers` | Success (with progress) | N/A (non-streaming) | Consolidated reply includes `🔧` progress markers |\n| `test_bridge_streaming_adapter_kernel_and_transport_both_fail` | Error (`\"rate limit hit\"`) | Error (`\"simulated transport failure\"`) | Fallback `send()` delivers buffered partial text + progress markers |\n| `test_bridge_streaming_adapter_kernel_ok_transport_fail_records_clean_success` | Success | Error | Fallback `send()` delivers buffered text; `record_delivery(success=true, err=None)` — the transport stream error must not leak into the metric err field (Bug 1 regression guard) |\n\n---\n\n## Approval Listener Tests\n\nRegression coverage for `BridgeManager::start_approval_listener()`. Tests span three PRs that closed progressively discovered scoping bugs:\n\n```\n#4875  Listener was dead code → wired up, basic delivery works\n  ↓\n#4985  Cross-agent broadcast leak → scoped by router channel_default\n  ↓\n#4994  Qualified-key fallback leak → no fallback from qualified to bare key\n  ↓\n#5002  Binding-only adapters dropped → fallback to AgentBinding fan-out\n```\n\n### Basic Delivery\n\n| Test | Verifies |\n|---|---|\n| `test_approval_listener_delivers_to_configured_recipients` | `ApprovalRequested` event reaches adapter's `notification_recipients()` with formatted text including tool name, approval ID prefix, and `/approve`/`/reject` hints |\n| `test_approval_listener_skips_adapter_without_recipients` | Adapter with empty recipients list produces no `send()` calls |\n\n### Agent Scoping (#4985)\n\n| Test | Verifies |\n|---|---|\n| `test_approval_listener_scopes_delivery_to_requesting_agent_adapter` | Two adapters bound to two agents via account-qualified keys (`telegram:bot-a`, `telegram:bot-b`); approval for agent A only reaches adapter A |\n| `test_approval_listener_skips_unbound_adapter` | Adapter with no `channel_default` entry in the router receives nothing |\n| `test_approval_listener_drops_malformed_agent_id` | Non-UUID `agent_id` on the event drops the notification rather than broadcasting |\n\n### Qualified Key Regression (#4994)\n\n| Test | Verifies |\n|---|---|\n| `test_approval_listener_does_not_fall_back_from_qualified_to_bare_key` | Mixed single-bot + multi-bot config; account-qualified adapter must not fall back to bare-key binding |\n| `test_approval_listener_scopes_to_non_telegram_multibot_adapter` | Scoping is channel-type-agnostic; Discord adapters with `account_id` use qualified keys (`discord:guild-1`) |\n\n### Binding-Aware Scoping (#5002)\n\nWhen an adapter has no `default_agent` (no `channel_default` entry), the listener falls back to `AgentRouter::bound_recipients_for_agent` to find bindings whose agent matches the requesting agent.\n\n| Test | Verifies |\n|---|---|\n| `test_approval_listener_falls_back_to_agent_binding_when_default_unset` | Binding maps `chat-z` → agent X; approval for X arrives at `chat-z` |\n| `test_approval_listener_binding_fallback_does_not_leak_cross_agent` | Approval for unrelated agent Y produces no delivery on adapter bound only to X |\n| `test_approval_listener_fans_out_to_all_bound_chats` | Agent bound to `chat-z1` and `chat-z2`; both receive the notification |\n| `test_approval_listener_skips_binding_with_no_peer_id` | Catch-all channel binding with no `peer_id` is skipped (no chat to deliver to) |\n| `test_approval_listener_binding_respects_account_id_scope` | Binding scoped to `(telegram, bot-a)` does not fire on `bot-b` |\n\n### Approval Test Architecture\n\n```mermaid\ngraph LR\n    A[test emits ApprovalRequested via broadcast::Sender] --> B[EventBusHandle.subscribe_events]\n    B --> C[BridgeManager approval listener task]\n    C --> D{router.channel_default key?}\n    D -- found --> E[deliver to notification_recipients]\n    D -- not found --> F{router.bound_recipients_for_agent}\n    F -- bindings found --> G[fan-out to each binding's peer_id]\n    F -- no bindings --> H[drop notification]\n```\n\n---\n\n## Sidecar Protocol Conformance (`sidecar_protocol_conformance.rs`)\n\nDual-implementation conformance testing against a shared JSON corpus at `conformance/sidecar/corpus/`. The Rust and Python SDKs both assert against the same files; drift on either side fails its respective test suite.\n\n### Directionality\n\n- **Events** (`corpus/events/`): adapters *produce* them, Rust *consumes* them — tests assert deserialization into the correct `SidecarEvent` variant\n- **Commands** (`corpus/commands/`): Rust *produces* them — tests assert serialization matches corpus JSON structurally\n\n### Corpus Structure\n\n```\nconformance/sidecar/corpus/\n├── events/\n│   ├── message.json\n│   ├── ready_full.json\n│   ├── ready_minimal.json\n│   ├── error.json\n│   └── typing.json\n└── commands/\n    ├── send_full.json\n    ├── send_minimal.json\n    ├── ready_ack.json\n    ├── shutdown.json\n    ├── heartbeat.json\n    ├── typing.json\n    ├── reaction.json\n    ├── interactive.json\n    ├── stream_start.json\n    ├── stream_start_threaded.json\n    ├── stream_delta.json\n    └── stream_end.json\n```\n\nEvery corpus file is a JSON object with a string `method` field.\n\n### Test Cases\n\n| Test | What it asserts |\n|---|---|\n| `corpus_files_are_well_formed` | Every `.json` under `events/` and `commands/` is a JSON object with a string `method` field |\n| `events_deserialize_into_expected_variant` | Each corpus event deserializes into the `SidecarEvent` variant matching its `method` (`\"message\"` → `SidecarEvent::Message`, etc.) |\n| `ready_full_and_minimal_both_parse` | `ready_full.json` parses with capabilities and `account_id`; `ready_minimal.json` parses with empty capabilities and no `protocol_version` — backward-compat guarantee |\n| `commands_serialize_to_corpus` | Each `SidecarCommand` serializes to exactly the corresponding corpus JSON (structural `Value` equality); the list of asserted files must exactly match the corpus directory contents |\n\n### Adding New Protocol Messages\n\n1. Add the corpus JSON file(s) to `conformance/sidecar/corpus/`\n2. For events: ensure `events_deserialize_into_expected_variant` covers the new `method` string in its match arms\n3. For commands: add a case to the `cases` vector in `commands_serialize_to_corpus`; the test asserts exhaustive coverage by comparing sorted filenames against the corpus directory","other-librefang-channels":"# Other — librefang-channels\n\n# librefang-channels\n\nChannel Bridge Layer for LibreFang — the infrastructure crate that connects the kernel to out-of-process channel adapters (sidecars) and provides shared messaging utilities.\n\n## Purpose\n\nThis crate does **not** contain channel adapters. Every channel adapter (Telegram, Discord, Slack, Matrix, ntfy, Signal, etc.) runs as an out-of-process Python sidecar located at `sdk/python/librefang/sidecar/adapters/`. This crate owns:\n\n- **The sidecar trampoline** (`sidecar.rs`) — spawns, communicates with, and manages the lifecycle of sidecar processes.\n- **Bridge types** (`bridge`, `types`) — the shared protocol every adapter speaks over the sidecar boundary.\n- **Shared infrastructure** — HTTP client, rate limiter, message formatting, sanitization, attachment handling, and other utilities the kernel and sidecars both need.\n\n## Architecture\n\n```mermaid\ngraph LR\n    K[librefang-kernel] -->|dispatches| C[librefang-channels]\n    C -->|\"sidecar.rs<br>trampoline\"| S1[sidecar adapter<br>Telegram]\n    C -->|\"sidecar.rs<br>trampoline\"| S2[sidecar adapter<br>Discord]\n    C -->|\"sidecar.rs<br>trampoline\"| SN[sidecar adapter<br>...]\n    C -->|bridge types| S1\n    C -->|bridge types| S2\n    C -->|bridge types| SN\n    S1 -->|ChannelMessage| C\n    S2 -->|ChannelMessage| C\n    SN -->|ChannelMessage| C\n    C -->|unified events| K\n```\n\nThe kernel sends outgoing messages to `librefang-channels`, which routes them through the sidecar trampoline to the appropriate Python adapter. Inbound messages from external platforms flow back through the same bridge in reverse, arriving at the kernel as unified `ChannelMessage` events.\n\n## Modules\n\nAll modules compile unconditionally — there are no feature gates. The full list declared in `src/lib.rs`:\n\n### Core sidecar infrastructure\n\n| Module | Role |\n|--------|------|\n| `sidecar` | Trampoline that launches and communicates with out-of-process Python sidecar adapters |\n| `bridge` | Shared protocol types exchanged across the sidecar boundary |\n| `types` | Channel-related type definitions |\n| `embedded_sdk` | Embeds `sdk/python/librefang/` into the daemon binary and extracts it at runtime |\n\n### Message processing\n\n| Module | Role |\n|--------|------|\n| `router` | Routes outgoing messages to the correct sidecar adapter |\n| `formatter` | Formats agent replies for channel-specific constraints |\n| `message_truncator` | Splits/truncates messages to platform limits (UTF-16 aware) |\n| `message_journal` | Journals message history for auditing and replay |\n| `sanitizer` | Sanitizes inbound/outbound message content |\n| `attachment_enrich` | Enriches attachment metadata (image dimensions, PDF extraction) |\n| `commands` | Channel-specific command parsing and handling |\n\n### Session and conversation management\n\n| Module | Role |\n|--------|------|\n| `thread_ownership` | Tracks which thread/conversation belongs to which channel session |\n| `group_history` | Manages group chat history context |\n| `roster` | Maintains the roster of known contacts/participants across channels |\n\n### Shared utilities\n\n| Module | Role |\n|--------|------|\n| `http_client` | Shared HTTP client with TLS configuration (rustls, aws_lc_rs backend) |\n| `rate_limiter` | Per-channel rate limiting |\n| `group_history` | Group chat history retrieval |\n\n## Embedded SDK\n\nThe `embedded_sdk` module uses the `include_dir` crate to bundle the entire Python SDK (`sdk/python/librefang/`) into the daemon binary. At runtime, it:\n\n1. Computes a content hash of the embedded SDK tree (using `sha2`).\n2. Extracts the SDK to `<home>/sidecar-python/<hash>/`.\n3. Injects that directory into `PYTHONPATH` when spawning sidecar processes.\n\nThis means a new user needs only `python3` on `PATH` to enable a sidecar channel — no `pip install` required. When the daemon upgrades and the SDK changes, the new hash causes extraction to a fresh subdirectory.\n\n## Sidecar-Only Policy\n\nThis crate enforces a strict policy: **all channel adapters must be out-of-process sidecars**. Adding a new `ChannelAdapter` implementation directly in this crate is rejected by:\n\n- `scripts/hooks/pre-commit` (local)\n- `cargo xtask channel-policy` (CI)\n\nBoth check that any file under `crates/librefang-channels/src/` containing `ChannelAdapter for` has a basename present in `channels-allowlist.txt`. That allowlist currently contains only `sidecar` and is documented to only ever shrink. Re-adding a name requires an explicit maintainer decision in a separate reviewed commit.\n\n**To add a new channel:** create a new adapter under `sdk/python/librefang/sidecar/adapters/`. See `docs/architecture/sidecar-channels.md` for the canonical onboarding flow.\n\n## Key Re-exports\n\nMessage truncation utilities used across the codebase:\n\n- `split_to_utf16_chunks`\n- `truncate_to_utf16_limit`\n- `utf16_len`\n- `DISCORD_MESSAGE_LIMIT` (2000)\n- `TELEGRAM_CAPTION_LIMIT` (1024)\n- `TELEGRAM_MESSAGE_LIMIT` (4096)\n\n## Dependencies\n\nThe crate depends on `librefang-types` for shared domain types and a standard async runtime stack (`tokio`, `futures`, `async-trait`). Notable dependencies:\n\n- **rustls** — TLS provider for the shared HTTP client, using the default `aws_lc_rs` backend (no ex
