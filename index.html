| 3 | API key validation, header checks |\n| **session** | `api-error-session-not-found` | 6 | Session CRUD, cleanup |\n| **workflow** | `api-error-workflow-missing-steps` | 5 | Multi-step workflow orchestration |\n| **trigger** | `api-error-trigger-missing-pattern` | 7 | Event trigger registration and lookup |\n| **budget** | `api-error-budget-invalid-amount` | 3 | Cost limits and budget updates |\n| **config** | `api-error-config-parse-failed` | 5 | TOML configuration read/write |\n| **profile** | `api-error-profile-not-found` | 1 | Named profile lookup |\n| **cron** | `api-error-cron-invalid-expression` | 6 | Scheduled job creation and validation |\n| **goal** | `api-error-goal-circular-parent` | 16 | Goal hierarchy, validation, CRUD |\n| **memory** | `api-error-memory-not-enabled` | 9 | Proactive memory, KV store, import/export |\n| **network** | `api-error-network-a2a-not-found` | 7 | Peer networking, A2A protocol |\n| **plugin** | `api-error-plugin-invalid-source` | 5 | Plugin installation sources |\n| **channel** | `api-error-channel-unknown` | 4 | Inter-agent channel routing |\n| **provider** | `api-error-provider-alias-exists` | 21 | LLM provider config, secrets, models |\n| **skill** | `api-error-skill-name-too-long` | 9 | Skill definition and installation |\n| **hand** | `api-error-hand-not-found` | 3 | Hand definition and instance lookup |\n| **mcp** | `api-error-mcp-missing-transport` | 5 | MCP server configuration |\n| **integration / extension** | `api-error-integration-not-found` | 3 | Extension system |\n| **system** | `api-error-system-cli-not-found` | 1 | CLI availability |\n| **kv** | `api-error-kv-missing-fields` | 4 | Structured key-value memory |\n| **approval** | `api-error-approval-not-found` | 2 | Human-in-the-loop approvals |\n| **webhook** | `api-error-webhook-url-unreachable` | 10 | Outgoing webhook delivery |\n| **backup** | `api-error-backup-missing-manifest` | 10 | Backup creation and restoration |\n| **schedule** | `api-error-schedule-invalid-cron` | 9 | Named schedule management |\n| **job** | `api-error-job-not-retryable` | 5 | Background job lifecycle |\n| **task** | `api-error-task-not-found` | 2 | Task resolution |\n| **pairing** | `api-error-pairing-invalid-token` | 2 | Device/client pairing |\n| **binding** | `api-error-binding-out-of-range` | 1 | Binding index validation |\n| **command** | `api-error-command-not-found` | 1 | CLI command lookup |\n| **file** | `api-error-file-path-traversal` | 14 | Upload/download, path security |\n| **tool** | `api-error-tool-invoke-denied` | 5 | Direct tool invocation, allowlist |\n| **validation** | `api-error-validation-color-invalid` | 5 | Field-level input validation |\n| **general** | `api-error-internal` | 4 | HTTP-level catch-alls (404, 500, 429) |\n\n## Locale Coverage Matrix\n\nNot all locales have full parity with English. The matrix below shows which domains are translated:\n\n| Domain | en | ja | de | es | fr | zh-CN |\n|--------|:--:|:--:|:--:|:--:|:--:|:-----:|\n| agent | ✅ | ✅ | ✅ | ✅ | ✅ | ✅ |\n| message | ✅ | ✅ | ✅ | ✅ | ✅ | ✅ |\n| template | ✅ | ✅ | ✅ | ✅ | ✅ | ✅ |\n| manifest | ✅ | ✅ | ✅ | ✅ | ✅ | ✅ |\n| auth | ✅ | ✅ | ✅ | ✅ | ✅ | ✅ |\n| session | ✅ | ✅ | ✅ | ✅ | ✅ | ✅ |\n| workflow | ✅ | ✅ | ✅ | ✅ | ✅ | ✅ |\n| trigger | ✅ | ✅ | ✅ | ✅ | ✅ | ✅ |\n| budget | ✅ | ✅ | ✅ | ✅ | ✅ | ✅ |\n| config | ✅ | ✅ | ✅ | ✅ | ✅ | ✅ |\n| profile | ✅ | ✅ | ✅ | ✅ | ✅ | ✅ |\n| cron | ✅ | ✅ | ✅ | ✅ | ✅ | ✅ |\n| goal | ✅ | ✅ | — | — | — | — |\n| memory | ✅ | ✅ | — | — | — | — |\n| network | ✅ | ✅ | — | — | — | — |\n| plugin | ✅ | ✅ | — | — | — | — |\n| channel | ✅ | ✅ | — | — | — | — |\n| provider | ✅ | ✅ | — | — | — | — |\n| skill | ✅ | ✅ | — | — | — | — |\n| hand | ✅ | ✅ | — | — | — | — |\n| mcp | ✅ | ✅ | — | — | — | — |\n| integration/extension | ✅ | ✅ | — | — | — | — |\n| system | ✅ | ✅ | — | — | — | — |\n| kv | ✅ | ✅ | — | — | — | — |\n| approval | ✅ | ✅ | — | — | — | — |\n| webhook | ✅ | ✅ | — | — | — | ✅* |\n| backup | ✅ | ✅ | — | — | — | — |\n| schedule | ✅ | ✅ | — | — | — | — |\n| job | ✅ | ✅ | — | — | — | — |\n| task | ✅ | ✅ | — | — | — | — |\n| pairing | ✅ | ✅ | — | — | — | — |\n| binding | ✅ | ✅ | — | — | — | — |\n| command | ✅ | ✅ | — | — | — | — |\n| file | ✅ | ✅ | — | — | — | — |\n| tool | ✅ | ✅ | — | — | — | ✅* |\n| validation | ✅ | ✅ | — | — | — | — |\n\n✅\\* = Partial coverage (subset of keys).\n\nWhen a key is missing from a non-English locale, the Fluent fallback chain resolves to the English version. This means **all routes function correctly regardless of locale completeness**, but users see English for untranslated domains.\n\n## Adding a New Error Message\n\n1. **Add the key to `en/errors.ftl` first** — this is the canonical source.\n2. **Copy the key to all other locale files** with translated text, or leave it absent (English fallback applies).\n3. **Follow the naming convention**: `api-error-<domain>-<detail>`.\n4. **Use interpolation variables** for dynamic content rather than string concatenation in code:\n\n```fluent\n# Good — uses interpolation\napi-error-template-not-found = Template '{ $name }' not found\n\n# Avoid — no context for translators\napi-error-template-not-found = Template not found\n```\n\n5. **If the error is used by an HTTP 500 handler**, consider whether `api-error-generic` suffices temporarily, but plan to create a typed key.\n\n## Adding a New Locale\n\n1. Create `librefang-types/locales/<locale-code>/errors.ftl`.\n2. At minimum, translate the **general** domain keys (`api-error-not-found`, `api-error-internal`, `api-error-bad-request`, `api-error-rate-limited`, `api-error-generic`). These are the most user-visible.\n3. Register the locale in whatever Fluent loader configuration the application uses.\n4. Translate remaining domains incrementally — the fallback mechanism ensures nothing breaks.\n\n## Relationship to Route Handlers\n\nRoute handlers reference these keys by name using the Fluent binding's lookup function (e.g., `t_args(\"api-error-agent-not-found\")` or `t_args(\"api-error-generic\", error = ...)`)`). The module itself has no executable code — it is pure data consumed by the i18n layer at runtime. The long-term migration path, noted in the source comments, is to replace bare `api-error-generic` calls with typed, domain-specific error keys backed by a `MemoryRouteError`-style enum so that every error is self-documenting and locale-independent in the type system.","other-librefang-types-src":"# Other — librefang-types-src\n\n# librefang-types: Model Catalog\n\nShared data structures for the model registry — the canonical source of truth for provider metadata, model definitions, pricing, capabilities, and per-user overrides. Every crate that needs to reason about \"what models exist, what can they do, and what do they cost\" depends on these types.\n\n## Architecture\n\n```mermaid\ngraph TD\n    TOML[\"providers/*.toml<br/>(Registry files)\"] -->|parse| MCF[ModelCatalogFile]\n    MCF -->|provider field| PCT[ProviderCatalogToml]\n    MCF -->|models array| MCE[ModelCatalogEntry]\n    PCT -->|From&lt;T&gt; into| PI[ProviderInfo]\n    PI -->|runtime enrichment| API[\"API routes /<br/>dashboard\"]\n\n    JSON[\"model_overrides.json<br/>(~/.librefang)\"] -->|parse| MO[ModelOverrides]\n    MCE -->|catalog defaults| EC[EffectiveCapabilities]\n    MO -->|user overrides| EC\n```\n\n## Enums\n\n### `ModelTier`\n\nCapability classification for models. Serialized as lowercase strings (`\"frontier\"`, `\"smart\"`, etc.). Default is `Balanced`.\n\n| Variant | Typical examples |\n|---|---|\n| `Frontier` | Claude Opus, GPT-4.1 |\n| `Smart` | Claude Sonnet, Gemini 2.5 Flash |\n| `Balanced` | GPT-4o-mini, Groq Llama |\n| `Fast` | Lightest/cheapest models |\n| `Local` | Ollama, vLLM, LM Studio |\n| `Custom` | User-added at runtime |\n\n### `AuthStatus`\n\nProvider authentication state. Default is `Missing`. Call `is_available()` to check usability — returns `true` for `ValidatedKey`, `Configured`, `AutoDetected`, `ConfiguredCli`, and `NotRequired`. Returns `false` for `InvalidKey` (key present but rejected) and all other states.\n\nNotable variants:\n- **`AutoDetected`** — key found via a fallback env var; usable but may not match the actual provider.\n- **`LocalOffline`** — local provider probed and found offline. Unlike `Missing`, `detect_auth()` will not reset this; the probe owns the transition back to `NotRequired`.\n\n### `Modality`\n\nWhat kind of output a model produces. Critical for validation: `Text` models **must** have non-zero `context_window` and `max_output_tokens`, while all other modalities may legitimately omit those fields.\n\n| Variant | Token fields required? |\n|---|---|\n| `Text` (default) | Yes — both must be > 0 |\n| `Image` | No |\n| `Audio` | No |\n| `Video` | No |\n| `Music` | No |\n\n### `ReasoningEchoPolicy`\n\nControls how the OpenAI-compatible driver handles `reasoning_content` on historical assistant turns. The ecosystem has multiple incompatible conventions, so this is encoded as per-model metadata to avoid substring-matching model names.\n\n| Variant | Behavior |\n|---|---|\n| `None` (default) | Omit `reasoning_content` on history |\n| `Strip` | Strip historical `reasoning_content`; also force non-null `content` on empty-text assistant turns (DeepSeek R1) |\n| `Echo` | Echo original thinking text on `tool_calls` turns (DeepSeek V4 Flash thinking-mode) |\n| `EmptyString` | Send empty-string `reasoning_content` on `tool_calls` turns, disable thinking wire-side (Moonshot / Kimi K2) |\n\nDrivers that use native SDKs (Anthropic, Gemini) ignore this field entirely.\n\n## Core Structs\n\n### `ModelCatalogEntry`\n\nA single model in the catalog. Key fields:\n\n- **`id`** — canonical identifier (e.g. `\"claude-sonnet-4-20250514\"`)\n- **`provider`** — provider identifier (e.g. `\"anthropic\"`)\n- **`tier`** / **`modality`** — classification enums\n- **`context_window`** / **`max_output_tokens`** — token limits; `0` means unknown or not applicable\n- **`input_cost_per_m`** / **`output_cost_per_m`** — cost per million tokens in USD\n- **`image_input_cost_per_m`** / **`image_output_cost_per_m`** — optional separate image pricing\n- **Capability flags**: `supports_tools`, `supports_vision`, `supports_streaming`, `supports_thinking`\n- **`reasoning_echo_policy`** — provider-specific reasoning wire-format handling\n- **`aliases`** — short names for lookup (e.g. `[\"sonnet\", \"claude-sonnet\"]`)\n\n#### Validation\n\nCall `validate()` after deserialization. It enforces that `Text` models have non-zero `context_window` and `max_output_tokens`. Non-text modalities skip this check. Catalog loaders **must** call this and reject entries that fail — a `0` value propagated downstream into compaction thresholds or budget math will produce incorrect behavior.\n\n```rust\nlet entry: ModelCatalogEntry = toml::from_str(raw)?;\nentry.validate()?; // reject malformed text entries\n```\n\n### `ProviderInfo` vs `ProviderCatalogToml`\n\nTwo parallel structs for provider metadata:\n\n- **`ProviderCatalogToml`** — maps 1:1 to the `[provider]` TOML section. Omits runtime-only fields. Used during parsing.\n- **`ProviderInfo`** — the runtime representation, adding `auth_status`, `model_count`, `available_models`, `is_custom`, and `proxy_url`.\n\n`ProviderCatalogToml` implements `From<ProviderCatalogToml> for ProviderInfo`, initializing runtime fields to their defaults (`Missing` auth, 0 models, etc.).\n\n### `RegionConfig`\n\nPer-region endpoint override with a `base_url` and optional `api_key_env`. Stored in `ProviderInfo::regions` as a `HashMap<String, RegionConfig>`. When a region is selected at runtime, the driver resolves the base URL from the region config, falling back to the provider-level default.\n\n### `ModelOverrides`\n\nPer-model inference parameter overrides persisted to `~/.librefang/model_overrides.json`, keyed by `provider:model_id`. Every field is `Option` — `None` means \"use the agent's or system default.\"\n\nOverride precedence: **agent-level config > model overrides > system defaults**.\n\nThe capability fields (`supports_tools`, `supports_vision`, `supports_streaming`, `supports_thinking`) allow forcing a capability on or off regardless of what the catalog declares — useful when a provider's metadata is wrong or incomplete (ref #4745).\n\n### `EffectiveCapabilities`\n\nResolved capability flags after applying `ModelOverrides` on top of the catalog entry's declared capabilities. Produced by `ModelCatalog::effective_capabilities` and consumed anywhere that gates runtime behavior on capability truth (tool use, vision input validation, etc.).\n\n### `ModelCatalogFile` and `AliasesCatalogFile`\n\nTop-level TOML file structures:\n\n- **`ModelCatalogFile`** — optional `[provider]` section + `[[models]]` array. Used by both the main repository and community catalog repos.\n- **`AliasesCatalogFile`** — maps short names to canonical model IDs via `[aliases]`.\n\n## TOML Format Reference\n\nA complete provider catalog file:\n\n```toml\n[provider]\nid = \"anthropic\"\ndisplay_name = \"Anthropic\"\napi_key_env = \"ANTHROPIC_API_KEY\"\nbase_url = \"https://api.anthropic.com\"\nkey_required = true\n\n[provider.regions.us]\nbase_url = \"https://us.anthropic.com\"\napi_key_env = \"ANTHROPIC_US_API_KEY\"   # optional per-region key override\n\n[[models]]\nid = \"claude-sonnet-4-20250514\"\ndisplay_name = \"Claude Sonnet 4\"\nprovider = \"anthropic\"\ntier = \"smart\"\ncontext_window = 200000\nmax_output_tokens = 64000\ninput_cost_per_m = 3.0\noutput_cost_per_m = 15.0\nsupports_tools = true\nsupports_vision = true\nsupports_streaming = true\naliases = [\"sonnet\", \"claude-sonnet\"]\n\n[[models]]\nid = \"gpt-image-2\"\ndisplay_name = \"GPT Image 2\"\ntier = \"frontier\"\nmodality = \"image\"\ninput_cost_per_m = 5.0\noutput_cost_per_m = 10.0\nimage_input_cost_per_m = 8.0\nimage_output_cost_per_m = 30.0\nsupports_vision = true\n# context_window / max_output_tokens omitted — not applicable to image models\n```\n\n## Serde Conventions\n\n- All enums use `#[serde(rename_all = \"lowercase\")]` or `snake_case` for wire compatibility.\n- Optional fields use `#[serde(default)]` so catalog TOML files can omit them.\n- `Option<f64>` cost fields use `#[serde(skip_serializing_if = \"Option::is_none\")]` to keep output clean.\n- All enums are `#[non_exhaustive]` — new variants can be added without a semver break.\n\n## Integration Points\n\n| Consumer | What it uses |\n|---|---|\n| **`librefang-runtime`** (`model_metadata`) | `ModelCatalogEntry` for constructing runtime model metadata |\n| **`librefang-kernel-metering`** | `ModelCatalogFile` for pricing/cost estimation |\n| **`librefang-api`** (`routes/providers`) | `ModelCatalogEntry::validate()` when adding custom models via the dashboard |\n| **Model catalog subsystem** | `ModelOverrides` and `EffectiveCapabilities` for resolving user preferences |\n| **Kernel tests** | `ModelCatalogEntry` fields (especially `context_window`) for budget/compaction behavior |\n\n## Adding a New Model\n\n1. Add a `[[models]]` entry to the appropriate `providers/*.toml` file.\n2. For text models, `context_window` and `max_output_tokens` are **required** — `validate()` will reject the entry if either is zero.\n3. For non-text models, set `modality` explicitly and omit the token fields.\n4. If the model has provider-specific reasoning wire-format quirks, set `reasoning_echo_policy`.\n5. Add aliases for convenient lookup.","other-librefang-types-tests":"# Other — librefang-types-tests\n\n# librefang-types Tests\n\nIntegration tests that guard the contract between the dashboard's TypeScript serializer and the kernel's Rust deserializer, and ensure config struct defaults remain consistent across `Default` impls and serde deserialization.\n\n## Test Files\n\n### `agent_form_roundtrip.rs`\n\nMirrors the exact TOML output produced by the dashboard's visual editor (implemented in `crates/librefang-api/dashboard/src/lib/agentManifest.ts`). Any drift between the TypeScript serializer and the Rust deserializer is caught at build time.\n\n**Tests:**\n\n| Test | What it validates |\n|---|---|\n| `parses_form_minimum_viable_output` | Minimal manifest with only required fields (`name`, `version`, `module`, `[model]`). |\n| `parses_form_full_output_with_capabilities_and_resources` | Full manifest including `tags`, `skills`, `[resources]`, `[capabilities]`, and model tuning (`temperature`, `max_tokens`). |\n| `parses_form_with_advanced_sections` | Every advanced section filled: `priority`, `session_mode`, `web_search_augmentation`, `schedule`, `exec_policy`, `[thinking]`, `[autonomous]`, `[routing]`, `[[fallback_models]]`, `[[context_injection]]`. This is the highest-risk test for field renames or enum variant changes. |\n| `parses_form_response_format_json_schema` | The `response_format` inline TOML table deserializes into `ResponseFormat::JsonSchema` with correct `name` and `strict` fields. |\n| `omitting_optional_sections_uses_defaults` | When the form leaves out `[resources]` and `[capabilities]`, the kernel falls back to `ResourceQuota` / `ManifestCapabilities` defaults (e.g. empty `network` list, `agent_spawn = false`, `max_llm_tokens_per_hour = None`). |\n\n### `config_default_roundtrip.rs`\n\nRegression suite for [issue #3404](https://github.com/librefang/librefang/issues/3404). The bug class: a developer adds a field with `#[serde(default)]` but forgets to update the manual `Default` impl. Deserialization from empty TOML fills the field with `T::default()` via serde, while `T::default()` in-process returns whatever the manual impl produces. The two silently diverge.\n\n**How it works:**\n\nEvery test asserts two properties for a config type `T`:\n\n1. `T::default()` equals what serde produces from an empty TOML document.\n2. `T::default()` round-trips losslessly through TOML serialization.\n\nEquality is checked by comparing serialized TOML strings rather than requiring `PartialEq` on every config type — this avoids cascading derives through the entire nested config tree.\n\n**Helper functions:**\n\n- **`assert_default_roundtrip::<T>(label)`** — for the common case where `Default` and serde-empty must agree on every field.\n- **`assert_default_roundtrip_with::<T>(label, normalize)`** — for types with a known legitimate divergence. The `normalize` closure patches the divergent field before comparison. Every other field is still checked exactly.\n\n**Special case — `KernelConfig`:**\n\n`config_version` intentionally differs between the two sources:\n\n- `KernelConfig::default()` sets `config_version = CONFIG_VERSION` (currently `2`) — fresh in-memory configs need no migration.\n- `default_config_version()` (called by serde for missing fields) returns `1` — a migration tripwire so `run_migrations` lifts legacy configs forward.\n\nThe test normalizes only `config_version`, preserving the comparison on every other field.\n\n**Covered types (50+ tests):**\n\n`QueueConfig`, `QueueConcurrencyConfig`, `BudgetConfig`, `SessionConfig`, `CompactionTomlConfig`, `TaskBoardConfig`, `TriggersConfig`, `WebhookTriggerConfig`, `WebConfig`, `WebFetchConfig`, `BrowserConfig`, `BraveSearchConfig`, `TavilySearchConfig`, `PerplexitySearchConfig`, `JinaSearchConfig`, `ReloadConfig`, `RateLimitConfig`, `SkillsConfig`, `ExtensionsConfig`, `VaultConfig`, `AutoReplyConfig`, `InboxConfig`, `TelemetryConfig`, `PromptIntelligenceConfig`, `CanvasConfig`, `ThinkingConfig`, `ContextEngineTomlConfig`, `ExternalAuthConfig`, `AuditConfig`, `PrivacyConfig`, `HealthCheckConfig`, `HeartbeatTomlConfig`, `AutoDreamConfig`, `RegistryConfig`, `MemoryConfig`, `MemoryDecayConfig`, `ChunkConfig`, `NetworkConfig`, `TtsConfig`, `DockerSandboxConfig`, `PairingConfig`, `SanitizeConfig`, `ParallelToolsConfig`, `TerminalConfig`, `AgentManifest`, `ChannelsConfig`, `BroadcastConfig`.\n\n**Pinned-value test — `channels_config_default_has_50mb_max`:**\n\nIndependent regression test for [issue #4436](https://github.com/librefang/librefang/issues/4436). Even if a future change zeroes both `Default` and the serde helper (keeping them \"consistent\" in the roundtrip test), this test still catches the regression by asserting `file_download_max_bytes == 50 * 1024 * 1024`.\n\n### `schemars_poc.rs`\n\nProof-of-concept diagnostics that dump `schemars`-generated JSON Schema (draft-07) for representative config types. Not a pass/fail gate for schema correctness — intended for developer inspection.\n\nRun with visible output:\n\n```bash\ncargo test -p librefang-types --test schemars_poc -- --nocapture\n```\n\n**Tests:**\n\n| Test | Purpose |\n|---|---|\n| `dump_budget_config_schema` | Baseline struct schema. |\n| `dump_vault_config_schema` | Contains `Option<PathBuf>` — tests filesystem path rendering. |\n| `full_kernel_config_schema_generates` | End-to-end sanity: asserts `KernelConfig` generates valid JSON with >50 top-level properties and >50 nested definitions. |\n| `dump_response_format_schema` | Tagged enum with a variant carrying `serde_json::Value` — major risk point for schema correctness. |\n\n## Adding a New Config Type Test\n\nIf you add a config struct `FooConfig` with both `#[serde(default)]` and a manual `impl Default`:\n\n1. In `config_default_roundtrip.rs`, add:\n   ```rust\n   #[test]\n   fn foo_config_default_roundtrips_through_toml() {\n       assert_default_roundtrip::<FooConfig>(\"FooConfig\");\n   }\n   ```\n\n2. If `FooConfig` has a field that legitimately differs between `Default` and serde-empty (like `KernelConfig::config_version`), use `assert_default_roundtrip_with` and pass a normalizer closure.\n\n3. If the field carries a pinned default value critical for runtime correctness (like `ChannelsConfig::file_download_max_bytes`), add an independent pinned-value assertion so a \"consistent but wrong\" change still fails CI.\n\n## Architecture\n\n```mermaid\ngraph LR\n    subgraph Dashboard TypeScript\n        A[agentManifest.ts serializer]\n    end\n    subgraph librefang-types Rust\n        B[AgentManifest serde Deserialize]\n        C[KernelConfig + 50 config types]\n    end\n    A -- \"TOML output\" --> B\n    agent_form_roundtrip_rs[\"agent_form_roundtrip.rs\"] --> B\n    config_default_roundtrip_rs[\"config_default_roundtrip.rs\"] --> C\n    schemars_poc_rs[\"schemars_poc.rs\"] --> C\n    config_default_roundtrip_rs[\"config_default_roundtrip.rs\"] -- \"catches #3404 bug class\" --> C\n```","other-librefang-types":"# Other — librefang-types\n\n# librefang-types\n\nShared data structures for the LibreFang Agent OS. Every other workspace crate depends on this one. **Contains no business logic** — pure types, derive-only helpers, and error enumerations.\n\n## Position in the dependency graph\n\nThis crate sits at the absolute bottom. It imports external libraries only (`serde`, `chrono`, `uuid`, `thiserror`, `schemars`, etc.) and zero workspace crates. Every other `librefang-*` crate may import from here; this crate imports from nothing in the workspace.\n\n```\n┌──────────────────────┐\n│   librefang-api      │\n│   librefang-kernel   │\n│   librefang-runtime  │\n│   ...                │\n└────────┬─────────────┘\n         │ imports\n         ▼\n┌──────────────────────┐\n│  librefang-types     │  ← bottom of DAG\n└────────┬─────────────┘\n         │ imports\n         ▼\n   serde, chrono, uuid,\n   thiserror, schemars, ...\n```\n\n## Public modules\n\n| Module | Domain |\n|---|---|\n| `agent` | Agent identity and descriptors |\n| `approval` | Human-approval gating types |\n| `capability` | Permission/capability tokens |\n| `comms` | Inter-agent communication types |\n| `config` | Configuration structs (including `KernelConfig`) |\n| `error` | `LibreFangError` and related error enums |\n| `event` | Event types emitted by the kernel |\n| `goal` | Goal/task representation |\n| `i18n` | Internationalization types |\n| `manifest_signing` | Signed manifest verification types |\n| `media` | Media/attachment types |\n| `memory` | Memory substrate types |\n| `message` | Chat/message types |\n| `model_catalog` | Model registry types |\n| `oauth` | OAuth credential types |\n| `registry_schema` | Registry payload schemas |\n| `scheduler` | Task scheduler types |\n| `serde_compat` | Serde helpers for cross-format compatibility |\n| `subagent` | Sub-agent spawning types |\n| `taint` | Taint-tracking types |\n| `tool` / `tool_class` | Tool definition and classification |\n\n## Constants\n\n- **`VERSION: &str`** — workspace version, compiled from `CARGO_PKG_VERSION`.\n\n## Key dependencies\n\n| Dependency | Role |\n|---|---|\n| `serde` / `serde_json` | Serialization framework |\n| `chrono` | Timestamps (`DateTime<Utc>`) |\n| `uuid` | Identifiers |\n| `thiserror` | Error enum derives |\n| `schemars` | JSON Schema generation (config types) |\n| `toml` | TOML deserialization (config types) |\n| `dirs` | Default path resolution |\n| `ed25519-dalek` / `sha2` / `hex` / `zeroize` | Manifest signing |\n| `fluent` / `unic-langid` | i18n |\n| `regex-lite` | Lightweight regex for validation |\n| `url` | Parsed URL types |\n| `tracing` | Log-level annotations |\n\nDev-dependencies: `rmp-serde` (MessagePack round-trip tests), `tempfile`.\n\n---\n\n## Adding a new type\n\n1. **Pick the right module.** Place the type in the matching submodule. If no module fits, create one — but first verify this is truly a cross-crate type and not something that belongs in the consuming crate.\n2. **Derive the standard quartet:** `Debug`, `Clone`, `Serialize`, `Deserialize`. Add `PartialEq`, `Eq`, or `Hash` only when a downstream consumer needs them.\n3. **OpenAPI surface types:** also derive `utoipa::ToSchema`.\n4. **Configuration types:** also derive `schemars::JsonSchema`.\n5. **Map/set fields in prompt-bound types:** use `BTreeMap` / `BTreeSet`, never `HashMap` / `HashSet`. Deterministic ordering matters for LLM prompts.\n\n```rust\n#[derive(Debug, Clone, Serialize, Deserialize)]\npub struct MyNewType {\n    pub id: uuid::Uuid,\n    pub label: String,\n}\n```\n\n## Adding a field to a config struct\n\nEvery config struct change has downstream effects. Follow all four steps:\n\n1. **Add the field** with `#[serde(default)]` so existing TOML files continue to parse.\n2. **Update the `Default` impl.** The build breaks if you forget.\n3. **Add a doc comment.** `schemars` surfaces doc comments as the `description` field in the generated JSON Schema.\n4. **Regenerate the golden fixture** in `librefang-api`'s test suite. CI will catch this if you don't.\n\n```rust\n#[derive(Debug, Clone, Serialize, Deserialize, JsonSchema)]\npub struct KernelConfig {\n    /// Maximum concurrent tool invocations per agent.\n    #[serde(default = \"default_max_concurrent_tools\")]\n    pub max_concurrent_tools: usize,\n    // ...\n}\n```\n\n## Schema-mirror invariant\n\n`librefang-types` *defines* the schema; `librefang-api` *guards* it. The test `kernel_config_schema_matches_golden_fixture` compares the live `JsonSchema` output against a checked-in golden file in `librefang-api/tests`.\n\nCI enforces this through the **changed-lanes rule**: any PR that touches `librefang-types` automatically pulls `librefang-api` into the affected test set. You cannot bypass this.\n\nWhen you change a `KernelConfig` field (add, rename, retype), you **must** regenerate the golden fixture. The canonical OpenAPI and TOML baselines live under `xtask/baselines/`.\n\n## Error types\n\nThis crate owns `LibreFangError` and related error enums. The codebase is migrating away from `Result<_, String>` and `anyhow::Error` in trait boundaries (refs #3541, #3711). New error variants go here.\n\nWhen adding a variant:\n\n- Preserve the `source()` chain so backtraces remain useful.\n- Use `#[from]` on wrapped enums — this is the standard idiom.\n\n```rust\n#[derive(Debug, thiserror::Error)]\npub enum LibreFangError {\n    #[error(\"configuration error: {0}\")]\n    Config(#[from] ConfigError),\n\n    #[error(\"tool execution failed: {name}\")]\n    ToolFailed { name: String, source: ToolError },\n}\n```\n\n## Hard rules\n\n| Rule | Why |\n|---|---|\n| No `tokio` | Sync types only. Async runtime belongs in consumers. |\n| No `reqwest` | HTTP code lives in consumer crates. Types are data-only. |\n| No `librefang-*` imports | This is the bottom of the DAG. Reverse the dependency. |\n| No function bodies > 5 lines | If it *does* something, it belongs elsewhere. |\n| No `HashMap` in prompt-bound types | Non-deterministic iteration order breaks LLM reproducibility (#3298). Use `BTreeMap`. |\n| No silently dropped serde fields | Use `#[serde(default)]` explicitly, or let it fail at compile time. |","other-librefang-wire":"# Other — librefang-wire\n\n# librefang-wire\n\nLibreFang Protocol (OFP) — agent-to-agent networking and cryptographic handshake layer.\n\n## Purpose\n\n`librefang-wire` implements the secure communication protocol that LibreFang agents use to talk to each other. It handles the full lifecycle of an agent-to-agent session: cryptographic key exchange, message framing, authentication, and encrypted transport. This crate is purely a protocol library — it defines *how* bytes move between agents, not *what* those agents do with the information.\n\n## Cryptographic Architecture\n\nThe dependency set reveals a clear multi-layered cryptographic design:\n\n```mermaid\nflowchart TD\n    A[X25519 ECDH] --> B[Shared Secret]\n    B --> C[HKDF Key Derivation]\n    C --> D[Tx/Rx Session Keys]\n    C --> E[HMAC-SHA256 Keys]\n    F[Ed25519 Signatures] --> G[Identity Verification]\n    D --> H[Encrypted Message Channel]\n    E --> H\n    G --> H\n```\n\n### Key Exchange — X25519\n\nAgents perform an ephemeral Diffie-Hellman exchange using `x25519-dalek`. Each side generates an ephemeral keypair, exchanges public keys, and derives a shared secret. This provides forward secrecy — compromising a long-term key does not expose past session traffic.\n\n### Key Derivation — HKDF\n\nThe raw X25519 shared secret is fed through HKDF (`hkdf` crate with `sha2` for the underlying hash) to produce:\n\n- **Session encryption keys** (separate Tx and Rx keys for each direction)\n- **HMAC authentication keys** for message integrity\n\nHKDF ensures the derived keys are cryptographically independent even though they originate from the same shared secret.\n\n### Identity — Ed25519\n\nLong-term agent identities are backed by Ed25519 keypairs (`ed25519-dalek`). During handshake, agents sign their ephemeral public keys with their long-term identity key, allowing the peer to verify who they are talking to. This separates identity from session encryption.\n\n### Message Authentication — HMAC-SHA256\n\n`hmac` and `sha2` provide keyed-hash message authentication. Every message on the wire carries an HMAC, and verification uses `subtle` for constant-time comparison to prevent timing side-channel attacks.\n\n## Role in the System\n\n```mermaid\nflowchart LR\n    subgraph Agent Process\n        T[librefang-types] --> W[librefang-wire]\n        W --> App[Application Logic]\n    end\n    W <--TCP_TLS[\"TCP/TLS\"]--> W2[Peer Agent]\n```\n\n| Dependency | Role in this crate |\n|---|---|\n| `librefang-types` | Shared message types, protocol enums, wire format definitions |\n| `tokio` | Async I/O for reading/writing frames on TCP streams |\n| `serde` / `serde_json` | Serialization of handshake payloads and message envelopes |\n| `dashmap` | Concurrent map for tracking active sessions or peer state |\n| `uuid` | Correlation IDs for request/response matching |\n| `chrono` | Timestamps in handshake and message metadata |\n| `tracing` | Structured logging of protocol events (handshake steps, errors) |\n| `async-trait` | Trait definitions for transport abstraction, allowing mock or alternate transports in tests |\n| `thiserror` | Typed error enums for protocol failures |\n\n## Error Handling\n\nErrors are defined using `thiserror` and should cover the distinct failure modes of the protocol:\n\n- Handshake failures (invalid signature, unsupported version)\n- Decryption failures (bad key, corrupted ciphertext)\n- Authentication failures (HMAC mismatch, unknown peer identity)\n- Framing errors (malformed messages, oversized payloads)\n- I/O errors wrapping `tokio`/underlying transport failures\n\n## Testing\n\nThe `tempfile` dev-dependency suggests tests that involve writing session state, keys, or cached peer information to temporary files, then verifying the protocol works end-to-end across clean and resuming sessions.\n\n## Development Notes\n\n- **No panics in crypto code.** All key operations return `Result` types. The `subtle` dependency exists specifically to avoid branching on secret data.\n- **Sessions are directional.** Because HKDF produces separate Tx/Rx keys, each agent in a pair uses a different key for sending vs. receiving. Code that handles both directions must key them correctly.\n- **Wire compatibility.** Changes to the handshake protocol or message framing are breaking changes. Version negotiation happens at the handshake layer using types from `librefang-types`.\n- **Transport abstraction.** The use of `async-trait` means the protocol logic should not be coupled to a specific I/O type. Implementations accept a generic async read/write stream, making the protocol testable with in-memory channels.","other":"# Other\n\n# Other — LibreFang Agent OS Workspace Crates\n\nThis module group contains the complete crate-level architecture of the **LibreFang Agent Operating System** — a platform for running, orchestrating, and extending autonomous AI agents across messaging channels on a 24×7 basis. The crates are organized into layered subsystems with clear dependency boundaries.\n\n## Architecture Overview\n\n```mermaid\ngraph TD\n    subgraph \"Client Surface\"\n        CLI[librefang-cli]\n        DESKTOP[librefang-desktop]\n        ACP[librefang-acp]\n    end\n\n    subgraph \"API Layer\"\n        API[librefang-api]\n        DASH[librefang-api-dashboard]\n    end\n\n    subgraph \"Kernel & Orchestration\"\n        KERNEL[librefang-kernel]\n        HANDLE[librefang-kernel-handle]\n        ROUTER[librefang-kernel-router]\n        METER[librefang-kernel-metering]\n    end\n\n    subgraph \"Runtime & Execution\"\n        RUNTIME[librefang-runtime]\n        AUDIT[librefang-runtime-audit]\n        MCP[librefang-runtime-mcp]\n        MEDIA[librefang-runtime-media]\n        SANDBOX[librefang-runtime-sandbox-docker]\n    end\n\n    subgraph \"LLM Integration\"\n        DRIVER[librefang-llm-driver]\n        DRIVERS[librefang-llm-drivers]\n    end\n\n    subgraph \"Agent Capabilities\"\n        HANDS[librefang-hands]\n        SKILLS[librefang-skills]\n        CHANNELS[librefang-channels]\n    end\n\n    subgraph \"Infrastructure\"\n        TYPES[librefang-types]\n        HTTP[librefang-http]\n        TELEMETRY[librefang-telemetry]\n        EXT[librefang-extensions]\n        TESTING[librefang-testing]\n    end\n\n    subgraph \"Networking\"\n        WIRE[librefang-wire]\n    end\n\n    CLI --> API\n    DESKTOP --> API\n    ACP --> HANDLE\n    API --> KERNEL\n    KERNEL --> RUNTIME\n    KERNEL --> HANDLE\n    KERNEL --> ROUTER\n    KERNEL --> METER\n    RUNTIME --> AUDIT\n    RUNTIME --> MCP\n    RUNTIME --> MEDIA\n    RUNTIME --> SANDBOX\n    RUNTIME --> DRIVERS\n    DRIVERS --> DRIVER\n    KERNEL --> HANDS\n    KERNEL --> SKILLS\n    KERNEL --> CHANNELS\n    CHANNELS --> HTTP\n    DRIVERS --> HTTP\n    EXT --> HTTP\n    WIRE --> HTTP\n    API --> EXT\n    API --> TELEMETRY\n    API --> DASH\n\n    DRIVER --> TYPES\n    KERNEL --> TYPES\n    RUNTIME --> TYPES\n    CHANNELS --> TYPES\n    WIRE --> TYPES\n    TESTING --> TYPES\n```\n\n## Subsystem Breakdown\n\n### Foundation Layer\n\n| Crate | Purpose |\n|-------|---------|\n| [librefang-types](Other%20—%20librefang-types.md) | Shared data structures at the bottom of the dependency DAG. Every workspace crate depends on this; it depends on nothing in the workspace. |\n| [librefang-http](Other%20—%20librefang-http.md) | Centralized `reqwest` client builder with uniform TLS (rustls) and proxy configuration. All HTTP-speaking crates go through here. |\n| [librefang-telemetry](Other%20—%20librefang-telemetry.md) | OpenTelemetry/Prometheus metric definitions — single source of truth for counters, gauges, and histograms. |\n| [librefang-testing](Other%20—%20librefang-testing.md) | Shared test infrastructure: mock kernel, mock LLM driver, and axum route test helpers. |\n\n### Kernel & Orchestration\n\nThe kernel is the central coordination hub. It manages agent lifecycles, scheduling, permissions, inter-agent messaging, and fans requests out to the runtime and LLM layers.\n\n- [librefang-kernel](Other%20—%20librefang-kernel.md) — Core orchestration: agent registry, cron scheduling, event bus, session lifecycle.\n- [librefang-kernel-handle](Other%20—%20librefang-kernel-handle.md) — Defines the `KernelHandle` trait, the stable in-process interface for kernel callers. Enables test mocking and decoupling.\n- [librefang-kernel-router](Other%20—%20librefang-kernel-router.md) — Resolves incoming requests to the correct Hand implementation via pattern matching and TOML routing rules.\n- [librefang-kernel-metering](Other%20—%20librefang-kernel-metering.md) — Token usage tracking and cost quota enforcement.\n\n### Runtime & Execution\n\nThe runtime layer handles the agent loop, tool execution, sandboxing, and media generation — everything that happens after the kernel dispatches work.\n\n- [librefang-runtime](Other%20—%20librefang-runtime.md) — Agent loop (LLM completion → tool execution → response assembly → session persistence), gateway compression, compaction.\n- [librefang-runtime-audit](Other%20—%20librefang-runtime-audit.md) — Tamper-evident Merkle hash chain for auditable runtime events. Persisted to SQLite with optional external anchor files.\n- [librefang-runtime-mcp](Other%20—%20librefang-runtime-mcp.md) — MCP (Model Context Protocol) transport implementations for tool integration.\n- [librefang-runtime-media](Other%20—%20librefang-runtime-media.md) — Provider-agnostic media drivers (TTS, image/video generation, speech-to-text) with caching.\n- [librefang-runtime-sandbox-docker](Other%20—%20librefang-runtime-sandbox-docker.md) — Docker container sandbox for isolated tool execution with resource limits and network isolation.\n\n### LLM Integration\n\nSplit into trait definition and concrete implementations to prevent dependency bloat:\n\n- [librefang-llm-driver](Other%20—%20librefang-driver.md) — The `LlmDriver` trait and `LlmError` enum. No provider code, no TLS dependencies.\n- [librefang-llm-drivers](Other%20—%20librefang-drivers.md) — Concrete implementations for Anthropic, OpenAI, Gemini, Groq, Ollama, etc., with credential pooling, fallback chains, rate limiting, retry with backoff, and stream backpressure.\n\n### Agent Capabilities\n\n- [librefang-hands](Other%20—%20librefang-hands.md) — Curated, versioned capability packages (Hands). Provides registry, loading, validation, and disk persistence.\n- [librefang-skills](Other%20—%20librefang-skills.md) — Skill discovery, loading, registry, marketplace client, and OpenClaw compatibility layer.\n- [librefang-channels](Other%20—%20librefang-channels.md) — Bridge layer connecting the kernel to out-of-process channel adapters (Telegram, Discord, Slack, Matrix, Signal, etc.) running as Python sidecars. Owns the sidecar trampoline, bridge protocol types, and shared messaging infrastructure.\n\n### Client Surfaces\n\nThree interfaces expose LibreFang to users and editors:\n\n- [librefang-cli](Other%20—%20librefang-cli.md) — The `librefang` binary. Operates in daemon mode (forwarding to a running HTTP daemon) or single-shot mode (in-process kernel for one-off commands).\n- [librefang-desktop](Other%20—%20librefang-desktop.md) — Native Tauri 2.0 application for macOS, Windows, Linux, iOS, and Android. Desktop embeds the kernel; mobile is a thin client connecting to a remote daemon.\n- [librefang-acp](Other%20—%20librefang-acp.md) — Agent Client Protocol adapter for editor integration (Zed, VS Code, JetBrains) over stdio JSON-RPC.\n\n### API & Dashboard\n\n- [librefang-api](Other%20—%20librefang-api.md) — axum HTTP/WebSocket server exposing agent management, sessions, channels, approvals, MCP, peer/A2A networking, and the embedded React dashboard.\n- [librefang-api-dashboard](Other%20—%20librefang-api-dashboard.md) — React 19 + TanStack Router + TanStack Query SPA for real-time agent management. PWA-enabled with service worker.\n- [librefang-api-static](Other%20—%20librefang-api-static.md) — i18n locale files (English, Japanese) for the dashboard.\n\n### Cross-Cutting Infrastructure\n\n- [librefang-extensions](Other%20—%20librefang-extensions.md) — Credential vault, MCP server lifecycle management, OAuth2 PKCE flows, and workspace environment parsing. Shared by API, CLI, and Desktop.\n- [librefang-wire](Other%20—%20librefang-wire.md) — LibreFang Protocol (OFP) for agent-to-agent networking. Handles X25519 key exchange, HKDF-derived session keys, AEAD encryption, and HMAC-SHA256 integrity.\n- [librefang-import](Other%20—%20librefang-import.md) — Migration engine for importing agent configs from LangChain, AutoGPT, Semantic Kernel, and other frameworks.\n- [librefang-rl-export](Other%20—%20librefang-rl-export.md) — RL rollout trajectory exporter for W&B, Tinker, and Atropos integration.\n\n## Key Workflows That Span Crates\n\n**Agent message processing:** An inbound message arrives via a channel sidecar → [librefang-channels](Other%20—%20librefang-channels.md) deserializes and routes it → [librefang-kernel](Other%20—%20librefang-kernel.md) resolves the target agent via [librefang-kernel-router](Other%20—%20librefang-kernel-router.md) → [librefang-runtime](Other%20—%20librefang-runtime.md) runs the agent loop → [librefang-llm-drivers](Other%20—%20librefang-llm-drivers.md) streams completions → tool results are collected → response is formatted and dispatched back through channels. Token usage is tracked by [librefang-kernel-metering](Other%20—%20librefang-kernel-metering.md) and every auditable event is appended to the [librefang-runtime-audit](Other%20—%20librefang-runtime-audit.md) Merkle chain.\n\n**CLI/Dashboard → Kernel path:** Both [librefang-cli](Other%20—%20librefang-cli.md) and [librefang-api-dashboard](Other%20—%20librefang-api-dashboard.md) talk to the kernel through [librefang-api](Other%20—%20librefang-api.md)'s REST/WebSocket surface, which uses the [librefang-kernel-handle](Other%20—%20librefang-kernel-handle.md) trait for in-process dispatch. Credentials are resolved through [librefang-extensions](Other%20—%20librefang-extensions.md)' vault, and all HTTP traffic uses [librefang-http](Other%20—%20librefang-http.md)'s shared client.\n\n**Editor integration:** [librefang-acp](Other%20—%20librefang-acp.md) translates editor JSON-RPC messages into kernel operations via the `KernelHandle` trait, enabling agent-assisted coding in Zed, VS Code, and JetBrains without running a full API server.\n\n**Agent-to-agent networking:** [librefang-wire](Other%20—%20librefang-wire.md) provides the cryptographic handshake and encrypted transport. Agents on different daemons establish X25519 key exchange sessions and communicate through AEAD-encrypted channels, with integrity verified via HMAC-SHA256 hash chains.\n\n## Test Suites\n\nNearly every crate has a companion `-tests` crate providing hermetic integration tests against mock kernels and fake LLM providers. Key test suites include:\n\n| Test Crate | Scope |\n|-----------|-------|\n| [librefang-api-tests](Other%20—%20librefang-api-tests.md) | Production router end-to-end: auth middleware, validation, error envelopes, security boundaries |\n| [librefang-kernel-tests](Other%20—%20librefang-kernel-tests.md) | Agent lifecycle, async tasks, memory, RBAC, cron, hand management, workflows |\n| [librefang-llm-drivers-tests](Other%20—%20librefang-llm-drivers-tests.md) | Wire contract validation against wiremock servers for each LLM provider |\n| [librefang-channels-tests](Other%20—%20librefang-channels-tests.md) | Bridge dispatch pipeline and sidecar protocol conformance |\n| [librefang-extensions-tests](Other%20—%20librefang-extensions-tests.md) | Credential vault cryptographic round-trips and key rotation |\n| [librefang-memory-tests](Other%20—%20librefang-memory-tests.md) | Chat-scoped canonical memory isolation (privacy regression guard) |","overview":"# crates — Wiki\n\n# LibreFang Agent OS\n\nLibreFang is an open-source agent operating system for running, orchestrating, and extending autonomous AI agents around the clock across messaging channels, editors, and native desktop apps. It provides a complete vertical stack — from LLM driver abstraction and persistent memory through to channel integrations (Telegram, Discord, Slack, WhatsApp), an ACP adapter for editor embedding, a browser dashboard, and a Tauri 2.0 desktop application.\n\n## Architecture\n\n```mermaid\ngraph TD\n    subgraph \"Client Surface\"\n        CLI[\"CLI & TUI\"]\n        DESK[\"Desktop App\"]\n        ACP[\"ACP Adapter\"]\n        DASH[\"Dashboard UI\"]\n    end\n\n    subgraph \"API & Transport\"\n        API[\"API Server + Routes\"]\n        CHAN[\"Channel Integrations\"]\n    end\n\n    subgraph \"Core Runtime\"\n        RT[\"Agent Runtime\"]\n        KERN[\"Kernel\"]\n    end\n\n    subgraph \"Infrastructure\"\n        LLM[\"LLM Drivers\"]\n        MEM[\"Memory & Storage\"]\n        MCP[\"MCP Protocol\"]\n    end\n\n    CLI --> API\n    DESK --> API\n    ACP --> API\n    DASH --> API\n    CHAN --> API\n    API --> RT\n    API --> KERN\n    RT --> LLM\n    RT --> MEM\n    RT --> MCP\n    KERN --> MEM\n    KERN --> RT\n```\n\nThe system is organized into four concentric layers:\n\n1. **Client Surface** — how users and tools reach LibreFang. The [CLI & TUI](librefang-cli-src.md) is the primary entry point for developers; the [Desktop Application](librefang-desktop-src.md) wraps the full stack in a native window with system tray integration and auto-updates; the [ACP Adapter](librefang-acp-src.md) lets editors like Zed, VS Code, and JetBrains embed agents via JSON-RPC over stdio; and the [Dashboard UI](librefang-dashboard-src.md) provides a browser-based management console backed by a typed [Dashboard Data Layer](librefang-dashboard-data-layer-src.md).\n\n2. **API & Transport** — the [API Server](librefang-api-src.md) exposes the kernel over HTTP with authentication, streaming, approval workflows, and error sanitization. Its route handlers live in [API Routes](librefang-api-routes-src.md). [Channel Integrations](librefang-channels-src.md) normalize inbound messages from heterogeneous chat platforms into a unified `ChannelMessage` type, debounce rapid-fire input, and route responses back through the originating adapter.\n\n3. **Core Runtime** — the [Agent Runtime](librefang-runtime-src.md) orchestrates every agent turn: prompt assembly, context loading, LLM completion, tool dispatch, and post-turn persistence. The [Kernel](librefang-kernel-src.md) provides the shared services every agent depends on — identity registration, approval management, cost enforcement, configuration, and routing.\n\n4. **Infrastructure** — [LLM Drivers](librefang-llm-drivers-src.md) provide a trait-based abstraction over upstream providers with per-provider implementations, exhaustion tracking, and error classification. [Memory & Storage](librefang-memory-src.md) combines an SQLite-backed structured store (via `r2d2` pools in WAL mode) with vector search, knowledge graphs, session history, and proactive memory consolidation. [MCP Protocol](librefang-runtime-mcp-src.md) implements the Model Context Protocol client for discovering and dispatching external tools while enforcing security boundaries around credential exfiltration and network access.\n\n## Key Supporting Modules\n\n- [Hands Orchestration](librefang-hands-src.md) — pre-built, domain-complete autonomous agent packages from a marketplace that run in the background; users check in on them rather than driving them turn-by-turn.\n- [Skills System](librefang-skills-src.md) — marketplace-driven skill discovery, installation, and iterative agent-driven refinement with version control.\n- [Extensions & Vault](librefang-extensions-src.md) — lifecycle management for MCP server integrations, credential storage with vault key preseeding, and OAuth flows.\n- [Wire Protocol & Networking](librefang-wire-src.md) — agent-to-agent TCP networking with Ed25519 authentication, ephemeral key exchange, and encrypted sessions.\n- [Docker Sandbox](librefang-runtime-docker-src.md) — OS-level isolation for agent code execution with capability dropping, network isolation, read-only filesystems, and resource limits.\n- [Media Processing](librefang-runtime-media-src.md) — provider-agnostic abstraction for image generation, TTS, transcription, and video analysis.\n- [Runtime Audit](librefang-runtime-audit-src.md) — tamper-evident Merkle hash chain audit trail for security-critical actions, persisted to SQLite.\n- [Telemetry & Observability](librefang-telemetry-src.md) — centralized metrics instrumentation emitting consistent, low-cardinality telemetry to a Prometheus exporter.\n- [Shared Types](librefang-types-src.md) — pure data types at the bottom of the dependency graph, consumed by nearly every other crate.\n- [HTTP Client](librefang-http-src.md) — centralized HTTP client construction with proxy support, TLS fallback to bundled CA roots, and consistent timeout configuration.\n- [Data Import & Migration](librefang-import-src.md) — migrates agent configurations and memory from OpenClaw, OpenFang, and other frameworks into LibreFang's native format.\n- [RL Data Export](librefang-rl-export-src.md) — exports long-horizon RL rollout trajectories to W&B, Tinker, or Atropos without inspecting the payload.\n- [Testing Utilities](librefang-testing-src.md) — mock infrastructure for testing API routes, kernel operations, and LLM interactions without starting a full daemon or requiring network access.\n\n## End-to-End Flows\n\n### Chat message → agent response\n\nA user sends a message on Telegram. [Channel Integrations](librefang-channels-src.md) normalizes it into a `ChannelMessage`, debounces rapid-fire messages from the same sender, and routes it through the [API Server](librefang-api-src.md) to the correct agent. The [Agent Runtime](librefang-runtime-src.md) loads context from [Memory & Storage](librefang-memory-src.md), dispatches tool calls via [MCP Protocol](librefang-runtime-mcp-src.md), calls an [LLM Driver](librefang-llm-drivers-src.md) for completion (streaming or non-streaming), persists the turn, and delivers the response back through the channel adapter.\n\n### Editor session via ACP\n\nAn editor launches the [ACP Adapter](librefang-acp-src.md) as a subprocess. The adapter translates the Agent Client Protocol's JSON-RPC 2.0 frames into LibreFang API calls, letting the editor provide its own approval modals, file I/O, terminal hosting, and prompt streaming — the agent operates with native editor integration rather than through the dashboard.\n\n### Provider health check → LLM call\n\nWhen the API lists available LLM providers, the flow traverses [API Routes](librefang-api-routes-src.md) → provider health probing in the runtime → the [HTTP Client](librefang-http-src.md) with proxy resolution and TLS configuration → and ultimately an [LLM Driver](librefang-llm-drivers-src.md) completion request to the upstream provider.\n\n### Skill evolution\n\nAn agent modifies a skill at runtime. The call flows from [Agent Runtime](librefang-runtime-src.md) through [API Routes](librefang-api-routes-src.md) into the [Skills System](librefang-skills-src.md), which acquires a file lock, writes updated TOML, and records version history. The skill is immediately available for subsequent turns.\n\n## Getting Started\n\nClone the repository and build the workspace:\n\n```bash\ngit clone https://github.com/librefang/crates.git\ncd crates\ncargo build\n```\n\nThe fastest way to explore is through the [CLI & TUI](librefang-cli-src.md):\n\n```bash\ncargo run --bin librefang -- tui\n```\n\nThis launches the interactive terminal dashboard. From there you can configure providers, create agents, and start chatting. The CLI also supports single-shot commands that boot a temporary in-process kernel, as well as daemon mode for 24×7 operation.\n\nFor editor integration, see the [ACP Adapter](librefang-acp-src.md) docs. For the native desktop experience, see [Desktop Application](librefang-desktop-src.md). To migrate from another agent framework, start with [Data Import & Migration](librefang-import-src.md).","rl-data-export":"# RL Data Export\n\n# RL Data Export (`librefang-rl-export`)\n\nLong-horizon RL rollout trajectory exporter. Takes a finished agent rollout and delivers the trajectory bytes to an upstream RL-tracking service — W&B, Tinker, or Atropos — without inspecting or transcoding the payload.\n\n## Architecture\n\n```mermaid\nflowchart TD\n    Caller -->|ExportTarget + RlTrajectoryExport| export[\"export()\"]\n    export --> SSRF[\"ssrf::validate_egress_url\"]\n    SSRF -->|WandB| wandb[\"wandb::export_to_wandb\"]\n    SSRF -->|Tinker| tinker[\"tinker::export_to_tinker\"]\n    SSRF -->|Atropos| atropos[\"atropos::export_to_atropos\"]\n    wandb --> retry[\"retry::retry_upload\"]\n    tinker --> retry\n    atropos --> retry\n    wandb --> redact[\"redact::redact_metadata\"]\n    tinker --> redact\n    retry -->|Ok| Receipt[\"ExportReceipt\"]\n    retry -->|Err| Error[\"ExportError\"]\n```\n\nEvery exporter follows the same two-step pattern:\n\n1. **Register** — create a run/session/environment on the upstream and recover a server-assigned ID.\n2. **Upload** — post the opaque `trajectory_bytes` under that ID.\n\nThe public entry point `export()` dispatches on `ExportTarget`, runs the SSRF egress check, resolves any env-var secrets, and calls into the target-specific private module. All HTTP uses the workspace shared client from `librefang_http::proxied_client()`.\n\n## Public API\n\n### `export(target: ExportTarget, payload: RlTrajectoryExport) -> Result<ExportReceipt, ExportError>`\n\nThe only public function. Fully async; caller must provide a Tokio runtime.\n\nReturns `ExportReceipt` containing the upstream's browser-loadable run URL, bytes uploaded, and timestamp. See `ExportError` variants for failure taxonomy.\n\n### Types\n\n**`ExportTarget`** — `#[non_exhaustive]` enum selecting the upstream:\n\n| Variant | Auth | Egress mode | Two-step pair |\n|---|---|---|---|\n| `WandB` | API key via env var, HTTP Basic (`api:<key>`) | Public only | `POST /api/runs` → `POST /files/{entity}/{project}/{run_id}` |\n| `Tinker` | `X-API-Key` header via env var | Public only | `POST /api/v1/create_session` → `POST /api/v1/telemetry` |\n| `Atropos` | None (local microservice) | Loopback/RFC-1918 only | `POST /register-env` → `POST /scored_data` |\n\nSecret-bearing variants use the `api_key_env` indirection — the field holds the **name** of the environment variable, not the secret itself. The exporter reads the env var at upload time and fails closed with `InvalidConfig` if unset or empty. This keeps secrets out of `config.toml` and process dumps.\n\n**`RlTrajectoryExport`** — the payload to ship:\n\n- `run_id: String` — caller-side identifier; used as a hint when the upstream accepts one.\n- `trajectory_bytes: Vec<u8>` — opaque bytes forwarded verbatim. Wire format is owned by the producer (RFC #3330 locks it later; this crate does not depend on that RFC).\n- `toolset_metadata: Option<serde_json::Value>` — structured metadata scrubbed before egress.\n- `started_at` / `finished_at: DateTime<Utc>` — rollout window timestamps.\n\n**`ExportReceipt`** — confirmed upload:\n\n- `target_run_url: String` — browser-loadable URL returned by the upstream.\n- `bytes_uploaded: u64` — mirrors `trajectory_bytes.len()`.\n- `uploaded_at: DateTime<Utc>` — local wall-clock time of completion.\n\n## Error Taxonomy (`ExportError`)\n\n`#[non_exhaustive]` enum with a flat, string-payload-heavy design. Callers generally render the upstream's message to the operator; distinct variants exist only where call sites need to branch on the cause.\n\n| Variant | Trigger | Retryable |\n|---|---|---|\n| `NetworkError(String)` | DNS, TCP/TLS, read timeout | Yes |\n| `AuthError` | HTTP 401/403 | No |\n| `UpstreamRejected { status, body }` | Non-auth 4xx/5xx (body truncated to 4 KiB) | Only 429 and 5xx |\n| `MalformedResponse(String)` | 2xx body didn't match expected shape | No |\n| `InvalidConfig(String)` | Empty project, unset env var, SSRF block — caught before any I/O | No |\n| `TrainerNotReady { status_label }` | Atropos trainer hasn't booted (sentinel 200 with no `env_id`) | Yes (poll with backoff) |\n\nHelper functions in `error.rs`:\n\n- `classify_status(status, body)` — maps 401/403 → `AuthError`, everything else → `UpstreamRejected`.\n- `classify_response_decode_error(err, context)` — splits `reqwest::Error` from `Response::json()` into `MalformedResponse` (decode failure) vs `NetworkError` (transport drop mid-body).\n- `read_body_truncated(resp)` — reads the error response body, lossy-UTF8 decodes, truncates to 4 KiB.\n\n## Per-Target Details\n\n### W&B (`wandb.rs`)\n\n- **Register**: `POST {base}/api/runs` with project, entity, run_id hint, started_at, finished_at, and scrubbed metadata. Returns `run_id` and `url`.\n- **Upload**: `POST {base}/files/{entity}/{project}/{run_id}` with `Content-Type: application/octet-stream`. Path segments are percent-encoded — entity, project, and run_id are caller-controlled and may contain `/`, spaces, or other reserved characters.\n- **Auth**: HTTP Basic with literal user `api` and the API key as password, per W&B REST docs.\n- **Defaults**: base URL `https://api.wandb.ai`. Entity is **required** — no fallback; the prior `\"default\"` guess silently landed runs under wrong-named buckets.\n\n### Tinker (`tinker.rs`)\n\n- **Register**: `POST {base}/api/v1/create_session` with sorted tags, optional user_metadata, sdk_version, and project_id. Returns `session_id`.\n- **Upload**: `POST {base}/api/v1/telemetry` with a single `GenericEvent` whose `event_data` carries the trajectory bytes as standard base64 (`trajectory_bytes_b64`), byte length, run ID, and timestamps.\n- **Auth**: `X-API-Key` header. Tinker's SDK requires the `tml-` prefix; this crate forwards the key verbatim and lets the upstream enforce it.\n- **Defaults**: base URL `https://tinker.thinkingmachines.dev/services/tinker-prod`.\n- **Note**: Tinker has no dedicated opaque-trajectory endpoint today. The `create_session + telemetry` pair is the closest stable match against the current SDK source. If Tinker ships a dedicated trajectory endpoint later, this module should switch.\n\n### Atropos (`atropos.rs`)\n\n- **Register**: `POST {base}/register-env` with `RegisterEnvRequest` (max_token_length, desired_name, weight, group_size). Returns `env_id` and `wandb_name`.\n- **Upload**: `POST {base}/scored_data` with the raw `trajectory_bytes` as `application/json`. The bytes **must already be valid `ScoredData` JSON** (`tokens`, `masks`, `scores`, …). Invalid payloads get a 422 from Atropos, surfaced as `UpstreamRejected`.\n- **Auth**: None. Atropos is a local FastAPI trainer-environment bus, not a cloud service.\n- **Trainer-not-ready**: If the trainer hasn't called `/register` yet, Atropos returns 200 with `{\"status\": \"wait for trainer to start\"}` and no `env_id`. The exporter surfaces this as `TrainerNotReady` — callers should poll with backoff.\n- **Tuning**: `AtroposTuning` (internal struct) lets operators override `max_token_length`, `group_size`, and `weight` via `ExportTarget::Atropos` fields. Defaults are conservative: 32,768 tokens, group size 1, weight 1.0.\n\n## Supporting Modules\n\n### Retry (`retry.rs`)\n\n`retry_upload(label, op)` — retries transient errors with exponential backoff: 3 attempts at 200ms base (200ms, 400ms delays). Diverges intentionally from the workspace's LLM retry loop (4 attempts at 1000ms) — trajectories are post-rollout, sub-second retry keeps failure latency low.\n\nTransient classification:\n- `NetworkError` — yes\n- `UpstreamRejected` with status 429 or 5xx — yes\n- Everything else (`AuthError`, `MalformedResponse`, `InvalidConfig`, `TrainerNotReady`, non-429 4xx) — no\n\n### SSRF Guard (`ssrf.rs`)\n\n`validate_egress_url(url, mode)` — two egress modes:\n\n- **`Public`** (W&B, Tinker): rejects loopback, RFC-1918, link-local, known internal hostnames (`localhost`, `metadata.google.internal`), non-HTTP schemes, and userinfo in URLs.\n- **`LoopbackOrPrivate`** (Atropos): accepts only loopback (`127.0.0.0/8`, `::1`) and RFC-1918 (`10/8`, `172.16/12`, `192.168/16`). Rejects public destinations, link-local/IMDS (`169.254.169.254`), and known metadata hostnames. No implicit default URL — operators must set `base_url` explicitly.\n\nAlso handles IPv4-mapped IPv6 and NAT64 addresses to prevent bypass via alternate address representations. No DNS resolution — the check is purely on the URL string so it's deterministic and offline.\n\n### Credential Redaction (`redact.rs`)\n\n`redact_metadata(value)` — walks a `serde_json::Value` and rewrites credential-shaped string values (keys are left intact). Three regex patterns applied in order:\n\n1. **JWT** — `eyJ…` three-segment base64url tokens → `<REDACTED:JWT>`\n2. **API keys** — `sk_…`, `api_key=…`, `token: …` → `<REDACTED:CREDENTIAL>`\n3. **Long base64** — ≥40 char blobs → `<REDACTED:BLOB>`\n\nPatterns mirror `librefang_kernel::trajectory::RedactionPolicy` and are kept in sync via a snapshot test (`regex_set_matches_kernel_snapshot`) that compares the local `const` patterns against `tests/fixtures/kernel_redaction_patterns.txt`. The patterns are duplicated rather than imported to avoid pulling `librefang-kernel`'s ~50 transitive crates into this leaf egress crate.\n\nRedaction fires in the W&B and Tinker paths before any network I/O. Atropos doesn't carry `toolset_metadata` on the wire.\n\n## Integration Points\n\n- **HTTP client**: `librefang_http::proxied_client()` — workspace shared reqwest client with proxy, TLS fallback roots, and `User-Agent: librefang/<version>`. No bespoke `reqwest::Client` instances.\n- **Secret resolution**: `resolve_env_secret(env_var, field_label)` reads `std::env::var` at upload time. Empty env-var name is rejected before probing.\n- **SSRF gate location**: Validation runs in the public `export()` dispatch *before* calling into target modules. The internal `*_with_base` functions skip SSRF checks so in-crate wiremock tests can point at loopback mock servers.\n\n## Adding a New Export Target\n\n1. Add a variant to `ExportTarget` (the enum is `#[non_exhaustive]` so this is non-breaking for downstream match arms, but this crate's `export()` dispatch must be updated).\n2. Create a private module implementing the two-step register-then-upload flow. Follow the existing pattern: validate config early (before I/O), use `retry_upload` for both calls, scrub metadata if the upstream receives it, return `ExportReceipt`.\n3. Add the SSRF egress mode to the dispatch in `export()`. Choose `Public` for cloud services, `LoopbackOrPrivate` for local microservices.\n4. Add `ExportError` variants only if callers need to branch on the new condition — otherwise use existing variants with descriptive messages.\n5. Write wiremock tests matching the existing per-target test structure.","runtime-audit":"# Runtime Audit\n\n# Runtime Audit\n\nMerkle hash chain audit trail for security-critical actions in the LibreFang agent runtime.\n\n## Overview\n\nEvery auditable event is appended to an append-only log where each entry contains the SHA-256 hash of its own contents concatenated with the hash of the previous entry, forming a tamper-evident chain. Any modification to a historical entry invalidates the hash of every subsequent entry, making tampering structurally detectable.\n\nWhen a SQLite connection pool is provided, entries are persisted to the `audit_entries` table (schema V8+) so the trail survives daemon restarts. An optional external anchor file closes the gap where an attacker with DB write access could fabricate an entire replacement chain.\n\n## Architecture\n\n```mermaid\ngraph TD\n    A[record / record_with_context] --> B[compute_entry_hash]\n    B --> C{DB pool available?}\n    C -->|Yes| D[BEGIN IMMEDIATE + INSERT]\n    D -->|Success| E[Push to in-memory Vec]\n    E --> F[Soft-cap drain?]\n    F --> G[Update anchor file]\n    C -->|No| E\n    D -->|Failure| H[Drop entry, do NOT advance chain]\n\n    subgraph \"Storage Layers\"\n        I[In-memory Vec<br/>Mutex-protected]\n        J[SQLite audit_entries<br/>r2d2 pool]\n        K[Anchor file<br/>seq:hash on disk]\n    end\n\n    E --> I\n    D --> J\n    G --> K\n```\n\n## Core Concepts\n\n### Hash Chain\n\nEach `AuditEntry` stores two hashes:\n\n- **`prev_hash`**: the `hash` field of the immediately preceding entry (64 zero-characters for the genesis entry)\n- **`hash`**: SHA-256 of this entry's fields concatenated with `prev_hash`, computed by the private `compute_entry_hash` function\n\nThe hash input includes `seq`, `timestamp`, `agent_id`, `action` (via `Display`), `detail`, `outcome`, and `prev_hash`. The optional `user_id` and `channel` fields are included only when present — this preserves hash stability for pre-M1 entries recorded before user attribution existed, while committing those fields to the chain for any entry that supplies them.\n\n### Chain Anchor\n\nWhen the retention trim job removes a prefix of the chain, the first surviving entry's `prev_hash` points at a dropped entry rather than the genesis sentinel. The `chain_anchor` field stores that `prev_hash` value so `verify_integrity` seeds its walk from the correct starting point instead of expecting all-zeros.\n\nOn startup, `with_db` recovers the anchor automatically: if the lowest-surviving entry's `prev_hash` is not the genesis sentinel, that value becomes the anchor. No separate schema column is needed.\n\n### External Anchor File\n\nA DB-only chain is self-consistent but cannot detect a full rewrite of `audit_entries` — an attacker who recomputes every hash from genesis forward passes the linked-list check. The anchor file stores the latest `seq:hash` pair outside SQLite (format: `<seq> <hex-hash>\\n`), providing an independent witness that must agree with the in-DB tip.\n\nThe anchor is written atomically via a `.tmp` + rename to prevent truncated writes on crash. On boot, `with_db_anchored` compares the file against the loaded chain and logs a loud error on mismatch.\n\n### Soft Cap\n\nThe in-memory buffer grows unbounded without intervention. Two mechanisms bound it:\n\n1. **Scheduled trim** (`trim`): runs on a configured interval, applies per-action retention policies\n2. **Append-path soft cap**: enforced inside `record_with_context` on every write. When the buffer exceeds `max_in_memory_entries × 1.5` (or the hard default of 10,000), the oldest prefix is drained immediately. Every drained entry is already persisted to SQLite, so no forensic data is lost.\n\nSet the operator cap via `set_max_in_memory_entries`. A value of `0` falls back to the hard default.\n\n## Key Types\n\n### `AuditAction`\n\nEnum of auditable event categories. **Append-only** — adding new variants is safe, but renaming or reordering existing variants is a breaking change that invalidates every persisted hash because the variant name is folded into the SHA-256 via `Display` (which delegates to `Debug`).\n\nVariants include: `ToolInvoke`, `CapabilityCheck`, `AgentSpawn`, `AgentKill`, `AgentMessage`, `MemoryAccess`, `FileAccess`, `NetworkAccess`, `ShellExec`, `AuthAttempt`, `WireConnect`, `ConfigChange`, `DreamConsolidation`, `UserLogin`, `RoleChange`, `PermissionDenied`, `BudgetExceeded`, `RetentionTrim`, `A2aDiscovered`, `A2aTrusted`.\n\n### `AuditEntry`\n\nA single chain entry with fields: `seq` (monotonically increasing, 0-indexed), `timestamp` (ISO-8601), `agent_id`, `action`, `detail`, `outcome`, `user_id` (optional, post-M1), `channel` (optional, post-M1), `prev_hash`, `hash`.\n\n### `AuditLog`\n\nThe main log structure. Thread-safe — all access serialized through internal `Mutex` guards. Fields:\n\n| Field | Purpose |\n|---|---|\n| `entries` | `Mutex<Vec<AuditEntry>>` — in-memory window |\n| `tip` | `Mutex<String>` — hash of the most recent entry |\n| `db` | Optional `r2d2` SQLite connection pool |\n| `anchor_path` | Optional filesystem path for external tip witness |\n| `chain_anchor` | `Mutex<Option<String>>` — hash of the last dropped entry after trim |\n| `max_in_memory_entries` | `AtomicUsize` — operator-configured soft cap |\n\n### `TrimReport`\n\nReturned by `trim`. Contains `dropped_by_action` (`BTreeMap<String, usize>`), `total_dropped`, and `new_chain_anchor` (`Option<String>`).\n\n## API Reference\n\n### Construction\n\n```rust\n// In-memory only, no persistence\nlet log = AuditLog::new();\n\n// Persisted to SQLite\nlet log = AuditLog::with_db(pool);\n\n// Persisted + external anchor file\nlet log = AuditLog::with_db_anchored(pool, PathBuf::from(\"/var/lib/librefang/audit.anchor\"));\n```\n\n`with_db` loads all existing rows from `audit_entries`, recovers the chain anchor, and runs `verify_integrity` at WARN level. `with_db_anchored` additionally compares the anchor file against the DB tip, seeds the file if it doesn't exist, and logs an error on mismatch.\n\n### Recording Events\n\n```rust\n// Without user attribution (pre-M1 call sites)\nlet hash = log.record(\"agent-1\", AuditAction::ToolInvoke, \"curl\", \"ok\");\n\n// With user and channel attribution\nlet hash = log.record_with_context(\n    \"agent-1\",\n    AuditAction::ToolInvoke,\n    \"curl\",\n    \"ok\",\n    Some(user_id),\n    Some(\"telegram\".into()),\n);\n```\n\nBoth return the SHA-256 hash of the new entry. The entry is appended to the in-memory chain and persisted to SQLite if available.\n\n**Failure semantics**: if the SQLite `INSERT` fails (disk full, connection pool exhausted, etc.), the entry is dropped and the chain is **not** advanced. This prevents the in-memory tip from diverging from the persisted tail, which would cause a chain break on the next restart. An `ERROR`-level log message is emitted. The next `record` call reuses the same `seq` with a fresh timestamp.\n\n**Concurrency**: the SQLite write uses `BEGIN IMMEDIATE` to acquire a RESERVED lock, ensuring at most one writer is between `prev_hash` derivation and `INSERT` at any instant. This is the invariant the Merkle chain depends on under concurrent access.\n\n### Querying\n\n```rust\nlog.len();                    // entry count\nlog.is_empty();               // whether empty\nlog.tip_hash();               // hash of the most recent entry\nlog.anchor_path();            // configured anchor path, if any\n\nlog.recent(50);               // last 50 entries (cloned)\nlog.since_seq(99);            // all entries with seq > 99\n```\n\n`since_seq` is cursor-based for streaming consumers (e.g. SSE endpoints). It uses binary search (`partition_point`) for O(log n) seek. The cursor is the highest seq the consumer has already received, so `since_seq(N)` returns entries with seq strictly greater than N. An initial backfill via `recent` is required before the cursor loop starts.\n\n### Verification\n\n```rust\nmatch log.verify_integrity() {\n    Ok(()) => println!(\"Chain intact\"),\n    Err(msg) => eprintln!(\"Integrity failure: {msg}\"),\n}\n```\n\nWalks the entire chain, recomputes every hash, and checks `prev_hash` links. When an anchor file is configured, also compares the in-DB tip against the external file. Returns `Err` on the first inconsistency found — either a `prev_hash` mismatch, a hash recomputation failure, or an anchor disagreement.\n\n### Retention\n\n```rust\n// Policy-based trim (per-action windows + memory cap)\nlet report = log.trim(&retention_config, Utc::now());\n\n// Simple time-based prune\nlet dropped = log.prune(30);  // drop entries older than 30 days\n```\n\nBoth are **prefix-only** — they walk forward from the oldest entry and stop at the first survivor. This preserves the contiguous Merkle chain. The `chain_anchor` is updated to the hash of the last dropped entry so `verify_integrity` continues to pass across the trim boundary. The same prefix is deleted from SQLite so restarts see a consistent view.\n\nAfter trimming, the external anchor file is refreshed to reflect the new `entries.len()` (the tip hash itself does not change — only a prefix was removed).\n\n### Configuration\n\n```rust\n// Set the in-memory soft cap (typically from config.toml at boot)\nlog.set_max_in_memory_entries(5000);\n// Effective ceiling: 5000 × 3 / 2 = 7500 entries\n```\n\n## Threat Model\n\n| Attack | Detected by |\n|---|---|\n| Modify a historical entry | `verify_integrity` — hash mismatch at the modified seq |\n| Delete a middle entry | `verify_integrity` — `prev_hash` link broken |\n| Delete the tail entry | Anchor file — `seq`/`hash` disagree with DB |\n| Fabricate an entire replacement chain | Anchor file — tip disagrees with external witness |\n| Delete the anchor file | `verify_integrity` — fails closed (\"anchor missing\") |\n\nThe anchor file's security depends on the attacker not having write access to it. For production deployments, point `anchor_path` at a location the daemon can write to but unprivileged code cannot (chmod-0400 file owned by a different user, read-only mount, NFS share, etc.).\n\n## Hash Stability Contract\n\nThe inputs to `compute_entry_hash` are part of the module's stability guarantee:\n\n- `seq`, `timestamp`, `agent_id`, `action` (via `Debug`/`Display`), `detail`, `outcome`, `prev_hash` — always included\n- `user_id` — included only when `Some`, prefixed with `\\x1fuser_id=`\n- `channel` — included only when `Some`, prefixed with `\\x1fchannel=`\n\nPre-M1 entries that lack `user_id`/`channel` verify with their original hash because the absent fields are skipped. New entries that supply either field commit it to the chain — stripping attribution from a row would break the Merkle link.\n\n## Recovery\n\nWhen `verify_integrity` fails on boot (common in dev after untracked restarts), the recommended operator flow is:\n\n1. `librefang security verify` — inspect the failure\n2. If the loss of pre-break forensic value is acceptable (dev only): `librefang security audit-reset` truncates the chain and re-anchors at zero\n3. **Do not** run `audit-reset` in compliance or production environments","shared-types":"# Shared Types\n\n# Shared Agent Types (`librefang-types/src/agent.rs`)\n\n## Purpose\n\nThis module defines every core type that describes an **agent** in the LibreFang runtime — its identity, manifest configuration, lifecycle state, session resolution, scheduling, resource quotas, tool profiles, workspace declarations, event triggers, and skill workshop settings.\n\nIt is consumed by nearly every other crate (`librefang-kernel`, `librefang-runtime`, `librefang-api`, `librefang-cli`). Because it sits at the bottom of the dependency graph, all types here are pure data with **no runtime behaviour** beyond constructors, validation helpers, and serde round-trips.\n\n---\n\n## Core Type Map\n\n```mermaid\nclassDiagram\n    direction LR\n    class AgentManifest {\n        +name: String\n        +model: ModelConfig\n        +schedule: ScheduleMode\n        +session_mode: SessionMode\n        +resources: ResourceQuota\n        +capabilities: ManifestCapabilities\n        +profile: Option~ToolProfile~\n        +triggers: Vec~ManifestTrigger~\n        +compaction: Option~CompactionOverrides~\n        +skill_workshop: SkillWorkshopConfig\n    }\n    class AgentEntry {\n        +id: AgentId\n        +manifest: AgentManifest\n        +state: AgentState\n        +mode: AgentMode\n        +session_id: SessionId\n        +identity: AgentIdentity\n    }\n    class AgentId { +Uuid }\n    class SessionId { +Uuid }\n    class UserId { +Uuid }\n    AgentEntry *-- AgentManifest\n    AgentEntry *-- AgentId\n    AgentEntry *-- SessionId\n    AgentManifest *-- ModelConfig\n    AgentManifest *-- ResourceQuota\n    AgentManifest *-- ManifestCapabilities\n    AgentManifest *-- ManifestTrigger\n    AgentManifest *-- SkillWorkshopConfig\n```\n\n---\n\n## Identifier System\n\nThree newtype wrappers — `AgentId`, `SessionId`, `UserId` — each wrap a `Uuid`. Every one can be created randomly (`::new()`) or **derived deterministically** via UUID v5 (SHA-1 + namespace). Deterministic derivation is critical for audit-log correlation across daemon restarts.\n\n### `AgentId`\n\n| Constructor | Input | Namespace | Use case |\n|---|---|---|---|\n| `AgentId::new()` | — | random v4 | general-purpose |\n| `AgentId::from_name(name)` | agent name string | `NAMESPACE` with `agent:` prefix | TOML-declared agents |\n| `AgentId::from_hand_id(hand_id)` | hand identifier | `NAMESPACE`, bare input | hand backward compat |\n| `AgentId::from_hand_agent(hand_id, role, instance_id)` | hand + role + optional instance | `NAMESPACE` with `hand:role[:instance]` format | multi-agent hand roles |\n\nAll typed variants use a **single namespace UUID** with prefixed input strings (`\"agent:name\"`, `\"hand_id:role\"`, etc.) to avoid cross-type collisions.\n\n### `UserId`\n\n- `UserId::from_name(name)` — UUID v5 under `LIBREFANG_USER_NAMESPACE`.\n- **Warning**: `LIBREFANG_USER_NAMESPACE` is a frozen constant. Changing it re-keys every user ID and breaks fleet-wide audit history.\n\n### `SessionId`\n\nSession IDs have the richest derivation surface. Each source gets its own disjoint UUID v5 namespace so two derivations can never collide even with overlapping input strings:\n\n| Constructor | Namespace constant | Input formula | Used by |\n|---|---|---|---|\n| `SessionId::new()` | random v4 | — | ad-hoc sessions |\n| `SessionId::for_channel(agent, channel)` | `CHANNEL_SESSION_NAMESPACE` | `\"{agent_id}:{channel}\"` | channel-bound persistent sessions |\n| `SessionId::for_sender_scope(agent, ch, chat_id)` | (delegates to `for_channel`) | `compose_sender_scope(ch, chat_id)` | kernel inbound resolver, channel-bridge resets |\n| `SessionId::for_cron_run(agent, run_key)` | `CRON_RUN_SESSION_NAMESPACE` | `\"{agent_id}:{run_key}\"` | per-fire cron isolation |\n| `SessionId::for_trigger_fire(agent, trigger_id, fire_time)` | `TRIGGER_FIRE_SESSION_NAMESPACE` | `\"{agent_id}:{trigger_id}:{rfc3339_nanos}\"` | per-fire trigger isolation |\n| `SessionId::from_route_key(agent, ch, acct, conv)` | `CHANNEL_SESSION_NAMESPACE` | legacy: `for_channel`; v2: `\"v2:{agent}:{ch}:{acct}:{conv}\"` | multi-tenant channel routing |\n\n#### Scope composition — `compose_sender_scope`\n\nThe helper `compose_sender_scope(channel, chat_id)` is the **single source of truth** for building scope strings. It returns `Some(\"channel:chat_id\")` when both are present, `Some(\"channel\")` when chat_id is absent, and `None` when channel itself is empty. Both the kernel's session resolver and the runtime's memory-scope filter call this function — if they ever drift, cross-chat memory isolation breaks (#5227).\n\n---\n\n## Agent Manifest (`AgentManifest`)\n\nThe manifest is the **complete declarative configuration** for an agent, typically authored as `agent.toml`. It has ~60 fields. The most important groups:\n\n### LLM Configuration\n\n- **`model`** (`ModelConfig`) — provider, model name, temperature, max_tokens, system_prompt, optional `context_window`/`max_output_tokens` overrides, and `extra_params` (a flattened `HashMap` for provider-specific request-body extensions like Qwen's `enable_memory`).\n- **`fallback_models`** — three-state: `None` (inherit global chain), `Some([])` (disable fallbacks), `Some([...])` (explicit chain).\n- **`routing`** (`ModelRoutingConfig`) — auto-select cheap/mid/expensive models by token
