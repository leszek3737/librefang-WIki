var PAGES = {"agent-control-protocol":"# Agent Control Protocol\n\n# Agent Client Protocol (ACP) Adapter\n\n## Overview\n\n`librefang-acp` bridges LibreFang's agent runtime to the [Agent Client Protocol](https://agentclientprotocol.com/), a JSON-RPC 2.0 protocol over a duplex byte stream (typically stdio). This lets editors—Zed, VS Code, JetBrains—embed a LibreFang agent natively, with the editor providing approval modals, file I/O, terminal hosting, and prompt streaming through its own UI rather than the LibreFang dashboard.\n\nThe crate handles only the LibreFang-specific glue layer. Wire-format serialization, JSON-RPC framing, and the schema types come from the external `agent-client-protocol` crate.\n\n## Architecture\n\n```mermaid\ngraph LR\n    subgraph Editor\n        E[Editor Process]\n    end\n    subgraph librefang-acp\n        SV[server.rs<br/>Handler Chain]\n        PR[prompt.rs<br/>Event Pump]\n        EV[events.rs<br/>EventTranslator]\n        PM[permission.rs<br/>Approval Bridge]\n        FS[fs.rs<br/>FsClientHandle]\n        TM[terminal.rs<br/>TerminalClientHandle]\n        SS[session.rs<br/>SessionStore]\n    end\n    subgraph Kernel\n        AK[AcpKernel trait]\n        KA[kernel_adapter.rs<br/>KernelAdapter]\n        K[LibreFangKernel]\n    end\n    E -- \"JSON-RPC 2.0<br/>(stdio / UDS)\" --> SV\n    SV --> PR\n    PR --> EV\n    SV --> PM\n    SV --> SS\n    PR --> AK\n    PM --> AK\n    FS --> AK\n    TM --> AK\n    AK -.-> KA\n    KA --> K\n```\n\nThe adapter is split into a transport-agnostic trait (`AcpKernel`) and a concrete implementation (`KernelAdapter`, behind the `kernel-adapter` feature). This separation means the ACP server is testable without booting a real kernel—integration tests in `tests/acp_integration.rs` use a stub impl that returns canned `StreamEvent` sequences.\n\n## Entry Points\n\n**`run(kernel, agent_id)`** — Bind to stdio. Used by the `librefang acp` CLI subcommand for in-process execution.\n\n**`run_with_transport(kernel, agent_id, transport)`** — Accept an explicit transport. Used by the daemon-attached UDS listener (`librefang-api`) and integration tests driving the server over a `tokio::io::duplex` pipe.\n\nBoth functions clone `Arc<AcpKernel>` and `Arc<SessionStore>` into each handler closure, assemble the handler chain on an `Agent.builder()`, spawn the permission bridge as a background task, and drive the JSON-RPC loop until the transport closes. On exit, a drop-guard drains all remaining sessions and unregisters their kernel-side `fs/*` and `terminal/*` handles so stale connections don't leak.\n\n## Session Lifecycle\n\nSessions are managed in `session::SessionStore`, a `DashMap<AcpSessionId, SessionState>` shared across all handlers. Each `SessionState` holds:\n\n- **`librefang_session_id`** — The kernel-side session UUID, derived deterministically from the ACP session id via `Uuid::new_v5` using a fixed namespace. Same ACP id always maps to the same kernel session, so a reconnecting editor's `session/load` rejoins the existing persisted history.\n- **`cwd`** — The project root the editor declared at session creation, surfaced to the agent loop for resolving file-relative paths.\n- **`cancel`** — A `CancellationToken` triggered by `session/cancel` notifications to interrupt the active prompt pump.\n\n| ACP Method | Behavior |\n|---|---|\n| `session/new` | Mints a UUID v4 ACP session id, derives the kernel session, inserts into the store, registers `fs/*` and `terminal/*` clients. |\n| `session/load` | Creates or replaces the mapping, then replays persisted message history (most recent 50 turns) as `session/update` notifications so the editor's chat panel rehydrates. |\n| `session/resume` | Same as load in Phase 1—both create-or-replace the mapping with history replay. |\n| `session/list` | Returns all sessions, optionally filtered by `cwd`. |\n| `session/close` | Removes the session, unregisters `fs/*` and `terminal/*` clients from the kernel. |\n| `session/cancel` | Fires the session's `CancellationToken`, breaking the prompt pump's `select!`. |\n\n## Prompt Handling\n\n`prompt::handle` drives a single prompt turn end-to-end:\n\n1. Look up the ACP session and resolve to a LibreFang `SessionId`.\n2. Concatenate the prompt's content blocks via `concat_text_blocks`. Only text blocks pass through verbatim; image/audio/resource-link blocks degrade to bracketed placeholders (e.g. `[image attachment: image/png]`) since the build doesn't yet pipe binary payloads to the LLM driver. The caller surfaces a warning notification when non-text blocks are converted.\n3. Call `AcpKernel::send_prompt` to start a streaming agent turn, receiving an `mpsc::Receiver<StreamEvent>`.\n4. Pump events in a `tokio::select!` loop, racing the event channel against the session's cancel token.\n5. When the channel closes or cancel fires, resolve the `StopReason` from the last-seen `ContentComplete` event and return a `PromptResponse`.\n\n`PromptResponse.stop_reason` mapping:\n\n| LibreFang `StopReason` | ACP `StopReason` |\n|---|---|\n| `EndTurn` | `EndTurn` |\n| `MaxTokens` | `MaxTokens` |\n| `ToolUse`, `StopSequence` | `EndTurn` (agent is mid-turn in ACP's model) |\n| `ContentFiltered` | `Refusal` |\n\n## Event Translation\n\n`events::EventTranslator` is a stateful translator instantiated once per prompt turn. It converts `StreamEvent` values from the agent loop into ACP `SessionUpdate` notifications:\n\n| `StreamEvent` variant | ACP `SessionUpdate` |\n|---|---|\n| `TextDelta` | `AgentMessageChunk` |\n| `ThinkingDelta` | `AgentThoughtChunk` |\n| `OwnerNotice` | `AgentMessageChunk` (Phase 1; dedicated variant planned) |\n| `ToolUseStart` | `ToolCall` (status: `Pending`) |\n| `ToolInputDelta` | Suppressed — too granular for wire |\n| `ToolUseEnd` | `ToolCallUpdate` (status: `InProgress`, raw input attached) |\n| `ToolExecutionResult` | `ToolCallUpdate` (status: `Completed` or `Failed`) |\n| `ContentComplete`, `PhaseChange` | No wire update — consumed by the pump for `StopReason` |\n\n### Tool Call ID Tracking\n\n`ToolExecutionResult` carries only a tool `name`, not an `id`. The translator maintains a `HashMap<String, VecDeque<ToolCallId>>` — a FIFO queue per tool name — mapping results back to the originating `ToolUseStart` call. Empty queues are reaped from the map to prevent per-session memory growth.\n\n**Known limitation:** When multiple same-named calls are in flight and complete out of start-order, the FIFO pop attributes the first finished result to the first started call regardless of which actually finished. When ≥2 calls are pending for the same name, the translator prepends a disambiguation note to the result content so the editor user knows the attribution is approximate.\n\n### Tool Kind Inference\n\n`infer_tool_kind` maps LibreFang tool names to ACP `ToolKind` categories by inspecting name prefixes and substrings (`read` → `Read`, `bash`/`exec` → `Execute`, etc.). Unknown names fall back to `ToolKind::Other`.\n\n## Permission Bridge\n\n`permission::run_bridge` runs as a background task, subscribing to the kernel's `ApprovalEvent` broadcast channel and forwarding `Created` events to the editor as `session/request_permission` requests.\n\nThe flow for each approval:\n\n1. Filter by LibreFang session id — skip approvals from non-ACP surfaces.\n2. Map the session id to the ACP session id via `SessionStore::find_by_librefang_id`.\n3. Build permission options. High-risk tools (`shell_exec`, `file_write`, `file_delete`, `apply_patch`, `skill_evolve_*`) suppress the \"Allow always\" option because the kernel's remembered-decision cache keys on `(agent_id, tool_name)` only — no args hash — so a blanket allow would grant outsized blast radius.\n4. Send the request to the editor with a 60-second timeout.\n5. On response (or timeout), translate the outcome to `ApprovalDecision` and persist \"always\" choices via `AcpKernel::remember_decision` before resolving.\n\n`resolve_approval` routes through the `KernelHandle` trait (not `ApprovalManager::resolve` directly) so the kernel's deferred-approval path spawns the queued tool execution. Without this routing, an editor \"Allow once\" would clear the approval record but the agent loop would hang waiting for a tool result that never lands.\n\n## Reverse-RPC: File System\n\n`fs::FsClientHandle` wraps `ConnectionTo<Client>` to issue `fs/read_text_file` and `fs/write_text_file` requests back to the editor. The editor is the file authority — reads come from its current buffer/virtual filesystem, not the agent process's local disk.\n\n- `FsCapabilities` captures the editor's declared support at `initialize` time so the runtime can short-circuit when the editor doesn't support the operation.\n- All calls carry a 60-second timeout (`FS_RPC_TIMEOUT`) to prevent a hung editor from freezing the agent loop.\n- `FsClientHandle` implements the kernel's `AcpFsClient` trait, bridging into the kernel registry so runtime tool calls route through the editor without depending on ACP schema types.\n\nSession binding: `set_fs_client` is called at `initialize`; `register_session_fs` binds the handle to a specific LibreFang session at `session/{new,load,resume}`; `unregister_session_fs` drops the binding at `session/close`.\n\n## Reverse-RPC: Terminal\n\n`terminal::TerminalClientHandle` exposes ACP's five-method terminal state machine:\n\n1. `terminal/create` → returns a `TerminalId`\n2. `terminal/wait_for_exit` → blocks until command exits (10-minute cap)\n3. `terminal/output` → snapshots captured stdout/stderr\n4. `terminal/kill` → kills the process without releasing\n5. `terminal/release` → drops the terminal entirely\n\nThe `AcpTerminalClient::run_command` implementation orchestrates the full dance (create → wait_for_exit → output → release), always releasing on completion or failure. This mirrors the synchronous `shell_exec` semantics LibreFang's runtime tools already expect.\n\n## Kernel Adapter\n\n`kernel_adapter::KernelAdapter` (behind the `kernel-adapter` feature) is the concrete `AcpKernel` implementation wrapping `Arc<LibreFangKernel>`. It holds the kernel both as the concrete type (for methods like `send_message_streaming_with_routing_and_session_override`) and as a `KernelHandle` trait object (for `resolve_tool_approval`, which must go through the trait to trigger deferred tool execution).\n\nKey behaviors:\n\n- **Agent resolution:** Accepts UUID strings or human-readable agent names via the registry's name index.\n- **Prompt dispatch:** Calls into the kernel's streaming send, flattening kernel errors through `to_string` (typed conversion planned for Phase 2).\n- **Session history:** Pulls persisted messages from the memory substrate, filtering out system prompts and concatenating text blocks. Empty/error paths degrade to empty history so the editor's `session/load` always succeeds.\n\n## Error Handling\n\n`AcpError` wraps kernel-level `LibreFangError`, transport-level `agent_client_protocol::Error`, and adapter-specific conditions:\n\n| Variant | Meaning | JSON-RPC Mapping |\n|---|---|---|\n| `UnknownSession` | Session id not from `session/new` | `invalid_params` with reason |\n| `AgentNotFound` | Agent name/id unresolvable | `invalid_params` with reason |\n| `Kernel` | Structured kernel error | `internal_error` |\n| `Transport` | Wire-level failure | Pass-through |\n| `PromptInFlight` | Concurrent prompt on same session | `internal_error` |\n| `Internal` | Catch-all (channel closed, panic, timeout) | `internal_error` |\n\n`into_acp_error()` converts any `AcpError` into a protocol-level error suitable for returning from request handlers.\n\n## Initialization Handshake\n\nThe `initialize` handler:\n\n1. Captures the editor's `FsCapabilities` and `TerminalCapabilities` from `client_capabilities`.\n2. Creates `FsClientHandle` and `TerminalClientHandle` wrapping the connection and hands them to the kernel via `set_fs_client` / `set_terminal_client`.\n3. Returns `AgentCapabilities` declaring session load/resume/close support, with `PromptCapabilities` defaulting all multimodal flags to `false` (image/audio/resource support is not yet plumbed).\n\n## Cleanup\n\nWhen the JSON-RPC loop ends — whether cleanly, via transport error, or editor crash — `run_with_transport` drains all remaining sessions and unregisters their kernel-side handles. This prevents stale `Arc<dyn AcpFsClient>` / `Arc<dyn AcpTerminalClient>` entries from blocking future registrations for the same deterministic `SessionId` with 60-second timeouts against a dead transport.","agent-runtime":"# Agent Runtime\n\n# Agent Runtime\n\nThe Agent Runtime is the execution core of LibreFang. It orchestrates every agent turn from prompt assembly through LLM completion to post-turn persistence. The runtime is split into several cooperating subsystems: the agent loop itself (with streaming and non-streaming entry points), A2A inter-agent communication, per-turn context loading, message-history management, and end-of-turn finalization.\n\n## Architecture Overview\n\n```mermaid\ngraph TD\n    A[Kernel Entry] --> B[Agent Loop]\n    B --> C[Prompt Assembly]\n    C --> D[Context Loader<br/>agent_context]\n    C --> E[Memory Recall]\n    B --> F[LLM Completion<br/>streaming / non-streaming]\n    F --> G{EndTurn?}\n    G -- No --> H[Tool Execution]\n    H --> C\n    G -- Yes --> I[End-Turn Finalization<br/>end_turn]\n    I --> J[Memory Persistence]\n    I --> K[History Fold / Trim]\n    \n    L[A2A Client] --> M[External Agent Discovery]\n    N[A2A Task Store] --> O[Task Lifecycle Tracking]\n    P[A2A Server] --> Q[Agent Card Exposure]\n    \n    R[HTTP Routes<br/>/api/a2a/*] --> L\n    R --> N\n    R --> P\n```\n\n---\n\n## A2A Protocol (`a2a.rs`)\n\nImplements Google's Agent-to-Agent protocol for cross-framework interoperability. LibreFang agents can both *expose* capabilities to external systems and *consume* capabilities from external A2A-compliant agents.\n\n### Agent Card\n\n`AgentCard` is a JSON capability manifest served at `/.well-known/agent.json`. It describes:\n\n- **Identity**: `name`, `description`, `url`, `version`\n- **Capabilities**: `AgentCapabilities` — streaming, push notifications, state transition history\n- **Skills**: `Vec<AgentSkill>` — each skill has an `id`, `name`, `description`, discovery `tags`, and example `prompts`\n- **I/O modes**: `default_input_modes` / `default_output_modes` (e.g. `[\"text\"]`)\n\n`build_agent_card(manifest, base_url)` converts an `AgentManifest` into an `AgentCard`, mapping tool names to A2A skill descriptors. The card URL is `{base_url}/a2a`.\n\n### A2A Task Lifecycle\n\nAn `A2aTask` is the unit of work exchanged between agents. Key fields:\n\n| Field | Purpose |\n|---|---|\n| `id` | Unique task identifier |\n| `session_id` | Optional conversation continuity key |\n| `status` | Current state (see below) |\n| `messages` | Conversation turns (`Vec<A2aMessage>`) |\n| `artifacts` | Produced artifacts (`Vec<A2aArtifact>`) |\n| `agent_id` | Local agent this task dispatched to |\n| `caller_a2a_agent_id` | External caller's identity (audit/ACL) |\n\nStatus transitions follow: `Submitted → Working → Completed | Failed | Cancelled`. An `InputRequired` state allows the agent to request more input.\n\n`A2aTaskStatusWrapper` handles interoperability by accepting both the bare string form (`\"completed\"`) and the object form (`{\"state\": \"completed\", \"message\": ...}`) used by different A2A implementations. Use `.state()` to extract the underlying `A2aTaskStatus` regardless of encoding.\n\n### A2aTaskStore\n\nIn-memory task store with optional SQLite persistence. Created via:\n\n- **`A2aTaskStore::new(max_tasks)`** — in-memory only, 24-hour TTL\n- **`A2aTaskStore::with_ttl(max_tasks, duration)`** — custom TTL\n- **`A2aTaskStore::with_persistence(max_tasks, db_path)`** — SQLite-backed\n\n**Eviction policy** (applied lazily on `insert`):\n\n1. **TTL sweep**: all tasks whose `updated_at` exceeds `task_ttl` are removed, regardless of state. This prevents `Working`/`InputRequired` tasks from accumulating indefinitely.\n2. **Capacity eviction**: if still at capacity after the TTL sweep, evict the oldest terminal-state task (`Completed`/`Failed`/`Cancelled`). If none exist, evict the oldest task overall.\n\n**SQLite persistence** (`with_persistence`):\n\n- Schema: `a2a_tasks_v2` table with full `messages_json` and `artifacts_json` columns\n- On startup: prunes rows older than 7 days, then loads the most recent `max_tasks` rows into memory\n- `get()` falls back to SQLite when a task has been evicted from memory — pollers never receive 404 for recently-evicted tasks\n- Persistence is best-effort: SQLite write failures log a warning but don't fail the caller\n\nKey methods:\n\n- `insert(task)` — persist + insert with eviction\n- `get(task_id)` — memory-first, then SQLite fallback\n- `update_status(task_id, status)` — mutate in-memory + upsert\n- `complete(task_id, response, artifacts)` — append response, set `Completed`\n- `fail(task_id, error_message)` — append error, set `Failed`\n- `cancel(task_id)` — set `Cancelled`\n\n### A2aClient\n\nHTTP client for discovering and interacting with external A2A agents. Created via `A2aClient::new()` (empty SSRF allowlist) or `A2aClient::new_with_allowlist(hosts)`.\n\nEach outbound request builds a fresh `reqwest::Client` to pin DNS resolution to SSRF-validated IPs (see Security below).\n\nMethods:\n\n- **`discover(url)`** — fetches `{url}/.well-known/agent.json`, returns `AgentCard`\n- **`send_task(url, message, session_id)`** — sends a JSON-RPC `tasks/send` request\n- **`get_task(url, task_id)`** — sends a JSON-RPC `tasks/get` request\n\nAll responses are capped via `read_capped_body`: 256 KiB for agent cards (`MAX_AGENT_CARD_BYTES`), 1 MiB for task responses (`MAX_A2A_TASK_BYTES`).\n\n### Security Model\n\nThe A2A subsystem implements several hardening measures:\n\n- **SSRF prevention** (#3563): `build_client_for_url` runs `web_fetch::check_ssrf` on every outbound URL, pins the validated IPs via `resolve()`, and disables redirects entirely (`Policy::none()`)\n- **DNS rebinding protection** (#3563): DNS pinning ensures the validated IPs are used for the actual connection, closing the TOCTOU window\n- **Redirect blocking**: 3xx responses are explicitly rejected to prevent redirect-based SSRF via DNS rebinding on the redirect target\n- **Body size caps** (#3785): remote responses are streamed with per-chunk accounting; decompression is disabled to prevent gzip bombs from slipping past `Content-Length` checks\n- **URL canonicalization** (`canonicalize_a2a_url`): normalizes scheme, host, port, trailing slash, and strips fragments/empty queries so trust-list comparisons are consistent\n\n### Discovery\n\n`discover_external_agents(agents)` is called during kernel boot. It fetches Agent Cards for all configured `ExternalAgent` entries, stores them keyed by canonicalized URL, and logs results.\n\n---\n\n## Agent Context Loader (`agent_context.rs`)\n\nLoads per-turn `context.md` files that external tools (cron jobs, scripts) maintain to inject live data into agent prompts.\n\n### Resolution Order\n\n1. `{workspace}/.identity/context.md` (new layout)\n2. `{workspace}/context.md` (legacy fallback)\n\nThe first candidate that exists wins, even if empty or unreadable.\n\n### Caching Modes\n\nControlled by `AgentManifest::cache_context`:\n\n- **`false` (default)**: reads from disk on every turn, picking up external updates in real-time\n- **`true`**: freezes the first successful read for the lifetime of the process\n\n### Fallback Behavior\n\nOn re-read failure (e.g. external writer mid-rewrite), the loader falls back to the previously cached content with a `warn!` log rather than dropping context mid-conversation.\n\n### Safety Constraints\n\n- **Size cap**: 32 KiB (`MAX_CONTEXT_BYTES`). Oversized files are truncated to the last valid UTF-8 boundary.\n- **Symlink rejection**: uses `symlink_metadata` to detect and refuse symlinks — prevents prompt-injection exfiltration (e.g. pointing `context.md` at `/etc/passwd`)\n- **UTF-8 validation**: files with no valid UTF-8 prefix surface as I/O errors, triggering the cache fallback\n\n### API\n\n- `load_context_md(workspace, cache_context)` — synchronous, used by the streaming entry point\n- `load_context_md_async(workspace, cache_context)` — async variant using `tokio::fs`, functionally identical\n\nBoth share the same global `OnceLock<Mutex<HashMap<PathBuf, String>>>` cache.\n\n---\n\n## Agent Loop — End-Turn Finalization (`agent_loop/end_turn.rs`)\n\nHandles everything that happens after the LLM produces a final `EndTurn` response: session persistence, memory writes, history folding, proactive memory extraction, and hook firing.\n\n### Retry Classification (`classify_end_turn_retry`)\n\nBefore accepting an `EndTurn`, the runtime checks whether the response should be retried:\n\n| Retry Reason | Trigger |\n|---|---|\n| `EmptyResponse` | Empty text + no tool calls; retries on iteration 0 or when both token counts are 0 (silent API failure) |\n| `HallucinatedAction` | Non-empty text, no tool calls, tools available, text matches `looks_like_hallucinated_action` |\n| `ActionIntent` | User message has action intent, no tool was executed, no prior hallucination retry |\n\n### Finalization Pipeline (`finalize_successful_end_turn`)\n\n1. **Append response** to session messages\n2. **Prune heartbeat turns** — removes stale autonomous heartbeat messages (configurable via `autonomous.heartbeat_keep_recent`, default 10)\n3. **Session persistence** — `memory.save_session_async(session)` (skipped for fork/incognito turns)\n4. **Episodic memory** — sanitizes user message and response, persists as `[Past exchange]` via `remember_interaction_best_effort` (skipped for fork/incognito)\n5. **Context engine** — calls `engine.after_turn()` to update internal state (skipped for fork/incognito)\n6. **Proactive memory** — extracts facts and relations from the turn's messages via `auto_memorize` (gated by per-agent `proactive_memory` config)\n7. **Hook fire** — emits `AgentLoopEnd` event\n8. **Metrics** — logs prompt-cache hit ratio per turn\n\n### Text Fallback (`finalize_end_turn_text`)\n\nWhen the final response text is empty:\n1. Falls back to `accumulated_text` — intermediate text emitted alongside tool calls during earlier iterations\n2. If both are empty and tools were executed: returns `\"[Task completed — the agent executed tools but did not produce a text summary.]\"`\n3. If both are empty and no tools: returns a diagnostic message about possible API issues\n\n### History Folding (`maybe_fold_stale_tool_results`)\n\nPeriodically summarizes old tool results to keep the context window viable. Uses `FoldConfig` settings (minimum turn count, batch size). Fold rewrites are replayed onto the durable `session.messages` by `tool_use_id` so subsequent turns skip already-folded results.\n\n### Proactive Memory Gating\n\nTwo gate functions control whether an agent participates in proactive memory:\n\n- `gated_proactive_memory_for_retrieve(manifest, store)` — controls auto-retrieval of extracted facts\n- `gated_proactive_memory_for_memorize(manifest, store)` — controls auto-extraction of new facts from conversations\n\nBoth check the per-agent `manifest.proactive_memory` override against the global config. Agents with an empty config pass through; agents with explicit opt-out return `None`.\n\n---\n\n## Message History Management (`agent_loop/history.rs`)\n\n### Constants\n\n| Constant | Value | Purpose |\n|---|---|---|\n| `DEFAULT_MAX_HISTORY_MESSAGES` | 60 | ~7–10 real turns, balances prompt-cache stability with context freshness |\n| `MAX_HISTORY_MESSAGES` | 500 | Hard ceiling; operator overrides above this are clamped with a warning |\n| `MIN_HISTORY_MESSAGES` | 4 | Floor; caps below this defeat the safe-trim heuristic |\n\n### Resolution\n\n`resolve_max_history(manifest, opts)` determines the effective trim cap:\n\n1. `manifest.max_history_messages` (per-agent override)\n2. `opts.max_history_messages` (operator/kernel config)\n3. `DEFAULT_MAX_HISTORY_MESSAGES` (compiled fallback)\n\nThe result is clamped into `[MIN_HISTORY_MESSAGES, MAX_HISTORY_MESSAGES]`.\n\n---\n\n## Message Helpers (`agent_loop/message.rs`)\n\n### Accumulated Text Buffer\n\n`push_accumulated_text` appends intermediate LLM text (emitted alongside tool calls) to a fallback buffer capped at 64 KiB (`ACCUMULATED_TEXT_MAX_BYTES`). When the cap is reached, the buffer is sealed with a sentinel and subsequent appends are dropped. This prevents unbounded memory growth in long-running autonomous loops.\n\n### Classifiers\n\n| Function | Purpose |\n|---|---|\n| `is_no_reply(text)` | Detects silent-response markers (`NO_REPLY`, `[no reply needed]`, etc.) — delegates to `silent_response::is_silent_response` |\n| `is_progress_text_leak(text)` | Catches short ellipsis-terminated preambles (≤120 chars) that the model emits before a tool call that never materializes |\n| `sanitize_for_memory(text)` | Strips channel-envelope prefixes before persisting to long-term memory; returns `None` when nothing meaningful remains |\n\n### Safe Trim\n\n`safe_trim_messages` trims conversation history on turn boundaries while ensuring the resulting window passes `validate_and_repair` (which synthesizes a minimal user message if fewer than 2 messages survive). This prevents sending malformed history to the LLM.\n\n### Tool Result Sanitization\n\nTool result content is dynamically truncated via `truncate_tool_result_dynamic` from the `context_budget` module, accounting for the remaining prompt budget rather than applying a fixed cutoff.\n\n---\n\n## Integration Points\n\n### Entry Points\n\nThe runtime is invoked from two agent loop entry points:\n\n- **`run_agent_loop`** (non-streaming, `agent_loop/mod.rs`) — used by cron, API, and internal tool calls\n- **`run_agent_loop_streaming`** (`agent_loop/run_streaming.rs`) — used by chat channels (Telegram, WhatsApp, etc.)\n\nBoth share the same prompt assembly, retry logic, tool execution, and end-turn finalization path, differing only in how the LLM response is consumed.\n\n### HTTP Routes\n\nThe A2A subsystem is wired into the kernel's HTTP layer via `src/routes/network.rs`:\n\n- `a2a_discover_external` → `A2aClient::discover`\n- `a2a_send_external_inner` → `A2aClient::send_task` / `A2aClient::get_task`\n- `a2a_send_task` → `A2aTaskStore::complete`\n- `a2a_approve_external` / `a2a_external_task_status` → `canonicalize_a2a_url`\n\n### Configuration\n\n- **A2A**: `A2aConfig` in `librefang_types::config` — `enabled`, `name`, `description`, `listen_path`, `external_agents[]`\n- **History**: `AgentManifest.max_history_messages` or `KernelConfig.max_history_messages`\n- **Context caching**: `AgentManifest.cache_context`\n- **Proactive memory**: `AgentManifest.proactive_memory` (per-agent override of global config)\n- **History folding**: `FoldConfig` — `fold_after_turns`, `min_batch_size`","api-routes":"# API Routes\n\n# API Routes\n\nThe `routes` module implements the HTTP/REST layer of LibreFang. It defines all Axum route handlers, wires them into the application router, and translates kernel operations into JSON responses. The two largest submodules are `agents.rs` (agent lifecycle, messaging, sessions, and files) and `agent_templates.rs` (tool profiles and agent template discovery).\n\n## Architecture\n\n```mermaid\ngraph TD\n    Client[\"HTTP Client\"]\n    Router[\"build_router()\"]\n    Agents[\"agents::router()\"]\n    Templates[\"agent_templates::router()\"]\n    OtherRoutes[\"Other route modules\"]\n    State[\"AppState (Arc)\"]\n    Kernel[\"KernelHandle\"]\n\n    Client --> Router\n    Router --> Agents\n    Router --> Templates\n    Router --> OtherRoutes\n    Agents --> State\n    Templates --> State\n    State --> Kernel\n```\n\nEvery route module exposes a single `router()` function returning `axum::Router<Arc<AppState>>`. The top-level `build_router()` in `server.rs` merges all sub-routers into one. Handlers receive `State(state)` to access the kernel, idempotency store, model catalog, and configuration.\n\n## Agent Routes (`agents.rs`)\n\n### Router Registration\n\n`agents::router()` registers ~50 routes covering the full agent lifecycle. Routes are ordered so literal path segments (e.g., `/agents/identities`, `/agents/bulk`) are matched before the parameterized `/agents/{id}`.\n\n### Agent Spawning\n\n**`POST /api/agents`** — `spawn_agent`\n\nAccepts a `SpawnRequest` body containing either inline `manifest_toml` or a `template` name referencing a file under `$LIBREFANG_HOME/workspaces/agents/<name>/agent.toml`. The shared `resolve_manifest()` function handles:\n\n1. **Template lookup** — sanitizes the template name (alphanumeric + `-` + `_` only) and reads from disk using `tokio::fs` to avoid blocking the async runtime.\n2. **Size guard** — rejects manifests exceeding `MAX_MANIFEST_SIZE` (1 MB).\n3. **Signed manifest verification** — when `signed_manifest` is provided, verifies the Ed25519 signature against the manifest content via `kernel.verify_signed_manifest()`. Failures are audit-logged.\n4. **TOML parsing** — deserializes into `AgentManifest`.\n5. **Name override** — callers may set `req.name` to spawn multiple agents from the same template under distinct names.\n\nThe handler supports **idempotency** via the `Idempotency-Key` header (#3637). The key + request body are cached in `state.idempotency_store`. A replay with the same key and body returns the cached response; a different body under the same key returns 409 Conflict.\n\nThe inner handler (`spawn_agent_inner`) returns `(StatusCode, Vec<u8>)` so JSON is encoded exactly once, shared between the live path and cache replays.\n\n### Bulk Operations\n\nFour endpoints operate on arrays of agent IDs or spawn requests:\n\n| Endpoint | Method | Purpose |\n|---|---|---|\n| `/api/agents/bulk` | POST | Create up to `BULK_LIMIT` (50) agents |\n| `/api/agents/bulk` | DELETE | Delete up to 50 agents |\n| `/api/agents/bulk/start` | POST | Set multiple agents to Full mode |\n| `/api/agents/bulk/stop` | POST | Cancel active runs on multiple agents |\n\nAll bulk handlers call `validate_bulk_size()` (defined in `routes/mod.rs`) before allocating, preventing `Vec::with_capacity` abuse. Results include per-item success/failure with aggregate counts.\n\nHand-spawned agents cannot be deleted via bulk delete — they must be removed by deactivating the owning hand.\n\n### Agent Listing\n\n**`GET /api/agents`** — `list_agents`\n\nReturns a paginated, filterable, sortable list. Key behaviors:\n\n- **Owner scoping**: Non-admin authenticated users only see agents where `manifest.author` matches their username. The filter is injected server-side when `?owner=` is absent.\n- **Hand exclusion**: Hand-spawned agents are excluded by default; pass `?include_hands=true` to include.\n- **Pagination**: `limit` defaults to `DEFAULT_AGENT_LIST_LIMIT` (500) and caps at `MAX_AGENT_LIST_LIMIT` (500). `offset` is 0-based.\n- **Sorting**: Fields `name`, `created_at`, `last_active`, `state`. Order defaults to ascending; `?order=desc` reverses.\n- **Performance**: Uses `list_arcs()` to share `Arc<AgentEntry>` pointers with the registry instead of deep-cloning manifests (#3569). Bulk 24h stats are fetched in one call via `memory_substrate().agents_stats_24h_bulk()`.\n\nEach agent row is enriched by `enrich_agent_json()`, which resolves the effective model provider/name (falling back to `DefaultModelConfig`), looks up tier/auth-status/thinking-support from the model catalog, computes the `ready` flag, and embeds identity/session/scheduling metadata.\n\n### Agent Detail and Lifecycle\n\n**`GET /api/agents/{id}`** — `get_agent`  \nReturns the enriched JSON for a single agent. 404 if not found.\n\n**`DELETE /api/agents/{id}`** — `kill_agent`  \nRequires `?confirm=true` (#4614). Without confirmation, returns 409 with a data-loss warning. With confirmation, kills the agent **and** purges its canonical UUID binding from `agent_identities.toml`. Idempotent: deleting an already-absent agent returns `{\"status\": \"already-deleted\"}` per RFC 9110 §9.2.2. Hand-owned agents cannot be deleted directly.\n\n**`PUT /api/agents/{id}/suspend`** / **`PUT /api/agents/{id}/resume`**  \nSuspends (stops cron, keeps in registry) or resumes an agent.\n\n**`PUT /api/agents/{id}/mode`** — `set_agent_mode`  \nChanges the agent's operational mode via `AgentRegistry::set_mode()`.\n\n**`POST /api/agents/{id}/stop`** — `stop_agent`  \nCancels the agent's current run.\n\n**`PATCH /api/agents/{id}`** — `patch_agent`  \nPartial update of agent manifest fields.\n\n**`POST /api/agents/{id}/clone`** — `clone_agent`  \nCreates a new agent from an existing one's manifest.\n\n### Messaging\n\n**`POST /api/agents/{id}/message`** — `send_message`\n\nThe primary conversational endpoint. Flow:\n\n1. Validates agent ID and checks existence.\n2. Enforces message size limits via `validation::check_message_size()` (byte + char caps).\n3. Checks the provider's auth status; rejects with 412 if the API key is missing.\n4. Resolves file attachments (see [Attachment Resolution](#attachment-resolution)).\n5. Detects ephemeral mode (`req.ephemeral` or `/btw ` prefix).\n6. Parses optional `session_id` override.\n7. Calls the kernel inside `run_cancel_on_disconnect()`, which spawns the kernel call on a tokio task and aborts it if the client disconnects (#3464).\n\n**Response shape** includes `response` text, token usage, iteration count, cost, optional `thinking` trace, `decision_traces`, memory stats, and an optional `session_id` (auto-resolved when the caller didn't pin one).\n\nThe `AbortOnDrop` RAII guard holds the task's `AbortHandle`. Calling `disarm()` releases the guard without aborting — used by the streaming path once content has reached the client.\n\n**`POST /api/agents/{id}/message/stream`** — `send_message_stream`  \nSSE streaming variant. Produces the same kernel call but streams partial tokens and tool events.\n\n**`POST /api/agents/{id}/inject`** — `inject_message`  \nInjects a message without triggering a response turn.\n\n**`POST /api/agents/{id}/push`** — `push_message`  \nPushes a message through the channel subsystem.\n\n### Session Management\n\n| Endpoint | Method | Handler | Description |\n|---|---|---|---|\n| `/api/agents/{id}/session` | GET | `get_agent_session` | Active session history (with optional `?session_id=` override) |\n| `/api/agents/{id}/sessions` | GET | `list_agent_sessions` | List all sessions for an agent |\n| `/api/agents/{id}/sessions` | POST | `create_agent_session` | Create a new session |\n| `/api/agents/{id}/sessions/{session_id}/switch` | POST | `switch_agent_session` | Switch active session |\n| `/api/agents/{id}/sessions/{session_id}/export` | GET | `export_session` | Export session data |\n| `/api/agents/{id}/sessions/{session_id}/trajectory` | GET | `export_session_trajectory` | Export session trajectory |\n| `/api/agents/{id}/sessions/import` | POST | `import_session` | Import a session |\n| `/api/agents/{id}/session/reset` | POST | `reset_session` | Reset session state |\n| `/api/agents/{id}/session/reboot` | POST | `reboot_session` | Reboot session |\n| `/api/agents/{id}/session/compact` | POST | `compact_session` | Trigger LLM compaction |\n| `/api/agents/{id}/sessions/{session_id}/stream` | GET | `attach_session_stream` | SSE stream for session events |\n| `/api/agents/{id}/sessions/{session_id}/stop` | POST | `stop_session` | Stop a specific session |\n\n`get_agent_session` performs a two-pass approach to reconstruct tool use/result pairs: pass 1 collects tool invocations; pass 2 attaches tool results to their matching invocations. Images are persisted to the upload directory and registered in `UPLOAD_REGISTRY`. Thinking blocks from extended thinking are joined and surfaced under a `thinking` key.\n\nCross-agent session access is rejected with a `session_agent_mismatch` error.\n\n### Attachment Resolution\n\n`resolve_attachments()` processes `AttachmentRef` entries into `ContentBlock` values the agent loop can consume:\n\n- **Images** (`image/*`) → `ContentBlock::Image` (base64 inline)\n- **PDFs** (`application/pdf`) → `ContentBlock::Text` with extracted text, truncated at 200K chars. Failed extractions surface as a note so the LLM knows the file exists.\n- **Text-like files** → `ContentBlock::Text` with a header. Detection uses `is_text_like_attachment()`, which checks MIME type and file extension against a comprehensive set covering code, config, markup, and data formats.\n- **Others** → skipped with a warning log.\n\nFile IDs are validated as UUIDs to prevent path traversal. All file reads are synchronous (the upload directory is local disk).\n\n**URL attachments** (`resolve_url_attachments()`) download remote images with SSRF protection: URLs are validated against loopback, RFC 1918, link-local, IPv6 ULA, and cloud-metadata addresses via `validate_webhook_url_resolved()`. DNS results are pinned to the validated IP using reqwest's `.resolve()` to prevent DNS rebind attacks (#3701). Downloads are capped at 20 MB.\n\n### Monitoring Endpoints\n\n**`GET /api/agents/{id}/stats`** — `get_agent_stats`  \nReturns an `AgentStats24hView` with sessions, cost, P95 latency, active-now count, and a previous-period window for trend deltas. Owner-scoped.\n\n**`GET /api/agents/{id}/events`** — `list_agent_events`  \nRecent turn-level events from `usage_events` (model, tokens, cost, latency, tool calls). Capped at 200 rows. Owner-scoped.\n\n**`GET /api/agents/{id}/metrics`** — `agent_metrics`  \nAggregate metrics for the agent.\n\n**`GET /api/agents/{id}/logs`** — `agent_logs`  \nAgent log entries with optional level filtering.\n\n**`GET /api/agents/{id}/traces`** — `get_agent_traces`  \nOpenTelemetry-style traces.\n\n### Configuration Endpoints\n\n| Endpoint | Method | Description |\n|---|---|---|\n| `/api/agents/{id}/model` | PUT | Change model provider/model |\n| `/api/agents/{id}/tools` | GET/PUT | Get or set tool list |\n| `/api/agents/{id}/skills` | GET/PUT | Get or set skills |\n| `/api/agents/{id}/mcp_servers` | GET/PUT | Get or set MCP server bindings |\n| `/api/agents/{id}/identity` | PATCH | Update emoji/avatar/color |\n| `/api/agents/{id}/config` | PATCH | Partial config update |\n| `/api/agents/{id}/hand-runtime-config` | PATCH/DELETE | Hand-specific runtime config |\n| `/api/agents/{id}/reload` | POST | Reload manifest from disk |\n\n### File and Upload Endpoints\n\n**`GET /api/agents/{id}/files`** / **`GET /api/agents/{id}/files/{filename}`** / **`PUT ...`** / **`DELETE ...`**  \nCRUD for per-agent workspace files.\n\n**`GET /api/uploads/{file_id}`** — `serve_upload`  \nServes previously uploaded files from the upload directory.\n\n### Identity Registry\n\n**`GET /api/agents/identities`** — `list_agent_identities`  \nLists canonical name→UUID bindings.\n\n**`POST /api/agents/identities/{name}/reset`** — `reset_agent_identity`  \nResets the canonical UUID for a name, allowing a fresh spawn.\n\n### WebSocket\n\n**`GET /api/agents/{id}/ws`** — `agent_ws`  \nUpgraded to a WebSocket for real-time bidirectional communication (defined in `ws.rs`).\n\n## Agent Template Routes (`agent_templates.rs`)\n\nMounted as a sibling under `routes::` via `.merge(crate::routes::agent_templates::router())` from `system::router()`.\n\n### Template Name Validation\n\n`validate_template_name()` is a security gate before any filesystem access. It permits only `[A-Za-z0-9_-]`, rejects empty names and anything over 64 chars. This prevents path traversal via `..`, `/`, `\\`, or null bytes — all confirmed by the inline test suite covering traversal, separators, empty/oversized, and special characters.\n\n### Tool Profiles\n\n**`GET /api/profiles`** — `list_profiles`  \nReturns all six predefined tool profiles (minimal, coding, research, messaging, automation, full) with their tool lists.\n\n**`GET /api/profiles/{name}`** — `get_profile`  \nReturns a single profile by name. 404 with i18n message if not found.\n\n### Agent Templates\n\n**`GET /api/templates`** — `list_agent_templates`  \nScans `$LIBREFANG_HOME/workspaces/agents/` for directories containing `agent.toml`. Returns name and description for each.\n\n**`GET /api/templates/{name}`** — `get_agent_template`  \nReturns parsed manifest details (name, description, module, tags, model config, capabilities) plus the raw `manifest_toml` string. Validates the name, checks file existence, and returns i18n errors for not-found or invalid manifests.\n\n**`GET /api/templates/{name}/toml`** — `get_agent_template_toml`  \nReturns the raw TOML as `text/plain; charset=utf-8`. Useful for CLI tools or editors that need the unprocessed manifest.\n\n## Shared Patterns\n\n### Error Handling\n\nHandlers use `ApiErrorResponse` for structured error JSON. Two helper patterns:\n\n- **`ApiErrorResponse::internal_scrub(e)`** — used when the raw error (`rusqlite` messages, internal paths) must not leak to the client. The full error goes to `tracing::error!`; a generic message goes to the client.\n- **`into_json_tuple()`** / **`into_response()`** — converts the error into the appropriate `(StatusCode, Json(...))` response.\n\n### i18n\n\nAll user-facing errors use `ErrorTranslator` with the language resolved from the `RequestLanguage` middleware extension. `ErrorTranslator::new()` wraps a `FluentBundle` which is `!Send`, so translators must be constructed and consumed before any `.await` point.\n\n### Structured Logging\n\nThe `extensions::with_agent_id()` and `with_session_id()` wrappers attach identifiers to the response extensions so the `request_logging` middleware can emit them as structured fields on access-log lines (#3511).\n\n### Owner Scoping\n\nMulti-tenant deployments scope agent data by the authenticated user. The pattern:\n\n1. Extract `AuthenticatedApiUser` from middleware.\n2. If `role < Admin`, inject the caller's username as the `owner` filter.\n3. In detail endpoints (stats, events, sessions), reject if the agent's `manifest.author` doesn't match.\n\n### Constants\n\n| Constant | Value | Purpose |\n|---|---|---|\n| `MAX_MANIFEST_SIZE` | 1 MB | Prevent parser memory exhaustion |\n| `BULK_LIMIT` | 50 | Max agents per bulk request |\n| `DEFAULT_AGENT_LIST_LIMIT` | 500 | Default page size for agent listing |\n| `MAX_AGENT_LIST_LIMIT` | 500 | Hard cap on agent listing page size |\n| `MAX_TEXT_ATTACHMENT_CHARS` | 200,000 | Inline text truncation threshold |\n| `DELETE_AGENT_WARNING` | static string | Warning when DELETE lacks confirmation |","api-server":"# API Server\n\n# API Server (`librefang-api`)\n\nThe API server is the daemon-facing layer that exposes LibreFang's kernel to external consumers — editors via the Agent Client Protocol (ACP), and end users via chat channels (Telegram, Discord, Slack, WhatsApp, etc.). It translates between transport-specific wire formats and the shared `KernelApi` trait, handling authentication, streaming, error sanitization, and approval workflows along the way.\n\n## Architecture\n\n```mermaid\ngraph TD\n    subgraph \"Transports\"\n        EDITOR[\"Editor / CLI<br/>(ACP JSON-RPC)\"]\n        CHANNEL[\"Channel Adapters<br/>(Telegram, Discord, Slack…)\"]\n    end\n\n    subgraph \"librefang-api\"\n        UDS[\"ACP UDS Listener<br/>(acp_uds.rs)\"]\n        PIPE[\"ACP Named Pipe<br/>(acp_pipe.rs)\"]\n        BRIDGE[\"Channel Bridge<br/>(channel_bridge.rs)\"]\n        KBA[\"KernelBridgeAdapter\"]\n    end\n\n    subgraph \"Core\"\n        KERNEL[\"KernelApi<br/>(librefang-kernel)\"]\n    end\n\n    EDITOR -->|stdin/stdout pipe| UDS\n    EDITOR -->|stdin/stdout pipe| PIPE\n    CHANNEL -->|messages| BRIDGE\n    UDS -->|KernelAdapter| KERNEL\n    PIPE -->|KernelAdapter| KERNEL\n    BRIDGE --> KBA\n    KBA -->|KernelApi calls| KERNEL\n```\n\n## ACP Listeners\n\nThe ACP listeners allow editor integrations (VS Code, JetBrains, etc.) to drive a long-running daemon kernel instead of spawning a new process per invocation. This means approval decisions persist across editor restarts, agent state is shared between all open tabs, and `allow_always` decisions outlive any single editor session.\n\nBoth listeners are wire-compatible: same JSON-RPC framing, same `KernelAdapter`, same shared kernel. Only the transport differs.\n\n### Unix Domain Socket (`acp_uds.rs`)\n\nListens on `~/.librefang/acp.sock`. Only compiled on `#[cfg(unix)]`.\n\n**Connection lifecycle:**\n\n1. `run_listener(kernel, sock_path)` binds the socket and enters an accept loop\n2. Each accepted connection is validated via `SO_PEERCRED` — the peer's UID must match the daemon's EUID\n3. The stream is split, wrapped in `tokio_util::compat` adapters, and handed to `librefang_acp::run_with_transport`\n4. Each connection runs in an independent `tokio::spawn` task\n\n**Atomic bind with TOCTOU hardening:**\n\n`bind_atomic_owner_only` avoids the classic `bind() → chmod()` race window where another local user could connect between the two syscalls. It binds to a randomised tempfile (`.acp.sock.{pid}.{nanos}`), `chmod`s it to `0o600`, then `rename`s into the final path. The rename atomically overwrites any stale socket left by a crashed daemon.\n\n**Stale orphan cleanup:**\n\nOn macOS Docker Desktop bind-mount volumes, `rename(2)` can succeed on the host but leave the source file visible inside the container. `sweep_stale_orphans` cleans up these leftover tempfiles with three guards:\n\n| Guard | Purpose |\n|-------|---------|\n| UID equality | Never delete files owned by another user |\n| Recency window (10s) | Don't race with a concurrent daemon's bind→rename |\n| PID liveness (`kill(pid, 0)`) | Don't delete a live daemon's in-flight tempfile; only remove when `ESRCH` (process dead) |\n\n### Windows Named Pipe (`acp_pipe.rs`)\n\nListens on `\\\\.\\pipe\\librefang-acp`. Only compiled on `#[cfg(windows)]`.\n\nWindows named pipes have no single-listener/multi-accept model. Instead, the server creates one pipe instance, awaits a connect, then immediately creates the next instance for the next client. `run_listener` loops on this pattern:\n\n```\ncreate_instance(first=true?) → await connect → spawn worker → create_instance(first=false) → …\n```\n\n**DACL hardening:**\n\nThe default Windows named pipe DACL grants `GENERIC_READ`/`GENERIC_WRITE` to any local user — dangerous on Terminal Server or shared workstations. `create_owner_only_instance` installs an explicit SDDL `D:P(A;;GA;;;OW)` — protected DACL, `GENERIC_ALL` to owner only, no inheritance. Every pipe instance (initial and rebind) gets this descriptor, closing the name-squatting race present in earlier code that only set `first_pipe_instance(true)` once.\n\n`OwnerOnlyDescriptor` wraps the Win32 security descriptor lifecycle: `ConvertStringSecurityDescriptorToSecurityDescriptorW` on creation, `LocalFree` on `Drop`. The SDDL is embedded as a `const &[u16]` to avoid per-call allocation.\n\n## Channel Bridge (`channel_bridge.rs`)\n\nThe channel bridge connects the kernel to chat platform adapters. `KernelBridgeAdapter` implements `ChannelBridgeHandle` by delegating every operation to the `KernelApi` trait object.\n\n### Sending messages\n\nThe bridge exposes three sending modes:\n\n| Method | Use case |\n|--------|----------|\n| `send_message` | Synchronous (wait for full response) |\n| `send_message_streaming` | Streaming (token-by-token via `mpsc::Receiver<String>`) |\n| `send_message_ephemeral` | Ephemeral/stateless queries (uptime, model list) |\n\nAll methods respect the `silent` flag on the kernel's response — when the agent emits `NO_REPLY` or `[[silent]]`, the bridge returns an empty string so the channel adapter skips delivery.\n\n### Streaming text bridge\n\n`start_stream_text_bridge` / `start_stream_text_bridge_with_status` translate kernel `StreamEvent`s into a channel-friendly text stream. This is the core of the \"typing live in Telegram\" experience.\n\n```mermaid\ngraph LR\n    KERNEL[\"Kernel<br/>StreamEvent channel\"] --> BRIDGE[\"Streaming Bridge<br/>task\"]\n    BRIDGE --> RX[\"mpsc::Receiver&lt;String&gt;<br/>(to channel adapter)\"]\n    BRIDGE --> STATUS[\"oneshot::Receiver&lt;Result&gt;<br/>(lifecycle signal)\"]\n```\n\n**Event handling rules:**\n\n| Event | Action |\n|-------|--------|\n| `TextDelta` | Buffer text |\n| `ContentComplete` | Flush buffer; suppress if tool-use adjacent, looks like leaked tool call, or is a silent-response sentinel |\n| `ToolUseStart` | Inject `🔧 Tool Name` progress line (deduplicated per iteration) |\n| `ToolExecutionResult` (error) | Inject `⚠️ Tool Name failed` progress line |\n| `PhaseChange(\"context_warning\")` | Surface context overflow/trim warning to user |\n\n**Tool-call leak detection:**\n\nSome LLM providers emit tool calls as plain text instead of using the proper tool API. `looks_like_tool_call` applies layered heuristics:\n\n- **Start-of-text patterns** (applied to all lengths): `[{`, `functions.`, `{\"type\":\"function\"}`, `{\"tool_calls\":`\n- **Deep heuristics** (texts ≤ 2000 chars): bare JSON tool-call objects, XML-style `<function=…>` tags, markdown/backtick-wrapped tool calls\n- Long natural-language responses are exempt from `contains()`-based patterns to avoid false positives when the response discusses tools conceptually\n\nThe `start_stream_text_bridge_with_status` variant returns a `oneshot::Receiver<Result<(), String>>` that resolves after the stream drains. Channel adapters use this to:\n- Drive lifecycle reactions (mark delivery as succeeded/failed)\n- Record accurate `record_delivery` metrics\n- Respect `suppress_error_responses` for public-feed adapters\n\n### Error sanitization\n\n`sanitize_channel_error` prevents raw technical details from reaching end users on WhatsApp, Telegram, etc. It pattern-matches common error classes:\n\n| Pattern | User-facing message |\n|---------|-------------------|\n| Timeout/inactivity | \"The task timed out. Try breaking it into smaller steps.\" |\n| Rate limit / 429 / quota | \"I've hit my usage limit and need to rest.\" |\n| Auth / 401 | \"I'm having trouble with my credentials.\" |\n| Content filtered | \"I can't help with that — blocked by safety filter.\" |\n| Exited with code / driver | \"Something went wrong on my end.\" |\n| Default | \"Something went wrong\" with truncated ref code |\n\nFor timeout-with-partial-output, the status is reported as `Ok(())` and the partial text is allowed through with an appended `[Task timed out. Output may be incomplete.]` notice — a timed-out partial response is better UX than a hard error.\n\n### Slash-command handlers\n\n`KernelBridgeAdapter` implements text-based command handlers that channel users invoke via `/command`:\n\n- **Session management**: `reset_session`, `reboot_session`, `compact_session`, `session_usage`, `stop_run`\n- **Agent management**: `find_agent_by_name`, `list_agents`, `spawn_agent_by_name`, `set_model`\n- **Approvals**: `list_approvals_text`, `resolve_approval_text` (with TOTP/recovery code support)\n- **Automation**: `list_workflows_text`, `run_workflow_text`, `list_triggers_text`, `create_trigger_text`, `delete_trigger_text`\n- **Scheduling**: `list_schedules_text`, `manage_schedule_text` (add/del/run cron jobs)\n- **System**: `uptime_info`, `list_models_text`, `list_providers_text`, `list_skills_text`, `list_hands_text`, `budget_text`\n\n**Approval TOTP flow:**\n\nThe approval path supports both TOTP codes and one-time recovery codes:\n\n1. Check if the tool requires TOTP via `policy().tool_requires_totp()`\n2. If a recovery code is provided, use `vault_redeem_recovery_code` for atomic read-verify-consume\n3. If a TOTP code is provided, check replay via `is_totp_code_used`, verify against the vault secret, then `record_totp_code_used`\n4. Failed attempts are tracked per sender with lockout via `check_and_record_totp_failure`\n5. Double-tap (user clicks inline button then sends slash command) is handled by `resolve_no_pending_message`, which checks the audit log and acks idempotently\n\n### Reply-intent classification\n\n`classify_reply_intent` uses a one-shot LLM call to determine whether a group-chat message is directed at the bot. It sanitizes all inputs (truncation, character replacement) to reduce prompt-injection surface, and fails open — if the classifier errors, the message is treated as directed at the bot.\n\n### Channel entry point\n\n`start_channel_bridge` reads the kernel config, instantiates configured adapters, and wires them into a `BridgeManager`. Channel adapters have been migrated to a sidecar architecture — the in-process adapters are gone, and `SIDECAR_CATALOG` in `routes/channels.rs` maps channel types to their sidecar endpoints. The bridge's `reload_channels_from_disk` function supports hot-reloading channel configuration without a daemon restart.\n\n### Other channel operations\n\n- `record_delivery` — tracks delivery success/failure per agent+channel+recipient, persists last channel for cron `CronDelivery::LastChannel`, includes thread_id for forum/topic context\n- `authorize_channel_user` — delegates to `AuthManager` for RBAC checks (chat, spawn, kill, install_skill actions)\n- `check_auto_reply` — evaluates whether an auto-reply rule should fire for a given message\n- `transcribe_inbound_audio` — honors the `[media] audio_transcription` flag (default OFF), dispatches to `MediaEngine::transcribe_audio` when enabled\n\n## Approval Re-export (`approval.rs`)\n\nA thin re-export of `librefang_kernel::approval::ApprovalManager`. Route modules import from here instead of reaching directly into the kernel, keeping the kernel's internal module path out of the API crate's import surface. This matters because API routes only call static/stateless helpers on `ApprovalManager` (e.g., `verify_totp_code_with_issuer`), so widening `KernelHandle` for the full kernel module would be unnecessary coupling.\n\n## Platform-specific compilation\n\n| File | Target | Guard |\n|------|--------|-------|\n| `acp_uds.rs` | Unix | `#[cfg(unix)]` |\n| `acp_pipe.rs` | Windows | `#[cfg(windows)]` |\n| `channel_bridge.rs` | All platforms | — |\n| `approval.rs` | All platforms | — |\n\n## Testing notes\n\n`acp_uds.rs` contains integration-style tests that verify:\n- Socket mode is `0o600` after bind\n- Stale files are atomically overwritten\n- Dead-PID orphan tempfiles are swept\n- Live-PID tempfiles are preserved\n- Recent tempfiles (within 10s window) are preserved regardless of PID state","channel-integrations":"# Channel Integrations\n\n# Channel Integrations (`librefang-channels`)\n\n## Purpose\n\nThis crate is the bridge between external chat platforms (Telegram, Discord, Slack, etc.) and the LibreFang kernel. It normalises inbound messages from heterogeneous channel adapters into a unified `ChannelMessage` type, routes them to the correct agent, dispatches the LLM call, and delivers the response back through the originating adapter.\n\nThe module also handles:\n\n- **Message debouncing** — rapid-fire messages from the same sender are buffered and merged into a single agent turn.\n- **Input sanitization** — prompt-injection heuristics inspect inbound text before it reaches the LLM.\n- **Attachment enrichment** — PDFs, code files, and other text-like attachments are extracted inline so the LLM sees their content without needing a separate file-reader tool.\n- **Approval workflows** — `ApprovalRequested` kernel events are forwarded to operators as inline keyboards (or plain-text fallbacks).\n- **Group message heuristics** — mention detection, vocative triggers, and reply-intent classification determine whether the bot should respond in a group.\n- **Proactive push** — the REST API can push outbound messages through a configured adapter.\n\n## Architecture\n\n```mermaid\ngraph LR\n    subgraph Adapters\n        A[Telegram]\n        B[Discord]\n        C[Slack]\n        D[Other / Custom]\n    end\n\n    subgraph BridgeManager\n        E[MessageDebouncer]\n        F[InputSanitizer]\n        G[AgentRouter]\n        H[Attachment Enrichment]\n    end\n\n    subgraph Kernel\n        I[ChannelBridgeHandle]\n        J[Agent Sessions]\n        K[EventBus]\n    end\n\n    A & B & C & D -->|ChannelMessage| E\n    E -->|merged msg| F\n    F -->|clean msg| G\n    G -->|agent_id| I\n    I -->|send_message| J\n    J -->|ReplyEnvelope| A & B & C & D\n    K -->|ApprovalRequested| L[Approval Listener]\n    L -->|send_interactive| A & B & C & D\n```\n\n## Key Components\n\n### `ChannelBridgeHandle` trait\n\nDefined in `bridge.rs`, implemented on the kernel in `librefang-api`. This trait is the narrow interface adapters use to interact with the kernel without creating a circular dependency — `librefang-channels` cannot depend on `librefang-kernel`.\n\nCore methods:\n\n| Method | Purpose |\n|--------|---------|\n| `send_message` | Plain-text send to an agent, returns full response string |\n| `send_message_with_blocks` | Structured send with `ContentBlock` (text + images) |\n| `send_message_with_sender` | Send with `SenderContext` for peer-scoped memory |\n| `send_message_streaming` | Returns `mpsc::Receiver<String>` for progressive token display |\n| `send_message_streaming_with_sender_status` | Streaming + oneshot status channel for delivery metrics |\n| `find_agent_by_name` / `list_agents` / `spawn_agent_by_name` | Agent lifecycle |\n| `channel_overrides` / `agent_channel_overrides` | Per-channel and per-agent configuration overrides |\n| `transcribe_inbound_audio` | Hand-off to `MediaEngine` for voice transcription |\n| `subscribe_events` | Broadcast receiver for kernel `EventBus` |\n| `classify_reply_intent` | Lightweight LLM call to decide if the bot should reply in a group |\n\nMost methods have default implementations that return stub values, so test mocks only need to override what they exercise. The single method without a default is `record_consumer_lag` — this is intentional: any production impl must forward lag drops to the kernel's `EventBus::dropped_count` metric, and a silent default would hide regressions.\n\n### `BridgeManager`\n\nOwns all running adapters, their dispatch tasks, and shared infrastructure (rate limiter, sanitizer, journal, thread-ownership registry).\n\n**Lifecycle:**\n\n1. **Construction** — `BridgeManager::new(handle, router)` or `with_sanitizer(...)` for custom sanitization config.\n2. **`start_adapter(adapter)`** — subscribes to the adapter's message stream, optionally sets up debouncing, and spawns a dispatch loop.\n3. **`start_approval_listener()`** — subscribes to `ApprovalRequested` events and fans out interactive keyboards to bound adapters.\n4. **`stop()`** — graceful shutdown; signals the watch channel, stops adapters, and awaits all tracked tasks.\n5. **`abort()`** — hard stop callable through `&self` (for hot-reload when `Arc::try_unwrap` fails). Fires the shutdown signal and aborts all tracked `JoinHandle`s.\n\n**Task tracking:** Every spawned task is recorded via the private `track()` method, which stores both the `JoinHandle` (for the graceful `stop()` join loop) and its `AbortHandle` mirror in a `std::sync::Mutex<Vec<AbortHandle>>`. This ensures `abort()` can always terminate tasks even when only a shared `&self` reference is available.\n\n### `ReplyEnvelope`\n\nA two-channel reply envelope:\n\n```rust\npub struct ReplyEnvelope {\n    pub public: Option<String>,\n    pub owner_notice: Option<String>,\n}\n```\n\n- `public` — the message to send back to the source chat (DM or group).\n- `owner_notice` — a private message for the operator's DM only (e.g. produced by the `notify_owner` LLM tool).\n\nAdapters that don't support owner-side delivery ignore `owner_notice` and forward only `public`.\n\n### `MessageDebouncer`\n\nBuffers rapid-fire messages from the same sender and merges them into a single dispatch. Configured via channel overrides:\n\n- `message_debounce_ms` — minimum wait after the last message before flushing (0 = disabled).\n- `message_debounce_max_ms` — hard ceiling; the buffer always flushes after this duration regardless of activity.\n- `message_debounce_max_buffer` — message count cap; flushes immediately when hit.\n\n**Merging logic:**\n\n- Multiple text messages → joined with `\\n`.\n- Multiple commands with the same name → args concatenated.\n- Mixed content types → all converted to text via `content_to_text()` and joined.\n- Image blocks are collected from all buffered messages into a single `Vec<ContentBlock>`.\n\n**Flush triggers:** debounce timer, max timer, buffer-full, typing-stop event, and shutdown drain. All triggers push to a bounded channel (`FLUSH_CHANNEL_CAP = 1024`) to prevent OOM when the dispatcher stalls.\n\n**Double-fire guard:** The max-timer and manual-flush paths can both enqueue the same key on a race. The `drain()` method removes the entry from the buffer map on first access, so the second arrival finds nothing and returns `None`.\n\n### `AgentRouter`\n\nResolves inbound messages to an `AgentId`. The router considers:\n\n1. **Channel defaults** — bare key (`telegram`) or account-qualified key (`telegram:12345`).\n2. **Agent bindings** — explicit `peer_id` → `agent_id` mappings per channel.\n3. **Group thread ownership** — once an agent replies in a group thread, it \"owns\" that thread for a configurable TTL, preventing multiple agents from responding to the same conversation.\n\n### Attachment Enrichment (`attachment_enrich.rs`)\n\nWhen the channel bridge downloads a non-image file, `enrich_saved_file()` extracts content so the LLM sees it inline rather than just a file path. The enrichment is **additive** — the original `[File: name] saved to /path` block is always preserved for tools that need raw bytes.\n\n**Detection matrix:**\n\n| Input | Detection | Output |\n|-------|-----------|--------|\n| `application/pdf` | MIME match | Extracted text with `[Attached PDF: name (N bytes)]` header |\n| `.pdf` extension + ambiguous MIME | Extension fallback | Same as above |\n| `%PDF-` magic bytes + ambiguous MIME | Magic-byte sniff | Same as above |\n| `text/*` MIME | MIME match | Inline text with `[Attached file: name (N bytes)]` header |\n| Code extensions (`.rs`, `.py`, etc.) | Extension fallback | Inline text |\n| Known text MIME (`application/json`, etc.) | MIME match | Inline text |\n| Image types | Skipped | Empty vec — bridge already emits `ContentBlock::ImageFile` |\n| Unknown binary | Skipped | Empty vec |\n\n**PDF handling** uses `pdf_extract` behind a `catch_unwind` boundary — the parser can panic on malformed or encrypted documents. A panic produces a `[Could not extract text: PDF parser panicked]` note instead of crashing the bridge.\n\n**Truncation:** Both text and PDF extraction are capped at `MAX_ENRICHED_TEXT_CHARS` (200,000 chars), matching the kernel's `MAX_PDF_TEXT_CHARS` and the API's `MAX_TEXT_ATTACHMENT_CHARS`. Oversized content gets a truncation marker appended.\n\nAudio/voice files are intentionally excluded — they go through `media_transcribe` out of band, and inlining binary noise would waste tokens.\n\n### Approval Listener\n\nStarted via `BridgeManager::start_approval_listener()`, this task listens on the kernel's `EventBus` for `ApprovalRequested` events and delivers interactive keyboards to the appropriate recipients.\n\n**Routing logic (in priority order):**\n\n1. **Direct route** — if the event carries `sender_id` + `channel`, the keyboard goes straight back to the originating chat (common case: user chatting with an agent that calls a `require_approval` tool).\n2. **Channel default** — if the adapter's `channel_default` points to the requesting agent, deliver to `notification_recipients()`.\n3. **Binding-derived peers** — if no default but `AgentBinding`s exist for the requesting agent on this adapter, fan out to those `peer_id`s.\n4. **Drop** — no matching route; a `warn!` log fires so operators know approvals are being lost.\n\nThe interactive payload is built by `build_approval_interactive()` which produces a two-button keyboard (`Approve` / `Deny`). Adapters without the `interactive` capability fall back to plain text with `/approve <id>` / `/reject <id>` instructions.\n\n### Input Sanitization\n\nThe `InputSanitizer` checks inbound text for potential prompt-injection payloads before dispatching to the agent. Three outcomes:\n\n- `Clean` — pass through.\n- `Warned(reason)` — suspicious but allowed (logged).\n- `Blocked(reason)` — message rejected; user receives a generic \"could not be processed\" notice.\n\nCommand arguments are reconstructed into text for checking, so slash-command args cannot carry injection payloads.\n\n### Group Message Processing\n\nGroup messages go through several layers before the bot decides to reply:\n\n1. **Group policy** — `GroupPolicy` determines if the bot should respond at all (e.g., `IgnoreAll`).\n2. **Explicit mention** — `@botname` or configured aliases always trigger.\n3. **Reply-to** — replying to a bot message triggers.\n4. **Regex trigger patterns** — `group_trigger_patterns` from agent config.\n5. **Vocative trigger** — leading capitalized name + punctuation (e.g., `\"BotName, do X\"`). Under the `LIBREFANG_GROUP_ADDRESSEE_GUARD=on` flag, the positional check also rejects patterns preceded by another vocative (the \"Caterina, chiedi al Signore\" case).\n6. **Reply-intent classification** — `classify_reply_intent()` makes a lightweight LLM call when other heuristics are inconclusive.\n\n## Message Flow\n\n### Inbound (text message, no debouncing)\n\n```\nAdapter stream → dispatch_message()\n  ├── InputSanitizer::check()\n  ├── AgentRouter::resolve() → agent_id\n  ├── ChannelBridgeHandle::channel_overrides() → formatting config\n  ├── BridgeHandle::send_message_streaming_with_sender_status()\n  │     └── Kernel: run agent, stream tokens back\n  ├── Formatter: markdown → channel-native format\n  ├── Adapter::send() → deliver to chat\n  └── ThreadOwnership: claim thread (groups)\n```\n\n### Inbound (with debouncing)\n\n```\nAdapter stream → MessageDebouncer::push()\n  └── Timer fires / max reached / typing-stop → flush_debounced()\n        ├── drain() → merge buffered messages\n        ├── Download images → ContentBlock::ImageFile\n        └── dispatch_with_blocks() (same path as above, with blocks)\n```\n\n### Inbound (file attachment)\n\n```\nAdapter streams download to disk → saved_path\n  ├── enrich_saved_file(saved_path, media_type, filename)\n  │     ├── PDF? → extract text → ContentBlock::Text\n  │     ├── Text-like? → read file → ContentBlock::Text\n  │     └── Otherwise → empty vec\n  ├── Insert enrichment blocks before path block\n  └── dispatch_with_blocks()\n```\n\n## Adding a New Channel Adapter\n\n1. Implement `ChannelAdapter` (defined in `types.rs`) — minimum `name()`, `channel_type()`, `start()`, `send()`.\n2. Optionally override `typing_events()`, `send_interactive()`, `notification_recipients()`, `create_webhook_routes()`, `fetch_headers_for()`.\n3. Add the `ChannelType` variant in `types.rs` and update `channel_type_str()` in `bridge.rs`.\n4. Register the adapter via `BridgeManager::start_adapter()` during startup.\n\n## Configuration\n\nChannel behaviour is tuned through `ChannelOverrides` (from `agent.toml` or global config):\n\n| Override | Default | Purpose |\n|----------|---------|---------|\n| `message_debounce_ms` | 0 (disabled) | Merge rapid-fire messages |\n| `message_debounce_max_ms` | 30000 | Hard ceiling on debounce window |\n| `message_debounce_max_buffer` | 64 | Message count before forced flush |\n| `output_format` | Per-channel default | Markdown, HTML, plain text |\n| `threading` | false | Enable thread-scoped replies |\n| `group_trigger_patterns` | Empty | Regex patterns that trigger bot replies |\n| `dm_policy` | Per-config | How DMs are handled |\n| `group_policy` | Per-config | How group messages are handled |\n\nThe env var `LIBREFANG_GROUP_ADDRESSEE_GUARD=on` enables stricter vocative-trigger logic during a observation window before it becomes the default.\n\n## Shutdown and Hot-Reload\n\n`BridgeManager` supports two shutdown paths:\n\n- **`stop(&mut self)`** — graceful: signals the watch channel, stops each adapter, awaits all tasks, clears abort handles.\n- **`abort(&self)`** — hard: fires the signal and aborts every tracked task via `AbortHandle`. Used during hot-reload when the old `BridgeManager` is still inside an `Arc` with outstanding strong references.\n\nExternal background tasks (e.g. journal retry tickers) must be registered via `track_task()` to be cleaned up on reload — otherwise they leak across reload boundaries and double-dispatch.","cli-tui":"# CLI & TUI\n\n# LibreFang CLI & TUI\n\nThe `librefang-cli` crate is the primary user-facing binary for LibreFang. It provides a command-line interface, an interactive terminal UI launcher, and a full-screen TUI dashboard. Every CLI command follows one of two execution paths: it either talks to a running daemon over HTTP, or boots a temporary in-process kernel for single-shot operations.\n\n## Architecture Overview\n\n```mermaid\ngraph TD\n    User[User / Editor / CI] --> CLI[librefang CLI binary]\n    CLI -->|subcommand| Launcher[Interactive Launcher]\n    CLI -->|subcommand| TUI[Full TUI Dashboard]\n    CLI -->|subcommand| Daemon[Daemon via HTTP]\n    CLI -->|no daemon| InProcess[In-Process Kernel]\n    CLI -->|acp subcommand| ACP[ACP stdio bridge]\n    ACP -->|daemon up| DaemonSock[Daemon UDS / Named Pipe]\n    ACP -->|daemon down| InProcess\n    Daemon --> Kernel[LibreFangKernel]\n    InProcess --> Kernel\n    Launcher --> DesktopApp[Desktop App]\n    Launcher --> ChatCmd[Chat]\n    Launcher --> Dashboard[Web Dashboard]\n```\n\n## Entry Point and Command Dispatch\n\n`main.rs` defines the top-level `Cli` struct via Clap with these responsibilities:\n\n1. **Load `.env`** — calls `librefang_extensions::dotenv::load_dotenv` before anything else.\n2. **Initialize i18n** — reads language from config, falls back to English (`en`).\n3. **Install Ctrl+C handler** — on Windows this uses `SetConsoleCtrlHandler` to force-exit on interrupt; on Unix the default SIGINT handler suffices.\n4. **Dispatch subcommand** — routes to the appropriate `cmd_*` function.\n\nWhen no subcommand is given and the process is attached to a TTY, the interactive launcher (`launcher::run`) is shown. In non-interactive contexts (piped stdin, CI), a help message is printed instead.\n\n### Two Execution Modes\n\n| Mode | When | How |\n|---|---|---|\n| **Daemon-attached** | `librefang start` is running | HTTP client calls to `http://{daemon_url}/api/...` |\n| **In-process** | No daemon detected | `LibreFangKernel::boot()` creates a temporary kernel that shuts down when the command finishes |\n\nHelper functions `daemon_client()` and `daemon_client_with_api_key()` construct the HTTP client for daemon communication. `daemon_json()` is a convenience wrapper that deserializes JSON responses.\n\n### Key Subcommands\n\n| Command | Description |\n|---|---|\n| `init` | Create `~/.librefang/` and default config; `--quick` for CI, `--upgrade` for migrating existing installs |\n| `start` | Launch the daemon (background by default, `--foreground` or `--tail` for attached modes) |\n| `stop` / `restart` | Daemon lifecycle management |\n| `chat` | Interactive REPL with an agent |\n| `agent` | Agent CRUD: `new`, `list`, `chat`, `kill`, `set` |\n| `doctor` | Run diagnostic health checks |\n| `update` | Self-update from GitHub releases (channels: stable/beta/rc) |\n| `tui` | Full-screen terminal dashboard |\n| `acp` | Agent Client Protocol server for editor integration |\n| `mcp` | MCP server management |\n| `channel` | Messaging channel sidecar management |\n| `skill` | Skill install/list/search/publish |\n| `workflow` / `trigger` / `cron` | Automation primitives |\n| `config` | Show, edit, get, set config values and API keys |\n| `migrate` | Import from OpenClaw, LangChain, AutoGPT |\n\n## Interactive Launcher\n\n**File:** `launcher.rs`\n\nWhen `librefang` is invoked without a subcommand in a TTY, a Ratatui-based menu appears. The launcher:\n\n- **Detects first-run vs. returning users** — checks for `~/.librefang/config.toml`. First-run users see \"Get started\" as the top entry; returning users see \"Chat\" first.\n- **Probes daemon and provider status in a background thread** — shows a spinner while checking, then displays daemon URL, agent count, and detected API key provider.\n- **Detects migration sources** — checks for `~/.openclaw` or `~/.openfang` directories and shows a migration hint.\n- **Provides two screens**: the menu and a scrollable help viewer (generated from Clap's `--help` output with ANSI stripped).\n\n### Menu Navigation\n\n- `↑`/`↓` or `j`/`k` to navigate\n- `1`–`9` for direct selection by number\n- `Enter` to confirm\n- `q`/`Esc` to quit\n- The help screen supports `PgUp`/`PgDn`, `g`/`G` (top/bottom), and scrollbar\n\n### Layout\n\nContent is capped at 80 columns with a left margin of 3. On terminals narrower than 10 columns, margins collapse entirely. Content is vertically positioned in the upper third of the terminal for visual comfort.\n\n### LauncherChoice Enum\n\nEach menu item maps to a `LauncherChoice` variant: `GetStarted`, `Chat`, `Dashboard`, `DesktopApp`, `TerminalUI`, `ShowHelp`, `Quit`. The `Quit` variant is never a menu item — it's only reachable via keyboard.\n\n## Agent Client Protocol (ACP)\n\n**File:** `acp.rs`\n\nProvides the `librefang acp` subcommand, which serves the Agent Client Protocol over stdio so editors (Zed, VS Code, JetBrains) can embed LibreFang as a native agent.\n\n### Two Modes\n\n1. **Daemon-attached (preferred):** When the daemon is running and has its ACP listener up, the CLI becomes a transparent bidirectional pipe — stdin → socket, socket → stdout. On Unix this uses a Unix Domain Socket at `~/.librefang/acp.sock`; on Windows it uses the named pipe `\\\\.\\pipe\\librefang-acp`. Multiple editor tabs share the daemon's kernel state, including approval decisions.\n\n2. **In-process:** When no daemon is detected, a fresh kernel boots in the current process. ACP runs on stdio until stdin EOF. Approval caches are local to this process and do not persist.\n\nThe mode is logged to stderr so users can diagnose why approval decisions might not carry over between modes (they use separate `allow_always` caches).\n\n### Socket Discovery (`locate_acp_socket`)\n\nChecks that the daemon is reachable **and** the socket file exists. A stale socket from a crashed daemon causes a fallback to in-process mode rather than a confusing connection error. Unix-only; Windows uses `find_daemon()` directly.\n\n### Proxy Implementation\n\nBoth `run_uds_proxy` (Unix) and `run_pipe_proxy` (Windows) use Tokio to run two concurrent async tasks:\n\n- **Inbound:** stdin → socket (with shutdown on EOF)\n- **Outbound:** socket → stdout (with flush after each write)\n\nEither direction closing terminates the session via `tokio::select!`.\n\n## Doctor / Audit Framework\n\n**File:** `doctor.rs`\n\nA trait-based diagnostic framework for `librefang doctor`. Each check is an independent struct implementing `AuditCheck`:\n\n```rust\npub trait AuditCheck {\n    fn run(&self, ctx: &AuditContext) -> AuditResult;\n}\n```\n\n### Adding a New Check\n\n1. Create a unit struct implementing `AuditCheck`.\n2. Add it to `registered_checks()`.\n\nEach check is isolated — no shared mutable state, no ordering dependencies.\n\n### AuditContext\n\nCarries pre-resolved paths so checks don't redundantly look up `~/.librefang/`. Currently contains just `librefang_home: PathBuf`; extend as needed.\n\n### AuditResult\n\nEach result has:\n- `name` — stable snake_case identifier (machine-readable, appears in JSON output)\n- `severity` — `Pass`, `Info`, `Warn`, or `Error`\n- `summary` — human-readable one-liner\n- `hint` — optional remediation guidance (shown for `Warn`/`Error`)\n\n### Registered Checks\n\n| Check | Severity | What it validates |\n|---|---|---|\n| `VaultKeyCheck` | Error if set but wrong | `LIBREFANG_VAULT_KEY` must base64-decode to exactly 32 bytes (the classic gotcha: 32 ASCII chars ≠ 32 bytes after decode) |\n| `ApiListenAddrCheck` | Error/Warn | `config.toml`'s `api_listen` must parse as `SocketAddr`; warns on port 0 (ephemeral, undiscoverable) and privileged ports (<1024) |\n| `ConfigTomlSchemaCheck` | Error if malformed | `config.toml` exists and is valid TOML |\n\nThe doctor framework runs **alongside** legacy inline checks in `cmd_doctor` — migration of those legacy checks into the framework is incremental.\n\n## Desktop App Management\n\n**File:** `desktop_install.rs`\n\nHandles discovery, download, and installation of the LibreFang desktop application from GitHub releases (`librefang/librefang`).\n\n### Binary Discovery (`find_desktop_binary`)\n\nSearch order:\n1. Sibling of the current CLI executable\n2. `PATH` lookup (`which_lookup`)\n3. Platform-specific standard location:\n   - **macOS:** `/Applications/LibreFang.app/Contents/MacOS/LibreFang`\n   - **Windows:** `%LOCALAPPDATA%\\LibreFang\\LibreFang.exe`\n   - **Linux:** `~/.local/bin/librefang-desktop`, then `~/Applications/LibreFang.AppImage`\n\n### Download and Install\n\nTriggered when the user selects \"Desktop App\" but it's not found locally. The flow:\n\n1. Query GitHub Releases API for the latest release\n2. Find the asset matching the current platform (`platform_asset_suffix`):\n   - macOS aarch64 → `_aarch64.dmg`\n   - macOS x86_64 → `_x64.dmg`\n   - Windows x86_64 → `_x64-setup.exe`\n   - Linux x86_64 → `_amd64.AppImage`\n3. Stream-download to a temp directory\n4. Platform-specific install:\n   - **macOS:** Mount DMG, copy `.app` to `/Applications`, clear quarantine xattr\n   - **Windows:** Run NSIS installer with `/S` (silent)\n   - **Linux:** Copy AppImage to `~/.local/bin/`, `chmod 755`\n\n### Launching (`launch`)\n\nOn macOS, if the binary is inside a `.app` bundle, uses `open -a` for proper bundle launch. Otherwise spawns the binary detached (`Stdio::null()` for all three streams).\n\n## Internationalization\n\n**File:** `i18n.rs`\n\nFluent-based i18n with two language packs: English (`en`, default) and Simplified Chinese (`zh-CN`). FTL resource files are embedded at compile time via `include_str!`.\n\n### Usage\n\n```rust\ni18n::init(\"zh-CN\");       // call once at startup\nlet msg = i18n::t(\"daemon-starting\");           // simple lookup\nlet msg = i18n::t_args(\"models-available\", &[(\"count\", \"12\")]);  // parameterized\n```\n\nThe module uses a `thread_local!` `RefCell<Option<I18n>>` so it's safe across the CLI's single-threaded main path. Unknown keys return `[key_name]` as a visible fallback. Initialization failures fall back to English with a `tracing::warn`.\n\n## HTTP Client\n\n**File:** `http_client.rs`\n\nThin wrapper around `reqwest::blocking::Client` that applies the TLS config from `librefang_runtime::http_client::tls_config()` (bundled CA roots for environments without system cert stores). The `new_client()` function panics on construction failure — this is intentional, as a broken TLS config is a startup-fatal problem.\n\n## Logging and Filter Reload\n\n**File:** `log_filter.rs`\n\nProvides `ReloadableEnvFilter` — a per-layer tracing filter backed by `ArcSwap<EnvFilter>` that can be swapped at runtime (e.g., from the dashboard's log level toggle) without restarting the daemon.\n\n### Why Custom Instead of `tracing_subscriber::reload::Layer`\n\nThe daemon's subscriber stack is a deeply nested `Layered<...>` type that's impractical to store in a `OnceLock`. The hand-rolled approach keeps the signature simple.\n\n### How Reload Works\n\n1. `ReloadableEnvFilter::install_with_baseline(initial, baseline)` stores the initial filter and remembers baseline directives (e.g., `librefang_kernel=warn`) that should survive reloads.\n2. `reload_log_level(directive)` parses the new directive, replays all baseline directives on top of it, swaps the `ArcSwap`, and calls `tracing_core::callsite::rebuild_interest_cache()` to invalidate the per-call
