tra feature flags).\n- **reqwest** — the HTTP client itself.\n- **axum** — used for inbound webhook receiver endpoints in the sidecar trampoline.\n- **image** — JPEG/PNG/WebP processing for attachment enrichment (no default features, only needed decoders).\n- **pdf-extract** — text extraction from PDF attachments.\n- **subtle** — constant-time comparison for HMAC-style operations at the bridge boundary.\n\nDependencies that were **removed** during the sidecar migration (their consumers moved to Python sidecars):\n\n- `hmac`, `sha1` — webhook signature verification (now in sidecars)\n- `aes`, `cbc` — AES-CBC envelope decryption for WeCom/Feishu payloads\n- `tokio-tungstenite` — WebSocket gateway connections (Socket Mode, etc.)\n- `lettre`, `imap`, `mailparse` — email adapter\n- `rsa` — Google Chat service account JWT signing\n- `hex`, `html-escape`, `urlencoding`, `zeroize` — no remaining in-crate callers\n\n## Cross-Cutting Concerns\n\nThe following topics are documented in the top-level `CLAUDE.md` and in the live sidecar adapter sources rather than here, to avoid duplication drift:\n\n- Webhook HMAC verification (runs inside each Python sidecar)\n- SSRF guards on `WEBHOOK_CALLBACK_URL`\n- `SessionId::for_channel` contract\n- Boundary contracts with `librefang-kernel` and `librefang-runtime`\n\nRefer to `docs/architecture/sidecar-channels.md` and `CONTRIBUTING.md` for authoritative details.","other-librefang-cli-locales":"# Other — librefang-cli-locales\n\n# librefang-cli-locales\n\nFluent (FTL) message catalogs for the LibreFang CLI. Provides all user-facing strings—status messages, error reports, hints, and interactive prompts—in a structured, localizable format. Currently ships English (`en`) as the primary locale and Simplified Chinese (`zh-CN`) as a complete translation.\n\n## Architecture\n\n```mermaid\ngraph LR\n    CLI[\"librefang-cli<br/>(Rust binary)\"] -->|\"fluent::FluentBundle<br/>load(\\\"en/main.ftl\\\")\"| EN[\"locales/<b>en<\/b>/main.ftl\"]\n    CLI -->|\"load(\\\"zh-CN/main.ftl\\\")\"| ZH[\"locales/<b>zh-CN<\/b>/main.ftl\"]\n    EN -->|fallback| CLI\n    ZH -->|override| CLI\n```\n\nThe CLI uses the [Fluent](https://projectfluent.org/) system (Rust crate `fluent`) to resolve message IDs to localized strings at runtime. The English catalog is the canonical source; all other locales translate against it one-to-one.\n\n## File Layout\n\n```\nlibrefang-cli/locales/\n├── en/main.ftl       # Primary (canonical) catalog\n└── zh-CN/main.ftl    # Simplified Chinese translation\n```\n\nEach file is a single self-contained Fluent resource with no imports.\n\n## Message ID Conventions\n\n### Prefixes group messages by subsystem\n\n| Prefix | Domain | Example |\n|--------|--------|---------|\n| `daemon-*` | Daemon lifecycle (start, stop, restart, background) | `daemon-started-bg`, `daemon-stopped-forced` |\n| `label-*` | Short field labels for status/info tables | `label-uptime`, `label-pid` |\n| `hint-*` | Non-critical guidance shown after output | `hint-stop-daemon`, `hint-check-status` |\n| `error-*` | Error titles and diagnostics | `error-boot-auth`, `error-connect-refused` |\n| `agent-*` | Agent spawning, killing, model management | `agent-spawned`, `agent-kill-failed` |\n| `vault-*` | Credential vault operations | `vault-stored`, `vault-rotate-success` |\n| `cron-*` | Scheduled job CRUD | `cron-created`, `cron-deleted` |\n| `config-*` | Config file reads/writes/edits | `config-set-kv`, `config-parse-error` |\n| `channel-*` | Messaging channel setup (Discord, Slack, etc.) | `channel-test-ok`, `channel-unknown` |\n| `section-*` | Table/section headers for status output | `section-daemon-status`, `section-active-agents` |\n| `webhook-*` | Webhook management | `webhook-created`, `webhook-test-ok` |\n| `memory-*` | Agent memory key-value operations | `memory-set`, `memory-deleted` |\n| `uninstall-*` | Teardown and cleanup | `uninstall-goodbye`, `uninstall-removed` |\n| `doctor-*` | Diagnostic checks | `doctor-all-passed`, `doctor-some-failed` |\n| `model-*` | Model catalog selection | `model-set-success`, `model-no-catalog` |\n| `approval-*` | Human-in-the-loop approvals | `approval-responded`, `approval-failed` |\n| `device-*` | Mobile device pairing | `device-scan-qr`, `device-removed` |\n| `guide-*` | Interactive setup wizard | `guide-title`, `guide-testing-key` |\n| `shutdown-*` | Shutdown-specific edge cases | `shutdown-401-detected`, `shutdown-401-fallback-attempt` |\n| `reset-*` / `log-*` | Reset and log tailing | `reset-success`, `log-following` |\n\n### Error + fix pattern\n\nMany error messages have a companion `*-fix` variant that provides remediation guidance. Consumers typically print the error message followed by the fix hint:\n\n```ftl\nerror-boot-auth = LLM provider authentication failed\nerror-boot-auth-fix = Run `librefang doctor` to check your API key configuration\n```\n\nIn code, these are resolved as a pair:\n\n```rust\nprintln!(\"{}: {}\", ftl(\"error-boot-auth\"), ftl(\"error-boot-auth-fix\"));\n```\n\n### Value labels\n\nStatic display values for the security status table use a `value-*` prefix to pair with their `label-*` counterpart:\n\n```ftl\nlabel-audit-trail = Audit trail\nvalue-audit-trail = Merkle hash chain (SHA-256)\n```\n\n## Variable Interpolation\n\nMessages use Fluent's `$variable` syntax. All variables are positional and untyped (rendered as strings by the CLI before passing to Fluent). Common variables:\n\n| Variable | Used in | Meaning |\n|----------|---------|---------|\n| `$error` | `daemon-error`, `vault-unlock-failed`, etc. | Underlying error string |\n| `$status` | `error-daemon-returned`, `daemon-bg-exited` | HTTP or exit status code |\n| `$path` | `log-path-hint`, `vault-rotate-no-vault` | Filesystem path |\n| `$url` | `daemon-already-running`, `dashboard-opening` | Daemon/dashboard URL |\n| `$count` | `models-available`, `agents-loaded`, `vault-rotate-success` | Numeric count |\n| `$pid` | `shutdown-401-fallback-attempt`, `shutdown-401-fallback-success` | OS process ID |\n| `$id` | `agent-killed`, `cron-deleted`, `webhook-created` | Entity identifier |\n| `$name` | `agent-spawned`, `channel-configured` | Human-readable name |\n| `$key` | `vault-stored`, `config-key-not-found` | Config or vault key |\n| `$value` | `agent-model-set`, `config-set-kv` | Assigned value |\n| `$command` | `error-require-daemon` | CLI subcommand name |\n| `$provider` / `$model` | `kernel-booted`, `model-set-success` | LLM provider or model ID |\n| `$display` / `$env_var` | `detected-provider`, `config-saved-key` | Provider display name, env var name |\n| `$action` | `cron-toggled`, `approval-responded` | Past-tense action (paused/resumed, approved/rejected) |\n| `$field` | `agent-unknown-field` | Field name in set operations |\n| `$max` | `model-out-of-range` | Upper bound of selection range |\n\n## Multiline Messages\n\nSome remediation hints use Fluent's block syntax (indented continuation lines). For example, `shutdown-401-fallback-fix`:\n\n```ftl\nshutdown-401-fallback-fix = Stop the daemon manually, then start it again:\n    kill { $pid }    # or: kill -9 { $pid } if it does not exit\n    librefang start\n```\n\nThe indented lines are part of the same message value. Consumers should preserve line breaks when rendering.\n\n## Adding a New Locale\n\n1. Create `librefang-cli/locales/<locale>/main.ftl` (e.g., `ja/main.ftl`).\n2. Copy `en/main.ftl` as the starting template.\n3. Translate every message value. **Do not change message IDs or variable names.**\n4. Keep the same section comment structure for diff-ability.\n5. Register the locale in the CLI's Fluent bundle loader (see the i18n initialization code in `librefang-cli`).\n\n### Completeness check\n\nEvery message ID present in `en/main.ftl` must exist in the new locale file. Missing IDs will silently fall back to English if the bundle is configured with an `en` fallback chain, but this should be treated as a bug.\n\n## Adding New Messages\n\n1. Add the message to `en/main.ftl` under the appropriate section comment.\n2. Follow the naming convention (`subsystem-variant` or `subsystem-variant-fix`).\n3. Use `$variable` placeholders for any dynamic content—never hardcode formatted strings.\n4. Immediately add the same message ID to all other locale files with a translation. Leaving other locales out of date is acceptable short-term only if fallback is configured.\n5. If the message is an error, add a companion `*-fix` variant.\n\n## Notable Design Decisions\n\n**Issue #4693 shutdown flow.** The `shutdown-401-*` family of messages handles a specific upgrade scenario: `curl install.sh | sh` replaces the CLI binary while the old daemon keeps running with a different `api_key`. The messages explain the cause, attempt a PID-based fallback, and guide manual recovery if that also fails. The entire flow is driven through these seven message IDs rather than hardcoded English strings.\n\n**Quick mode vs. interactive mode.** The `hint-non-interactive` and `hint-non-interactive-wizard` messages distinguish between piped/CI terminals and interactive ones. The `init-quick-success` / `init-interactive-success` pair reflects the same split in the init command.\n\n**In-process vs. daemon agents.** Several message pairs distinguish ephemeral in-process agents from daemon-managed persistent ones:\n- `agent-spawned` vs. `agent-spawned-inprocess`\n- `section-daemon-status` vs. `section-status-inprocess`\n- `hint-agent-lost-on-exit` and `hint-persistent-agents`","other-librefang-cli-templates":"# Other — librefang-cli-templates\n\n# librefang-cli-templates\n\nTOML configuration templates shipped with the LibreFang CLI. These files are rendered by `librefang init` (or the interactive wizard) to produce the daemon's runtime configuration at `~/.librefang/config.toml`.\n\n## Templates\n\n### `init_default_config.toml`\n\nFull reference configuration. Every supported key is present — most are commented out so the generated file doubles as in-place documentation. Keys that the CLI can pre-fill use Mustache-style placeholders:\n\n| Placeholder | Replaced with |\n|---|---|\n| `{{provider}}` | LLM provider name (e.g. `openai`, `anthropic`) |\n| `{{model}}` | Default model identifier (e.g. `gpt-4o`, `claude-sonnet-4-20250514`) |\n| `{{api_key_env}}` | Environment variable holding the API key (e.g. `OPENAI_API_KEY`) |\n\nUsed when the user runs `librefang init` non-interactively or selects the \"full\" template during setup.\n\n### `init_wizard_config.toml`\n\nMinimal configuration emitted by the interactive setup wizard. Only the keys strictly required to start the daemon are included:\n\n| Placeholder | Replaced with |\n|---|---|\n| `{{provider}}` | LLM provider name |\n| `{{model}}` | Default model identifier |\n| `{{api_key_line}}` | A complete `api_key_env = \"...\"` line, or omitted if not needed |\n| `{{routing_section}}` | Optional agent-routing TOML block generated by the wizard |\n\n## Configuration Sections\n\nThe full template is organized into these sections, roughly in dependency order:\n\n### Server & Networking\n\n```toml\napi_listen = \"127.0.0.1:4545\"\nlog_level = \"info\"           # trace | debug | info | warn | error\nmode = \"default\"             # stable | default | dev\n```\n\nThe daemon binds to loopback only by default. Binding to a non-loopback address requires authentication to be configured first (`api_key`, `dashboard_user`/`dashboard_pass`, or `[[users]]` with `api_key_hash`). The daemon will refuse to start otherwise unless `LIBREFANG_ALLOW_NO_AUTH=1` is set.\n\n**Terminal access control** (`[terminal]`) governs remote shell access, with `allow_unauthenticated_remote` as a hard guard against accidental exposure.\n\n### Default LLM\n\n```toml\n[default_model]\nprovider = \"{{provider}}\"\nmodel = \"{{model}}\"\napi_key_env = \"{{api_key_env}}\"\n```\n\nThe primary LLM used when no agent-specific model override is set. `api_key_env` names an environment variable — the key itself is never written to the config file.\n\nFallback providers (`[[fallback_providers]]`) form a failover chain consulted when the primary provider returns an error.\n\n### Memory & Proactive Memory\n\n```toml\n[memory]\ndecay_rate = 0.05\n\n[proactive_memory]\nenabled = true\nauto_memorize = true\nauto_retrieve = true\nmax_retrieve = 10\n```\n\n`[memory]` controls confidence decay across cycles. `[proactive_memory]` enables automatic fact extraction from conversations and context-aware retrieval of previously stored facts.\n\n### Web Tools\n\n```toml\n[web]\nsearch_provider = \"auto\"     # Tavily → Brave → Jina → Perplexity → DuckDuckGo\n\n[web.fetch]\nmax_chars = 50000\nreadability = true\n```\n\nSearch provider auto-detection checks for available API keys at startup. The fetch subsystem converts HTML to readable text and blocks cloud metadata IPs (169.254.x.x, 100.64.x.x) by default; `ssrf_allowed_hosts` can selectively open internal hosts.\n\n### Task Queue Concurrency\n\n```toml\n[queue.concurrency]\nmain_lane = 3\ncron_lane = 2\nsubagent_lane = 3\ntrigger_lane = 8\ndefault_per_agent = 1\n```\n\nFour named lanes cap concurrent work. `default_per_agent` provides a per-agent fallback when the agent manifest doesn't specify `max_concurrent_invocations`.\n\n### Shell Execution Policy\n\n```toml\n[exec_policy]\nmode = \"deny\"                # deny | allowlist | full\ntimeout_secs = 30\nmax_output_bytes = 102400\n```\n\nDefaults to `deny` — agents cannot execute shell commands unless explicitly enabled.\n\n### Sidecar Channel Adapters\n\nAll messaging integrations run as out-of-process Python sidecars communicating over newline-delimited JSON-RPC via stdio. The template ships with commented blocks for every supported adapter:\n\n```\nBluesky · DingTalk · Discord · Email · Feishu/Lark · Google Chat ·\nGotify · LINE · Mastodon · Matrix · Mattermost · Nextcloud Talk ·\nntfy · QQ · Reddit · Rocket.Chat · Signal · Slack · Teams ·\nTelegram · Twitch · Webex · Webhook · WeChat · WeCom · WhatsApp · Zulip\n```\n\nEach block follows the same structure:\n\n```toml\n[[sidecar_channels]]\nname = \"slack\"\ncommand = \"python3\"\nargs = [\"-m\", \"librefang.sidecar.adapters.slack\"]\nchannel_type = \"slack\"\n[sidecar_channels.env]\nSLACK_APP_TOKEN = \"...\"\nSLACK_BOT_TOKEN = \"...\"\n```\n\n**Prerequisites:** The `librefang-sdk` Python package must be installed in the same interpreter that `python3` resolves to. Verify with:\n\n```bash\npython3 -c 'import librefang.sidecar; print(librefang.__file__)'\n```\n\nSecrets should be stored in `~/.librefang/secrets.env`, not in the config file. To discover all environment variables an adapter accepts:\n\n```bash\npython3 -m librefang.sidecar.adapters.<name> --describe\n```\n\nOld in-process `[channels.<name>]` blocks are no longer recognized — all adapters have been migrated to the sidecar architecture.\n\n### Other Optional Sections\n\n| Section | Purpose |\n|---|---|\n| `[reload]` | Config hot-reload mode: `off`, `restart`, `hot`, or `hybrid` |\n| `[rate_limit]` | GCRA-based API rate limiting and WebSocket throttling |\n| `[budget]` | Per-provider and global cost caps with alert thresholds |\n| `[compaction]` | LLM-based session history summarization |\n| `[triggers]` | Event-driven automation with recursion and time limits |\n| `[thinking]` | Extended thinking for Claude models (`budget_tokens`) |\n| `[[mcp_servers]]` | External tool integration via Model Context Protocol |\n| `[browser]` | Headless browser automation settings |\n| `[docker]` | Containerized code execution sandbox |\n| `[inbox]` | File-based async message ingestion |\n| `[network]` | P2P federation between LibreFang nodes |\n| `[registry]` | Agent registry cache TTL |\n| `[provider_regions]` | Regional endpoint selection for multi-region providers |\n| `[provider_urls]` | Custom endpoints for self-hosted LLM servers |\n\n## Template Rendering\n\nThe CLI replaces placeholders at init time and writes the result to the user's config directory. No runtime template engine is involved — the daemon reads plain TOML.\n\n```mermaid\nflowchart LR\n    A[librefang init] --> B{Wizard?}\n    B -- Yes --> C[init_wizard_config.toml]\n    B -- No --> D[init_default_config.toml]\n    C --> E[Replace placeholders]\n    D --> E\n    E --> F[\"~/.librefang/config.toml\"]\n    F --> G[librefang start]\n```\n\n## Guidelines for Contributors\n\n- **Adding a new config key:** Add it (commented out) to `init_default_config.toml` with a descriptive comment. If the wizard should set it, add the corresponding line to `init_wizard_config.toml`.\n- **Adding a new sidecar adapter:** Add a commented `[[sidecar_channels]]` block to `init_default_config.toml`. Include a migration note referencing the PR that moved it from in-process. Regenerate the listing from the adapter's SCHEMA using `cd sdk/python && python3 ../../scripts/gen_sidecar_samples.py`.\n- **Never put actual secrets in these templates.** Always reference environment variables or the vault.\n- **Placeholder syntax:** Use `{{key}}` — the CLI performs simple string substitution, not a full template engine.","other-librefang-cli-tests":"# Other — librefang-cli-tests\n\n# librefang-cli/tests — Integration & Regression Tests\n\n## Overview\n\nThis directory contains two standalone test programs that guard against specific regressions in `librefang-cli` and its dependency `librefang-extensions`. They are compiled and run by `cargo test` but live outside the main library crate so they can inspect build-time artifacts and drive library APIs without coupling to the CLI's `std::process::exit` error paths.\n\n| File | What it protects | Issue reference |\n|---|---|---|\n| `build_rs_no_git_mutation.rs` | Ensures `build.rs` never mutates the user's git config or invokes side-effecting git subcommands | #3641 |\n| `vault_rotate_key.rs` | Validates the full vault key-rotation lifecycle (decrypt → rewrap → sentinel preservation → old-key rejection) | #3651 |\n\n---\n\n## build_rs_no_git_mutation.rs\n\n### Purpose\n\nIssue #3641 was caused by `build.rs` writing to the user's global git config (specifically `core.hooksPath`) during compilation — an unacceptable side effect for a build script. This test is a **static analysis guard**: it reads `build.rs` at test time and asserts that forbidden tokens never appear in the source, preventing regressions silently introduced by future edits.\n\n### How it works\n\n1. **`read_build_rs()`** — Resolves `<CARGO_MANIFEST_DIR>/build.rs` and reads the entire file into a `String`. Panics if the file is missing (the test is meaningless without it).\n\n2. **`strip_comments(src)`** — Strips `//` line comments from the source so that doc comments or explanatory notes referencing the old bug (e.g. `// We used to run git config …`) don't trigger false positives. This is intentionally naive — it doesn't handle block comments or string-escaped slashes — which is fine because `build.rs` doesn't use `/* */` comments.\n\n3. Two test functions scan the cleaned source for banned patterns:\n\n   - **`build_rs_does_not_mutate_git_config`** — Bans the literal string token `\"config\"` (the argument subcommand passed to git) and the string `hooksPath`. If a future change needs read-only `git config --get`, the test must be updated with an explicit allowance rather than silently passing.\n\n   - **`build_rs_uses_only_read_only_git_subcommands`** — Bans a list of side-effecting git subcommands: `init`, `clone`, `commit`, `push`, `pull`, `fetch`, `checkout`, `reset`, `add`, `rm`.\n\n### Design note\n\nThe test checks for string literals like `\"config\"` (with quotes) rather than the bare word `config`. This avoids matching variable names, comments, or other incidental occurrences while catching cases where git is invoked with `arg(\"config\")`.\n\n---\n\n## vault_rotate_key.rs\n\n### Purpose\n\nThe CLI subcommand `librefang vault rotate-key` wraps several `CredentialVault` methods from `librefang-extensions`. This test exercises the **exact library-level code path** the CLI drives, verifying that:\n\n- After rotation, the vault decrypts under the **new** key and **rejects** the old key.\n- All user entries survive rotation with their original plaintext intact.\n- The internal sentinel (`SENTINEL_KEY` / `SENTINEL_VALUE`) survives rotation, is invisible to `list_keys()`, and is inspectable via `iter_all_entries()`.\n- Re-wrapping with the **same** key is idempotent (the CLI blocks this as a user-facing guard, but the library tolerates it).\n\n### Why library-level and not CLI-spawned\n\nThe real `cmd_vault_rotate_key` has two properties that make it hostile to parallel `cargo test`:\n\n- It calls `std::process::exit` on every error path, which would kill the test runner.\n- It reads `LIBREFANG_VAULT_KEY_OLD` / `LIBREFANG_VAULT_KEY_NEW` from the **global** process environment, causing data races under `cargo test --threads > 1`.\n\nDriving `CredentialVault` directly is deterministic, parallel-safe, and covers the actual invariants the CLI depends on.\n\n### Helper\n\n```rust\nfn key_filled(b: u8) -> Zeroizing<[u8; 32]>\n```\n\nReturns a deterministic 32-byte key with every byte set to `b`. Uses `Zeroizing` to match production key handling. Deterministic keys make failures reproducible without `OsRng` noise.\n\n### Test functions\n\n#### `rotate_key_end_to_end_replaces_master_key_and_preserves_entries`\n\nFour-phase lifecycle test:\n\n```\nPhase 1: Create vault under key A → store API_KEY, REFRESH_TOKEN → verify sentinel\nPhase 2: Unlock with key A → verify sentinel → rewrap_with_new_key(key B)\nPhase 3: Unlock with key B → assert entries match originals → verify sentinel\nPhase 4: Unlock with key A → assert failure (old key must be rejected)\n```\n\nThis mirrors the sequence in `cmd_vault_rotate_key`: `unlock_with_key` → `verify_or_install_sentinel` → `rewrap_with_new_key`.\n\n#### `rewrap_with_identical_key_still_decrypts`\n\nTests idempotent re-encryption: create a vault, call `rewrap_with_new_key` with the **same** key, then reopen and verify the entry is still readable and the sentinel still validates. The library allows this (it re-encrypts with a fresh AES-GCM nonce/salt); the CLI layer blocks it as a user-facing footgun via the `vault-rotate-same-key` fluent message.\n\n#### `sentinel_round_trips_through_rotation`\n\nFocused test for internal entry preservation. Creates a vault, rotates the key, then uses `iter_all_entries()` (which includes reserved keys hidden from `list_keys()`) to directly inspect the sentinel:\n\n```rust\nlet (_, sv) = vault2.iter_all_entries().find(|(k, _)| *k == SENTINEL_KEY).expect(\"...\");\nassert_eq!(sv, SENTINEL_VALUE);\n```\n\nThis catches regressions where `rewrap_with_new_key` might only re-encrypt user-visible entries and drop internal slots.\n\n### Relationship to librefang-extensions\n\n```mermaid\ngraph LR\n    subgraph \"vault_rotate_key.rs (tests)\"\n        T1[rotate_key_end_to_end]\n        T2[rewrap_identical_key]\n        T3[sentinel_round_trips]\n    end\n    subgraph \"CredentialVault (librefang-extensions)\"\n        init[init_with_key]\n        unlock[unlock_with_key]\n        set[set / get]\n        list[list_keys]\n        rewrap[rewrap_with_new_key]\n        sentinel[verify_or_install_sentinel]\n        iter[iter_all_entries]\n    end\n    T1 --> init & unlock & set & list & rewrap & sentinel\n    T2 --> init & unlock & set & rewrap & sentinel\n    T3 --> init & unlock & rewrap & sentinel & iter\n```\n\n---\n\n## Running\n\n```sh\n# Both test programs\ncargo test\n\n# Only build.rs guard\ncargo test --test build_rs_no_git_mutation\n\n# Only vault rotation\ncargo test --test vault_rotate_key\n```\n\nNo environment variables, network access, or external state are required. All vault tests use `tempfile::tempdir()` for automatic cleanup.","other-librefang-cli":"# Other — librefang-cli\n\n# librefang-cli\n\nCommand-line interface for the LibreFang Agent OS. Produces the `librefang` binary.\n\n## Operational Modes\n\nThe CLI operates in one of two modes depending on whether a daemon is already running:\n\n- **Daemon mode** — When `librefang start` has launched the background daemon, subsequent CLI invocations talk to it over HTTP at `http://127.0.0.1:4545` (default). Commands are forwarded; no in-process kernel is created.\n- **Single-shot mode** — When no daemon is running, commands that need the kernel boot one in-process, execute, and terminate. This is the path used by `librefang doctor`, one-off `librefang agent spawn` calls, and similar invocations.\n\n## Architecture\n\n```mermaid\ngraph TD\n    CLI[\"librefang binary<br/>(clap CLI)\"]\n    CLI -->|daemon running| HTTP[\"HTTP API<br/>127.0.0.1:4545\"]\n    CLI -->|no daemon| Kernel[\"In-process kernel\"]\n    Kernel --> API[\"librefang-api\"]\n    Kernel --> Channels[\"librefang-channels<br/>(sidecar adapters)\"]\n    Kernel --> Runtime[\"librefang-runtime\"]\n    Kernel --> ACP[\"librefang-acp\"]\n    Kernel --> Memory[\"librefang-memory\"]\n    Kernel --> Skills[\"librefang-skills\"]\n    Kernel --> Extensions[\"librefang-extensions\"]\n    Kernel --> Import[\"librefang-import\"]\n```\n\n## Cargo Features\n\n| Feature | Default | Description |\n|---------|---------|-------------|\n| `telemetry` | **yes** | Enables OpenTelemetry tracing via `librefang-api/telemetry`, `opentelemetry`, and `tracing-opentelemetry`. |\n| `mini` | no | **Deprecated no-op alias.** Previously selected a reduced channel set. All channel adapters now run as out-of-process sidecars, so this feature is byte-identical to the default build. It exists solely so legacy CI jobs (`cli_linux_mini`, `cli_mac_mini`, `cli_windows_mini`) continue to produce their `librefang-${target}-mini.tar.gz` artifacts. Those jobs should be retired and this feature removed. |\n\nHistorical features `core-channels`, `all-channels`, `android`, and per-adapter `channel-*` flags have been removed. Channel adapters live in the `librefang-channels` crate but execute as out-of-process sidecars (`librefang.sidecar.adapters.*` in the SDK package), so there are no in-process cargo features to gate.\n\n## Build Script (`build.rs`)\n\nThe build script injects compile-time metadata as environment variables accessible via `env!()` in `main.rs`:\n\n| Variable | Source | Example |\n|----------|--------|---------|\n| `GIT_SHA` | CI env or `git rev-parse --short HEAD` | `a1b2c3d` |\n| `BUILD_DATE` | `chrono::Utc::now()` (UTC, date only) | `2025-01-15` |\n| `RUSTC_VERSION` | `rustc --version` output | `rustc 1.82.0` |\n\n### Git SHA Resolution (`resolve_git_sha`)\n\nPriority order:\n\n1. `GITHUB_SHA` environment variable (GitHub Actions). Truncated to 7 characters via `short_sha`.\n2. `CI_COMMIT_SHA` environment variable (GitLab CI / generic). Also truncated.\n3. `git rev-parse --short HEAD`, with the `git` binary located via `which::which(\"git\")` to avoid depending on shell PATH lookup semantics.\n4. `\"unknown\"` if all methods fail.\n\nThe build script declares `cargo:rerun-if-env-changed` for `GITHUB_SHA`, `CI_COMMIT_SHA`, and `SOURCE_DATE_EPOCH` so cargo correctly invalidates the build script when these inputs change.\n\n`BUILD_DATE` is captured using `chrono::Utc::now()` rather than shelling out to `date`, avoiding platform-specific flag differences between BSD and GNU `date`.\n\n## Global Allocator\n\nOn non-MSVC targets (`cfg(not(target_env = \"msvc\"))`), the binary uses **tikv-jemallocator** with `disable_initial_exec_tls` as the global allocator. MSVC targets (Windows) use the system default.\n\n## Key Dependencies\n\n| Crate | Role |\n|-------|------|\n| `librefang-kernel` | Core agent orchestration engine |\n| `librefang-api` | HTTP API layer (feature-gated telemetry) |\n| `librefang-channels` | Channel adapter definitions (sidecar dispatch) |\n| `librefang-runtime` | Agent execution runtime |\n| `librefang-acp` | Agent Communication Protocol (kernel-adapter feature) |\n| `librefang-types` | Shared type definitions |\n| `librefang-memory` | Agent memory/state management |\n| `librefang-skills` | Skill definitions and loading |\n| `librefang-extensions` | Extension system |\n| `librefang-import` | Agent/conversation import |\n| `clap` / `clap_complete` | CLI argument parsing and shell completions |\n| `ratatui` | Terminal UI (dashboard) |\n| `tracing` / `tracing-subscriber` | Structured logging |\n| `tokio` | Async runtime |\n| `reqwest` (blocking) | HTTP client for daemon communication |\n\n## Common Commands\n\n```\nlibrefang start              # Start the daemon (HTTP API + dashboard)\nlibrefang init               # Write starter ~/.librefang/config.toml\nlibrefang agent spawn        # Create a new agent\nlibrefang agent list         # List running agents\nlibrefang agent message      # Send a message to an agent\nlibrefang doctor             # Diagnose the local environment\nlibrefang help               # Show full command catalog\n```\n\nAny subcommand accepts `--help` for detailed usage.\n\n## Configuration\n\nDefault config path: `~/.librefang/config.toml`. Generated by `librefang init`. The CLI also reads `dirs`-resolved XDG paths for cross-platform config location.\n\n## Build for Release\n\n```bash\n# Standard build with telemetry\ncargo build -p librefang-cli --release\n\n# Mini build (identical output; alias kept for CI compatibility)\ncargo build -p librefang-cli --release --features mini\n\n# Without telemetry\ncargo build -p librefang-cli --release --no-default-features\n```","other-librefang-desktop-capabilities":"# Other — librefang-desktop-capabilities\n\n# LibreFang Desktop — Capabilities\n\n## Purpose\n\nThis module defines the **Tauri capability configurations** that control which plugins and system APIs the LibreFang app is permitted to use. Tauri's capability system is a security layer: the app cannot invoke any plugin command unless that command is explicitly listed in a capability file that matches the current platform and window.\n\nThere are two capability files, each targeting a different set of platforms with a tailored permission set.\n\n## File Reference\n\n### `default.json` — Desktop Platforms\n\n| Field | Value |\n|---|---|\n| Identifier | `default` |\n| Target windows | `main` |\n| Target platforms | macOS, Windows, Linux |\n\n**Granted permissions:**\n\n| Permission | Plugin | What it enables |\n|---|---|---|\n| `core:default` | `core` | Standard Tauri runtime APIs (window management, event system, etc.) |\n| `notification:default` | `notification` | Sending native OS notifications |\n| `shell:default` | `shell` | Spawning child processes and executing shell commands |\n| `dialog:default` | `dialog` | Native file open/save dialogs, message boxes |\n| `global-shortcut:allow-register` | `global-shortcut` | Registering global keyboard shortcuts |\n| `global-shortcut:allow-unregister` | `global-shortcut` | Removing previously registered shortcuts |\n| `global-shortcut:allow-is-registered` | `global-shortcut` | Querying whether a shortcut is currently registered |\n| `autostart:default` | `autostart` | Launching the app automatically at login/boot |\n| `updater:default` | `updater` | Checking for and applying app updates |\n\nNote that `global-shortcut` permissions are granted at the individual-command level rather than using the `:default` bundle, giving fine-grained control over which shortcut operations are allowed.\n\n### `mobile.json` — Mobile Platforms\n\n| Field | Value |\n|---|---|\n| Identifier | `mobile` |\n| Target windows | `main` |\n| Target platforms | iOS, Android |\n\n**Granted permissions:**\n\n| Permission | Plugin |\n|---|---|\n| `core:default` | `core` |\n| `notification:default` | `notification` |\n| `dialog:default` | `dialog` |\n\nThis is a strict subset of the desktop capability. Several plugins are excluded because they have no meaningful implementation on mobile:\n\n- **`shell`** — Mobile platforms restrict arbitrary process spawning.\n- **`global-shortcut`** — Mobile OSes don't expose system-wide hotkey APIs to apps.\n- **`autostart`** — Not applicable on iOS/Android.\n- **`updater`** — Mobile apps are distributed and updated through app stores, not self-updated.\n\n## Architecture\n\n```mermaid\ngraph LR\n    subgraph Desktop [\"Desktop (macOS / Windows / Linux)\"]\n        D[default.json]\n    end\n    subgraph Mobile [\"Mobile (iOS / Android)\"]\n        M[mobile.json]\n    end\n    D --> P[core / notification / dialog / shell / global-shortcut / autostart / updater]\n    M --> Q[core / notification / dialog]\n```\n\nTauri loads the capability file whose `platforms` array matches the current OS at build time. Only one capability set is active for a given build target — the files are mutually exclusive by platform.\n\n## How to Modify\n\n**Adding a new permission** — Add the permission identifier string to the `permissions` array in the appropriate file(s). Use individual command permissions (e.g., `plugin:allow-command`) for fine-grained control, or `plugin:default` to grant the plugin's recommended default set.\n\n**Adding a new plugin** — If the plugin is desktop-only, add its permissions only to `default.json`. If it works cross-platform, add it to both files. Update the `$schema` field if the schema URL changes.\n\n**Targeting a new window** — Add the window label to the `windows` array in the relevant capability file. Currently only the `main` window is configured.","other-librefang-desktop-gen":"# Other — librefang-desktop-gen\n\n# librefang-desktop-gen\n\nAuto-generated build artifacts produced by the Tauri CLI during initialization and build of the LibreFang desktop application. This directory is managed entirely by tooling and should not be hand-edited.\n\n## Directory Layout\n\n```\ngen/\n├── android/           # Android Studio project (populated by `cargo tauri android init`)\n├── apple/             # Xcode project (populated by `cargo tauri ios init`, macOS only)\n└── schemas/\n    ├── acl-manifests.json      # Aggregated ACL manifests from all Tauri plugins\n    ├── capabilities.json       # Resolved capability sets for the LibreFang app\n    └── desktop-schema.json     # JSON Schema for Tauri capability files\n```\n\n## Mobile Platform Directories\n\n### `android/` and `apple/`\n\nEmpty placeholder directories until the respective init commands are run from `crates/librefang-desktop/`:\n\n```bash\n# Populate the Android project\ncd crates/librefang-desktop && cargo tauri android init\n\n# Populate the Apple project (macOS host only)\ncd crates/librefang-desktop && cargo tauri ios init\n```\n\nAfter initialization, these directories contain full native build projects (Gradle/Android Studio and Xcode respectively) that Tauri uses to produce mobile bundles.\n\n## Schemas\n\nThe `schemas/` directory contains three JSON files that together define the security and permission model for the desktop app.\n\n### `acl-manifests.json`\n\nAggregated access-control manifests from every Tauri plugin used by LibreFang. Each top-level key is a plugin identifier and contains:\n\n- **`default_permission`** — the permission set granted when referencing the plugin's `default` identifier\n- **`permissions`** — granular `allow-*` and `deny-*` entries, each mapping to specific IPC commands\n- **`global_scope_schema`** — optional JSON Schema for scoped permissions (e.g., file system paths, shell commands)\n\n**Plugins included in this application:**\n\n| Plugin | Default Grants | Purpose |\n|---|---|---|\n| `autostart` | enable, disable, is_enabled | Launch on OS boot |\n| `core` | All core sub-plugins | Tauri runtime foundation |\n| `core:app` | App metadata and listeners | App identity, theme, listeners |\n| `core:event` | listen, unlisten, emit, emit_to | IPC event bus |\n| `core:image` | Image creation and inspection | Image manipulation |\n| `core:menu` | Full menu CRUD | Application and context menus |\n| `core:path` | Path resolution and manipulation | Filesystem path utilities |\n| `core:resources` | Resource close | Resource management |\n| `core:tray` | Tray icon CRUD | System tray |\n| `core:webview` | Webview queries and devtools | Webview management |\n| `core:window` | Window state queries and maximize toggle | Window management |\n| `dialog` | message, save, open | Native file/message dialogs |\n| `global-shortcut` | None (empty default) | Keyboard shortcuts |\n| `notification` | Full notification lifecycle | System notifications |\n| `shell` | open (http/tel/mailto) | URL and process spawning |\n| `updater` | check, download, install | Self-update mechanism |\n\n### `capabilities.json`\n\nThe resolved capability configuration for the LibreFang app, defining two distinct capability profiles:\n\n#### Default (Desktop)\n\n```json\n{\n  \"identifier\": \"default\",\n  \"windows\": [\"main\"],\n  \"platforms\": [\"macOS\", \"windows\", \"linux\"],\n  \"permissions\": [\n    \"core:default\",\n    \"notification:default\",\n    \"shell:default\",\n    \"dialog:default\",\n    \"global-shortcut:allow-register\",\n    \"global-shortcut:allow-unregister\",\n    \"global-shortcut:allow-is-registered\",\n    \"autostart:default\",\n    \"updater:default\"\n  ]\n}\n```\n\nDesktop platforms receive the full plugin set including shell access, autostart, global shortcuts, and the auto-updater.\n\n#### Mobile\n\n```json\n{\n  \"identifier\": \"mobile\",\n  \"windows\": [\"main\"],\n  \"platforms\": [\"iOS\", \"android\"],\n  \"permissions\": [\n    \"core:default\",\n    \"notification:default\",\n    \"dialog:default\"\n  ]\n}\n```\n\nMobile platforms are restricted to core functionality, notifications, and dialogs. Desktop-only plugins (`shell`, `global-shortcut`, `autostart`, `updater`) are excluded because they are not bundled on mobile targets.\n\nBoth capabilities are scoped to the `\"main\"` window and have `\"local\": true`, meaning they only apply to locally-served application content — not remote URLs.\n\n### `desktop-schema.json`\n\nA comprehensive JSON Schema (Draft 07) that validates capability files. It defines:\n\n- **`CapabilityFile`** — accepts a single capability, an array, or an object with a `capabilities` key\n- **`Capability`** — the core security boundary object with fields for `identifier`, `windows`, `webviews`, `permissions`, `platforms`, `remote`, and `local`\n- **`PermissionEntry`** — either a plain permission identifier string or an object with `identifier` + scoped `allow`/`deny` arrays\n- **`ShellScopeEntry`** — defines allowed shell commands with `name`, `cmd`/`sidecar`, and optional argument validators\n\nThis schema is what Tauri's CLI uses to validate capability files at build time.\n\n## Architecture: How Permissions Flow\n\n```mermaid\nflowchart LR\n    A[Plugin source code] --> B[ACL manifests per plugin]\n    B --> C[acl-manifests.json]\n    D[Capability files in src-tauri] --> E[capabilities.json]\n    C --> F[Build-time validation]\n    E --> F\n    F --> G[Generated IPC bindings]\n```\n\n1. Each Tauri plugin ships its own ACL manifest declaring commands and their default permission sets\n2. The Tauri CLI aggregates all manifests into `acl-manifests.json`\n3. Developer-authored capability files (in the Tauri source directory) define which windows get which permissions\n4. The CLI resolves those into `capabilities.json` and validates against the manifests\n5. At runtime, the Tauri IPC layer enforces these capabilities — any command not explicitly allowed is rejected\n\n## Working With This Directory\n\n### When to regenerate\n\nThese files are regenerated automatically by:\n\n- `cargo tauri build`\n- `cargo tauri dev`\n- Any change to `Cargo.toml` plugin dependencies\n- Changes to capability files in `src-tauri/capabilities/`\n\n### What not to do\n\n- **Do not edit** any files under `gen/` — changes will be overwritten on the next build\n- **Do not delete** the `android/` or `apple/` directories — Tauri expects them to exist\n- **Do not commit mobile project changes** without running the init commands first\n\n### Modifying permissions\n\nTo add or remove permissions, edit the capability files in the Tauri source directory (typically `src-tauri/capabilities/`), not here. The valid permission identifiers are enumerated in `desktop-schema.json` under the `Identifier` definition. The schema provides autocomplete and validation in editors that support JSON Schema.","other-librefang-desktop-src":"# Other — librefang-desktop-src\n\n# librefang-desktop (Binary Entry Point)\n\n## Overview\n\n`librefang-desktop` is the thin binary crate that serves as the executable entry point for the LibreFang Desktop application (referred to internally as \"Agent OS\"). Its responsibilities are minimal by design:\n\n1. **Load environment secrets** from disk into the process environment.\n2. **Parse CLI arguments** (remote server URL or local mode flag).\n3. **Delegate** to `librefang_desktop::run`, which owns the actual application lifecycle.\n\nThe crate contains no business logic. It exists because environment variables must be loaded synchronously at the process boundary before any async runtime or additional threads are spawned.\n\n## Startup Sequence\n\n```mermaid\nflowchart TD\n    A[main] --> B[\"librefang_extensions::dotenv::load_dotenv()\"]\n    B --> C[clap::Parser::parse]\n    C --> D[\"librefang_desktop::run(server_url, local)\"]\n```\n\n## CLI Interface\n\nThe binary exposes two optional flags via `clap`:\n\n| Flag | Type | Description |\n|------|------|-------------|\n| `--server-url <URL>` | `Option<String>` | Connect to a remote LibreFang server (e.g. `http://192.168.1.100:4545`) |\n| `--local` | `bool` | Start a local server directly, skipping the connection screen |\n\nBoth flags are optional. When neither is provided, the behavior is determined by `librefang_desktop::run` (typically presenting a UI for the user to choose).\n\n### Examples\n\n```bash\n# Launch with connection screen (default)\nlibrefang-desktop\n\n# Connect to a specific remote server\nlibrefang-desktop --server-url http://192.168.1.100:4545\n\n# Start in local/offline mode\nlibrefang-desktop --local\n```\n\n## Environment Loading\n\n`librefang_extensions::dotenv::load_dotenv()` is called as the very first operation in `main`. It reads dotfiles (`.env`, `secrets.env`, `vault`) from `~/.librefang/` and injects them into the process environment via `std::env::set_var`.\n\n> **Why here and not inside the library?** `std::env::set_var` is undefined behavior once multiple threads exist. The synchronous `main()` function is the only safe place to call it — before the Tokio runtime (or any other thread pool) is spawned by `librefang_desktop::run`.\n\nThe search path and file precedence are handled entirely by `librefang_extensions::dotenv`.\n\n## Windows Console Behavior\n\nThe attribute:\n\n```rust\n#![cfg_attr(not(debug_assertions), windows_subsystem = \"windows\")]\n```\n\nSuppresses the allocation of a console window on Windows when building in release mode. In debug builds, the console remains visible for `println!` / `eprintln!` output. This has no effect on non-Windows platforms.\n\n## Relationship to Other Crates\n\n| Crate | Direction | Role |\n|-------|-----------|------|\n| `librefang_desktop` (library) | Called | Contains `run(server_url, local)` — the actual application bootstrapping, UI, and runtime |\n| `librefang_extensions::dotenv` | Called | Handles `.env` / secrets file discovery and loading |\n\nThis binary crate has **no incoming calls** — it is the leaf node at the top of the call graph.","other-librefang-desktop":"# Other — librefang-desktop\n\n# librefang-desktop\n\nNative desktop and mobile application for LibreFang, built on **Tauri 2.0**. This single crate produces binaries for four platforms (macOS, Windows, Linux, iOS, Android) with platform-specific feature sets gated by `cfg` attributes and Cargo features.\n\n## Purpose\n\nLibreFang is an Agent Operating System — it runs, orchestrates, and extends AI agents across channels 24×7. The desktop crate provides the native shell: a system tray, auto-update, autostart, and a windowed UI rendered from the shared React frontend bundled in `librefang-api`.\n\nOn mobile, the same crate compiles as a **thin client** that connects to a remote librefang daemon over HTTP/WebSocket. The daemon is never embedded in the mobile binary — iOS and Android cannot guarantee the uptime that cron, autodream, and channel adapters require.\n\n## Architecture\n\n```mermaid\ngraph LR\n    subgraph Desktop\n        DT[Desktop Binary] -->|embeds| Kernel[librefang-kernel]\n        DT -->|serves| API[librefang-api / React]\n        DT -->|tray / autoupdate| OS[Native OS APIs]\n    end\n\n    subgraph Mobile\n        MT[Mobile Binary] -->|HTTP/WS| Daemon[Remote librefang Daemon]\n        MT -->|renders| React[Shared React Frontend]\n    end\n```\n\n### Dependency graph\n\nThe desktop crate sits at the top of the workspace dependency tree:\n\n| Crate | Role |\n|---|---|\n| `librefang-kernel` | Core agent runtime — embedded in desktop builds |\n| `librefang-api` | HTTP/WebSocket API server + static React frontend |\n| `librefang-types` | Shared type definitions |\n| `librefang-extensions` | Extension/plugin system |\n\n## Platform targets\n\n### macOS and Windows\n\nFull feature set with no opt-in required:\n\n- **System tray icon** — native `NSStatusItem` / `Shell_NotifyIconW`, no GTK dependency.\n- **Single-instance enforcement** — `tauri-plugin-single-instance`.\n- **Autostart on login** — `tauri-plugin-autostart`.\n- **Global keyboard shortcuts** — `tauri-plugin-global-shortcut`.\n- **Auto-updater** — `tauri-plugin-updater` with passive install mode on Windows. Public key and GitHub release endpoint configured in `tauri.desktop.conf.json`.\n- **Shell plugin** — `tauri-plugin-shell` for CLI process spawning.\n\n### Linux\n\nIdentical plugin set to macOS/Windows, except the **system tray is opt-in** (see [Linux tray and GTK3](#linux-tray-and-gtk3) below).\n\n### iOS and Android\n\nCompiled-out features: system tray, single-instance, autostart, global shortcuts, auto-updater, and shell plugin. Additional mobile-only dependencies are pulled in:\n\n- `tauri-plugin-barcode-scanner` — QR-based connection wizard.\n- `keyring` — native credential storage.\n\nMobile-specific Tauri configs (`tauri.android.conf.json`, `tauri.ios.conf.json`) set the window URL to `lfconnect://localhost/` and point `frontendDist` at the shared React build in `librefang-api/static/react`.\n\nMinimum OS versions:\n\n| Platform | Minimum |\n|----------|---------|\n| iOS | 16.0 |\n| Android | API 26 (Android 8.0) |\n| macOS | 12.0 |\n\n## Cargo features\n\n| Feature | Default | Description |\n|---------|---------|-------------|\n| `default` | ✅ | Inherits `librefang-api/default` |\n| `custom-protocol` | ❌ | Production Tauri builds — activates `tauri/custom-protocol` |\n| `mobile` | ❌ | Documentation-only flag; mobile targets are cfg-gated, not feature-gated |\n| `linux-tray` | ❌ | Opts into `tauri/tray-icon` on Linux (see below) |\n\nRemoved features: `all-channels`, `mini`, `mobile-no-email` — channel adapters are now sidecars with no Rust feature gate. CI configs referencing these flags should drop the `-f` argument.\n\n## Tauri configuration files\n\nThe crate uses Tauri 2.0's layered configuration system:\n\n```\ntauri.conf.json              — base: product name, identifier, CSP, bundle settings\ntauri.desktop.conf.json      — desktop overlay: auto-updater pubkey + endpoints\ntauri.android.conf.json      — Android overlay: bundle ID, min SDK, mobile window\ntauri.ios.conf.json          — iOS overlay: bundle ID, minimum system version\n```\n\n### Content Security Policy\n\nThe desktop CSP (`tauri.conf.json`) allows:\n- `self`, `tauri:`, `ipc:` for scripts and connections\n- `http://127.0.0.1:*` and `ws://127.0.0.1:*` for local API communication\n- Google Fonts for `style-src` / `font-src`\n- `blob:` and `data:` for images and media\n- `object-src 'none'` and `base-uri 'self'` as hardening\n\n## Crate types\n\n```toml\n[lib]\ncrate-type = [\"staticlib\", \"cdylib\", \"lib\"]\n```\n\niOS requires `staticlib` (linked by Xcode) and Android requires `cdylib` (loaded by the Tauri mobile runtime). `lib` (rlib) is kept so the desktop binary in `src/main.rs` can depend on the library normally.\n\n**Trade-off**: Cargo cannot conditionalize `crate-type` on `cfg(mobile)`, so desktop builds also produce `staticlib` and `cdylib` outputs. This adds a link step costing ~10–20% extra build time on clean builds. If desktop build times become a bottleneck, this is the first place to investigate.\n\n## Linux tray and GTK3\n\nTauri 2.10's `tray-icon` feature on Linux depends on `libappindicator-rs 0.9`, which transitively pulls in eight unmaintained GTK3 crates (RUSTSEC-2024-0411 through RUSTSEC-2024-0420) plus a `glib` unsoundness issue (RUSTSEC-2024-0429).\n\nTo avoid these advisories on headless Linux servers and CI:\n\n- **Default**: `tray-icon` is **not** enabled on Linux. The app runs without a system tray.\n- **Opt-in**: Pass `--features linux-tray` to enable the tray at the cost of the GTK3 dependency chain.\n- **Future**: This will be resolved when Tauri migrates to `tray-icon 0.22+` / `ksni`, eliminating the GTK dependency. Tracked in issue #3667.\n\n## Building and running\n\n### Desktop (development)\n\n```bash\n# From the workspace root\ncargo run -p librefang-desktop\n\n# From crates/librefang-desktop/\ncargo tauri dev\n```\n\n### Desktop (production bundle)\n\n```bash\ncargo tauri build\n# Produces platform-specific bundles (dmg, msi, AppImage, deb)\n```\n\n### Android\n\n```bash\ncd crates/librefang-desktop\ncargo tauri android init   # first time only\ncargo tauri android dev    # emulator\n```\n\n### iOS (macOS only)\n\n```bash\ncd crates/librefang-desktop\ncargo tauri ios init       # first time only\ncargo tauri ios dev        # simulator\n```\n\n### Linux with system tray\n\n```bash\ncargo run -p librefang-desktop --features linux-tray\n```\n\n## Mobile release and distribution\n\n- CI builds produce signed `.aab`, `.apk`, and `.ipa` artifacts in `.github/workflows/release.yml` (jobs `mobile_android` and `mobile_ios`).\n- TestFlight and Play Internal Testing uploads are unattended in CI.\n- Upload secrets are tracked in `.github/SECRETS.md`.\n- The mobile privacy policy template is at `.github/templates/PRIVACY_MOBILE_TEMPLATE.md` — publish under `docs/src/app/privacy-mobile/` after legal review.\n- Full release procedures, version-mapping rules, and the recovery runbook for failed uploads are in `docs/src/app/operations/mobile-release/page.mdx`.\n\n## Related issues\n\n| Issue | Topic |\n|-------|-------|\n| #3351 | Mobile epic |\n| #3342 | Initial scaffold (this crate) |\n| #3343 | Mobile UX |\n| #3344 | Connection wizard + QR |\n| #3345 | CI build jobs |\n| #3348 | Distribution |\n| #3667 | Linux tray / GTK3 migration |","other-librefang-extensions-tests":"# Other — librefang-extensions-tests\n\n# librefang-extensions-tests — Vault Round-Trip Integration Tests\n\n## Overview\n\nThis module (`vault_roundtrip.rs`) is an integration test suite for the `CredentialVault` subsystem. It validates the cryptographic and API contracts that the rest of the daemon depends on for secure credential storage, without requiring an OS keyring or environment variables on the host machine.\n\nAll tests use an explicit master key and a temporary filesystem path, making them fully self-contained and safe for parallel execution.\n\n## Contracts Under Test\n\nThe test suite guards five invariants:\n\n| # | Invariant | Why it matters |\n|---|-----------|----------------|\n| 1 | `decode_master_key` requires exactly 32 bytes after base64 decoding | Prevents silent key truncation that would weaken AES-GCM encryption |\n| 2 | `decode_master_key` rejects literal 32-character ASCII input (both valid-but-short base64 and non-base64) | Guards against the operator foot-gun of confusing \"32 characters\" with \"32 bytes\" |\n| 3 | A vault encrypted under key K can only be decrypted with the same key K | AES-GCM authentication must fail loudly on key mismatch — no silent corruption |\n| 4 | The `SENTINEL_KEY` reserved internal key is invisible to `list_keys` and immutable via `set`/`remove` | Protects the boot-path verification branch (#3651) from accidental or malicious overwrite |\n| 5 | Full encrypt → persist → reload → decrypt round-trip preserves all stored entries | Validates end-to-end correctness of the file-backed vault |\n\n## Architecture\n\n```mermaid\ngraph TD\n    A[vault_roundtrip.rs] -->|calls| B[decode_master_key]\n    A -->|calls| C[CredentialVault]\n    C -->|init_with_key| D[vault.enc on tmpfs]\n    C -->|unlock_with_key| D\n    C -->|set / get / remove / list_keys| D\n    E[SENTINEL_KEY constant] -->|reserved key name| C\n    A -->|validates errors from| F[ExtensionError]\n    F -->|Vault variant| G[\"Vault(_)\"]\n    F -->|VaultKeyMismatch variant| H[\"VaultKeyMismatch { .. }\"]\n```\n\n## Test Fixtures\n\nTwo helper functions provide deterministic, reproducible test inputs:\n\n### `fixture_key_b64() -> String`\n\nReturns a base64-encoded all-zeros 32-byte key. The encoding produces a 44-character string (the same length as `openssl rand -base64 32`), which decodes back to exactly 32 bytes. Tests don't need cryptographic strength — only consistency across the round-trip.\n\n### `fixture_vault_path(tmp: &TempDir) -> PathBuf`\n\nJoins `vault.enc` to the provided temporary directory, yielding a filesystem path that is automatically cleaned up when the `TempDir` drops.\n\n## Test Cases\n\n### `decode_master_key_rejects_wrong_byte_length`\n\n**What it tests:** Invariant #1 — `decode_master_key` enforces a 32-byte decoded length.\n\n**How it works:**\n- Encodes 24 zero bytes as base64, producing a valid base64 string that decodes to 24 bytes.\n- Asserts that `decode_master_key` returns an error containing `\"Invalid key length\"`.\n- Confirms the happy path: 32 raw bytes round-trip cleanly through encode → decode.\n\n**Why it exists:** A naïve implementation might accept any base64 input and silently use a truncated key, weakening AES-256-GCM to AES-192-GCM (or worse).\n\n---\n\n### `decode_master_key_rejects_literal_32_ascii_chars`\n\n**What it tests:** Invariant #2 — the documented operator foot-gun is caught and surfaced as a structured error.\n\n**How it works:** Three sub-cases in one test:\n\n1. **32 valid base64 characters** (`\"xxxx...x\"` × 32). These decode successfully to 24 bytes. The length guard rejects it with an error mentioning both `\"Invalid key length\"` and `\"32\"`.\n\n2. **32 non-base64 characters** (`\"!!!!...!\"` × 32). Base64 decoding itself fails. The test asserts the error contains `\"decode\"` (not a panic, not a silently wrong key).\n\n3. **Correct form** — 32 raw bytes encoded as base64 produce a 44-character string. This is accepted and round-trips correctly. The test explicitly asserts the 44-character length to document the `openssl rand -base64 32` recipe.\n\n**Why it exists:** CLAUDE.md documents this as a known gotcha: operators commonly paste a 32-character ASCII string thinking it represents 32 bytes. Both failure modes (valid-but-short and invalid-alphabet) must produce structured errors.\n\n---\n\n### `vault_roundtrip_encrypt_then_decrypt_with_same_key`\n\n**What it tests:** Invariants #5 and #4 (round-trip correctness + sentinel key invisibility).\n\n**How it works — two phases:**\n\n**Phase 1 (write):**\n1. Create a fresh `CredentialVault` pointing at a temp file.\n2. Call `init_with_key` with the fixture key.\n3. Store two credentials: `OPENAI_API_KEY` and `ANTHROPIC_API_KEY`.\n4. Drop the vault — memory is zeroed; only the encrypted file survives.\n\n**Phase 2 (read):**\n1. Create a new `CredentialVault` at the same path.\n2. Call `unlock_with_key` with the same key.\n3. Assert `get` returns the original values for both keys.\n4. Assert `list_keys` contains both user keys.\n5. Assert `list_keys` does **not** contain `SENTINEL_KEY`.\n\n---\n\n### `vault_unlock_with_wrong_key_fails`\n\n**What it tests:** Invariant #3 — wrong-key decryption fails loudly.\n\n**How it works:**\n1. Initialize and write a credential under key A (all zeros).\n2. Attempt to unlock the same vault file with key B (all ones).\n3. Assert the result is an error matching either `ExtensionError::Vault(_)` or `ExtensionError::VaultKeyMismatch { .. }`.\n4. Assert the vault remains in a locked state (`!vault.is_unlocked()`).\n\n**Why both error variants are accepted:** The underlying AES-GCM authentication failure has historically been routed through both `Vault` and `VaultKeyMismatch` depending on the vault format version. The contract is \"non-`Ok`\", not a specific variant.\n\n---\n\n### `vault_rejects_writes_to_reserved_sentinel_key`\n\n**What it tests:** Invariant #4 — the sentinel key is protected from external mutation.\n\n**How it works:**\n1. Initialize a vault.\n2. Attempt `set(SENTINEL_KEY, \"attacker-payload\")` — assert it returns `ExtensionError::Vault(_)`.\n3. Attempt `remove(SENTINEL_KEY)` — assert it returns `ExtensionError::Vault(_)`.\n\n**Why it exists:** The `SENTINEL_KEY` is an internal implementation detail of the boot-path verification (#3651). Overwriting or removing it via the public API would silently break the daemon's ability to detect vault corruption or key mismatches during startup.\n\n## Dependencies\n\n| Crate | Usage |\n|-------|-------|\n| `librefang_extensions` | Provides `CredentialVault`, `decode_master_key`, and `SENTINEL_KEY` |\n| `tempfile` | Creates isolated temporary directories for each test |\n| `base64` | Constructs well-formed and intentionally malformed key inputs |\n| `zeroize` | Wraps keys and values in `Zeroizing<T>` to match production API signatures |\n\n## Relationship to Production Code\n\nThese tests exercise the **public API** of the vault module (`librefang_extensions::vault`). They do not inspect internal state or depend on implementation details. The vault under test uses real AES-GCM encryption and real file I/O — only the key source and file path are substituted with test fixtures.\n\nThe error variants asserted (`ExtensionError::Vault`, `ExtensionError::VaultKeyMismatch`) live in `librefang_extensions::ExtensionError`, making this an integration-level test rather than a unit test of an isolated function.\n\n## Running\n\n```bash\n# Run the full vault round-trip suite\ncargo test -p librefang-extensions --test vault_roundtrip\n\n# Run a single test\ncargo test -p librefang-extensions --test vault_roundtrip -- decode_master_key_rejects_literal_32_ascii_chars\n```","other-librefang-extensions":"# Other — librefang-extensions\n\n# librefang-extensions\n\nExtension and integration toolkit for LibreFang — credential vault, MCP server management, OAuth2 PKCE flows, shared HTTP client construction, and workspace environment parsing. This crate sits above `librefang-kernel` and provides the cross-cutting infrastructure that agents need but that doesn't belong in the runtime or kernel layers.\n\n## Architecture\n\n```mermaid\ngraph TD\n    subgraph \"Higher layers\"\n        API[librefang-api]\n        CLI[librefang-cli]\n        Desktop[librefang-desktop]\n    end\n\n    subgraph \"This crate\"\n        Vault[vault — CredentialVault]\n        Catalog[catalog — MCP metadata]\n        OAuth[oauth — PKCE + DCR]\n        Installer[installer — MCP lifecycle]\n        Creds[credentials — resolve/resolve_all]\n        Health[health — liveness probes]\n        HTTP[http_client — reqwest builder]\n        DotEnv[dotenv — .env parsing]\n    end\n\n    Kernel[librefang-kernel]\n    Types[librefang-types]\n\n    API --> Vault\n    API --> OAuth\n    API --> Catalog\n    API --> Installer\n    CLI --> Vault\n    CLI --> Installer\n    Desktop --> Health\n\n    Vault --> Types\n    Catalog --> Types\n    OAuth --> HTTP\n    Installer --> HTTP\n    Health --> HTTP\n    Creds --> Types\n\n    Vault -->|AES-256-GCM| Keyring[\"OS keyring / file fallback\"]\nend\n```\n\n**Dependency direction**: Nothing in this crate may import from `librefang-api`, `librefang-cli`, or `librefang-desktop`. The crate depends on `librefang-types` and `librefang-kernel` only.\n\n## Module Reference\n\n### `vault` — AES-256-GCM Credential Vault\n\nThe `CredentialVault` struct provides encrypted storage for secrets. Encryption is AES-256-GCM. The master encryption key has two storage backends, selected at compile time and runtime:\n\n| Platform | Primary backend | Fallback |\n|---|---|---|\n| Linux (glibc) | libsecret via OS keyring | File-based encrypted store |\n| Windows | Credential Manager via OS keyring | File-based encrypted store |\n| macOS | File-based (see `use_os_keyring` plumbing) | — |\n| Linux (musl) | File-based (OS keyring not compiled in) | — |\n| Android | File-based (OS keyring not compiled in) | — |\n\nThe OS keyring dependency (`keyring` crate) is target-gated in `Cargo.toml` to avoid pulling `libdbus-sys` on musl-static and Android targets where there is no usable secret-service backend. The vault transparently falls back to the file-based AES-256-GCM store when no OS keyring backend is compiled in.\n\nKey handling rules (see top-level `CLAUDE.md` for the authoritative cross-cutting rules):\n- `LIBREFANG_VAULT_KEY` environment variable can override key source\n- Constraints on key format and rotation are defined at the workspace level\n\n### `catalog` — MCP Server Catalog\n\nManages MCP server catalog metadata stored under `~/.librefang/mcp/catalog/`. This module handles reading, writing, and querying the local catalog of available MCP servers and their configurations.\n\n### `installer` — MCP Server Lifecycle\n\nHandles the install, update, and uninstall flows for MCP servers. This module orchestrates downloading, verifying, registering, and removing MCP server packages. It uses the shared HTTP client from `http_client` for network operations.\n\n### `oauth` — OAuth2 PKCE and Dynamic Client Registration\n\nImplements OAuth2 authorization with PKCE (Proof Key for Code Exchange) tailored for MCP server authentication. Supports RFC 7591 Dynamic Client Registration to programmatically register OAuth2 clients.\n\n**Important boundary**: The `McpOAuthProvider` trait lives in `librefang-runtime`. The concrete implementation lives in `librefang-api`. This module provides the OAuth2 *client* machinery — the flow ownership and callback wiring belong to higher layers. Do not add HTTP routing or callback endpoints here.\n\nCross-cutting rules for Docker callback URLs and OAuth flow ownership between the daemon and API layer are defined in the top-level `CLAUDE.md`.\n\n### `credentials` — Auth-Source Unification\n\nProvides `resolve` and `resolve_all` functions that unify multiple authentication sources into a consistent credential resolution pipeline. This lets callers request credentials without knowing whether they come from the vault, environment variables, configuration files, or other sources.\n\n### `http_client` — Shared reqwest Client Builder\n\nExposes two functions for constructing HTTP clients:\n\n- **`client_builder()`** — Returns a configured `reqwest::ClientBuilder` that callers can further customize before building. Use this when the call site needs to add custom middleware, timeouts, or TLS configuration.\n- **`new_client()`** — Returns a fully built `reqwest::Client` with sensible defaults. Use this for straightforward HTTP calls.\n\nThere is no `shared_client()` function. Use whichever of the above fits the call site.\n\nThe builder configures:\n- TLS via `rustls` with `webpki-roots` and `rustls-native-certs` for certificate verification\n- Standard user-agent and timeout defaults consistent across the project\n\n### `health` — Provider Liveness Probes\n\nProbes MCP providers for liveness and availability. Used by higher layers to determine whether a provider is reachable before attempting operations.\n\n### `dotenv` — Workspace Environment Parsing\n\nParses `.env` files in agent workspaces, making environment variables available to agent processes. Handles standard `.env` format with variable substitution and quoting rules.\n\n## Dependency Highlights\n\n| Dependency | Purpose |\n|---|---|\n| `aes-gcm`, `argon2` | Vault encryption (AES-256-GCM) and key derivation (Argon2) |\n| `keyring` | OS-native key storage (target-gated, see above) |\n| `reqwest`, `rustls`, `webpki-roots` | HTTP client with rustls TLS backend |\n| `sha2`, `hmac`, `subtle` | Cryptographic primitives for OAuth PKCE |\n| `zeroize` | Secure memory zeroing for credential material |\n| `dashmap` | Concurrent map for catalog and credential caches |\n| `base64` | Encoding for OAuth and vault operations |\n\n## Boundaries\n\n**Owns**: Vault, MCP catalog, OAuth client logic, shared HTTP client builder, `.env` parsing, plugin installer, provider health probes, credential resolution.\n\n**Does NOT own**: Kernel callback wiring, HTTP routing, channel adapters, the `McpOAuthProvider` trait definition (that's `librefang-runtime`), or its implementation (that's `librefang-api`).\n\nBefore adding code that crosses the crate boundary — especially anything touching vault keys, OAuth callback URLs, Docker networking, or the auth middleware allowlist — read the cross-cutting rules in the top-level `CLAUDE.md`. Those rules are authoritative and are not duplicated here to avoid drift.\n\n## Testing\n\nDev-dependencies include `tempfile` for filesystem-based tests, `serial_test` for tests that share global state (keyring, file-based vault), and `librefang-runtime` for integration scenarios.","other-librefang-hands-tests":"# Other — librefang-hands-tests\n\n# librefang-hands-tests — Registry Smoke Tests\n\n## Purpose\n\nThis module contains integration smoke tests that validate the `HandRegistry` public API behaves correctly when its methods are composed together. These tests are not unit tests for individual methods — they verify **cross-method invariants** and **disk persistence contracts** that previous production bugs violated (e.g., definitions present but no workspace directory, instances lingering after uninstall).\n\nThe tests require no LLM, no kernel, and no running services. They exercise pure tool-dispatch and persistence behaviour against a temporary filesystem.\n\n## Fixtures\n\nTwo constant strings provide the minimal valid inputs needed to install a hand:\n\n- **`SMOKE_HAND_TOML`** — A complete `HAND.toml` with `id = \"smoke-hand\"`, a `routing` section with an alias, and an `[agent]` block. The `category = \"data\"` value satisfies schema validation without pulling in additional dependencies.\n- **`SMOKE_SKILL_MD`** — A trivial Markdown file that serves as the skill body written to `SKILL.md`.\n\n## Test Cases\n\n### `install_activate_deactivate_uninstall_lifecycle`\n\nEnd-to-end exercise of the full hand lifecycle. The call sequence and the invariants checked at each stage are:\n\n```\nHandRegistry::new()\n  ├── list_definitions / list_instances  →  both empty\n  │\n  ├── install_from_content_persisted(home, toml, md)\n  │     ├── returns def with id \"smoke-hand\"\n  │     ├── creates home/workspaces/smoke-hand/HAND.toml on disk\n  │     ├── creates home/workspaces/smoke-hand/SKILL.md on disk\n  │     └── get_definition(\"smoke-hand\") → Some\n  │\n  ├── activate(\"smoke-hand\", HashMap::new())\n  │     ├── returns instance with status HandStatus::Active\n  │     └── list_instances → exactly one entry matching the instance\n  │\n  ├── uninstall_hand(home, \"smoke-hand\")\n  │     ├── must ERR (refused — live instance exists)\n  │     ├── get_definition still Some (state unperturbed)\n  │     └── list_instances still length 1 (state unperturbed)\n  │\n  ├── deactivate(instance_id)\n  │     ├── returns deactivated instance\n  │     └── list_instances → empty\n  │\n  └── uninstall_hand(home, \"smoke-hand\")\n        ├── succeeds (no live instances)\n        ├── get_definition → None\n        └── workspace directory physically removed from disk\n```\n\nThe key cross-method invariants this test locks in:\n\n| Invariant | Why it matters |\n|---|---|\n| Files persist to `workspaces/<id>/` after install | Daemon restarts must be able to reload state from disk |\n| `uninstall_hand` refuses while instances exist | The `DELETE /api/hands/{id}` route depends on this guard |\n| A refused uninstall leaves in-memory state untouched | Prevents partial corruption on error paths |\n| Deactivation removes the instance from `list_instances` | Ensures cleanup is complete, not just a status change |\n| Successful uninstall removes the workspace directory | Prevents orphaned disk usage |\n\nThe empty `HashMap::new()` passed to `activate` exercises the explicit-default path — equivalent to a dashboard \"activate with defaults\" action for a hand that declares no required settings.\n\n### `definitions_round_trip_through_a_disk_reload`\n\nValidates the disk-as-source-of-truth contract:\n\n1. One `HandRegistry` installs a hand via `install_from_content_persisted`.\n2. A second, independent `HandRegistry` is created (starts empty).\n3. `reload_from_disk(home)` discovers and loads the previously installed hand.\n4. `get_definition(\"smoke-hand\")` returns the correct definition on the fresh registry.\n\nThis test ensures that a daemon process restart — where a new `HandRegistry` is constructed and `reload_from_disk` is called — re-discovers all previously installed hands without needing to replay an in-memory log. The `reload_from_disk` return value `(loaded, _failed)` is asserted to report at least one successful load.\n\n## Disk Layout Contract\n\nBoth tests depend on the following filesystem layout established by `install_from_content_persisted`:\n\n```\n<home>/\n└── workspaces/\n    └── <hand-id>/\n        ├── HAND.toml\n        └── SKILL.md\n```\n\nThis layout is the contract between `install_from_content_persisted` (write side) and `reload_from_disk` (read side). Changing it requires updating both the registry implementation and these tests.\n\n## Dependencies\n\n| Crate / Module | Usage |\n|---|---|\n| `librefang_hands::registry::HandRegistry` | System under test |\n| `librefang_hands::HandStatus` | Asserting instance status after activation |\n| `tempfile` | Isolated temporary directories per test |\n\n## Running\n\n```sh\ncargo test -p librefang-hands-tests --test registry_smoke\n```\n\nThese tests are safe to run in parallel — each creates its own `tempfile::tempdir` with no shared state.","other-librefang-hands":"# Other — librefang-hands\n\n# librefang-hands\n\nCurated autonomous capability packages for LibreFang.\n\n## Overview\n\nA **Hand** is a self-contained, curated capability package that encapsulates a discrete unit of autonomous functionality. Hands serve as the primary mechanism by which LibreFang defines, distributes, and manages the skills available to the system. Each hand is independently versioned, identifiable, and loadable.\n\nThis crate provides the data structures, loading logic, registry, and validation for working with hands.\n\n## Conceptual Model\n\n```mermaid\ngraph TD\n    A[Hand Package] --> B[Manifest / Metadata]\n    A --> C[Capability Definition]\n    B --> D[UUID]\n    B --> E[Version]\n    B --> F[Timestamps]\n    G[Hand Registry] --> H[dashmap concurrent store]\n    G --> I[lookup by UUID / name]\n    J[Deserializer] --> K[TOML source]\n    J --> L[JSON source]\n    J --> A\n```\n\n## Key Responsibilities\n\n| Concern | Implementation Detail |\n|---|---|\n| **Hand identity** | Each hand carries a `uuid::Uuid` for unique identification. |\n| **Serialization formats** | Hands can be loaded from both TOML and JSON via `serde`, `toml`, and `serde_json`. |\n| **Concurrency-safe registry** | A `dashmap`-backed store allows concurrent registration and lookup of hands. |\n| **Timestamping** | `chrono` is used for creation and modification timestamps on hand metadata. |\n| **Diagnostics** | `tracing` spans and events are emitted during loading, validation, and registration. |\n| **Error handling** | `thiserror` derives structured error types for parse failures, validation errors, and registry conflicts. |\n\n## Core Components\n\n### Hand Definition\n\nThe central data structure representing a capability package. It is `Serialize`/`Deserialize`-owned and contains:\n\n- A unique identifier (`Uuid`)\n- A human-readable name\n- A version string\n- Creation and last-modified timestamps\n- Capability-specific configuration or payload\n\n### Hand Registry\n\nA concurrency-safe collection (`DashMap`-backed) that stores loaded hands. Supports:\n\n- Insertion of new hands with conflict detection\n- Lookup by UUID or by name\n- Removal of hands\n\n### Loader / Deserializer\n\nReads hand definitions from TOML or JSON sources, validates them, and produces ready-to-register `Hand` instances. Invalid or malformed input results in structured errors rather than panics.\n\n### Error Types\n\nCustom error enum covering:\n\n- TOML parse errors\n- JSON parse errors\n- Schema validation failures (missing required fields, invalid values)\n- Registry conflicts (duplicate UUID or name)\n\n## Integration with LibreFang\n\n```text\nlibrefang-types       ← shared type definitions used across crates\n        ↑\nlibrefang-hands       ← this crate\n        ↓ (dev-dependency only)\nlibrefang-runtime     ← used in tests to verify hands integrate with the runtime\n```\n\n- **`librefang-types`**: Provides shared types that hands reference (e.g., common enums, result aliases).\n- **`librefang-runtime`**: Not a production dependency—used exclusively in tests to confirm that loaded hands can be handed off to the runtime correctly.\n\n## Loading a Hand\n\nHands are typically loaded from a TOML manifest file or a JSON blob. The general flow is:\n\n1. **Read** the source content (file, string, etc.).\n2. **Deserialize** into the hand data structure using the appropriate format.\n3. **Validate** required fields and constraints.\n4. **Register** in the hand registry for later lookup.\n\nErrors at any stage produce a typed error carrying context about what failed and why.\n\n## Testing\n\nTests use:\n\n- **`tempfile`** — to create temporary directories and files for filesystem-based loading tests.\n- **`serial_test`** — to serialize tests that share global registry state, preventing race conditions.\n- **`librefang-runtime`** — to verify end-to-end integration of loaded hands with the runtime environment.","other-librefang-http":"# Other — librefang-http\n\n# librefang-http\n\nShared HTTP client builder providing consistent TLS configuration and proxy support across the LibreFang workspace.\n\n## Purpose\n\nThis crate centralizes `reqwest` client construction so that every component in LibreFang——makes HTTP requests with identical TLS behavior and proxy handling. Any crate that needs to speak HTTP depends on this library rather than building its own client, preventing certificate trust mismatches and duplicated boilerplate.\n\n## Dependencies\n\n| Dependency | Role |\n|---|---|\n| `reqwest` | HTTP client runtime (workspace-managed version) |\n| `rustls` | TLS backend — avoids OpenSSL linkage |\n| `webpki-roots` | Mozilla's bundled CA certificates |\n| `rustls-native-certs` | Loads system certificate store as a fallback |\n| `tracing` | Structured logging for TLS and proxy diagnostics |\n| `librefang-types` | Shared domain types used across the workspace |\n\n## TLS Certificate Strategy\n\nThe crate implements a two-tier certificate trust chain:\n\n1. **Primary** — `webpki-roots` provides a pinned set of well-known Mozilla CA certificates. This guarantees consistent behavior regardless of the host OS.\n2. **Fallback** — `rustls-native-certs` loads whatever CA bundle the operating system provides. This covers corporate environments with private CAs, self-signed infrastructure, or non-standard root certificates.\n\nBoth pools are merged into a single `rustls::RootCertStore` so that the resulting `reqwest::Client` trusts the union of Mozilla's roots and the system's roots. If native cert loading fails entirely, the client still functions with the webpki roots alone.\n\n## Proxy Support\n\nProxies are left to `reqwest`'s default behavior, which respects the standard `HTTP_PROXY`, `HTTPS_PROXY`, and `NO_PROXY` environment variables. This crate does not hardcode proxy configuration, keeping it flexible for different deployment scenarios.\n\n## Relationship to the Workspace\n\n```mermaid\ngraph TD\n    A[librefang-types] --> B[librefang-http]\n    B --> C[librefang-resolver]\n    B --> D[Other LibreFang crates]\n    B --> E[reqwest + rustls]\n```\n\n`librefang-http` sits between the shared types layer and any crate that makes outbound HTTP calls. It consumes types from `librefang-types` and exposes a pre-configured `reqwest::Client` (or builder) that downstream crates use directly.\n\n## Usage Pattern\n\nDownstream crates add `librefang-http` as a dependency and call its builder to obtain a ready-to-use client. The returned client already has:\n\n- A `rustls`-backed TLS connector (no OpenSSL required)\n- The merged certificate store described above\n- Sensient default timeouts and redirect policies from the workspace's `reqwest` version\n- `tracing` instrumentation for connection and TLS events\n\nConsumers should not need to touch TLS configuration themselves.\n\n## Build Notes\n\nBecause this crate uses `rustls` exclusively, the workspace avoids an OpenSSL build dependency. This simplifies cross-compilation and reduces the binary's attack surface. Ensure the workspace `reqwest` dependency is configured with `default-features = false` and `features = [\"rustls-tls\"]` (or equivalent) so that no OpenSSL backend is accidentally pulled in through feature unification.","other-librefang-import-tests":"# Other — librefang-import-tests\n\n# librefang-import/tests/idempotency.rs\n\nEnd-to-end integration tests verifying that the migration crate produces deterministic, recoverable results at the filesystem level.\n\n## Purpose\n\nUnit tests inside `src/openclaw.rs` already assert that `report.imported.is_empty()` on a second migration run. This test module validates the **stronger contract that callers actually depend on**: the bytes on disk. It covers three concerns raised in issue #3407:\n\n1. **Idempotency** — A second migration run produces a byte-identical destination tree (no duplicate sessions, no clobbered configs, no rewritten timestamps).\n2. **Partial-write recovery** — If a migration is killed mid-write (simulated by deleting a file), re-running the migration recreates the missing file without corrupting surviving entries.\n3. **Forward compatibility** — A prior major version's `KernelConfig` TOML shape still deserialises into the current types and round-trips through `run_migrations`.\n\n## Test Architecture\n\n```mermaid\ngraph TD\n    subgraph \"Test Helpers\"\n        ST[snapshot_tree]\n        WD[walkdir_iter]\n        WOC[write_openclaw_workspace]\n        WOF[write_openfang_workspace]\n        OPT[opts]\n    end\n    subgraph \"Idempotency Tests\"\n        A[openclaw_second_run_is_byte_identical]\n        B[openfang_second_run_is_byte_identical]\n    end\n    subgraph \"Recovery Tests\"\n        C[openclaw_partial_write_is_recoverable]\n        D[openfang_partial_write_is_recoverable]\n    end\n    subgraph \"Forward-Compat Tests\"\n        E[legacy_v1_config_parses_into_current_kernel_config]\n        F[legacy_v1_config_migrates_forward_to_current_version]\n    end\n    A --> ST\n    B --> ST\n    C --> ST\n    D --> ST\n    ST --> WD\n    A --> WOC\n    C --> WOC\n    B --> WOF\n    D --> WOF\n    F -->|calls| RM[run_migrations]\n```\n\n## Helper Functions\n\n### `snapshot_tree(root: &Path) -> BTreeMap<PathBuf, Vec<u8>>`\n\nReads every regular file under `root` and returns a sorted map of relative path → byte contents. Using `BTreeMap` guarantees deterministic iteration orde
