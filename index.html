groq\"\nmodel = \"llama-3.3-70b-versatile\"\ntemperature = 0.3\n```\n\nThe `is_multi_agent()` method returns `true` when `agents.len() > 1`.\n\n### Wrapped Format\n\nHAND.toml files may also use a `[hand]` wrapper section:\n\n```toml\n[hand]\nid = \"clip\"\nname = \"Clip Maker\"\n# ... all fields under [hand]\n```\n\nThe parser tries flat format first, then falls back to wrapped format.\n\n## Legacy Format Compatibility\n\nOlder HAND.toml files use flat agent fields at the top level of `[agent]` instead of a nested `[agent.model]` table:\n\n```toml\n[agent]\nname = \"old-style\"\nprovider = \"anthropic\"      # ← flat: should be under [agent.model]\nmodel = \"claude-3\"\nsystem_prompt = \"...\"\nmax_tokens = 4096\ntemperature = 0.7\n```\n\n`parse_single_agent_section()` detects whether a `model` sub-table exists and routes to either `AgentManifest::deserialize()` (nested) or `LegacyHandAgentConfig::deserialize()` (flat). The `normalize_flat_to_nested()` function performs the same conversion for base templates before deep-merging.\n\n## Base Template Resolution\n\nAgents in multi-agent hands can reference a shared template via `base`, then override only what differs:\n\n```toml\n[agents.writer]\ncoordinator = true\nbase = \"my-writer\"          # loads agents/my-writer/agent.toml\n\n[agents.writer.model]\nsystem_prompt = \"You are a blog post writer.\"  # overrides base\n```\n\nThe resolution flow:\n\n1. `parse_multi_agent_entry()` reads the `base` field and validates it contains no path separators (preventing traversal attacks).\n2. Loads `{agents_dir}/{base}/agent.toml` and parses it as a `toml::Value`.\n3. Calls `normalize_flat_to_nested()` to ensure the base is in nested format.\n4. Strips hand-only fields (`coordinator`, `invoke_hint`, `base`) from the overlay.\n5. Calls `deep_merge_toml()` — overlay fields win over base fields; tables merge recursively; scalars and arrays in overlay replace base.\n6. Parses the merged result via `parse_single_agent_section()`.\n\nTemplate resolution requires filesystem access, so it goes through `parse_hand_definition()` (which accepts `agents_dir: Option<&Path>`) rather than the `Deserialize` impl.\n\n## The Registry (`HandRegistry`)\n\nA concurrent-safe store using `DashMap` for lock-free reads:\n\n| Field | Type | Purpose |\n|---|---|---|\n| `definitions` | `DashMap<String, HandDefinition>` | All known hand blueprints |\n| `instances` | `DashMap<Uuid, HandInstance>` | Active/paused/error instances |\n| `agent_index` | `DashMap<String, Uuid>` | Reverse lookup: `agent_id → instance_id` |\n| `active_index` | `DashMap<String, Uuid>` | Reverse lookup: `hand_id → instance_id` |\n| `activate_lock` | `Mutex<()>` | Serializes check-then-insert to prevent duplicate activations |\n| `persist_lock` | `Mutex<()>` | Serializes writes to `hand_state.json` |\n\n### Hand Discovery\n\n`reload_from_disk()` scans two directories for subdirectories containing `HAND.toml`:\n\n1. `{home_dir}/registry/hands/` — read-only, synced from the shared registry tarball\n2. `{home_dir}/workspaces/` — user-writable, where `install_from_content_persisted()` writes\n\nRegistry entries take precedence on id collisions (scanned first). Per-agent skill files matching `SKILL-{role}.md` are loaded alongside the shared `SKILL.md`.\n\n### Install Methods\n\n| Method | Use Case | Base Templates |\n|---|---|---|\n| `install_from_path()` | Load from a local directory | ✅ Resolved via `home_dir/registry/agents/` |\n| `install_from_content()` | API-based install from raw TOML | ❌ Rejected — no filesystem access |\n| `install_from_content_persisted()` | API install + persist to `workspaces/` | ✅ Resolved via `home_dir/registry/agents/` |\n\n### Uninstall\n\n`uninstall_hand()` removes a user-installed hand (living under `workspaces/`). Built-in hands (under `registry/hands/`) are refused — they'd be recreated on the next registry sync. Active instances must be deactivated first.\n\n## Lifecycle\n\n```mermaid\nstateDiagram-v2\n    [*] --> Active[\"Active:\"] activate()\n    Active --> Paused[\"Paused:\"] pause()\n    Paused --> Active[\"Active:\"] resume()\n    Active --> Error[\"Error:\"] set_error()\n    Error --> Active[\"Active:\"] resume() ¹\n    Active --> Inactive[\"Inactive:\"] deactivate()\n    Paused --> Inactive[\"Inactive:\"] deactivate()\n    Inactive --> [*]\n```\n\n¹ Error-to-Active requires kernel-level reactivation; `resume()` sets status to Active.\n\nKey methods:\n\n- **`activate(hand_id, config)`** — Creates a `HandInstance`, rejects if the hand is already active. The kernel then spawns agents and calls `set_agents()`.\n- **`activate_with_id(...)`** — Restores a persisted instance with a specific UUID and optional preserved timestamps.\n- **`deactivate(instance_id)`** — Removes the instance and cleans up reverse indexes.\n- **`pause(instance_id)` / `resume(instance_id)`** — Status transitions that update `active_index`.\n- **`set_agents(instance_id, agent_ids, coordinator_role)`** — Called by the kernel after spawning. Populates `agent_ids`, updates `agent_index`.\n- **`set_error(instance_id, message)`** — Marks an instance as errored.\n\n### Coordinator Role Resolution\n\n`HandInstance::normalize_coordinator_role()` determines which agent receives user messages:\n\n1. If `coordinator_role` is explicitly set and the role exists in `agent_ids`, use it.\n2. If only one agent, use it.\n3. If `\"main\"` exists, use it.\n4. Fall back to the first entry by BTreeMap order.\n\n## State Persistence\n\nHand state is persisted to `hand_state.json` so it survives daemon restarts. The current format is **v5**.\n\n### Version History\n\n| Version | Changes |\n|---|---|\n| v1 | Bare JSON array of instances, single `agent_id` |\n| v2 | `{ version, instances }` wrapper, still single-agent |\n| v3 | Multi-agent: `agent_ids: BTreeMap<role, AgentId>`, `coordinator_role` |\n| v4 | Adds `activated_at` / `updated_at` timestamps |\n| v5 | Adds `agent_runtime_overrides` for dashboard-edited model config |\n\n### Backward Compatibility\n\n- All new fields use `#[serde(default)]` and `skip_serializing_if`, so a v5 daemon can load v1–v4 state files.\n- A v4 daemon loading a v5 file silently drops `agent_runtime_overrides` (it serializes with `skip_serializing_if = \"BTreeMap::is_empty\"`).\n- Legacy `config.__model_overrides__` blobs are migrated into `agent_runtime_overrides` via `legacy_agent_runtime_overrides()`.\n\n### Atomic Writes\n\n`atomic_write_json()` writes to a temp file, syncs to disk, renames over the target, then fsyncs the parent directory (unix-only) for crash safety.\n\n### Load Behavior\n\n`load_state()` restores Active and Paused instances. Error and Inactive instances are skipped with an info log. The returned `HandStateEntry` objects include `old_agent_ids` and `instance_id` so the kernel can reassign cron jobs and regenerate deterministic agent IDs.\n\n## Requirements Checking\n\n`check_requirements()` evaluates each `HandRequirement` against the runtime environment:\n\n| `RequirementType` | Check logic |\n|---|---|\n| `Binary` | `which_binary()` on PATH. Special cases: `python3` runs the binary and checks version output; `chromium` tries multiple binary names and platform paths. |\n| `EnvVar` / `ApiKey` | `std::env::var()` is set and non-empty |\n| `AnyEnvVar` | Comma-separated list; any one being set passes |\n\nOptional requirements (`optional: true`) don't block activation but contribute to the `degraded` flag in `readiness()`.\n\n### `HandReadiness`\n\nCombines requirement checks with activation state:\n\n- `requirements_met` — all non-optional requirements satisfied\n- `active` — at least one Active instance exists\n- `degraded` — active but some requirements (optional or not) are unmet\n\n## Settings Resolution\n\n`resolve_settings()` takes a hand's settings schema and user config, producing:\n\n- **`prompt_block`** — Markdown summary appended to the system prompt (e.g. `## User Configuration\\n- STT: Groq (groq)`)\n- **`env_vars`** — Env var names the agent's subprocess should have access to (e.g. `[\"GROQ_API_KEY\"]`)\n\nFor Select-type settings, the matched option's `provider_env` is collected. For Text-type settings with an `env_var` field, that env var is collected. Toggles produce human-readable Enabled/Disabled labels.\n\n### Settings Availability\n\n`check_settings_availability()` returns per-option availability status (checking `provider_env` and `binary` fields) and applies i18n label/description overrides based on the requested language.\n\n## Internationalization\n\nHands declare localized strings under `[i18n.{lang}]`:\n\n```toml\n[i18n.zh]\nname = \"线索生成\"\ndescription = \"自主线索生成\"\n\n[i18n.zh.agents.main]\nname = \"主协调器\"\n\n[i18n.zh.settings.target_industry]\nlabel = \"目标行业\"\n```\n\nAll i18n fields are optional — hands work without any `[i18n.*]` section. Missing translations fall back to English defaults.\n\n## Error Handling\n\n```rust\npub enum HandError {\n    NotFound(String),           // Hand definition not found\n    AlreadyActive(String),      // Hand already has an active instance\n    AlreadyRegistered(String),  // Duplicate hand ID on install\n    BuiltinHand(String),        // Cannot uninstall built-in hand\n    InstanceNotFound(Uuid),     // Instance ID doesn't exist\n    ActivationFailed(String),   // Instance creation failed\n    TomlParse(String),          // HAND.toml parse error\n    Io(std::io::Error),         // Filesystem error\n    Config(String),             // Configuration error\n}\n```\n\n## Kernel Integration Points\n\nThe kernel interacts with this module through several pathways:\n\n1. **Startup** — `reload_from_disk()` discovers hands; `load_state()` restores persisted instances; the kernel re-spawns agents using `HandStateEntry.old_agent_ids`.\n2. **Activation** — Kernel calls `activate()`, spawns agents per the `HandDefinition.agents` manifests, then calls `set_agents()` with the resulting `AgentId`s.\n3. **Settings** — `apply_settings_block_to_manifest()` (kernel) calls `resolve_settings()` to build the prompt block and env vars for agent configuration.\n4. **Multi-agent dispatch** — `apply_team_block_to_manifest()` (kernel) checks `is_multi_agent()` to configure inter-agent routing.\n5. **Agent lookup** — `resolve_hand_agent()` and `hand_instance_status()` (HTTP routes) use `HandInstance::agent_id()` and `find_by_agent()` for request routing.\n6. **Runtime overrides** — The dashboard edits model/provider per agent role via `update_agent_runtime_override()` / `merge_agent_runtime_override()` / `clear_agent_runtime_override()`. These are persisted in v5 state and applied when the kernel rebuilds agent manifests on restart.","http-client":"# HTTP Client\n\n# HTTP Client (`librefang-http`)\n\nCentralized HTTP client construction with proxy support, TLS fallback to bundled CA roots, and timeouts. All outbound HTTP traffic in the codebase routes through this module to ensure consistent proxy handling and TLS configuration.\n\n## Architecture\n\n```mermaid\ngraph TD\n    A[\"init_proxy(ProxyConfig)\"] -->|\"writes\"| B[GLOBAL_PROXY RwLock]\n    A -->|\"bootstrap only\"| C[Env Vars HTTP_PROXY etc.]\n    D[\"tls_config()\"] -->|\"OnceLock cached\"| E[ClientConfig rustls + webpki-roots + native-certs]\n    F[\"proxied_client_builder()\"] --> G[\"build_http_client(active_proxy())\"]\n    G --> D\n    G --> B\n    G --> H[reqwest::ClientBuilder]\n```\n\n## Initialization Sequence\n\nAt daemon startup, before the Tokio runtime spawns worker threads:\n\n1. **Call `init_proxy(cfg)`** once with the `[proxy]` section from `config.toml`. This:\n   - Stores the config in a global `RwLock<Option<ProxyConfig>>`.\n   - Exports proxy values as environment variables (`HTTP_PROXY`, `HTTPS_PROXY`, `NO_PROXY`) during the initial bootstrap call only, because `std::env::set_var` is unsound in a multi-threaded context. Subsequent hot-reload calls update `GLOBAL_PROXY` without touching env vars.\n   - Validates proxy URL schemes, logging a warning for invalid URLs (valid: `http://`, `https://`, `socks5://`, `socks5h://`).\n\n2. **TLS is lazily initialized** on first client build via `tls_config()`, which returns a cached `rustls::ClientConfig`.\n\nNo further setup is required. All downstream code calls `proxied_client()` or `proxied_client_builder()` to get a ready-to-use client.\n\n## TLS Configuration\n\nThe TLS stack solves a specific problem: on minimal environments (musl builds on Termux/Android, minimal Docker images), system CA certificates may be absent or incomplete, causing `reqwest`'s default TLS initialization to panic.\n\n`init_tls_config()` builds the root certificate store in two steps:\n\n1. **Bundled Mozilla CA roots** via `webpki_roots::TLS_SERVER_ROOTS` — always present, covering all major public CAs.\n2. **System CA certificates** via `rustls_native_certs::load_native_certs()` — adds organization-internal and self-signed CAs without requiring a librefang release.\n\nThe result is cached in a `OnceLock<rustls::ClientConfig>` and cloned for each client. The AWS LC RS crypto provider is used via `rustls::crypto::aws_lc_rs::default_provider()`.\n\nUse `tls_config()` directly if you need the `rustls::ClientConfig` for a custom client (as `librefang-cli` does).\n\n## Public API\n\n### Proxy Configuration\n\n| Function | Description |\n|---|---|\n| `init_proxy(cfg: ProxyConfig)` | Set or hot-reload the global proxy config. Safe to call multiple times. |\n| `active_proxy() -> ProxyConfig` | Read the current global proxy config. Returns `Default::default()` if uninitialized. |\n\n### Client Constructors\n\n| Function | Returns | Use When |\n|---|---|---|\n| `proxied_client()` | `reqwest::Client` | You need a ready client and are fine with defaults. |\n| `proxied_client_builder()` | `reqwest::ClientBuilder` | You need to customize timeouts, headers, etc. before building. |\n| `proxied_client_fallback()` | `reqwest::Client` | A per-provider proxy override failed; adds a 300s total timeout as a safety net. |\n| `proxied_client_with_override(url)` | `reqwest::Result<reqwest::Client>` | A specific provider has its own proxy URL. Returns `Err` on invalid URLs — never silently falls back. |\n| `build_http_client(proxy)` | `reqwest::ClientBuilder` | You have a `ProxyConfig` already and want to bypass the global state. |\n| `client_builder()` | `reqwest::ClientBuilder` | Backward-compatible alias for `proxied_client_builder()`. |\n| `new_client()` | `reqwest::Client` | Backward-compatible alias for `proxied_client()`. |\n\n### TLS\n\n| Function | Returns | Description |\n|---|---|---|\n| `tls_config()` | `rustls::ClientConfig` | Cached TLS config with bundled + system CA roots. |\n\n## Proxy Resolution Order\n\nWhen building a client via `build_http_client`:\n\n1. **Explicit `ProxyConfig` fields** — if `http_proxy` or `https_proxy` is `Some(url)` in the config, it's applied directly to the builder via `reqwest::Proxy::http(url)` / `reqwest::Proxy::https(url)`.\n2. **Environment variable fallback** — when a config field is `None`, reqwest's built-in env var detection reads `HTTP_PROXY` / `HTTPS_PROXY` / `NO_PROXY` automatically. Since `init_proxy` exports config values to env vars at bootstrap, this covers crates that build their own clients independently.\n3. **NoProxy filter** — only set from explicit `ProxyConfig.no_proxy`. Not applied when the field is `None`, avoiding conflicts with reqwest's env var detection.\n\nThis design avoids double-applying proxy settings while ensuring all code paths pick up the configured proxy.\n\n## Timeouts\n\nDefault timeouts are baked into every client builder to prevent stalled upstreams from wedging the agent loop:\n\n| Timeout | Duration | Scope |\n|---|---|---|\n| `connect_timeout` | 30s | TCP + TLS handshake per request |\n| `read_timeout` | 300s | Per-read inactivity (not total request time). Streaming LLM responses stay alive as long as tokens arrive. |\n| `timeout` (fallback client only) | 300s | Total per-request budget, applied only by `proxied_client_fallback()`. |\n\nCallers can override these on the `ClientBuilder` returned by `proxied_client_builder()`.\n\n## User Agent\n\nAll clients set `User-Agent: librefang/<version>` via `concat!(\"librefang/\", env!(\"CARGO_PKG_VERSION\"))`.\n\n## Thread Safety\n\n- **`GLOBAL_PROXY`** — protected by `RwLock`. `init_proxy` takes a write lock; `active_proxy` takes a read lock. Hot-reload calls overwrite the value safely.\n- **`TLS_CONFIG`** — `OnceLock` ensures single initialization. Cloning the `ClientConfig` is cheap.\n- **Environment variables** — only mutated during the synchronous bootstrap phase (before Tokio runtime starts). Hot-reload skips `set_var` entirely.\n\n## Usage Examples\n\n### Basic: get a client for an HTTP request\n\n```rust\nlet client = librefang_http::proxied_client();\nlet resp = client.get(\"https://api.example.com/health\").send().await?;\n```\n\n### Custom: adjust timeouts before building\n\n```rust\nlet client = librefang_http::proxied_client_builder()\n    .timeout(std::time::Duration::from_secs(60))\n    .build()?;\n```\n\n### Per-provider proxy override with fallback\n\n```rust\nmatch librefang_http::proxied_client_with_override(&provider.proxy_url) {\n    Ok(client) => client,\n    Err(e) => {\n        tracing::warn!(\"invalid proxy for provider {}: {e}\", provider.id);\n        librefang_http::proxied_client_fallback()\n    }\n}\n```\n\n### Direct TLS config for a custom client\n\n```rust\nlet tls = librefang_http::tls_config();\nlet client = reqwest::Client::builder()\n    .use_preconfigured_tls(tls)\n    .build()?;\n```\n\n## Consumers Across the Codebase\n\nThis module is a leaf dependency used pervasively:\n\n- **Provider health probing** — `probe_client` in `librefang-runtime/src/provider_health.rs`\n- **OAuth flows** — Copilot device flow, ChatGPT device auth, MCP OAuth discovery\n- **Media transcription** — Whisper, Gemini, ElevenLabs integrations in `librefang-runtime-media`\n- **Plugin management** — installation, updates, registry search\n- **Tool execution** — web fetch, web search, location lookups\n- **Image generation** — `librefang-runtime/src/image_gen.rs`\n- **Webhook testing** — `src/routes/webhooks.rs`\n- **Cron bridge** — response delivery, fan-out HTTP clients\n- **CLI** — `librefang-cli` uses `tls_config()` directly for its own client construction","kernel-librefang-kernel-handle-src":"# Kernel — librefang-kernel-handle-src\n\n# librefang-kernel-handle\n\nThe runtime↔kernel seam. This crate defines the trait surface that the agent runtime calls into, and the concrete kernel implements. It is the *only* crate both sides depend on — keeping it free of kernel internals (no SQLite, no driver constructors, no config structs) so the boundary stays narrow and mockable.\n\n## Background\n\nPrior to issue #3746 the entire kernel surface lived in a single `KernelHandle` trait with 50+ methods spanning 14 unrelated domains. That made it impossible to express narrow capability requirements, and test stubs had to fake the entire kernel even when they only needed memory access.\n\nThe crate now exposes **19 role traits**, one per domain, plus a `KernelHandle` supertrait that requires all of them. A blanket impl means any type implementing every role trait automatically satisfies `KernelHandle`, so the 117+ existing `Arc<dyn KernelHandle>` call sites continue to compile unchanged. New code should take narrower bounds (e.g. `T: ApprovalGate + Send + Sync`).\n\n## Architecture\n\n```mermaid\ngraph TD\n    subgraph \"librefang-kernel-handle (this crate)\"\n        KH[KernelHandle supertrait]\n        AC[AgentControl]\n        MA[MemoryAccess]\n        WA[WikiAccess]\n        TQ[TaskQueue]\n        EB[EventBus]\n        KG[KnowledgeGraph]\n        CC[CronControl]\n        AG[ApprovalGate]\n        HC[HandsControl]\n        A2A[A2ARegistry]\n        CS[ChannelSender]\n        PS[PromptStore]\n        WR[WorkflowRunner]\n        GC[GoalControl]\n        TP[ToolPolicy]\n        AA[ApiAuth]\n        SW[SessionWriter]\n        FB[AcpFsBridge]\n        TB[AcpTerminalBridge]\n        CQ[CatalogQuery]\n    end\n\n    KH --- AC & MA & WA & TQ & EB & KG & CC & AG & HC & A2A & CS & PS & WR & GC & TP & AA & SW & FB & TB & CQ\n\n    RT[\"librefang-runtime<br/>(caller)\"] -->|\"depends on\"| KH\n    KR[\"librefang-kernel<br/>(implementor)\"] -->|\"impls all role traits\"| KH\n```\n\n## Error model\n\nAll trait methods return `KernelResult<T>`, an alias for `Result<T, KernelOpError>`.\n\n`KernelOpError` is a re-export of `librefang_types::error::LibreFangError` — the workspace-wide structured error enum. This was intentional (#3541): before the migration callers crossing the runtime↔kernel seam received `Result<_, String>`, losing variant information and forcing substring matching. The shared enum means every layer (runtime, kernel, API) works with the same vocabulary.\n\nCommon variants you'll encounter:\n- `Unavailable(_)` — capability not wired (stub kernel, feature flag off)\n- `NotFound(_)` — agent/session/task missing\n- `Conflict(_)` — optimistic-lock failure (wiki writes, task claim races)\n\n## Role trait reference\n\nEach trait is `Send + Sync`. Async methods use `#[async_trait]`. Methods that represent optional capabilities have defaults returning `Unavailable` errors or no-op values, so stub implementations only need to fill in the methods they care about.\n\n### 1. `AgentControl`\n\nAgent lifecycle, inter-agent messaging, listing, heartbeats, and forked one-shot calls.\n\n| Method | Notes |\n|--------|-------|\n| `spawn_agent` | Create an agent from a TOML manifest |\n| `spawn_agent_checked` | Same, but validates child capabilities against `parent_caps` |\n| `send_to_agent` | Fire a message to another agent, await response |\n| `send_to_agent_as` | Includes `parent_agent_id` for cancel-cascade propagation (#3044) |\n| `send_to_agent_with_key` | Pins callee to a deterministic session derived from `conversation_key` |\n| `send_to_agent_as_with_key` | Combines parent cascade + session pinning |\n| `list_agents` / `find_agents` | Discovery (name/tag/tool matching) |\n| `kill_agent` | Terminate by ID |\n| `touch_heartbeat` | Refresh `last_active` during long LLM calls |\n| `fire_agent_step` | External hook at each agent loop iteration |\n| `run_forked_agent_oneshot` | Structured-output primitive — drains a forked streaming turn into a single text response. Default: `Unavailable` |\n| `max_agent_call_depth` | Config-derived recursion limit (default 5) |\n\n### 2. `MemoryAccess`\n\nPer-agent key/value memory with optional peer scoping.\n\n**Scoping rules** — `agent_id: Some(uuid)` scopes to that agent's namespace. `None` uses the shared namespace (internal kernel subsystems). `peer_id: Some(id)` further scopes within a peer.\n\n| Method | Notes |\n|--------|-------|\n| `memory_store` / `memory_recall` / `memory_list` | CRUD with agent + peer scoping |\n| `memory_acl_for_sender` | Per-user RBAC resolution (#3054). Returns `None` when RBAC is disabled |\n\n### 3. `WikiAccess`\n\nDurable markdown knowledge vault (#3329). Defaults return `Unavailable(\"wiki\")` so test stubs compile when the wiki feature is off.\n\n| Method | Notes |\n|--------|-------|\n| `wiki_get` | Fetch a page; returns `{ topic, frontmatter, body }` |\n| `wiki_search` | Substring search, sorted by score |\n| `wiki_write` | Create/update with provenance chain. `force = false` refuses silent overwrites via mtime/sha256 conflict detection |\n\n### 4. `TaskQueue`\n\nShared task queue: post, claim, complete, list, delete, retry, status updates.\n\n### 5. `EventBus`\n\nSingle method: `publish_event`. Fire-and-forget custom events for proactive triggers.\n\n### 6. `KnowledgeGraph`\n\nEntity/relation insertion and pattern query. Takes `entity` and `relation` by reference (#3553) so callers retain ownership for retry paths.\n\n### 7. `CronControl`\n\nAgent-owned scheduled jobs: `cron_create`, `cron_list`, `cron_cancel`. All default to `Unavailable(\"Cron scheduler\")`.\n\n### 8. `ApprovalGate`\n\nApproval policy and lifecycle:\n\n| Method | Notes |\n|--------|-------|\n| `requires_approval` | Simple policy check |\n| `requires_approval_with_context` | Context-aware (sender + channel) |\n| `is_tool_denied_with_context` | Hard deny check |\n| `resolve_user_tool_decision` | Per-user RBAC gate (returns `Allow` / `Deny` / `NeedsApproval`). Default: `Allow` |\n| `request_approval` | Blocking approval wait |\n| `submit_tool_approval` / `resolve_tool_approval` / `get_approval_status` | Non-blocking approval lifecycle |\n\n### 9. `HandsControl`\n\nSpecialized-agent (\"Hand\") lifecycle: `hand_list`, `hand_install`, `hand_activate`, `hand_status`, `hand_deactivate`.\n\n### 10. `A2ARegistry`\n\nRead-only directory of discovered external A2A agents. `list_a2a_agents` returns `(name, url)` pairs.\n\n### 11. `ChannelSender`\n\nOutbound channel adapters — text, media, file, poll — plus group roster management and channel-owner resolution.\n\nKey detail: `send_channel_file_data` takes `bytes::Bytes` (#3553) so wrapping layers (metering, retry, fan-out) clone the handle without copying the underlying buffer.\n\n### 12. `PromptStore`\n\nPrompt versioning, experiments, and auto-tracking. All mutating methods default to `Unavailable`; read methods default to empty/`None`.\n\n### 13. `WorkflowRunner`\n\nDeclarative workflow execution. Returns structured types (not raw JSON):\n\n- **`WorkflowSummary`** — registered workflow metadata\n- **`WorkflowDescription`** — input schema + step names for discovery (#4982)\n- **`WorkflowInputParam`** — typed parameter descriptor (`string | number | boolean | file | image | agent_id`)\n- **`WorkflowRunSummary`** — run state + per-step `StepOutputSummary`\n\nAll types are `#[non_exhaustive]` and constructed via `new()` methods. Future field additions use `with_<field>(self, …)` setters on the constructors so downstream code doesn't break.\n\n| Method | Notes |\n|--------|-------|\n| `run_workflow` | Synchronous run, returns `(run_id, output)` |\n| `start_workflow_async` | Fire-and-forget, returns `run_id` immediately |\n| `start_workflow_async_tracked` | Registers async-task tracker entry for completion events (#4983) |\n| `describe_workflow` | Input schema discovery (#4982 gap 2) |\n| `get_workflow_run` | Status polling |\n| `cancel_workflow_run` | Cancellation |\n\n### 14. `GoalControl`\n\nList active goals and update status/progress.\n\n### 15. `ToolPolicy`\n\nRead-side tool execution config: timeouts (global + per-tool glob matching), workspace prefixes (read-only + named), skill env passthrough policy, channel download directories, file-read deduplication toggle, upload directory resolution.\n\n### 16. `ApiAuth`\n\nAtomic snapshot of auth config fields via `auth_snapshot() -> ApiAuthSnapshot`. Returns owned values so the snapshot is independent of the kernel's lifetime. Used by the HTTP server to build middleware token tables.\n\n### 17. `SessionWriter`\n\nPre-inject content blocks into agent sessions (attachment uploads, channel message mirroring). **Blocking I/O** — current implementation calls `MemorySubstrate::save_session` synchronously; callers in async contexts should wrap in `spawn_blocking` (#3579 will make this async).\n\n### 18. `AcpFsBridge`\n\nEditor-backed file I/O via the Agent Client Protocol (#3313). Manages per-session `AcpFsClient` registrations. Runtime tools should treat `Unavailable` as \"fall back to local filesystem.\"\n\n### 19. `AcpTerminalBridge`\n\nEditor-backed terminal commands via ACP. Manages per-session `AcpTerminalClient` registrations. Returns `AcpTerminalRunResult` with output, truncation flag, exit code/signal.\n\n### 20. `CatalogQuery`\n\nModel-catalog metadata for driver dispatch. Currently surfaces `reasoning_echo_policy_for(model)` (#4842) and `proactive_memory_extraction_model_for(agent_id)` (#5475).\n\n## Using the prelude\n\n```rust\nuse librefang_kernel_handle::prelude::*;\n```\n\nThis brings in `KernelHandle` plus every role trait and associated struct, so method calls like `kernel.send_channel_message(...)` resolve without manual imports.\n\n## Migration guide for new code\n\n**Existing pattern** (still works, don't churn unnecessarily):\n```rust\nfn process(h: Arc<dyn KernelHandle>) { ... }\n```\n\n**Preferred for new code** — express only what you need:\n```rust\nfn approve<T: ApprovalGate + Send + Sync>(gate: &T) { ... }\nfn remember<T: MemoryAccess + Send + Sync>(mem: &T) { ... }\n```\n\nThis makes the dependency graph explicit: a missing capability is a compile error in the role-trait impl, not a silent `Err(\"not available\")` at first runtime call.\n\n## Implementing the kernel side\n\nA concrete kernel implements each role trait. The blanket `impl KernelHandle for T` means it automatically satisfies the supertrait — no extra code. The crate's test module contains a `StubKernel` that demonstrates the minimum required implementations: only the methods without defaults need bodies (e.g. `spawn_agent`, `send_to_agent`, `memory_store`). Everything else inherits the default.\n\n## Object safety\n\nEvery role trait is individually object-safe. The test `role_traits_are_individually_object_safe` verifies this by constructing `Arc<dyn EachTrait>` — if any trait gains a non-object-safe method (generic parameter, `Self` by value), that test stops compiling.","kernel-librefang-kernel-metering-src":"# Kernel — librefang-kernel-metering-src\n\n# librefang-kernel-metering\n\nCost-tracking and quota-enforcement engine for LLM usage. Persists every call to SQLite, estimates pre-call cost to gate concurrent dispatches, and integrates with the LLM fallback chain so budget-exhausted providers are skipped without wasted network hops.\n\n## Architecture\n\n```mermaid\ngraph TD\n    Caller[\"Kernel / Trigger\"] -->|\"1. reserve_global_budget()\"| Engine[\"MeteringEngine\"]\n    Engine -->|\"2. check caps (hourly→daily→monthly)\"| Ledger[\"CostReservationLedger (in-memory)\"]\n    Engine -->|\"2b. read settled spend\"| Store[\"UsageStore (SQLite)\"]\n    Caller -->|\"3. dispatch LLM call\"| LLM[\"LLM Provider\"]\n    Caller -->|\"4a. settle() on success\"| Engine\n    Caller -->|\"4b. release() on failure\"| Engine\n    Engine -->|\"5. record() / check_all_and_record()\"| Store\n    Engine -->|\"budget breach\"| Exhaustion[\"ProviderExhaustionStore\"]\n    Exhaustion -.->|\"skips provider\"| Fallback[\"FallbackChain\"]\n```\n\n## Budget Enforcement Hierarchy\n\nEvery LLM call passes through up to four independent budget layers. A failure at any layer aborts the call (or marks the provider exhausted):\n\n| Layer | Scope | Time Windows | Additional Caps |\n|-------|-------|-------------|-----------------|\n| **Global** | All agents, all users | hourly, daily, monthly | — |\n| **Per-agent** | Single `AgentId` | hourly, daily, monthly | — |\n| **Per-provider** | Single provider string | hourly, daily, monthly | tokens/hour |\n| **Per-user** (RBAC M5) | Single `UserId` | hourly, daily, monthly | — |\n\nA limit of `0.0` (or `0` for tokens) on any window means **unlimited** — that window is skipped entirely. This is the default.\n\n### Asymmetric comparison operators\n\n`reserve_global_budget` uses `>` (allows a call that *exactly* fills the cap) while `check_global_budget` uses `>=` (rejects once the limit is fully consumed). The pre-call path is intentionally lenient so a single request hitting the boundary isn't blocked before it has ever been recorded; the post-call path is strict to prevent further dispatches.\n\n## Key Components\n\n### `MeteringEngine`\n\nThe main entry point. Wraps a SQLite-backed `UsageStore` and an optional `ProviderExhaustionStore`.\n\n**Construction:**\n\n```rust\nlet engine = MeteringEngine::new(arc_usage_store)\n    .with_exhaustion_store(shared_exhaustion_store);\n```\n\nThe exhaustion store is optional — legacy callers that never wire one work identically, they just miss the fallback-chain integration.\n\n**Core methods by phase:**\n\n| Phase | Method | Atomicity |\n|-------|--------|-----------|\n| Pre-dispatch | `reserve_global_budget` | In-process mutex (prevents concurrent overshoot) |\n| Pre-dispatch | `check_provider_budget` | Non-atomic read (dashboard / pre-flush gate) |\n| Post-call | `check_all_and_record` | Single SQLite transaction (agent + global + provider) |\n| Post-call | `check_user_budget` | Non-atomic read (next-call denial, not rollback) |\n| Recording only | `record` | Single SQLite insert |\n| Diagnostics | `budget_status`, `get_summary`, `get_by_model`, `pending_reserved_usd` | Read-only queries |\n\n### `CostReservationLedger` (internal)\n\nAn in-memory `f64` behind a `Mutex` that holds the sum of all reserved-but-not-yet-settled USD. The critical path is `check_and_add` — it holds the mutex for the entire check-then-mutate sequence so two concurrent callers cannot both observe the pre-add total and both commit.\n\n### `MeteringReservation`\n\nA `#[must_use]` RAII token returned by `reserve_global_budget`. Three disposal paths:\n\n1. **`settle(self)`** — the LLM call succeeded and actual usage was recorded. Releases the reservation so the in-memory ledger stops counting it.\n2. **`release(self)`** — the call failed before any cost was incurred. Same mechanism, different semantic name.\n3. **`Drop`** — if neither was called (e.g., a panic between reserve and settle), the `Drop` impl releases the reservation defensively so the budget doesn't remain permanently locked.\n\nAccess `estimated_usd()` on the reservation to inspect the held amount.\n\n## The Reservation System (#3616)\n\n**Problem:** `check_global_budget` reads settled spend from SQLite. When N triggers fire concurrently they all observe the same pre-call total, all pass the gate, and all commit — producing multi-x overshoots of hourly/daily/monthly caps.\n\n**Solution:** Before dispatching the LLM call, the kernel calls `reserve_global_budget` with an estimated cost. The ledger atomically checks whether `already_spent + pending + estimated > limit` for each cap, and only commits the reservation if all pass.\n\n**Scope:** This is an in-process synchronization mechanism. Two separate processes (or an out-of-band SQL writer) can still race; matching SQLite atomicity in the post-call `check_all_and_record` path is what catches that case.\n\n### Reservation lifecycle\n\n```\nreserve_global_budget()   →  MeteringReservation\n    ↓                          ↓\n    │                    dispatch LLM call\n    │                          ↓\n    │               ┌─── success ──── failure ───┐\n    │               ↓                            ↓\n    │          settle()                     release()\n    │               ↓                            ↓\n    └─────── ledger.release() ←─────── ledger.release()\n```\n\n## Cost Estimation\n\nTwo public entry points:\n\n- **`MeteringEngine::estimate_cost`** — uses hardcoded default rates ($1/$3 per million input/output tokens). Catalog-agnostic; the `model` parameter is a label only. Suitable for unit tests or when no catalog is available.\n\n- **`MeteringEngine::estimate_cost_with_catalog`** — looks up the model in a `ModelCatalog`, reads `input_cost_per_m` / `output_cost_per_m`, and falls back to defaults if not found.\n\n### Token-type pricing (applied by `estimate_cost_from_rates`)\n\n| Token Type | Price Multiplier |\n|-----------|-----------------|\n| Regular input | 1.0× input rate |\n| Cache-read input | 0.10× input rate |\n| Cache-creation input | 1.25× input rate |\n| Output | 1.0× output rate |\n\nRegular input is derived as `input_tokens - cache_read - cache_creation` with saturating arithmetic.\n\n### ChatGPT session-auth special case\n\nChatGPT session-authenticated models have zero catalog pricing (they aren't billed per-token). `estimate_cost_with_catalog` detects these via `should_use_legacy_budget_estimate` (checks `provider == \"chatgpt\"`) and applies the default $1/$3 rates so budgets still get a conservative non-zero estimate. Other zero-priced models (e.g., local-tier) genuinely cost nothing and return $0.\n\n### Subscription providers\n\nProviders like `alibaba-coding-plan` use flat-rate subscriptions with request-based quotas, not per-token billing. These models are registered with zero cost-per-token, so metering tracks $0 cost. Users monitor usage via the provider's console.\n\n## Provider Exhaustion Integration (#4807)\n\nWhen a per-provider budget gate trips and an exhaustion store is wired, `flag_provider_budget_exhausted` marks the provider with `ExhaustionReason::BudgetExceeded` and a backoff of `DEFAULT_LONG_BACKOFF`. The LLM fallback chain reads the same `ProviderExhaustionStore` and skips that provider slot instead of dispatching a request that the gate would deny again.\n\nWire the same store instance into both the metering engine and the fallback chain:\n\n```rust\nlet exhaustion = ProviderExhaustionStore::new();\nlet engine = MeteringEngine::new(store).with_exhaustion_store(exhaustion.clone());\n// Pass exhaustion.clone() to FallbackChain construction as well.\n```\n\nRetrieve the attached store later with `engine.exhaustion_store()` (returns `None` if unwired).\n\n## Token Overflow Safety (metering-token-overflow)\n\nThe inner addition of `cache_read_input_tokens + cache_creation_input_tokens` uses `saturating_add` to defend against a buggy or malicious provider returning `u64::MAX / 2 + 1` in both fields. Previously this panicked in debug builds and silently wrapped in release, producing absurd budget rows. The outer `input_tokens.saturating_sub(cache_total)` then clamps regular input to zero when the reported cache exceeds total input — a sane fallback that charges only the cache-token rates.\n\n## Atomic Check-and-Record\n\nThree SQLite-transactional methods prevent TOCTOU races between the quota check and the usage insert:\n\n| Method | Checks Enforced |\n|--------|----------------|\n| `check_quota_and_record` | Per-agent (hourly/daily/monthly) |\n| `check_global_budget_and_record` | Global (hourly/daily/monthly) |\n| `check_all_and_record` | Per-agent + global + per-provider (cost + tokens) |\n\n`check_all_and_record` is the **preferred post-call method**. It resolves the per-provider budget from `BudgetConfig.providers` keyed on the record's `provider` field, and if the transaction fails the row is never inserted — no partial state.\n\n## Typical Call Flow\n\n```text\n1.  reserve_global_budget(budget, estimated_usd)    → MeteringReservation\n2.  check_provider_budget(provider, provider_budget) → Ok or QuotaExceeded\n3.  [dispatch LLM call]\n4.  On success:\n      check_all_and_record(record, quota, budget)   → single SQLite txn\n      check_user_budget(user_id, user_budget)        → post-call denial for next call\n      reservation.settle()\n5.  On failure:\n      reservation.release()\n```\n\nSteps 1–2 are pre-dispatch gates. Step 4's `check_user_budget` is intentionally post-call — the LLM call already happened, so \"exceeded\" means the *next* call from that user is denied, not that the current one is rolled back.\n\n## Data Flow to External Layers\n\n- **`librefang-memory`** — `UsageStore` for persistence, `UsageRecord` / `UsageSummary` / `ModelUsage` for data shapes.\n- **`librefang-llm-driver`** — `ProviderExhaustionStore`, `ExhaustionReason`, and `DEFAULT_LONG_BACKOFF` (narrow dependency; nothing else from the driver crate).\n- **`librefang-types`** — `AgentId`, `UserId`, `ResourceQuota`, `BudgetConfig`, `ProviderBudget`, `UserBudgetConfig`, `LibreFangError`.\n- **`librefang-runtime`** — `ModelCatalog` for catalog-aware cost estimation.","kernel-librefang-kernel-router-src":"# Kernel — librefang-kernel-router-src\n\n# librefang-kernel-router\n\nMessage routing engine for LibreFang. Given an incoming user message, this module scores candidate agents (\"templates\") and agent orchestrators (\"hands\") to determine which specialist should handle the request. Routing combines keyword matching, manifest metadata, and optional embedding-based semantic similarity.\n\n## Architecture\n\n```mermaid\nflowchart TD\n    MSG[Incoming Message] --> TPL[auto_select_template]\n    MSG --> HAND[auto_select_hand]\n\n    TPL --> RULES[TEMPLATE_RULES keyword scoring]\n    TPL --> META[Manifest metadata scoring]\n    TPL --> SEM_T[Semantic similarity bonus]\n    RULES --> MERGE_T[Merge and rank]\n    META --> MERGE_T\n    SEM_T --> MERGE_T\n    MERGE_T --> MULTI{Multi-domain?}\n    MULTI -->|Yes| ORCH[orchestrator]\n    MULTI -->|No| BEST_T[Best-scoring template]\n\n    HAND --> CAND[HandRouteCandidates from HAND.toml]\n    HAND --> SEM_H[Semantic similarity bonus]\n    CAND --> MERGE_H[Score and rank]\n    SEM_H --> MERGE_H\n    MERGE_H --> THRESH{Score ≥ 2?}\n    THRESH -->|Yes| BEST_H[Best-scoring hand]\n    THRESH -->|No| NONE[No match]\n```\n\n## Public API\n\n### `auto_select_template(message, agents_dir, semantic_scores) -> TemplateSelection`\n\nRoutes a message to the best agent template. Evaluates three sources in order:\n\n1. **Hardcoded rules** (`TEMPLATE_RULES`) — bilingual regex patterns for ~30 built-in templates (coder, debugger, architect, security-auditor, etc.)\n2. **Manifest metadata** — `agent.toml` files under `agents_dir` may declare `[metadata.routing]` with explicit aliases\n3. **Semantic-only fallback** — when keyword matching finds nothing, templates with embedding similarity ≥ `SEMANTIC_ONLY_THRESHOLD` (0.55) are considered\n\nIf no specialist matches, defaults to `\"orchestrator\"`.\n\n**Multi-domain detection:** When the top two scoring templates differ and the message contains tokens like \"同时\", \"分别\", \"协作\", \"多个\", or \"multi\"/\"together\", the message is routed to `orchestrator` instead of a single specialist.\n\n### `auto_select_hand(message, semantic_scores) -> HandSelection`\n\nRoutes a message to the best hand. Hand definitions are loaded from `HAND.toml` files under `<home_dir>/registry/hands/`. Each hand's `[routing]` section contributes:\n\n- **Strong phrases**: explicit `aliases` + description-derived phrases (weight 6 per hit)\n- **Weak phrases**: explicit `weak_aliases` + id-derived tokens filtered through `GENERIC_ENGLISH_WORDS` (weight 1 per hit)\n- **Semantic bonus**: up to `MAX_SEMANTIC_BONUS` (5.0) points from cosine similarity\n\nCandidates scoring below `MIN_HAND_SCORE` (2) are rejected. A single weak hit (score 1) is considered too noisy to route on.\n\n### `load_template_manifest(home_dir, template) -> Result<AgentManifest, String>`\n\nReads `<home_dir>/workspaces/agents/<template>/agent.toml` and deserializes it. Template names are validated to contain only ASCII alphanumeric characters, hyphens, and underscores.\n\n### `all_template_descriptions(agents_dir) -> Vec<(String, String)>`\n\nReturns `(template_name, embedding_text)` pairs for all non-excluded templates. Used by the kernel to precompute embedding vectors for semantic routing. Templates listed in `ROUTING_EXCLUDED_TEMPLATES` (currently `[\"assistant\"]`) are skipped.\n\n### Cache Management\n\n| Function | Purpose |\n|---|---|\n| `set_hand_route_home_dir(path)` | Set the LibreFang home directory for hand candidate loading |\n| `invalidate_hand_route_cache()` | Clear cached hand candidates (call on hot-reload) |\n| `invalidate_manifest_cache()` | Clear cached manifest candidates (call on agent install/uninstall) |\n\nAll caches use `OnceLock<Mutex<...>>` for thread-safe lazy initialization. Caches are keyed by directory path and auto-invalidate when the source directory changes.\n\n## Scoring Weights\n\n| Source | Weight | Applies to |\n|---|---|---|\n| Explicit alias / strong match | 6 | Both template and hand routing |\n| Generated phrase | 2 | Manifest metadata only |\n| Weak phrase | 1 | Both |\n| Semantic similarity | `similarity × 5.0` (rounded) | Both, optional |\n\nTemplate rules (from `TEMPLATE_RULES`) are treated as strong matches — they carry the same weight as explicit aliases.\n\n## Keyword Matching Pipeline\n\n### Template Rules\n\n`TEMPLATE_RULES` is a static array of `RouteRule` entries. Each rule has a `target` template name and bilingual pattern sets:\n\n```rust\nRouteRule {\n    target: \"coder\",\n    strong: &[\n        (\"implement\", r\"\\bimplement\\b|\\bbuild\\b|\\brefactor\\b|\\bpatch\\b\"),\n        (\"写代码\", r\"写代码|实现功能|补丁|脚本|编码|重构|开发\"),\n    ],\n    weak: &[\n        (\"code\", r\"\\bcode\\b|\\bfunction\\b|\\bapi\\b\"),\n        (\"代码\", r\"代码|程序|模块|接口\"),\n    ],\n}\n```\n\nPatterns are compiled as case-insensitive regexes via `regex_matches()`. Each label is a human-readable key used in the selection reason string.\n\n### Phrase Matching\n\nFor manifest metadata and hand routing, phrases are matched with `phrase_matches()`:\n\n- **ASCII phrases**: compiled into a word-boundary regex that treats spaces, underscores, and hyphens as interchangeable. The message is lowercased before matching.\n- **Non-ASCII phrases** (Chinese, Japanese, etc.): simple case-insensitive `contains` check.\n\n### Phrase Generation\n\nPhrases are auto-generated from manifest metadata when `[metadata.routing]` doesn't set `exclude_generated = true`:\n\n| Function | Source | Output |\n|---|---|---|\n| `english_variants` | Template name | Normalized form + space-separated form + individual parts |\n| `description_phrases` | Description text | Split on punctuation/line breaks, filtered against generic words |\n| `tag_phrases` | Manifest tags | Normalized tag strings (ASCII candidates + raw unicode) |\n\nThe `GENERIC_ENGLISH_WORDS` blocklist (~45 entries) filters out low-signal words like \"helper\", \"system\", \"professional\" that would cause false matches.\n\n## Regex Cache\n\nAll regex patterns pass through a bounded FIFO cache (`RegexCache`) capped at `MAX_REGEX_CACHE_ENTRIES` (4096). This prevents unbounded memory growth from agent-controlled patterns:\n\n- **Hit**: returns cached `Regex` reference (O(1), no recompilation)\n- **Miss**: compiles `(?i)<pattern>`, inserts, evicts oldest entry if at capacity\n- **Invalid pattern**: caches `None` to avoid recompiling broken patterns on every call\n\n## Home Directory Resolution\n\nHand routing resolves its home directory in priority order:\n\n1. Explicitly set via `set_hand_route_home_dir()`\n2. `LIBREFANG_HOME` environment variable\n3. `~/.librefang` (falls back to temp directory if home is unavailable)\n\n## Return Types\n\n```rust\npub struct TemplateSelection {\n    pub template: String,   // Selected template name (e.g., \"coder\")\n    pub reason: String,     // Human-readable routing reason\n    pub score: usize,       // Aggregate score\n}\n\npub struct HandSelection {\n    pub hand_id: Option<String>,  // None if no hand matched\n    pub reason: String,\n    pub score: usize,\n}\n```\n\n## Dependencies\n\n- `librefang_types::agent::AgentManifest` — manifest deserialization\n- `librefang_hands::registry::parse_hand_toml_with_agents_dir` — HAND.toml parsing with agent template resolution\n- `regex_lite` — lightweight regex engine for pattern matching","kernel-librefang-kernel-src":"# Kernel — librefang-kernel-src\n\n# librefang-kernel\n\nThe kernel crate houses the core runtime services that LibreFang agents depend on: identity stability, execution gating, orchestration, workflow, authentication, and configuration. Every other crate in the workspace either calls into the kernel or provides data/types that the kernel consumes.\n\nThis document covers the two primary subsystems whose source is included here — the **Agent Identity Registry** and the **Approval Manager** — and explains how they interact with the rest of the codebase.\n\n---\n\n## Architecture Overview\n\n```mermaid\ngraph TD\n    subgraph \"librefang-kernel\"\n        AIR[Agent Identity Registry]\n        AM[Approval Manager]\n    end\n\n    subgraph \"Callers\"\n        KR[Kernel Boot / Spawn]\n        API[HTTP API Routes]\n        ACP[ACP Permission Bridge]\n        TUI[Dashboard / TUI]\n    end\n\n    subgraph \"Persistence\"\n        TOML[(agent_identities.toml)]\n        SQLITE[(SQLite: approvals, audit, TOTP)]\n    end\n\n    KR -->|load / register_if_absent| AIR\n    AIR -->|atomic write| TOML\n    TOML -->|load on boot| AIR\n\n    API -->|submit_request / resolve| AM\n    ACP -->|subscribe / resolve| AM\n    TUI -->|list_pending / resolve| AM\n\n    AM -->|persist pending + audit| SQLITE\n    SQLITE -->|restore on restart| AM\n    API -->|\"purge (reset agent identity)\"| AIR\n```\n\n---\n\n## Agent Identity Registry\n\n**File:** `src/agent_identity_registry.rs`\n\n### Purpose\n\nThe registry persists `agent_name → canonical_uuid` mappings independently of the agent SQLite rows. Without it, a respawn after a panic, manifest reload, or explicit kill would generate a fresh UUID — silently orphaning every session, memory, cron job, and workflow keyed under the previous ID.\n\nThe spawn path already derives agent IDs deterministically via `AgentId::from_name` (UUID v5), which preserves identity when the name never changes. The registry adds an explicit history layer on top:\n\n1. **Identity stability under rename/re-derivation.** The recorded UUID survives even if the v5 derivation evolves later (namespace bump, name normalisation change). Rather than rewriting every user's existing data, the kernel honors whatever ID was first handed out.\n2. **Delete-vs-purge separation.** A normal `kill_agent` keeps the registry entry intact — a later respawn lands on the same UUID. An explicit purge (`?purge_identity=true`) drops the entry; the next spawn starts clean.\n\n### Storage\n\nA TOML file at `<home_dir>/agent_identities.toml`, written atomically:\n\n```toml\n[agents.nika]\ncanonical_uuid = \"660bef7c-04d5-4480-8af2-0ce029981a14\"\ncreated_at = \"2026-04-01T10:00:00Z\"\n```\n\nThe file is human-readable for emergency surgery but is **not** intended as user-edited config.\n\n### Concurrency Model\n\n- A `DashMap<String, AgentIdentityRecord>` serves reads and inserts lock-free.\n- A separate `Mutex` (`persist_lock`) serialises on-disk writes so two concurrent `register` calls never produce an interleaved file.\n- The DashMap entries are the source of truth — `persist` snapshots them.\n\n### Key Methods\n\n| Method | Description |\n|---|---|\n| `AgentIdentityRegistry::load(home_dir)` | Construct from a home directory. Reads existing TOML; parse errors are logged and treated as empty (the malformed file is left intact for manual recovery). |\n| `AgentIdentityRegistry::in_memory()` | Empty registry with no persistence. Used in tests. |\n| `get(name)` | Look up the canonical UUID for a previously-registered name. Returns `Option<AgentId>`. |\n| `register_if_absent(name, uuid)` | Insert `name → uuid` if no entry exists. **First writer wins** — subsequent calls with a different UUID are silently ignored. Returns the effective canonical UUID. Persists to disk on insert. |\n| `purge(name)` | Remove the entry for `name`. Returns the dropped UUID. Persists after removal. Called from the API layer via `reset_agent_identity`. |\n| `list()` | Snapshot all entries as a `BTreeMap` (deterministic key order for diagnostics). |\n| `persist()` | Write current state to disk via atomic write (temp file → fsync → rename). No-op when constructed with `in_memory()`. |\n\n### Atomic Write Strategy\n\n1. Serialise the in-memory snapshot as pretty-printed TOML.\n2. Write to a temp path (`.tmp.<pid>.<seq>.<nanos>`).\n3. `fsync` the temp file.\n4. `rename` over the target path.\n\nPersistence errors are logged as warnings but **do not** fail the in-memory write — the kernel needs the in-memory map to be authoritative for the running process even if the disk is momentarily wedged.\n\n### Error Philosophy\n\n- `load()` never returns `Err`. A malformed file is logged and the registry starts empty — the original file is **not** overwritten, preserving the operator's chance to recover by hand.\n- `register_if_absent()` and `purge()` log persistence failures but retain their in-memory effects.\n\n---\n\n## Approval Manager\n\n**File:** `src/approval.rs`\n\n### Purpose\n\nThe `ApprovalManager` gates dangerous tool executions (shell commands, file writes, skill mutations, etc.) behind human approval. It supports two execution paths:\n\n- **Blocking** (`request_approval`) — the agent loop blocks until a human resolves the request (approve, deny, timeout).\n- **Deferred** (`submit_request`) — the request is queued and a `DeferredToolExecution` payload is stored. On resolution, the deferred payload is returned to the kernel for async execution.\n\n### Lifecycle\n\n```mermaid\nstateDiagram-v2\n    [*] --> Submitted[\"Submitted:\"] submit_request / request_approval\n    Submitted --> Pending[\"Pending:\"] persisted to SQLite\n    Pending --> Approved[\"Approved:\"] resolve(Approved)\n    Pending --> Denied[\"Denied:\"] resolve(Denied)\n    Pending --> Escalated[\"Escalated:\"] timeout + Escalate policy\n    Pending --> TimedOut[\"TimedOut:\"] timeout + max escalations reached\n    Pending --> Skipped[\"Skipped:\"] timeout + Skip policy\n    Escalated --> Pending[\"Pending:\"] re-inserted with bumped count\n    Approved --> [*]: deferred payload returned\n    Denied --> [*]\n    TimedOut --> [*]\n    Skipped --> [*]\n```\n\n### Construction\n\n```rust\n// Without database (no audit, no restart recovery)\nApprovalManager::new(policy)\n\n// With database (audit logging, pending-approval restore, TOTP lockout persistence)\nApprovalManager::new_with_db(policy, pool)\n```\n\n### Policy-Driven Gating\n\nBefore a tool reaches the approval queue, the kernel asks whether it needs approval at all:\n\n| Method | Behavior |\n|---|---|\n| `requires_approval(tool_name)` | Checks the `require_approval` list (supports glob patterns like `file_*`). |\n| `requires_approval_with_context(tool_name, sender_id, channel)` | Same, but short-circuits to `false` for trusted senders or channel-specific allow rules. |\n| `requires_approval_with_context_for(agent_id, tool_name, sender_id, channel)` | Agent-aware variant that checks the remembered-decisions cache (`allow_always`) before falling through to policy. |\n| `is_tool_denied_with_context(tool_name, sender_id, channel)` | Returns `true` when a channel rule explicitly denies a tool. |\n| `is_tool_denied_with_context_for(agent_id, tool_name, sender_id, channel)` | Agent-aware variant that checks `reject_always` remembered decisions first. |\n\nPolicy is hot-reloadable via `update_policy(policy)`.\n\n### Approval Caches\n\nThree independent caching layers reduce repeated prompts:\n\n#### 1. Remembered Decisions (cross-session, in-memory)\n\nWhen an external surface (ACP bridge) records `allow_always` or `reject_always` for an `(agent_id, tool_name)` pair, future calls skip the gate entirely. Methods: `remember`, `recall`, `forget`. Persistence across daemon restarts is tracked as a follow-up.\n\n#### 2. Per-Session Cache (#5600)\n\nOnce a user approves a tool within a chat session, every subsequent call of that same tool in the same session auto-approves. Keyed on `(session_id, tool_name)`. Controlled by `policy.cache_approvals_per_session` (on by default). Security carve-out: **`force_human=true` deferred calls never populate this cache** (RBAC M3, #3054).\n\n| Method | Description |\n|---|---|\n| `remember_session_approval(session_id, tool_name)` | Record an approval. No-op on empty keys. |\n| `has_session_approval(session_id, tool_name)` | Check for a cached approval. |\n| `forget_session_approval(session_id, tool_name)` | Remove one entry. |\n| `clear_session_approvals(session_id)` | Drop all entries for a session (e.g., on session reset). |\n\n#### 3. TOTP Grace Period\n\nAfter a successful TOTP verification, the user gets a configurable grace window (`totp_grace_period_secs`) during which subsequent approvals for the same `user_id` skip TOTP. Methods: `is_within_totp_grace`, `record_totp_grace`.\n\n### Pending Request Limits\n\nEach agent is capped at `MAX_PENDING_PER_AGENT` (5) concurrent pending requests. Overflow is immediately denied. Duplicate `tool_use_id` values are rejected on the deferred path to prevent double-submission.\n\n### Escalation\n\nWhen `timeout_fallback` is `Escalate { extra_timeout_secs }`:\n- On timeout, the request is re-inserted with `escalation_count += 1`.\n- The timeout grows by `extra_timeout_secs` per escalation round.\n- After `MAX_ESCALATIONS` (3) rounds, the request resolves as `TimedOut`.\n\n### Resolution\n\n`resolve(request_id, decision, decided_by, totp_verified, user_id)` is the central resolution method. It:\n\n1. Checks the TOTP gate (if the policy requires TOTP for this tool and the user is not in grace).\n2. Removes the pending entry from memory **and** SQLite.\n3. Records TOTP grace on successful TOTP verification.\n4. Populates the per-session cache (if policy allows and not `force_human`).\n5. Writes an audit entry to SQLite.\n6. Pushes to the in-memory recent list (capped at 100).\n7. Fires an `ApprovalEvent::Resolved` on the broadcast channel.\n8. Sends the decision to the blocking oneshot sender (if present).\n9. Returns `(ApprovalResponse, Option<DeferredToolExecution>)`.\n\nBatch and session-scoped helpers:\n- `resolve_batch(ids, decision, decided_by)` — no TOTP support; resolves individually.\n- `resolve_all_for_session(session_id, decision, decided_by)` — resolves every pending request for a session atomically. TOTP-required requests return errors and are not counted.\n\n### Restart Recovery\n\n`new_with_db` restores `pending_approvals` rows that survived a daemon restart (issue #3611). Restored entries have no live `oneshot::Sender` — they surface in the dashboard/API as pending items requiring operator action. If a `deferred_payload` blob survives, the restored entry includes it for auto-resume on approval.\n\n**Security:** Restored deferred payloads are integrity-checked against the row's `agent_id`, `tool_name`, and `session_id` columns. On mismatch, the deferred slot is dropped (the pending request still surfaces for investigation, but no auto-resume happens).\n\n### Broadcast Events\n\n`subscribe()` returns a `broadcast::Receiver<ApprovalEvent>` with a 256-slot capacity. The ACP adapter (#3313) listens on this for low-latency awareness of pending-queue changes instead of polling `list_pending`. Slow consumers may see `RecvError::Lagged` and should re-sync via `list_pending`.\n\n### TOTP Second Factor\n\n| Method | Description |\n|---|---|\n| `verify_totp(secret_base32, code, issuer)` | Instance wrapper around the static verification. RFC 6238, SHA-1, 6 digits, 30-second step, ±1 window. |\n| `generate_totp_secret(issuer, account)` | Returns `(base32_secret, otpauth_uri, qr_base64_png)`. |\n| `generate_recovery_codes()` | 8 codes in `XXXX-XXXX-XXXX-XXXX` hex format (64 bits entropy each). |\n| `is_recovery_code_format(code)` | Accepts new format (16 hex + 3 dashes) and legacy `DDDD-DDDD`. |\n| `verify_recovery_codes(stored_json, code)` | Constant-time comparison across all stored codes. Consumes the matching code on success. |\n\n**Brute-force protection:**\n- `TOTP_MAX_FAILURES` (5) consecutive failures triggers a `TOTP_LOCKOUT_SECS` (300s) lockout.\n- `check_and_record_totp_failure(sender_id)` atomically checks lockout status and records the failure under a single mutex, eliminating the TOCTOU race (#3584).\n- Lockout state is persisted to SQLite (`totp_lockout` table) and restored on restart. Expired lockouts are discarded at load time.\n- DB write failures return `Err(())` — callers must reject fail-secure (#3372).\n\n**Replay prevention (#3359):**\n- Used TOTP codes are hashed (SHA-256) and stored in `totp_used_codes` with a 60-second replay window.\n- `record_totp_code_used_for(code, bound_to)` optionally binds the code to an action key (e.g., `\"approval:<uuid>\"`) for audit trail.\n- Expired entries are pruned on each write (120-second retention).\n\n### OAuth Nonce Tracking\n\n`is_oauth_nonce_used` / `record_oauth_nonce_used` track consumed OIDC nonces (hashed) to prevent OAuth callback replay (#3944). Nonces are retained for 1 hour.\n\n### Audit Log\n\n| Method | Description |\n|---|---|\n| `query_audit(limit, offset, agent_id, tool_name)` | Paginated query with optional filters. |\n| `audit_count(agent_id, tool_name)` | Total count with the same filters. |\n| `prune_audit(older_than_days)` | Hard-delete entries older than N days. Uses `datetime()` comparison to handle mixed RFC3339 formats. |\n\nAudit entries are written at both submission (as `\"pending\"`) and resolution, so a mid-flight crash still shows the request.\n\n### Session-Scoped Queries\n\n| Method | Description |\n|---|---|\n| `list_pending_for_session(session_id)` | All pending requests for a session. Used by dashboard views. |\n| `has_pending_for_session(session_id)` | Boolean check. Mirrors Hermes-Agent's `has_blocking_approval`. |\n\n### Risk Classification\n\n`classify_risk(tool_name)` provides a static mapping:\n\n| Tool | Risk |\n|---|---|\n| `shell_exec` | Critical |\n| `file_write`, `file_delete`, `apply_patch` | High |\n| `web_fetch`, `browser_navigate` | Medium |\n| Everything else | Low |\n\n---\n\n## Integration Points\n\n### API Layer → Approval Manager\n\nThe HTTP routes in `src/routes/approvals.rs` call directly into `ApprovalManager`:\n\n- `create_approval` reads policy for tool-level checks.\n- `list_approvals` calls `list_pending` + `list_recent`.\n- `batch_resolve` delegates to `resolve_batch`.\n- `reject_all_for_session` calls `list_pending_for_session` then resolves individually.\n- `audit_log` calls `query_audit` / `audit_count`.\n- `totp_setup`, `totp_confirm`, `totp_revoke` use `verify_totp_code_with_issuer` and `policy`.\n\n### API Layer → Agent Identity Registry\n\n`src/routes/agents.rs` calls `purge` on the registry via `reset_agent_identity` when `?purge_identity=true` is passed with an agent deletion.\n\n### Kernel Boot → Agent Identity Registry\n\nThe boot sequence (`src/kernel/boot.rs`) calls `AgentIdentityRegistry::load(home_dir)` early and uses `register_if_absent` when spawning agents to ensure UUID stability across restarts.\n\n### ACP Bridge → Approval Manager\n\nThe ACP permission bridge (`subscribe`) listens for `ApprovalEvent::Created` to fire editor-side permission prompts immediately, and calls `resolve` when the user responds. It also uses `remember`/`recall`/`forget` for \"always\" decisions.\n\n### Kernel Sweep Task\n\nA periodic background task (`spawn_approval_sweep_task`, ~10s interval) calls `expire_pending_requests`, which:\n1. Sweeps timed-out requests (escalating or resolving per policy).\n2. Runs `gc_expired_totp_entries` to bound the grace/failure maps by currently-relevant sender IDs (#5144).","kernel":"# Kernel\n\n# Kernel\n\nThe kernel crate group provides the core runtime services that every LibreFang agent depends on: identity, routing, execution gating, cost enforcement, approval workflows, and configuration. Every other crate in the workspace either calls into the kernel or supplies data and types that the kernel consumes.\n\n## Sub-modules\n\n| Crate | Role |\n|---|---|\n| [Kernel](librefang-kernel-src.md) | Core services — Agent Identity Registry, Approval Manager, auth, config, workflow, orchestration |\n| [Kernel Handle](librefang-kernel-handle-src.md) | Trait boundary between runtime and kernel — 19 narrow role traits that keep the seam mockable and free of internals |\n| [Kernel Metering](librefang-kernel-metering-src.md) | LLM cost tracking and quota enforcement — reserves budget before dispatch, settles after completion, skips exhausted providers |\n| [Kernel Router](librefang-kernel-router-src.md) | Message routing — scores candidate agents and orchestrators via keywords, metadata, and optional semantic similarity |\n\n## How they fit together\n\n```mermaid\nflowchart LR\n    MSG[Incoming Message] --> Router[\"Router<br/>(score & select)\"]\n    Router --> Kernel[\"Kernel<br/>(orchestrate, approve, identity)\"]\n    Kernel --> Metering[\"Metering<br/>(reserve → dispatch → settle)\"]\n    Kernel -.->|implements| Handle[\"Handle Traits<br/>(19 role traits)\"]\n    Handle -.->|called by| Runtime[Agent Runtime]\n```\n\nThe **Handle** crate is the architectural linchpin. It defines the trait surface (`KernelHandle` and its 19 constituent role traits) that the agent runtime calls into and the concrete **Kernel** implements. By keeping SQLite drivers, config structs, and other internals out of this crate, both sides stay decoupled and testable in isolation.\n\n**Kernel** houses the stateful subsystems — the Agent Identity Registry for stable cross-session identity, the Approval Manager for gated human-in-the-loop actions, plus auth, config loading, and workflow orchestration.\n\n**Router** sits at the front of request processing. Given an incoming user message, it scores agent templates and orchestrator hands using keyword rules, manifest metadata, and optional embedding-based similarity. Its output feeds the kernel's orchestration layer, which decides what actually runs.\n\n**Metering** plugs into the LLM dispatch pipeline. Before any call goes out, it reserves budget against hourly/daily/monthly caps. On success it settles the actual cost; on failure it releases the reservation. This lets the fallback chain skip budget-exhausted providers without wasting network hops.\n\n## Key cross-cutting workflows\n\n1. **Message handling** — Router scores and selects an agent → Kernel orchestrates execution → Metering gates every LLM call within that execution.\n2. **Approval-gated actions** — Kernel's Approval Manager queues a request → external approver resolves it via the handle trait → execution proceeds or is rejected. TOTP and escalation policies are enforced here.\n3. **Config-driven behavior** — Kernel loads and hot-reloads configuration → Router reads routing rules and template manifests → Metering reads quota caps. A single config change can propagate across all three.\n4. **Capability-scoped access** — Runtime code depends only on the narrow role trait it needs from Handle (e.g., `Processes`, `Memory`, `Approval`) rather than the full kernel, making dependencies explicit and stubs lightweight.","llm-drivers-librefang-llm-driver-src":"# LLM Drivers — librefang-llm-driver-src\n\n# librefang-llm-driver\n\nCore trait, types, and error classification for LibreFang's LLM provider abstraction layer. This crate defines the `LlmDriver` trait that all concrete provider implementations (Anthropic, OpenAI, Gemini, Ollama, etc.) implement, along with the error taxonomy, fallback-chain exhaustion tracking, and request/response types that flow through the entire system.\n\n## Architecture\n\n```mermaid\ngraph TD\n    subgraph \"librefang-llm-driver\"\n        LT[LlmDriver trait]\n        CR[CompletionRequest]\n        CPR[CompletionResponse]\n        LE[LlmError]\n        FE[FailoverReason]\n        PES[ProviderExhaustionStore]\n        CE[classify_error]\n    end\n\n    subgraph Consumers\n        DRIVERS[librefang-llm-drivers<br/>Concrete providers]\n        METERING[librefang-kernel-metering<br/>Budget gates]\n        RUNTIME[librefang-runtime<br/>Routing, compaction, agent loop]\n        API[librefang-api<br/>WebSocket streaming]\n        TESTING[librefang-testing<br/>Mock drivers]\n    end\n\n    DRIVERS -->|implements| LT\n    DRIVERS -->|populates| LE\n    METERING -->|writes| PES\n    RUNTIME -->|constructs| CR\n    API -->|calls| CE\n    TESTING -->|implements| LT\n    LE -->|classifies via| FE\n```\n\n## Core Trait: `LlmDriver`\n\nThe central abstraction. Every LLM provider implements this trait:\n\n```rust\n#[async_trait]\npub trait LlmDriver: Send + Sync {\n    async fn complete(&self, request: CompletionRequest)\n        -> Result<CompletionResponse, LlmError>;\n\n    async fn stream(&self, request: CompletionRequest, tx: Sender<StreamEvent>)\n        -> Result<CompletionResponse, LlmError>;\n\n    fn is_configured(&self) -> bool { true }\n    fn family(&self) -> LlmFamily { LlmFamily::Other }\n}\n```\n\n- **`complete`** — synchronous (non-streaming) request. Returns the full response at once.\n- **`stream`** — has a default implementation that wraps `complete` and emits `TextDelta` + `ContentComplete` events. Concrete drivers override this for true token-by-token streaming. If the receiver is dropped mid-stream (client disconnect, abort), the default implementation returns `LlmError::Http(\"stream receiver dropped\")` rather than silently swallowing the cancellation.\n- **`is_configured`** — returns `false` only for `StubDriver`. Real drivers always return `true`.\n- **`family`** — returns the provider family for cross-cutting policy decisions. Defaults to `LlmFamily::Other` so out-of-tree drivers compile without changes.\n\n### `LlmFamily`\n\nCoarse grouping of providers that share wire format and policy-relevant behavior:\n\n| Variant | Providers |\n|---|---|\n| `Anthropic` | Claude direct API, Anthropic-compatible providers, Claude Code CLI |\n| `OpenAi` | OpenAI, Azure OpenAI, Groq, OpenRouter, DeepInfra, Together, Cerebras |\n| `Google` | Gemini API, Vertex AI Gemini, Gemini CLI |\n| `Local` | Ollama, LM Studio, vLLM, sglang, llama.cpp (native protocol) |\n| `Other` | Cohere, custom CLIs, anything not yet categorized |\n\n## Request and Response Types\n\n### `CompletionRequest`\n\nAll fields default to zero/empty values. Real callers must set at minimum `model` and `messages`.\n\nKey fields worth noting:\n\n| Field | Type | Purpose |\n|---|---|---|\n| `messages` | `Arc<Vec<Message>>` | Refcounted — cloning for retries/fallback is O(1) |\n| `tools` | `Arc<Vec<ToolDefinition>>` | Same `Arc` strategy as messages |\n| `prompt_caching` | `bool` | Enables cache markers (Anthropic) or relies on automatic prefix caching (OpenAI) |\n| `prompt_cache_strategy` | `Option<PromptCacheStrategy>` | Controls breakpoint placement: `SystemOnly`, `SystemAndN(n)`, `Disabled` |\n| `cache_ttl` | `Option<&'static str>` | `\"1h\"` for extended Anthropic cache; default is 5 minutes |\n| `response_format` | `Option<ResponseFormat>` | Structured output constraints |\n| `extra_body` | `Option<HashMap<String, serde_json::Value>>` | Provider-specific overrides; last-wins over standard fields |\n| `agent_id` / `session_id` / `step_id` | `Option<String>` | Correlation keys surfaced as `x-librefang-*-id` HTTP headers |\n| `timeout_secs` | `Option<u64>` | Per-request timeout override (CLI drivers use `message_timeout_secs` instead) |\n| `reasoning_echo_policy` | `ReasoningEchoPolicy` | How to handle `reasoning_content` on historical turns (OpenAI-compat only) |\n\n### `CompletionResponse`\n\n| Field | Type | Purpose |\n|---|---|---|\n| `content` | `Vec<ContentBlock>` | Text, thinking, and other content blocks |\n| `stop_reason` | `StopReason` | Why generation stopped |\n| `tool_calls` | `Vec<ToolCall>` | Extracted tool invocations |\n| `usage` | `TokenUsage` | Input/output token counts |\n| `actual_provider` | `Option<String>` | Set by fallback wrappers to attribute spend to the slot that served the request, not the nominated slot. Always `None` on leaf drivers. |\n\n`response.text()` concatenates all `ContentBlock::Text` blocks into a single string, skipping thinking blocks.\n\n### `StreamEvent`\n\nEvents emitted during streaming. Key variants:\n\n- **`TextDelta`** — incremental text\n- **`ToolUseStart` / `ToolInputDelta` / `ToolUseEnd`** — tool use lifecycle\n- **`ThinkingDelta`** — extended thinking output\n- **`ContentComplete`** — final event with `stop_reason` and `usage`\n- **`PhaseChange`** — agent lifecycle phase for UX indicators (e.g., `\"response_complete\"`)\n- **`ToolExecutionResult`** / **`OwnerNotice`** — emitted by the agent loop, not LLM drivers\n\n## Error Handling: `LlmError`\n\nNon-exhaustive error enum covering all failure modes. Each variant carries enough context for both failover decisions and user-facing diagnostics.\n\n### Variants and Their Failover Behavior\n\n`LlmError::failover_reason()` classifies every variant into a `FailoverReason` that drives the fallback chain:\n\n| Error Variant | FailoverReason | Recovery Action |\n|---|---|---|\n| `RateLimited { retry_after_ms }` | `RateLimit(Some(ms))` | Back off, retry same provider |\n| `Overloaded { retry_after_ms }` | `RateLimit(Some(ms))` | Same as rate limit — transient capacity |\n| `Api { status, code, .. }` | Varies (see below) | Depends on classification |\n| `AuthenticationFailed` / `MissingApiKey` | `AuthError` | Skip to next slot |\n| `ModelNotFound` | `ModelUnavailable` | Skip to next slot |\n| `TimedOut` | `Timeout` | Skip to next provider |\n| `Http(_)` | `HttpError` | Skip to next provider |\n| `Parse(_)` | `Unknown` | Propagate (not recoverable by switching) |\n| `AllProvidersExhausted` | `ChainExhausted` | Terminal — propagate to user |\n\n### `Api` Error Classification\n\nThe `Api` variant has a `code: Option<ProviderErrorCode>` field. When populated (by drivers that parse structured error responses), classification uses the typed enum — locale-independent and immune to provider rewording. When `None`, classification falls back to status-code matching only:\n\n| Status | FailoverReason |\n|---|---|\n| 429 | `RateLimit(None)` |\n| 401 | `AuthError` |\n| 402 | `CreditExhausted` |\n| 413 | `ContextTooLong` |\n| 503 | `ModelUnavailable` |\n| other | `HttpError` |\n\nWhen `code` is present, the typed enum takes priority over status-code heuristics.\n\n### `TimedOut` Variant\n\nDesigned for cheap cloning — `partial_text` is `Option<Arc<str>>` so cloning is an O(1) refcount bump rather than copying potentially-megabyte payloads. `Display` references only `partial_text_len`; CLI callers that need the actual body pattern-match the variant.\n\n### `AllProvidersExhausted` Variant\n\nTerminal error produced when every slot in a fallback chain is exhausted. Carries:\n- `details: Vec<ProviderExhaustionDetail>` — one row per slot, sorted by `provider_id` for deterministic string output (#3298 prompt-cache determinism)\n- `cause: Option<Box<LlmError>>` — the last underlying provider error, exposed via `std::error::Error::source` so callers walking the error chain still see the upstream failure. `None` when every slot was pre-skipped from the exhaustion store.\n\n## Provider Exhaustion Tracking (`exhaustion`)\n\nIn-memory ledger that prevents a fallback chain from re-attempting a provider slot that is known to be unavailable. Shared between the fallback chain (which queries and records) and the metering layer (which records when operator-set spending caps trigger).\n\n### Core Type: `ProviderExhaustionStore`\n\nWraps an `Arc<DashMap<String, ProviderExhaustion>>` — cheap to clone, safe to share across tasks, optimized for hot reads and medium writes.\n\n**Lifecycle of an entry:**\n\n1. **Recorded** via `mark_exhausted(provider_id, reason, until)` — typically called when a provider returns an exhaustion-class error (429, 402, 401) or when the metering layer detects a budget cap breach.\n2. **Queried** via `is_exhausted(provider_id)` — returns `Some(record)` when the slot should be skipped. **Side effect**: expired entries are atomically removed on read, so the chain naturally re-attempts the slot once the cooldown passes.\n3. **Cleared** via `clear_exhausted(provider_id)` — explicit removal for admin/CLI force-retry ahead of scheduled reset.\n\n### `ExhaustionReason`\n\n| Variant | Typical Trigger | Auto-Recovery |\n|---|---|---|\n| `RateLimited` | 429, server-reported reset time | Yes — clears when server reset hint passes |\n| `QuotaExceeded` | 402, out of funds | Yes — after `DEFAULT_LONG_BACKOFF` (1 hour) |\n| `BudgetExceeded` | Operator-set budget cap pre-dispatch | Yes — after `DEFAULT_LONG_BACKOFF` (1 hour) |\n| `AuthFailed` | 401/403, invalid key | Yes — after `DEFAULT_LONG_BACKOFF` (1 hour) |\n\nFor reasons requiring operator action (quota, budget, auth), callers pass `DEFAULT_LONG_BACKOFF` (1 hour) — short enough that a fixed operator action heals the chain automatically, long enough that the chain doesn't waste attempts every minute.\n\n### `ExhaustionReason::as_metric_label()`\n\nReturns a stable, lowercase, no-spaces label (`\"rate_limited\"`, `\"quota_exceeded\"`, `\"budget_exceeded\"`, `\"auth_failed\"`) suitable for Prometheus labels and structured log fields without quoting.\n\n### Determinism Guarantees\n\n- Storage is process-local. A daemon restart clears all state by design — persisting exhaustion across restarts could lock out a slot whose underlying issue was resolved out-of-band.\n- `snapshot()` returns entries sorted by `provider_id` ascending (via `BTreeMap`), ensuring any stringified output is byte-identical across processes. This preserves prompt-cache determinism when exhaustion data leaks into a prompt.\n- `DashMap` iteration order is non-deterministic (sharded by hash), but `snapshot()` normalizes this.\n\n### Observability\n\nBoth `mark_exhausted` and `record_skip` emit `tracing::info!` events with `target: \"metering\"` so existing tracing-subscriber filters that route metering events to dashboards pick them up without additional wiring.\n\n## Error Classification (`llm_errors`)\n\nTwo-layer classification system: a general-purpose classifier for user-facing diagnostics, and a failover taxonomy for provider-switching decisions.\n\n### `classify_error(message, status) -> ClassifiedError`\n\nClassifies raw LLM API errors into 8 categories using priority-ordered pattern matching:\n\n1. **ContextOverflow** — checked first (most specific patterns)\n2. **Billing** (402)\n3. **Auth** (401/403 — with careful handling of non-auth 403s)\n4. **RateLimit** (429)\n5. **ModelNotFound**\n6. **Format** (400-class)\n7. **Overloaded** (500/503)\n8. **Timeout** (network)\n\nFalls back to `Format` for structured errors or `Timeout` for network-sounding messages.\n\nStatus-code fast paths take priority over pattern matching for unambiguous codes (429 → RateLimit, 402 → Billing, 401 → Auth, 404 → ModelNotFound). Status 403 requires special handling because providers use it for rate limiting, quota issues, region restrictions, and model permissions — not just auth.\n\n#### `classify_error_with_context(message, status, provider, model)`\n\nEnriches the classified error with:\n- `provider` and `model` metadata\n- `suggestion` — actionable resolution text based on category and context\n- Enriched `sanitized_message` with `[provider=X, model=Y]` suffix\n\n### `FailoverReason`\n\nProvider-switching taxonomy that drives `FallbackChain` decisions:\n\n| Variant | Recovery |\n|---|---|\n| `RateLimit(Option<u64>)` | Sleep (optional hint), retry same provider |\n| `CreditExhausted` | Skip to next provider immediately |\n| `ContextTooLong` | Propagate — caller must compress |\n| `ModelUnavailable` | Skip to next provider |\n| `Timeout` | Skip to next provider |\n| `HttpError` | Skip to next provider |\n| `AuthError` | Skip to next provider |\n| `ChainExhausted` | Terminal — propagate to user/operator |\n| `Unknown` | Propagate immediately |\n\n`ChainExhausted` is distinct from `Unknown` — the classification is known, the chain is simply dry.\n\n### `ProviderErrorCode`\n\nTyped enum populated by drivers that parse structured provider error responses (JSON `error.code`, `error.type`). When present on `LlmError::Api { code, .. }`, `failover_reason()` classifies via this enum instead of status-code heuristics, making classification immune to provider rewording and localization (#3745).\n\nVariants: `RateLimit`, `CreditExhausted`, `ContextLengthExceeded`, `ModelNotFound`, `AuthError`, `ServerUnavailable`, `ServerError`, `BadRequest`.\n\n### Sanitization\n\n`sanitize_for_user(category, raw)` produces user-facing messages that include a sanitized excerpt of the raw provider error (capped at 300 characters). The pipeline:\n\n1. **Detect HTML error pages** — Cloudflare etc. → generic \"provider returned an error page\"\n2. **Extract JSON message** — tries `/error/
