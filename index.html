ibrefang-llm-driver`.\n- Handles streaming via SSE/chunked responses, piped through `stream_backpressure` and `utf8_stream` for safe downstream consumption.\n\n### Fallback Chain (`drivers::fallback_chain`)\n\n`FallbackChain` composes multiple drivers into an ordered failover list. Each entry is a `ChainEntry` that pairs a driver with optional routing metadata. When a request fails, the chain advances to the next entry, exposing the `FailoverReason` so callers can log or react.\n\nUse this when you want transparent resilience—e.g., prefer Anthropic, fall back to OpenAI, then Ollama.\n\n### Credential Pool (`credential_pool`)\n\nA thread-safe, shared pool of API keys built on `dashmap`. The main types:\n\n| Type | Role |\n|---|---|\n| `CredentialPool` | The pool itself; selects credentials per request. |\n| `ArcCredentialPool` | `Arc<CredentialPool>` — the shared handle. |\n| `PoolStrategy` | Selection algorithm (e.g., round-robin, random). |\n| `PooledCredential` | A borrowed credential from the pool, automatically tracked. |\n| `new_arc_pool` | Convenience constructor returning `ArcCredentialPool`. |\n\nKeys are stored with zeroize-on-drop semantics via the `zeroize` crate. The pool hashes credentials with `sha2` for deduplication and tracking.\n\n### Rate Limit Tracking (`rate_limit_tracker`)\n\n- **`RateLimitBucket`** — tracks per-provider remaining capacity and reset times, typically populated from response headers (`x-ratelimit-remaining`, `Retry-After`, etc.).\n- **`RateLimitSnapshot`** — a read-only view of current rate-limit state for observability and metrics.\n\nThese integrate with the `metrics` crate so upstream dashboards can display provider throttle status.\n\n### Retry and Backoff Utilities\n\n| Module | Purpose |\n|---|---|\n| `backoff` | Exponential backoff with jitter for transient failures. |\n| `retry_after` | Parses `Retry-After` headers (seconds or HTTP-date) and gates retries accordingly. |\n| `shared_rate_guard` | A RAII-style guard that holds a rate-limit slot for the duration of a request and releases it on drop, preventing over-commitment. |\n\n### Stream Handling\n\n| Module | Purpose |\n|---|---|\n| `stream_backpressure` | Applies backpressure when the consumer reads slower than the provider sends, preventing unbounded buffering. |\n| `utf8_stream` | Ensures chunk boundaries don't split UTF-8 sequences — reassembles partial characters across chunk boundaries. |\n| `think_filter` | Strips `<think …>…<\/think ` reasoning blocks from provider output before returning to callers. Useful for providers that emit internal chain-of-thought. |\n\n## Relationship to Other Crates\n\n| Crate | Relationship |\n|---|---|\n| `librefang-llm-driver` | Defines the `LlmDriver` trait and error types. This crate implements them. Re-exported here as `llm_driver` and `llm_errors`. |\n| `librefang-types` | Shared domain types (prompts, completions, messages, model identifiers). |\n| `librefang-http` | Shared HTTP client construction, middleware, and telemetry injection (OpenTelemetry propagation via `opentelemetry-http`). |\n\nAll outbound HTTP traffic goes through `reqwest` clients built with `librefang-http`, ensuring consistent tracing spans, metric emission, and header propagation.\n\n## Usage Patterns\n\n### Single Provider\n\n```rust\nuse librefang_llm_drivers::drivers::anthropic::AnthropicDriver;\nuse librefang_llm_drivers::credential_pool::new_arc_pool;\n\nlet pool = new_arc_pool(vec![\"sk-ant-...\".to_string()], PoolStrategy::RoundRobin);\nlet driver = AnthropicDriver::new(pool);\n\nlet response = driver.complete(request).await?;\n```\n\n### Fallback Chain\n\n```rust\nuse librefang_llm_drivers::drivers::fallback_chain::{FallbackChain, ChainEntry};\n// Compose entries from individual drivers, then:\nlet chain = FallbackChain::new(entries);\nlet response = chain.complete(request).await?;\n```\n\nThe chain tries each entry in order. On success it returns immediately; on failure it records the `FailoverReason` and tries the next.\n\n## Testing\n\nThe crate uses `wiremock` for HTTP mocking in integration tests and `serial_test` to isolate tests that share global state (credential files, rate-limit counters). `tempfile` is used for tests involving credential persistence to disk.\n\n## Adding a New Provider\n\n1. Create a new submodule under `drivers/` (e.g., `drivers/mistral.rs`).\n2. Define a driver struct that holds an `ArcCredentialPool` and any provider-specific config.\n3. Implement the `LlmDriver` trait — build the request, send via `librefang-http`, parse the response.\n4. Handle streaming if the provider supports it, piping chunks through `utf8_stream` and `stream_backpressure`.\n5. Integrate `RateLimitBucket` updates from response headers.\n6. Register the driver in `FallbackChain` construction if multi-provider failover is desired.\n7. Add `wiremock`-based integration tests under `tests/`.","other-librefang-memory-src":"# Other — librefang-memory-src\n\n# RosterStore — Group Chat Member Persistence\n\n## Overview\n\n`RosterStore` persists which users have been seen in each group chat across daemon restarts. Instead of injecting the entire roster into the agent's system prompt (wasting tokens), agents query member lists on demand via the `group_members` tool.\n\nThe store is a thin wrapper around an `r2d2`-pooled SQLite connection. All operations are synchronous and degrade gracefully if the connection pool is exhausted — they log a warning, increment a failure metric, and return an empty result rather than panicking.\n\n## Schema\n\nThe backing table `group_roster` is **not** created by this module. It is managed by the shared migration ladder (`migration::migrate_v28`), which runs during `MemorySubstrate::open` before the store is constructed. This ensures:\n\n- Every memory table goes through a single, ordered migration path.\n- Constructing a `RosterStore` can never fail due to a locked or read-only database — that failure surfaces earlier, at boot.\n\nThe table schema (from the migration) uses a composite key of `(channel_type, chat_id, user_id)` with columns for `display_name`, `username`, `first_seen`, and `last_seen`.\n\n## Architecture\n\n```mermaid\ngraph LR\n    A[MemorySubstrate::open] --> B[run_migrations]\n    B --> C[RosterStore::new]\n    C --> D[r2d2 Pool]\n    E[group_members tool] --> F[members]\n    F --> D\n    G[Presence updates] --> H[upsert]\n    H --> D\n```\n\n`MemorySubstrate::open` runs migrations first, then passes the pool into `RosterStore::new`. At runtime, presence events call `upsert`, and the agent tool calls `members`.\n\n## API\n\n### `RosterStore::new(pool)`\n\nWraps an existing `Pool<SqliteConnectionManager>`. No DDL is executed here — the pool must already have the `group_roster` table via migrations.\n\n### `upsert(channel, chat_id, user_id, display_name, username)`\n\nInserts a new member or updates an existing one. On conflict (same `channel` + `chat_id` + `user_id`), it:\n\n- Overwrites `display_name` with the new value.\n- Preserves the existing `username` if the new value is `None` (via `COALESCE`).\n- Refreshes `last_seen` to the current Unix timestamp.\n- Leaves `first_seen` unchanged.\n\n**Guards:** If `chat_id` or `user_id` is empty, the call is silently ignored — no database interaction occurs.\n\n### `members(channel, chat_id) -> Vec<(String, String, Option<String>)>`\n\nReturns all members for the given chat as `(user_id, display_name, username)` tuples, ordered alphabetically by `display_name`. Returns an empty `Vec` if the pool is exhausted or no members exist.\n\n### `remove_member(channel, chat_id, user_id)`\n\nDeletes a single member from the roster. No-op if the pool is unavailable.\n\n### `member_count(channel, chat_id) -> usize`\n\nReturns the count of members in a group. Returns `0` if the pool is exhausted.\n\n## Error Handling Strategy\n\nAll methods handle pool exhaustion identically:\n\n1. Increment the `librefang_memory_pool_get_failed_total` counter with labels `store=roster` and `op=<operation>`.\n2. Log a `tracing::warn` with the channel and chat_id.\n3. Return a safe default (`None`, empty vec, or zero).\n\nSQL execution errors from `execute` and `query_row` are silently consumed (the `let _ = ...` pattern). This is intentional — a transient SQLite error should not crash the agent loop.\n\n## Integration Points\n\n- **Migration dependency:** `crate::migration::run_migrations` must run before constructing the store. Tests use `in_memory_store()` which calls `run_migrations` explicitly.\n- **Metric emission:** Uses the `metrics` crate's `counter!` macro. The consuming application must install a metrics exporter to observe pool exhaustion.\n- **Channel identification:** The `channel` parameter is a string like `\"telegram\"` that distinguishes different chat platforms. Rosters for different channels are fully isolated even if `chat_id` values overlap.","other-librefang-memory-tests":"# Other — librefang-memory-tests\n\n# librefang-memory-tests: Canonical Chat-Scoped Integration Tests\n\n## Purpose\n\nThis module contains integration regression tests that guard a privacy-critical fix in `librefang-memory`'s `SessionStore`. The fix ensures that **canonical memory entries are scoped by `SessionId`**, preventing cross-contamination of conversation history between different chat sessions that share the same agent.\n\n### The Bug It Prevents\n\nBefore the fix, every `CanonicalEntry` was stored without an originating `SessionId` tag. When the kernel requested canonical context for an LLM prompt, it received entries from **all** chats tied to that agent — meaning a WhatsApp DM could inject group messages into its prompt, and vice versa. This was both a privacy leak and a source of confused LLM responses.\n\n## Architecture\n\n```mermaid\ngraph TD\n    A[Test: canonical_context_isolates_two_whatsapp_chats] --> B[setup]\n    A --> C[SessionStore::append_canonical]\n    A --> D[SessionStore::canonical_context]\n    A --> E[SessionId::for_channel]\n    F[Test: canonical_context_unfiltered_returns_all] --> B\n    F --> C\n    F --> D\n    F --> E\n    B --> G[run_migrations]\n    B --> H[SessionStore::new]\n```\n\n## Test Helpers\n\n### `setup() → SessionStore`\n\nCreates a fully initialized `SessionStore` backed by an **in-memory SQLite** database (`SqliteConnectionManager::memory()`). This avoids filesystem side effects and gives each test an isolated, blank slate.\n\nThe function:\n1. Builds an `r2d2::Pool` with `max_size(1)` (sufficient for single-threaded tests)\n2. Runs database migrations via `run_migrations`\n3. Returns a new `SessionStore` wrapping the pool\n\n### `user_msg(text: &str) → Message`\n\nConvenience constructor for `Message` with `Role::User` and text content. Sets `pinned: false` and `timestamp: None` since neither field is relevant to the isolation logic under test.\n\n## Test Cases\n\n### `canonical_context_isolates_two_whatsapp_chats_for_same_agent`\n\nThe primary regression test. It simulates the real-world scenario that triggered the original bug: a single agent serving both a WhatsApp DM and a WhatsApp group containing the same person.\n\n**Steps:**\n\n1. Derive two distinct `SessionId` values using `SessionId::for_channel` with different channel addresses:\n   - `whatsapp:393331111111@s.whatsapp.net` (DM)\n   - `whatsapp:120363111111111111@g.us` (group)\n2. Append messages in interleaved order: `dm-1`, then `group-1`, then `dm-2`.\n3. Call `canonical_context(agent, Some(session_dm), None)` and assert only `[\"dm-1\", \"dm-2\"]` appear.\n4. Call `canonical_context(agent, Some(session_group), None)` and assert only `[\"group-1\"]` appears.\n\n**What this proves:** The `session_id` parameter passed to `append_canonical` is correctly stored and used as a filter at read time. Interleaved writes from different sessions do not bleed into each other's context windows.\n\n### `canonical_context_unfiltered_returns_all_for_backward_compat`\n\nEnsures backward compatibility for callers that haven't adopted per-session filtering.\n\n**Steps:**\n\n1. Append messages across two different sessions (`session_a` via WhatsApp, `session_b` via Telegram).\n2. Call `canonical_context(agent, None, None)` — passing `None` for `session_id`.\n3. Assert **all** messages are returned, regardless of session.\n\n**What this proves:** The `session_id = None` path preserves the original cross-channel canonical memory semantics. Existing callers that don't pass a session tag continue to work unchanged.\n\n## Dependencies on Other Crates\n\n| Crate | Usage |\n|---|---|\n| `librefang-memory` | `SessionStore`, `run_migrations` — the code under test |\n| `librefang-types` | `AgentId`, `SessionId`, `Message`, `Role`, `MessageContent` — domain types |\n| `r2d2` / `r2d2-sqlite` | Connection pool and in-memory SQLite for test isolation |\n\n## How to Run\n\n```bash\n# Run just these integration tests\ncargo test -p librefang-memory --test canonical_chat_scoped_integration\n\n# Run with output visible\ncargo test -p librefang-memory --test canonical_chat_scoped_integration -- --nocapture\n```\n\nNo external services or environment variables are required. The tests are fully self-contained using in-memory SQLite.\n\n## When to Extend This Module\n\nAdd a new test here when:\n\n- You modify the `session_id` tagging or filtering logic in `session.rs`\n- You change the `canonical_context` or `append_canonical` signatures\n- You introduce new channel types that affect `SessionId::for_channel` derivation\n- You alter the backward-compatible \"return all when unfiltered\" behavior","other-librefang-rl-export":"# Other — librefang-rl-export\n\n# librefang-rl-export\n\nLong-horizon reinforcement learning rollout trajectory exporter, providing an integration surface for W&B (Weights & Biases), Tinker, and Atropos.\n\n## Purpose\n\nThis module handles the export of RL rollout trajectories generated during long-horizon training. It serves as the bridge between the training loop and external tracking/logging systems, serializing trajectory data and shipping it to configured backends.\n\n## Architecture\n\n```mermaid\ngraph LR\n    A[Training Loop] -->|trajectory data| B[librefang-rl-export]\n    B -->|HTTP| C[W&B]\n    B -->|HTTP| D[Tinker]\n    B -->|HTTP| E[Atropos]\n    B --> F[librefang-http]\n```\n\nThe module depends on `librefang-http` as its HTTP transport layer, keeping network concerns abstracted behind a shared client. All outbound communication to external services flows through this dependency.\n\n## Key Dependencies\n\n| Dependency | Role |\n|---|---|\n| `librefang-http` | Shared HTTP client infrastructure |\n| `reqwest` | Underlying HTTP request execution |\n| `serde` / `serde_json` | Trajectory serialization to JSON |\n| `tokio` | Async runtime for non-blocking I/O |\n| `chrono` | Timestamp handling for trajectory events |\n| `base64` / `urlencoding` | Encoding for binary payloads and URL-safe data |\n| `url` | URL construction for backend endpoints |\n| `regex` | Pattern matching for data validation/transformation |\n| `thiserror` | Typed error definitions |\n| `tracing` | Structured logging of export operations |\n\n## Integration Surface\n\nThe module targets three external systems:\n\n- **W&B (Weights & Biases)** — Experiment tracking. Trajectories are logged as structured data for visualization and comparison across training runs.\n- **Tinker** — Local or remote debugging/inspection tooling for rollout data.\n- **Atropos** — RL infrastructure backend, receiving trajectory data for centralized storage and analysis.\n\nEach backend is expected to accept JSON-formatted trajectory payloads over HTTP. The module handles serialization, encoding, and transmission.\n\n## Testing\n\nTests use `wiremock` to mock HTTP endpoints, allowing verification of request structure, headers, and payload format without requiring live backend connections. Test configuration lives in `[dev-dependencies]` with `tokio`'s `macros` and `rt-multi-thread` features enabled for async test execution.","other-librefang-runtime-audit-src":"# Other — librefang-runtime-audit-src\n\n# librefang-runtime-audit\n\nTamper-evident audit trail for the Librefang runtime. Every agent action — tool invocation, shell execution, role change, network access — is recorded into a hash-linked Merkle chain that can be verified at any time. The chain is persisted to SQLite and optionally anchored to an external file, making both in-place tampering and full-history rewrites detectable.\n\n## Architecture\n\n```mermaid\ngraph TD\n    A[AuditLog::record] --> B[Read tip hash]\n    B --> C[Build AuditEntry with prev_hash = tip]\n    C --> D[compute_entry_hash over all fields]\n    D --> E[Append to in-memory entries]\n    E --> F[INSERT into SQLite inside BEGIN IMMEDIATE]\n    F --> G[Write anchor file via atomic rename]\n    G --> H[Advance tip]\n\n    subgraph Verification\n        V[verify_integrity] --> V1[Walk entries: each.prev_hash == prev_hash[\"prev.hash\"]]\n        V1 --> V2[Check chain_anchor or genesis sentinel at head]\n        V2 --> V3[Compare tip against anchor file]\n    end\n```\n\n## Core Types\n\n### AuditLog\n\nThe primary interface. Construct it in one of three modes:\n\n| Constructor | Persistence | Anchor | Use case |\n|---|---|---|---|\n| `AuditLog::new()` | In-memory only | None | Testing, ephemeral runs |\n| `AuditLog::with_db(pool)` | SQLite via r2d2 pool | None | Standard daemon |\n| `AuditLog::with_db_anchored(pool, path)` | SQLite | External file | Hardened deployments |\n\n**Recording entries:**\n\n```rust\n// Minimal — no RBAC attribution\nlog.record(\"agent-1\", AuditAction::ToolInvoke, \"read_file /etc/hosts\", \"ok\");\n\n// With user and channel attribution (RBAC-aware)\nlog.record_with_context(\n    \"agent-1\",\n    AuditAction::PermissionDenied,\n    \"/api/admin/users\",\n    \"denied\",\n    Some(UserId::from_name(\"Alice\")),\n    Some(\"api\".to_string()),\n);\n```\n\nBoth methods return the hash of the newly appended entry.\n\n### AuditEntry\n\nEach entry carries:\n\n- `seq: u64` — monotonically increasing sequence number\n- `timestamp: String` — RFC 3339\n- `agent_id: String`\n- `action: AuditAction`\n- `detail: String`\n- `outcome: String` — typically `\"ok\"` or `\"denied\"`\n- `user_id: Option<UserId>` — the human who triggered the action\n- `channel: Option<String>` — how the request arrived (e.g. `\"api\"`, `\"telegram\"`)\n- `prev_hash: String` — hash of the preceding entry (64-hex-char SHA-256)\n- `hash: String` — hash of *this* entry over all fields including `prev_hash`\n\nThe first entry's `prev_hash` is the 64-zero genesis sentinel: `\"0000…0000\"`.\n\n### AuditAction\n\nLocked enum — the `Display` representation of every variant is part of the committed hash. Renaming any variant invalidates all persisted entries that reference it.\n\n| Variant | Category |\n|---|---|\n| `ToolInvoke` | Agent operations |\n| `ShellExec` | |\n| `AgentSpawn` | |\n| `AgentKill` | |\n| `AgentMessage` | |\n| `NetworkAccess` | |\n| `MemoryAccess` | |\n| `ConfigChange` | |\n| `UserLogin` | RBAC (M5) |\n| `RoleChange` | |\n| `PermissionDenied` | |\n| `BudgetExceeded` | |\n| `RetentionTrim` | Self-audit (M7) |\n\n### UserId\n\nDeterministic identifier derived from a human-readable name via `UserId::from_name(\"Alice\")`. The mapping is stable across process restarts, so audit attribution survives daemon cycling.\n\n## Merkle Chain Integrity\n\n### How hashing works\n\n`compute_entry_hash` hashes all fields of an entry — `seq`, `timestamp`, `agent_id`, `action`, `detail`, `outcome`, `user_id`, `channel`, and `prev_hash` — into a single SHA-256 digest. Any change to any field produces a different hash, breaking the chain at that point.\n\n### Verification\n\n`verify_integrity()` walks the chain and checks:\n\n1. The first surviving entry's `prev_hash` equals either the genesis sentinel or the in-memory `chain_anchor` (set after prefix trims).\n2. Every subsequent entry's `prev_hash` equals the preceding entry's `hash`.\n3. If an anchor file is configured, the on-disk tip matches the computed tip.\n\nReturns `Ok(())` on success, or `Err(String)` describing where the break occurred (e.g. `\"hash mismatch at seq 1\"`, `\"audit anchor mismatch\"`).\n\n### External anchor file\n\nThe linked-list structure alone proves internal consistency but cannot detect a full rewrite: an attacker who can write to the SQLite database could wipe every row, fabricate a new history, and recompute all hashes from the genesis sentinel forward. The anchor file defeats this by storing the chain tip out-of-band (outside the database).\n\nBehavior:\n\n- On first boot with an existing DB but no anchor file, `with_db_anchored` **seeds** the anchor from the current tip — this is the upgrade path.\n- On subsequent boots, the anchor must exist and match the DB tip.\n- If the anchor file is missing after being seeded, verification **fails closed** (returns an error containing `\"missing\"`).\n- The anchor is updated on every `record` call via atomic rename (write to `.tmp`, then `fs::rename`).\n\n### Concurrent writes\n\nThe INSERT path runs inside `BEGIN IMMEDIATE` to serialize chain appends at the SQLite layer. This prevents races where two threads read the same tip, build entries with the same `prev_hash`, and create a chain fork. The r2d2 pool may have multiple connections, but SQLite's write serialization ensures only one append is in flight at a time.\n\n### DB failure handling\n\nIf the SQLite INSERT fails (e.g. table dropped, disk full), the in-memory chain **does not advance**. The entry is not added to the in-memory buffer, and the tip hash stays at its previous value. This prevents chain-break-on-restart bugs where an in-memory-only entry's hash was referenced by a later persisted entry whose predecessor never reached disk.\n\n## Retention and Pruning\n\n### Per-action retention (`trim`)\n\n`trim(policy: &AuditRetentionConfig, now: DateTime<Utc>)` drops aged entries according to per-action day counts:\n\n```rust\nlet mut policy = AuditRetentionConfig::default();\npolicy.retention_days_by_action.insert(\"ToolInvoke\".to_string(), 7);\nlet report = log.trim(&policy, chrono::Utc::now());\n```\n\n`AuditRetentionConfig` fields:\n\n| Field | Type | Default | Purpose |\n|---|---|---|---|\n| `retention_days_by_action` | `HashMap<String, u64>` | empty (keep forever) | Days to retain per action name |\n| `max_in_memory_entries` | `Option<usize>` | `None` | Hard cap on in-memory window |\n\n**Trim is prefix-only.** It scans from the head of the log and drops consecutive entries that exceed their per-action retention window. It stops at the first entry that should be kept (because its action has no rule, or it's within its window). This means entries *after* a kept entry are never dropped even if they're older than their own rule — this preserves the chain structure.\n\nWhen a prefix is dropped, `chain_anchor` is set to the hash of the last dropped entry. The first surviving entry's `prev_hash` still points to that dropped entry's hash, and `verify_integrity()` uses the anchor as the trusted starting point instead of requiring the genesis sentinel.\n\n`TrimReport` fields:\n- `total_dropped: usize`\n- `dropped_by_action: HashMap<String, usize>`\n- `new_chain_anchor: Option<String>` — hash of the last dropped entry\n\nThe `trim()` method does **not** write a self-audit row. The caller (the kernel periodic task) is responsible for recording a `RetentionTrim` entry after a non-empty trim.\n\n### Legacy day-based pruning (`prune`)\n\n`prune(max_age_days: u64) -> usize` drops entries older than `max_age_days` regardless of action type. It also updates `chain_anchor` and persists deletions to SQLite, matching the semantics of `trim`.\n\n### In-memory soft cap\n\nWhen `max_in_memory_entries` is configured, the append path enforces a soft cap at `configured × 1.5` (integer arithmetic: `cap * 3 / 2`). If the in-memory buffer exceeds this threshold during `record`, the oldest prefix is evicted and `chain_anchor` is advanced. This prevents unbounded memory growth between periodic `trim` calls.\n\nWhen `max_in_memory_entries` is `None` or `0`, the hard cap of 10,000 entries applies (`MAX_AUDIT_ENTRIES`).\n\n### Persistence across restart\n\n`with_db` recovers the `chain_anchor` from the surviving rows on load: if the first entry's `prev_hash` is not the genesis sentinel, it becomes the anchor. This means a daemon restart after a trim that dropped the entire prefix will still pass `verify_integrity()` without an external anchor file.\n\nThe \"drop everything\" edge case — where every entry is older than its retention rule — is handled explicitly: the DB is fully cleared, no orphan tail row remains, and the next `record` call anchors against the in-memory `chain_anchor`.\n\n## Cursor-based Streaming\n\n### `since_seq(cursor: u64) -> Vec<AuditEntry>`\n\nReturns all entries with `seq > cursor`. Used by the SSE log stream (`/api/logs/stream`) to deliver incremental updates to consumers.\n\nKey semantics:\n- The cursor represents the highest seq the consumer has already received.\n- `since_seq(0)` does **not** return `seq == 0` — initial backfill is handled by `recent()`.\n- Returns an empty vec when the cursor is at or past the current tail.\n- No burst-size limit: delivers every entry after the cursor regardless of volume.\n\n### `recent(n: usize) -> Vec<AuditEntry>`\n\nReturns the last `n` entries. Used for initial backfill in the SSE handler and for inspection in tests.\n\n## SQLite Schema\n\n```sql\nCREATE TABLE audit_entries (\n    seq INTEGER PRIMARY KEY,\n    timestamp TEXT NOT NULL,\n    agent_id TEXT NOT NULL,\n    action TEXT NOT NULL,       -- AuditAction Display string\n    detail TEXT NOT NULL,\n    outcome TEXT NOT NULL,\n    user_id TEXT,               -- UserId Display string, nullable\n    channel TEXT,               -- nullable\n    prev_hash TEXT NOT NULL,    -- 64-hex-char SHA-256\n    hash TEXT NOT NULL          -- 64-hex-char SHA-256\n);\n```\n\nThe recommended connection initialization:\n\n```rust\nSqliteConnectionManager::file(db_path).with_init(|c| {\n    c.execute_batch(\n        \"PRAGMA journal_mode=WAL;\n         PRAGMA busy_timeout=5000;\n         PRAGMA synchronous=NORMAL;\"\n    )\n})\n```\n\n## Threat Model Summary\n\n| Attack | Detection mechanism |\n|---|---|\n| Modify a single entry's field | Hash mismatch at that seq during `verify_integrity()` |\n| Delete a middle entry | Chain break — `prev_hash` of the next entry dangles |\n| Full DB rewrite with recomputed hashes | External anchor file mismatch |\n| Delete the anchor file | Fails closed — `\"missing\"` error |\n| Race concurrent appends to fork the chain | `BEGIN IMMEDIATE` serializes writes |\n| DB INSERT failure leaves phantom in-memory entry | In-memory chain does not advance on failure |","other-librefang-runtime-audit":"# Other — librefang-runtime-audit\n\n# librefang-runtime-audit\n\nTamper-evident audit log for the LibreFang runtime. Every auditable runtime event is appended to a Merkle hash chain, making retroactive edits detectable.\n\n## Overview\n\nThis crate provides an append-only audit log where each entry is cryptographically linked to its predecessor. Each entry stores the SHA-256 digest of its own contents concatenated with the previous entry's hash, forming a continuous chain. Any modification to a past entry invalidates every subsequent hash, providing strong tamper evidence.\n\nThe crate was extracted from `librefang-runtime` as part of the #3710 god-crate split. Downstream consumers should not need to change imports — `librefang-runtime` re-exports this crate at its historical path (`runtime::audit`).\n\n## Architecture\n\n```mermaid\nflowchart LR\n    E1[Entry N-1] -->|prev_hash| E2[Entry N]\n    E2 -->|SHA-256| E3[Entry N+1]\n\n    subgraph \"Entry N\"\n        direction TB\n        P[payload fields]\n        H[prev_hash]\n        C[\"hash = SHA-256(payload || prev_hash)\"]\n    end\n\n    subgraph \"Persistence\"\n        DB[(SQLite audit_entries)]\n    end\n\n    E2 -.->|with_db| DB\n```\n\n## How the Hash Chain Works\n\n1. **Genesis entry** — The first entry uses a fixed sentinel value (typically all-zero bytes) as `prev_hash`.\n2. **Subsequent entries** — Each entry computes `hash = SHA-256(serialize(entry_fields) || prev_hash)`, where `prev_hash` is the hash of the immediately preceding entry.\n3. **Verification** — Walking the chain from genesis forward and recomputing each hash confirms integrity. A mismatch at any position indicates that the entry or an earlier one was altered.\n\nThis is a linear Merkle chain (a Merkle tree with a single branch), chosen for simplicity and deterministic verification.\n\n## Persistence\n\nWhen the audit log is constructed **with_db**, entries are written to the `audit_entries` table in SQLite (schema V8). This ensures the chain survives daemon restarts and process crashes. The connection pool is managed via `r2d2` and `r2d2_sqlite`.\n\nKey properties of the persistence layer:\n\n- **Append-only** — Entries are never updated or deleted by normal operations.\n- **Atomic** — Each entry insertion is a single transaction, preventing partial writes.\n- **Restart-safe** — On startup, the log reads the last known hash from the database to continue the chain seamlessly.\n\nWithout `with_db`, the chain operates in-memory only and is lost when the process exits.\n\n## Dependencies\n\n| Dependency | Purpose |\n|---|---|\n| `librefang-types` | Shared type definitions for audit events |\n| `sha2` | SHA-256 hashing for the Merkle chain |\n| `hex` | Hex encoding of digests for storage and display |\n| `chrono` | Timestamps on audit entries |\n| `rusqlite` / `r2d2` / `r2d2_sqlite` | SQLite storage with connection pooling |\n| `serde` / `serde_json` | Serialization of entry payloads for hashing and storage |\n| `tracing` | Structured logging of audit operations |\n| `metrics` | Operational metrics (entry count, chain length, verification results) |\n\n## Integration with the Workspace\n\n```\nlibrefang-types\n       ↓\nlibrefang-runtime-audit\n       ↓\nlibrefang-runtime  (re-exports as runtime::audit)\n```\n\n`librefang-runtime` re-exports this crate, so existing call sites using `runtime::audit` continue to work without modification. Direct dependency on `librefang-runtime-audit` is only necessary for crates that need audit functionality without pulling in the full runtime.\n\n## Testing\n\nTests use the `tempfile` crate to create ephemeral SQLite databases, ensuring isolation between test cases. Verification routines are tested against known chains to confirm that both valid chains pass and tampered chains fail detection.\n\n## Schema Reference\n\nThe `audit_entries` table (schema V8) stores the chain on disk. Each row corresponds to one audit entry and includes the serialized payload, the previous entry's hash, and the computed hash for that entry. The exact column layout is defined in the database migration files within the workspace schema directory.","other-librefang-runtime-mcp-tests":"# Other — librefang-runtime-mcp-tests\n\n# HttpCompat Transport — Integration Tests\n\n**File:** `librefang-runtime-mcp/tests/http_compat_integration.rs`\n\n## Purpose\n\nEnd-to-end integration tests for the `HttpCompat` MCP transport. `HttpCompat` is the simplest transport in the MCP stack: it maps declared tool calls onto plain HTTP/JSON requests against a user-supplied base URL, without performing an MCP `initialize` handshake. Because it requires no protocol-speaking peer, it is the ideal candidate for lightweight integration testing against a real HTTP server.\n\nThe tests spin up a `wiremock` server on each run, configure an `McpConnection` with `HttpCompat` transport, and assert correct behaviour through the public API (`connect`, `tools()`, `call_tool`).\n\n---\n\n## What the Tests Verify\n\n| # | Behaviour | Test function |\n|---|-----------|---------------|\n| 1 | `McpConnection::connect` succeeds and registers declared tools under the namespaced `mcp_<server>_<tool>` naming convention. | `http_compat_connect_registers_namespaced_tools` |\n| 2 | `call_tool` issues a real HTTP request, interpolates path-template parameters (`{city}`), sends remaining args as query parameters, attaches configured headers, and returns the response body verbatim. | `http_compat_call_tool_renders_path_and_returns_body` |\n| 3 | Calling a tool name that was never registered produces an error containing a clear \"not found\" / \"unknown\" / \"does not exist\" message. | `http_compat_call_tool_unknown_name_errors` |\n\n---\n\n## Test Architecture\n\n```mermaid\nsequenceDiagram\n    participant Test\n    participant McpConnection\n    participant WireMock\n\n    Test->>McpConnection: connect(config)\n    McpConnection->>WireMock: GET / (probe)\n    WireMock-->>McpConnection: 200\n    McpConnection-->>Test: conn (tools registered)\n\n    Test->>McpConnection: call_tool(\"mcp_test-server_get_weather\", args)\n    McpConnection->>WireMock: GET /weather/Paris?units=metric<br/>x-test-token: integration-fixture\n    WireMock-->>McpConnection: {\"city\":\"Paris\",\"tempC\":18}\n    McpConnection-->>Test: response body\n```\n\n---\n\n## Helper Functions\n\n### `http_compat_config(base_url, tools) -> McpServerConfig`\n\nBuilds a complete `McpServerConfig` wired with `McpTransport::HttpCompat`. Every test configures:\n\n- **Server name:** `\"test-server\"` — used as the namespace prefix in tool names.\n- **Static header:** `x-test-token: integration-fixture` — verifies header injection on every call.\n- **Timeout:** 5 seconds.\n- **Taint scanning:** disabled (empty rule sets via `empty_taint_rule_sets_handle()`).\n\nAll other optional fields (`oauth_provider`, `oauth_config`, `roots`, `env`) are left at their defaults / empty.\n\n### `weather_tool() -> HttpCompatToolConfig`\n\nReturns a canonical tool fixture used by all three tests:\n\n| Field | Value |\n|-------|-------|\n| `name` | `\"get_weather\"` |\n| `description` | `\"Look up current weather by city\"` |\n| `path` | `\"/weather/{city}\"` — one path-template parameter |\n| `method` | `HttpCompatMethod::Get` |\n| `request_mode` | `HttpCompatRequestMode::Query` — non-path args become query parameters |\n| `response_mode` | `HttpCompatResponseMode::Json` — backend JSON forwarded verbatim |\n| `input_schema` | JSON Schema requiring `\"city\"` (string), optional `\"units\"` (string) |\n\n---\n\n## Test Details\n\n### `http_compat_connect_registers_namespaced_tools`\n\n**What it proves:** After `connect`, the tool list includes the fully namespaced tool name `mcp_test-server_get_weather`. This naming convention is critical — the agent loop, dashboard, and tool-dispatch layer all key off the prefixed form. A regression here breaks end-to-end tool dispatch.\n\n**How it works:**\n\n1. Start a `wiremock` server with a catch-all `GET /` that returns 200 (the connect-phase probe).\n2. Build an `McpServerConfig` with one `weather_tool`.\n3. Call `McpConnection::connect(config)`.\n4. Assert `conn.tools()` contains `format_mcp_tool_name(\"test-server\", \"get_weather\")`.\n5. Assert `conn.name()` returns `\"test-server\"`.\n\n### `http_compat_call_tool_renders_path_and_returns_body`\n\n**What it proves:** The driver correctly:\n\n- Renders `{city}` from the call arguments into the URL path.\n- **Consumes** the path key so it does not also appear as a query parameter.\n- Sends remaining arguments (`units=metric`) as query parameters.\n- Attaches the static header from the transport config.\n- Returns the backend response body verbatim (JSON passthrough).\n\n**How it works:**\n\n1. Set up two mock endpoints on the wiremock server:\n   - `GET /` → 200 (connect probe).\n   - `GET /weather/Paris` with `units=metric` query param and `x-test-token` header → 200 with JSON body `{\"city\":\"Paris\",\"tempC\":18}`. Marked `expect(1)` to verify exactly one call.\n2. Connect, then call the namespaced tool with `{\"city\": \"Paris\", \"units\": \"metric\"}`.\n3. Assert the response string contains `\"city\"`, `\"Paris\"`, and `\"18\"` — proving the backend payload round-trips to the caller.\n\n### `http_compat_call_tool_unknown_name_errors`\n\n**What it proves:** Calling a tool that was never declared in the config fails with a descriptive error rather than issuing an arbitrary HTTP request.\n\n**How it works:**\n\n1. Connect with one registered tool (`get_weather`).\n2. Call `call_tool(\"mcp_test-server_does_not_exist\", {})`.\n3. Assert the call returns `Err` whose message contains \"not found\", \"unknown\", or \"does not exist\".\n\n---\n\n## Dependencies on the Parent Crate\n\nThe tests exercise these public items from `librefang_runtime_mcp`:\n\n| Item | Usage |\n|------|-------|\n| `McpConnection::connect` | Entry point to establish a transport connection |\n| `McpConnection::call_tool` | Dispatch a tool call through the transport |\n| `McpConnection::tools()` | Read the list of registered tools post-connect |\n| `McpConnection::name()` | Read the server name |\n| `McpTransport::HttpCompat` | Variant in the transport enum |\n| `McpServerConfig` | Configuration struct for a server |\n| `format_mcp_tool_name` | Utility to build the `mcp_<server>_<tool>` name |\n| `empty_taint_rule_sets_handle` | Provides a no-op taint rule handle |\n\nFrom `librefang_types::config`:\n\n- `HttpCompatHeaderConfig`, `HttpCompatMethod`, `HttpCompatRequestMode`, `HttpCompatResponseMode`, `HttpCompatToolConfig`\n\n---\n\n## Running the Tests\n\n```bash\n# Run just this test file\ncargo test -p librefang-runtime-mcp --test http_compat_integration\n\n# Run with output visible\ncargo test -p librefang-runtime-mcp --test http_compat_integration -- --nocapture\n```\n\nEach test is `#[tokio::test]`-annotated and starts its own isolated `wiremock::MockServer` — no shared state, no port conflicts, safe to run in parallel.","other-librefang-runtime-media":"# Other — librefang-runtime-media\n\n# librefang-runtime-media\n\nMedia generation drivers for LibreFang. Provides a provider-agnostic abstraction layer for text-to-speech, image generation, video generation, music generation, and media understanding (speech-to-text, image/audio analysis).\n\n## Architecture\n\n```mermaid\ngraph TD\n    A[librefang-runtime] -->|re-exports| B[librefang-runtime-media]\n    B --> C[MediaDriver trait]\n    B --> D[MediaDriverCache]\n    B --> E[media_understanding]\n    C --> F[elevenlabs]\n    C --> G[gemini]\n    C --> H[google_tts]\n    C --> I[minimax]\n    C --> J[openai]\n    E --> K[speech-to-text]\n    E --> L[image/audio analysis]\n```\n\n## Purpose\n\nThis crate was extracted from `librefang-runtime` during the god-crate split (#3710 Phase 1). It encapsulates all media generation and analysis logic behind a provider-agnostic interface modeled after the patterns in `librefang-llm-drivers`.\n\nDownstream consumers should not import this crate directly. `librefang-runtime` re-exports it at the historical paths `runtime::media` and `runtime::media_understanding` behind its default-on `media` feature flag. Existing call sites require no import changes.\n\n## Core Components\n\n### `MediaDriver` Trait\n\nThe central abstraction. Each media modality has its own method on the trait. Providers that do not support a given modality return a typed `NotSupported` error rather than panicking or returning a generic failure. This allows callers to attempt fallback providers or gracefully degrade.\n\nSupported modalities:\n\n- **TTS** — text-to-speech synthesis\n- **Image** — image generation\n- **Video** — video generation\n- **Music** — music generation\n\nThe trait is async (`#[async_trait]`) and implementations rely on `reqwest` for HTTP communication with provider APIs.\n\n### `MediaDriverCache`\n\nA lazy-initialization, thread-safe cache for `MediaDriver` instances, backed by `DashMap`. Features:\n\n- **Lazy init**: drivers are constructed on first access, not at startup.\n- **Thread safety**: concurrent tasks can request the same driver without races.\n- **Per-provider URL overrides**: allows pointing a provider at a custom endpoint (useful for proxies, self-hosted alternatives, or testing).\n\n### Provider Implementations\n\n| Provider | Module | Primary Modality | Notes |\n|---|---|---|---|\n| ElevenLabs | `elevenlabs` | TTS | Voice selection; API key via `ELEVENLABS_API_KEY` env var |\n| Gemini | `gemini` | Image, Video | Google's multimodal model |\n| Google TTS | `google_tts` | TTS | Google Cloud Text-to-Speech |\n| MiniMax | `minimax` | Image, Video, Music | Multi-modal generation |\n| OpenAI | `openai` | Image, TTS | DALL·E and TTS endpoints |\n\n### `media_understanding`\n\nA companion module handling the inverse direction — consuming media rather than generating it:\n\n- **Speech-to-text** (transcription)\n- **Image analysis** (description, classification)\n- **Audio analysis**\n\nThis module routes requests to the appropriate provider based on configuration, mirroring the same driver abstraction used for generation.\n\n## Dependencies\n\nKey external crates used:\n\n- **`reqwest`** / **`tokio`** — async HTTP communication with provider APIs\n- **`dashmap`** — concurrent map for `MediaDriverCache`\n- **`async-trait`** — trait object support for async methods\n- **`serde_json`** — request/response serialization\n- **`base64`** / **`hex`** — encoding for media payloads and signatures\n- **`tracing`** — structured logging throughout driver operations\n\nInternal dependencies:\n\n- **`librefang-types`** — shared type definitions (request/response types, error types)\n- **`librefang-http`** — shared HTTP client configuration and middleware\n\n## Testing\n\nThe test suite uses `serial_test` (version 3, pinned to match the workspace) to serialize environment-mutating tests. Specifically, ElevenLabs voice ID validation tests modify `ELEVENLABS_API_KEY` and must not run concurrently to avoid race conditions.\n\n## Integration with LibreFang\n\n```mermaid\ngraph LR\n    A[Application Code] --> B[librefang-runtime]\n    B -->|media feature| C[librefang-runtime-media]\n    C --> D[Provider APIs]\n    C --> E[librefang-http]\n    C --> F[librefang-types]\n```\n\n- **Import path**: Use `runtime::media` and `runtime::media_understanding` from `librefang-runtime`.\n- **Feature gate**: Enabled by the default `media` feature on `librefang-runtime`.\n- **No breaking changes**: The re-export preserves the historical module paths from before the extraction.\n\n## Adding a New Provider\n\n1. Create a new module under `src/` (e.g., `src/newprovider.rs`) and register it in `mod.rs`.\n2. Implement `MediaDriver` for a struct representing the provider's client.\n3. Return `NotSupported` for modalities the provider doesn't handle.\n4. Add the provider variant to whatever dispatch/enum is used for provider selection.\n5. Register the provider in `MediaDriverCache` so it can be lazily constructed and cached.\n6. Add configuration support (API key env var, endpoint URL override) following the patterns of existing providers.","other-librefang-runtime-sandbox-docker":"# Other — librefang-runtime-sandbox-docker\n\n# librefang-runtime-sandbox-docker\n\nDocker container sandbox for LibreFang tool execution. Provides OS-level isolation by spawning commands inside Docker containers with strict resource limits, network isolation, and capability dropping.\n\nPart of the [#3710 god-crate split](https://github.com/librefang/librefang/issues/3710) — Phase 1.\n\n## Architecture\n\n```mermaid\ngraph TD\n    A[librefang-runtime] -->|\"re-exports at runtime::docker_sandbox\"| B[librefang-runtime-sandbox-docker]\n    B --> C[Docker API]\n    B --> D[librefang-types]\n    B --> E[helpers module]\n    E -->|\"parity-tested\"| F[shell metacharacter denylist]\n```\n\n## Where This Fits\n\nThis crate was extracted from `librefang-runtime` as a standalone module. The parent crate re-exports it at the historical path `runtime::docker_sandbox`, so downstream call sites do not need to change imports.\n\nIt is gated behind the `docker-sandbox` feature flag on `librefang-runtime`, which is **enabled by default**.\n\n### Integration Points\n\n| Direction | Crate | Path / Mechanism |\n|-----------|-------|------------------|\n| Re-exported by | `librefang-runtime` | `runtime::docker_sandbox` |\n| Feature flag | `librefang-runtime` | `docker-sandbox` (default-on) |\n| Parity tests | `librefang-runtime/tests/` | `docker_sandbox_helpers_parity.rs` |\n| Depends on | `librefang-types` | Shared type definitions |\n\n## Security Model\n\nThe sandbox enforces several layers of isolation:\n\n- **Resource limits** — CPU and memory constraints on spawned containers\n- **Network isolation** — Containers run without network access\n- **Capability dropping** — Linux capabilities are stripped from container processes\n- **Shell metacharacter inspection** — User-supplied commands are vetted against a denylist via the helpers module\n\nThe shell metacharacter denylist is parity-tested against the parent crate's implementation in `crates/librefang-runtime/tests/docker_sandbox_helpers_parity.rs` to ensure consistent behavior across both locations.\n\n## Dependencies\n\n| Dependency | Purpose |\n|------------|---------|\n| `librefang-types` | Shared type definitions for the LibreFang workspace |\n| `tokio` | Async runtime for container lifecycle management |\n| `tracing` | Structured logging and instrumentation |\n| `dashmap` | Concurrent hashmap for tracking active containers |\n| `chrono` | Timestamp handling for container metadata |\n| `sha2` | SHA hashing — likely for container image or config digesting |\n\n## Contributing\n\nWhen modifying this crate, ensure:\n\n1. The helpers module remains parity-tested with the parent crate — run `docker_sandbox_helpers_parity.rs` in `librefang-runtime/tests/`.\n2. The re-export path `runtime::docker_sandbox` in `librefang-runtime` continues to work.\n3. Feature flag semantics (`docker-sandbox`, default-on) are preserved.\n4. All new shell metacharacter rules are added to both this crate and the parity test.\n\n## References\n\n- [Workspace README](../../README.md)\n- [librefang-runtime README](../librefang-runtime/README.md)","other-librefang-runtime-src":"# Other — librefang-runtime-src\n\n# Agent Loop Test Suite (`librefang-runtime/src/agent_loop/tests/`)\n\n## Overview\n\nThis is the test module for the agent loop — the core iterative conversation engine that drives LLM completion, tool execution, response assembly, and session persistence. The tests validate correctness guards for edge cases that have caused production incidents: empty responses, cascade leaks, hallucinated actions, and lost metadata across streaming/non-streaming paths.\n\nThe test suite is organized into four submodules:\n\n| Module | Focus |\n|---|---|\n| `mod.rs` | Unit tests for utilities, sanitizers, leak detectors, tool resolution caching, and invariant guards |\n| `integration.rs` | End-to-end integration tests with mock LLM drivers driving `run_agent_loop` and `run_agent_loop_streaming` |\n| `recovery.rs` | Exhaustive coverage of text-to-tool-call recovery across 9+ model-specific output patterns |\n| `sender.rs` / `utilities.rs` | Message preparation, session repair, tool staging, and proactive memory (not shown in source) |\n\n## Architecture\n\n```mermaid\ngraph TD\n    subgraph \"Test Infrastructure\"\n        MD[Mock Drivers]\n        TM[test_manifest]\n        FS[fresh_session]\n        RAL[\"run_agent_loop / run_agent_loop_streaming\"]\n    end\n\n    subgraph \"What's Being Validated\"\n        ER[Empty Response Guards]\n        CL[Cascade Leak Detection]\n        HF[Hallucinated Action Detection]\n        TF[Text Tool-Call Recovery]\n        HR[History Fold Persistence]\n        DP[Directive Preservation]\n        SP[Session Ephemeral Options]\n    end\n\n    MD --> RAL\n    TM --> RAL\n    FS --> RAL\n    RAL --> ER\n    RAL --> CL\n    RAL --> DP\n    RAL --> SP\n    RAL --> HR\n```\n\n## Mock Driver Infrastructure\n\nAll integration tests inject mock `LlmDriver` implementations that return deterministic `CompletionResponse` values without network calls. Each driver simulates a specific LLM misbehavior.\n\n### Available Mock Drivers\n\n| Driver | Behavior | Tests |\n|---|---|---|\n| `NormalDriver` | Returns `\"Hello from the agent!\"` with `EndTurn` | Sanity baseline — normal responses pass through unchanged |\n| `EmptyAfterToolUseDriver` | Call 0: `ToolUse` with no text. Call 1: empty `EndTurn` | Empty response after tool-use cycle returns fallback, not empty string |\n| `EmptyMaxTokensDriver` | Always returns empty content with `MaxTokens` | Max continuations cap returns fallback message |\n| `EmptyThenNormalDriver` | Call 0: empty `EndTurn`. Call 1: normal text | Iteration-0 empty response retry logic |\n| `AlwaysEmptyDriver` | Always returns empty `EndTurn` | Fallback when retry also fails |\n| `AlwaysFailingToolDriver` | Always emits tool call for unregistered tool | `RepeatedToolFailures` circuit breaker |\n| `FailThenTextDriver` | Call 0: tool call. Call 1: text response | Loop retries after tool failure |\n| `DirectiveDriver` | Returns configurable text with `[[reply:...]]` directives | Directive parsing in `EndTurn` and `MaxTokens` paths |\n| `NotifyOwnerThenMaxTokensDriver` | Call 0: `notify_owner` tool. Call 1+: `MaxTokens` (optional tool calls) | Owner notice, `actual_provider`, session persistence with continuations |\n| `CascadeLeakTimedOutDriver` | Streams text then returns `LlmError::TimedOut` | Cascade leak suppression of timeout partial text |\n| `MultiToolCycleDriver` | N tool-use rounds then `EndTurn`; records all `CompletionRequest` messages | History fold stub appearance in LLM request |\n| `FoldSummaryDriver` | Returns deterministic fold summary | Aux driver for history fold summarization |\n\nAll drivers use `AtomicU32` call counters for thread-safe state tracking in async contexts.\n\n### Helper Functions\n\n- **`test_manifest()`** — Returns a minimal `AgentManifest` with a test agent name and system prompt.\n- **`fresh_session()`** — Creates a new in-memory `Session` with fresh IDs and no messages.\n- **`fake_tool(name)`** — Creates a `ToolDefinition` with a JSON object schema.\n- **`notify_owner_tool_definition()`** — Returns the `notify_owner` tool definition used in owner-notice tests.\n- **`run_streaming_for_test()`** — Wraps `run_agent_loop_streaming` with sensible defaults for test ergonomics.\n\n## Key Behaviors Validated\n\n### Empty Response Guards\n\nThe agent loop must never return an empty string to the caller. `finalize_end_turn_text` implements a three-way fallback:\n\n1. **Final text non-empty** → use it (accumulated buffer ignored)\n2. **Final text empty + accumulated non-empty** → use accumulated buffer\n3. **Both empty** → emit canned guard message:\n   - Tools were executed → `\"Task completed\"`\n   - No tools → `\"empty response\"` message\n\nTests cover this for both `run_agent_loop` and `run_agent_loop_streaming` paths, including the iteration-0 retry that gives the LLM a second chance before emitting the fallback.\n\n### Cascade Leak Detection\n\n`is_cascade_leak` detects when the LLM leaks internal conversation structure (envelope markers like `[Group message from ...]` plus turn frames like `User asked:` / `I responded:`) into its output. The detector requires **two or more** structural markers to trip — single markers and thematic-only headers (`## Calendar`, `## Tasks`) are legitimate and must not trigger false positives.\n\nKey properties:\n- Envelope prefixes (`ENVELOPE_LINE_PREFIXES`) are a subset of cascade structural markers — ensures `sanitize_for_memory` and the leak guard agree\n- Thematic headers alone are legitimate (prevents false positives on help replies)\n- The guard fires in both streaming and non-streaming paths, including when `stop_reason` is `ToolUse`\n- Timeout partial text (`LlmError::TimedOut` with `partial_text`) is also suppressed when the cascade leak fires — no `TextDelta` events reach the caller\n\n### Hallucinated Action Detection\n\n`looks_like_hallucinated_action` catches when the LLM claims to have completed a domain action (file creation, message sending, payment booking) without actually calling a tool. It covers:\n\n- **English**: `\"I've created...\"`, `\"Successfully modified...\"`, `\"I've sent the message...\"`\n- **Italian present perfect**: `\"Ho registrato...\"`, `\"Ho inviato...\"`, `\"Ho prenotato...\"`\n- **Italian impersonal**: `\"è stato inviato\"`, `\"Operazione completata\"`\n\nNeutral text (`\"Vuoi che registri questa spesa?\"`) must never trigger — a false positive wastes an in-loop retry iteration.\n\n### Reply Directive Preservation\n\nDirectives (`[[reply:msg_id]]`, `[[@current]]`) must survive through all response paths:\n- Normal `EndTurn` — directives parsed, stripped from visible text\n- `MaxTokens` partial — directives preserved even in short-circuited single-iteration path\n- Streaming `MaxTokens` — identical preservation as non-streaming\n- Streaming empty + `MaxTokens` — directives absent (correct, since no text to parse)\n\n### Session Persistence and Ephemeral Options\n\nSession saves respect three modes:\n\n| Option | Persists Session? |\n|---|---|\n| Default | ✅ Yes |\n| `incognito: true` | ❌ No |\n| `is_fork: true` | ❌ No |\n\nTests verify persisted sessions contain the original user message, assistant partial, and (when continuations ran) the `\"Please continue.\"` prompt — all verified against the in-memory `MemorySubstrate`.\n\n### History Fold Persistence (Issue #4866)\n\n`maybe_fold_stale_tool_results` must:\n1. Rewrite stale `ToolResult` blocks in the working clone with `[history-fold]` stubs\n2. **Replay the same rewrites onto `session.messages`** (the durable record)\n3. Advance `messages_generation` via `mark_messages_mutated()` so `save_session_async` detects the mutation\n4. Preserve every original `tool_use_id` — pairing invariant\n5. **Skip rewriting on subsequent calls** (the `is_already_folded` short-circuit) — without this, every turn refolds from scratch\n\n### Tool Resolution and Caching\n\n`ResolvedToolsCache` provides `Arc<[ToolDefinition]>` caching with lazy/eager mode:\n\n- **Lazy mode** (tool count > `LAZY_TOOLS_THRESHOLD` + `tool_load` present): trims to session-loaded tools\n- **Eager fallback**: if `tool_load` is absent from the pool, returns full list regardless of threshold\n- **Cache identity**: stable inputs return the same `Arc` (verified via `Arc::ptr_eq`)\n- **Cache invalidation**: growing `session_loaded_tools` rebuilds the cache in lazy mode; non-lazy mode never rebuilds on session growth\n\n### Text Tool-Call Recovery\n\n`recover_text_tool_calls` parses tool calls from LLM text output when models fail to use proper structured tool-use fields. Supports 9+ patterns:\n\n| Pattern | Example | Origin |\n|---|---|---|\n| `<function=NAME>JSON<\/function>` | `<function=web_search>{\"query\":\"rust\"}<\/function>` | Groq/Llama |\n| `<function>NAME{JSON}<\/function>` | `<function>web_search{\"query\":\"x\"}<\/function>` | Variant format |\n| `<tool>NAME{JSON}<\/tool>` | `<tool>exec{\"command\":\"ls\"}<\/tool>` | Alternative tag |\n| Markdown code block | `` ```json\\nweb_search {\"query\":\"x\"}\\n``` `` | Some models |\n| Backtick-wrapped | `` `exec {\"command\":\"pwd\"}` `` | Inline code |\n| `[TOOL_CALL]...[/TOOL_CALL]` with JSON or arrow syntax | Issue #354 format | |\n| `<Qwen-style tags>` | Issue #332 format | Qwen3 |\n| Bare JSON object | `{\"name\":\"exec\",\"arguments\":{...}}` | Fallback |\n| XML attribute style | `<function name=\"...\" parameters=\"...\" />` | XML-structured output |\n\nAll patterns validate against the registered tool allowlist — unknown tools are silently rejected. Duplicate recovery across patterns is prevented. The parser handles nested JSON, stringified args, whitespace variants, and edge cases (unclosed tags, missing brackets).\n\n## Constants Verified by Tests\n\n| Constant | Value | Purpose |\n|---|---|---|\n| `MAX_ITERATIONS` | Matches `AutonomousConfig::DEFAULT_MAX_ITERATIONS` | Per-turn iteration cap |\n| `MAX_RETRIES` | 3 | LLM retry attempts |\n| `BASE_RETRY_DELAY_MS` | 1000 | Retry backoff base |\n| `DEFAULT_MAX_HISTORY_MESSAGES` | 60 | History window size |\n| `ACCUMULATED_TEXT_MAX_BYTES` | (defined in `message` module) | Buffer growth cap |\n\n## Invariant Guards\n\n### `silent_result_has_empty_response`\n\nWhen `result.silent == true`, `result.response` must be `\"\"`. No sentinel string ever escapes the runtime as visible text. Enforced by `build_silent_agent_loop_result`.\n\n### `silent_response_single_source_of_truth`\n\nA grep-guard test that enforces the literal `NO_REPLY` appears only in an explicit allow-list of files. Any new occurrence must either delegate to the canonical `silent_response::is_silent_response` detector or be added to the allow-list with rationale. This prevents divergent silent-detection logic from accumulating across the codebase.\n\n### `envelope_prefixes_are_a_subset_of_cascade_structural_markers`\n\nEvery envelope that `sanitize_for_memory` strips must also be detectable by `is_cascade_leak`. Without this invariant, a legacy memory row containing an envelope would keep tripping the leak guard without ever being repaired.\n\n## Adding New Tests\n\n1. **For a new mock driver**: implement `LlmDriver` with `AtomicU32` call counting. Place the struct in `integration.rs` if used by multiple tests, or inline in the test function if single-use.\n\n2. **For testing a new response path**: use `run_agent_loop` for non-streaming, `run_streaming_for_test` for streaming. Both accept the same mock driver infrastructure. Pass `&[]` for tools when testing tool-free paths.\n\n3. **For new text recovery patterns**: add tests in `recovery.rs` following the existing pattern — create a `Vec<ToolDefinition>`, call `recover_text_tool_calls(text, &tools)`, assert on the returned calls. Verify both valid and unknown-tool rejection.\n\n4. **For session persistence tests**: use `MemorySubstrate::open_in_memory(0.01)` and verify via `memory.get_session(session.id)` after the loop completes.","other-librefang-skills":"# Other — librefang-skills\n\n# librefang-skills\n\nSkill system for LibreFang — provides the registry, filesystem loader, marketplace client, and OpenClaw compatibility layer for discovering, loading, and managing skills.\n\n## Overview\n\nA **skill** in LibreFang is a self-contained unit of functionality that can be discovered, loaded, and executed at runtime. This crate provides the infrastructure for the full skill lifecycle:\n\n- **Discovery** — scanning directories and remote sources for available skills\n- **Loading** — reading skill manifests, validating metadata, and preparing skills for use\n- **Registry** — an in-memory index of loaded skills with lookup by name, tag, or category\n- **Marketplace** — a client for downloading and installing skills from a remote marketplace\n- **OpenClaw Compatibility** — support for loading skills authored for the OpenClaw format\n\n## Architecture\n\n```mermaid\ngraph TD\n    A[Skill Registry] --> B[Local Loader]\n    A --> C[Marketplace Client]\n    B --> D[Filesystem Scanner]\n    B --> E[Manifest Parser]\n    C --> F[HTTP / TLS]\n    C --> G[Package Verifier]\n    E --> H[TOML / YAML / JSON]\n    G --> I[SHA-256 Hash Check]\n    A --> J[OpenClaw Adapter]\n```\n\n## Key Concepts\n\n### Skill Manifests\n\nEvery skill is described by a manifest file containing metadata such as:\n\n- Unique identifier and display name\n- Semantic version (`semver`)\n- Author information\n- Tags and categories for discovery\n- Compatibility requirements\n- Entry point definition\n\nManifests may be authored in **TOML**, **YAML**, or **JSON** — all three formats are supported by the loader.\n\n### Versioning\n\nSkill versions follow [Semantic Versioning](https://semver.org/) and are validated using the `semver` crate. This enables:\n\n- Version constraint resolution when skills declare dependencies on one another\n- Compatibility checks during loading\n- Upgrade detection in the marketplace client\n\n### Integrity Verification\n\nDownloaded skill packages are verified using **SHA-256** hashes (`sha2` + `hex`). This ensures that marketplace-sourced skills have not been tampered with during transit.\n\n### File Locking\n\nThe `fs2` dependency provides file-level locking for the local skill store. This prevents corruption when multiple processes or concurrent tasks attempt to install, update, or remove skills simultaneously.\n\n## Components\n\n### Local Loader\n\nScans a configured directory tree using `walkdir`, parses each discovered manifest, and registers valid skills. Invalid or malformed manifests are logged via `tracing` and skipped rather than causing a panic.\n\nThe loader is designed to be called at startup and optionally on-demand when the skill directory changes.\n\n### Skill Registry\n\nAn in-memory collection of loaded skills supporting:\n\n- Lookup by exact name or ID\n- Filtering by tags or categories\n- Iteration over all registered skills\n\nThe `aho-corasick` crate powers fast multi-pattern matching across skill names and tags, enabling efficient batch lookups.\n\n### Marketplace Client\n\nAn async HTTP client built on `reqwest` with TLS via `rustls`. It supports:\n\n- Browsing available skills from a remote marketplace\n- Downloading skill packages (ZIP archives, unpacked via the `zip` crate)\n- Verifying package integrity against published hashes\n- Tracking download timestamps using `chrono`\n\nCertificate roots are sourced from both `webpki-roots` (Mozilla's bundled roots) and `rustls-native-certs` (the system certificate store), ensuring compatibility across platforms.\n\n### OpenClaw Adapter\n\nProvides a compatibility layer that translates OpenClaw-format skill manifests and packages into the native LibreFang skill representation. This allows the ecosystem to leverage existing OpenClaw skills without modification.\n\n## Error Handling\n\nAll fallible operations return `Result<T, SkillError>` where `SkillError` is derived via `thiserror`. Error variants cover:\n\n- Manifest parsing failures (invalid TOML/YAML/JSON, missing required fields)\n- Version constraint violations\n- Filesystem I/O errors during scanning or installation\n- Network errors from marketplace operations\n- Hash verification failures\n- File locking conflicts\n\nErrors are instrumented with `tracing` spans to provide context in logs.\n\n## Async Runtime\n\nAll I/O-bound operations (directory scanning, HTTP requests, file extraction) are `async` and require a `tokio` runtime. The crate does not create its own runtime — callers must ensure one is available, typically by running within a `#[tokio::main]` function or a Tokio task.\n\n## Integration with libreFang\n\nThis crate depends on `librefang-types` for shared data structures — primarily the `Skill` type and related metadata structs. Other crates in the workspace consume `librefang-skills` to:\n\n- Query the registry for available skills at runtime\n- Trigger skill installation from the marketplace\n- Reload skills after directory changes\n\n## Testing\n\nTests use `tempfile` for isolated filesystem operations and `serial_test` to serialize tests that share filesystem state. This avoids flaky tests caused by concurrent access to temporary directories.","other-librefang-telemetry":"# Other — librefang-telemetry\n\n# librefang-telemetry\n\nOpenTelemetry + Prometheus metrics instrumentation for LibreFang.\n\n## Purpose\n\nThis module serves as the centralized metrics definitions and instrumentation layer for the LibreFang system. It depends on the [`metrics`](https://docs.rs/metrics) facade crate and `librefang-types`, providing a single place to define counters, gauges, histograms, and labels used across the project.\n\nBecause metrics definitions are co-located here rather than scattered throughout business logic, any consumer in the workspace can record telemetry without importing backend-specific crates directly.\n\n## Dependencies\n\n| Crate | Role |\n|---|---|\n| `metrics` | Vendor-agnostic metrics facade. Provides macros like `counter!`, `gauge!`, `histogram!`, and `increment_counter!` that route to whatever exporter is installed at runtime. |\n| `librefang-types` | Shared domain types. Telemetry labels and metric names often reference enums or structs defined in the types crate (e.g., message kinds, connection states). |\n\n## Architecture\n\n```mermaid\ngraph LR\n    A[librefang-telemetry] -->|depends on| B[metrics facade]\n    A -->|depends on| C[librefang-types]\n    D[Application binary] -->|uses| A\n    D -->|installs exporter| E[metrics-exporter-prometheus]\n    B -.->|routes through| E\n```\n\nThe application binary is responsible for installing a concrete exporter (e.g., `metrics-exporter-prometheus`). Once installed, every macro call emitted by code that depends on `librefang-telemetry` is routed to that exporter. This module does **not** itself start an HTTP server or bind a scrape endpoint.\n\n## Usage\n\nOther workspace crates add `librefang-telemetry` as a dependency and call into its metric helpers or re-exported macros. The typical flow:\n\n1. **At startup**, the binary crate installs a Prometheus exporter on a known port.\n2. **At runtime**, library crates call metrics functions defined or re-exported here.\n3. **At scrape time**, Prometheus hits the exporter's endpoint and collects aggregated values.\n\n## Integration Notes\n\n- **No execution flows originate here.** This is a pure definition/utility module with no side effects of its own. It exposes constants, helper functions, and/or macros that other crates call.\n- **Adding new metrics:** Define new metric names and label constants in this crate so they remain discoverable and consistent.\n- **Testing:** Because `metrics` is a facade, tests can run without a real exporter installed—recorded values are simply no-ops unless an exporter is explicitly set up in the test harness.","other-librefang-testing-src":"# Other — librefang-testing-src\n\n# librefang-testing/src/tests.rs — Integration & Example Tests\n\n## Purpose\n\nThis module contains the primary integration test suite for the librefang API layer. It exercises HTTP endpoints end-to-end by spinning up an in-process router via `TestAppState`, dispatching requests through `tower::oneshot`, and asserting on status codes and JSON response bodies. It also validates the mock driver infrastructure (`MockLlmDriver`, `FailingLlmDriver`) that downstream feature tests rely on.\n\nBecause all tests run against the real router with a mock kernel, they catch wiring regressions (missing routes, wrong status codes, serde mismatches) without needing a live LLM backend or database.\n\n## Architecture\n\n```mermaid\ngraph TD\n    TC[tests.rs] -->|builds| TAS[TestAppState]\n    TAS -->|produces| R[axum Router]\n    TC -->|calls| TR[test_request helper]\n    TC -->|calls| AJO[assert_json_ok]\n    TC -->|calls| AJE[assert_json_error]\n    TC -->|constructs| MLD[MockLlmDriver]\n    TC -->|constructs| FLD[FailingLlmDriver]\n    TAS -->|uses| MKB[MockKernelBuilder]\n```\n\nEvery HTTP-level test follows the same three-step pattern: **build** → **dispatch** → **assert**.\n\n## Test Categories\n\n### 1. Read-Only Endpoint Probes\n\n| Test | Endpoint | Validates |\n|------|----------|-----------|\n| `test_health_endpoint` | `GET /api/health` | Returns 200 with `\"status\"` field (`\"ok\"` or `\"degraded\"`) |\n| `test_list_agents` | `GET /api/agents` | Returns `{ \"items\": […], \"total\": N }` with `total` as `u64` |\n| `test_version_endpoint` | `GET /api/version` | Returns 200 with a `\"version\"` field |\n\nThese tests verify the response shape and basic liveness. They use `assert_json_ok` which checks for `200 OK` and parses the body into `serde_json::Value`.\n\n### 2. Agent CRUD — Error & Edge Cases\n\n| Test | Method / Endpoint | Expected |\n|------|-------------------|----------|\n| `test_get_agent_invalid_id` | `GET /api/agents/not-a-valid-uuid` | `400 Bad Request` with `\"error\"` field |\n| `test_get_agent_not_found` | `GET /api/agents/{random-uuid}` | `404 Not Found` with `\"error\"` field |\n| `test_spawn_agent_post` | `POST /api/agents` with TOML manifest | `200 OK` or `201 Created` |\n| `test_delete_nonexistent_agent_is_idempotent` | `DELETE /api/agents/{random-uuid}` | `200 OK` with `{ \"status\": \"already-deleted\" }` |\n| `test_set_model_not_found` | `PUT /api/agents/{random-uuid}/model` | `4xx`/`5xx` |\n| `test_send_message_agent_not_found` | `POST /api/agents/{random-uuid}/message` | `404` or `400` |\n| `test_patch_agent_not_found` | `PATCH /api/agents/{random-uuid}` | `404` or `400` |\n\n#### Design note: Idempotent DELETE\n\n`test_delete_nonexistent_agent_is_idempotent` encodes a deliberate API contract: deleting a valid UUID that doesn't map to an agent returns `200 OK` with `{ \"status\": \"already-deleted\" }` rather than `404`. This prevents phantom errors from network retries or dashboard double-clicks. The `404` status is reserved exclusively for malformed UUIDs (see `test_get_agent_invalid_id`).\n\n### 3. MockLlmDriver — Response Playback & Recording\n\n**`test_mock_llm_driver_recording`** — Validates the core mock driver loop:\n\n```\nnew([\"回复1\", \"回复2\"]) → complete() → \"回复1\" → complete() → \"回复2\"\n```\n\nAfter exhaustion, asserts `driver.call_count() == 2` and inspects `recorded_calls()` to verify the `model` and `system` fields were captured faithfully.\n\n**`test_mock_llm_driver_custom_tokens_and_stop_reason`** — Exercises the builder API:\n\n```rust\nMockLlmDriver::with_response(\"test\")\n    .with_tokens(200, 100)\n    .with_stop_reason(StopReason::MaxTokens)\n```\n\nConfirms that `resp.usage.input_tokens`, `resp.usage.output_tokens`, and `resp.stop_reason` reflect the overridden values rather than defaults.\n\n### 4. FailingLlmDriver\n\n`test_failing_llm_driver` confirms that:\n\n- `FailingLlmDriver::new(\"模拟的 API 错误\")` always returns `Err` from `complete()`.\n- The error message contains the configured string.\n- `is_configured()` returns `false`.\n\nUse `FailingLlmDriver` when testing error-handling paths (retries, fallbacks, user-facing error messages) without needing a real API failure.\n\n### 5. Custom Kernel Configuration\n\n`test_custom_config_kernel` demonstrates `TestAppState::with_builder`:\n\n```rust\nTestAppState::with_builder(\n    MockKernelBuilder::new().with_config(|cfg| {\n        cfg.language = \"zh\".into();\n    })\n);\n```\n\nAfter construction, the test reads back `app.state.kernel.config_ref().language` to confirm the override took effect. Use this pattern whenever a test needs non-default runtime config (language, feature flags, timeout values).\n\n## Common Patterns\n\n### Building and dispatching a request\n\n```rust\nlet app = TestAppState::new();\nlet router = app.router();\n\nlet req = test_request(Method::GET, \"/api/health\", None);\nlet resp = router.oneshot(req).await.expect(\"request failed\");\nlet json = assert_json_ok(resp).await;\n```\n\nFor requests with a body, pass the serialized JSON string as the third argument:\n\n```rust\nlet body = serde_json::json!({ \"model\": \"gpt-4\" }).to_string();\nlet req = test_request(Method::PUT, \"/api/agents/{id}/model\", Some(&body));\n```\n\n### Asserting on error responses\n\n```rust\nlet json = assert_json_error(resp, StatusCode::BAD_REQUEST).await;\nassert!(json.get(\"error\").is_some());\n```\n\n`assert_json_error` asserts the HTTP status matches the expected code and parses the body as JSON. All error responses are expected to carry an `\"error\"` field.\n\n### Constructing CompletionRequest for driver tests\n\nThe `CompletionRequest` struct has many fields. When testing driver behaviour, copy the full construction block from existing tests and modify only the fields relevant to your scenario. The standard set uses `temperature: 0.0`, empty messages/tools, and `ReasoningEchoPolicy::default()`.\n\n## Adding New Tests\n\n1. **New endpoint test** — Follow the build → dispatch → assert pattern. Use `assert_json_ok` for success cases and `assert_json_error` for expected failures. Place it in the appropriate section (read-only, CRUD, etc.).\n2. **New driver behaviour** — Extend `MockLlmDriver` with the builder method in `mock_driver.rs`, then add a test here validating the new knob end-to-end.\n3. **Async runtime** — Use `#[tokio::test(flavor = \"multi_thread\")]` for tests that call `router()` (which may spawn background tasks). Plain `#[tokio::test]` is sufficient for pure driver tests that never touch the router.\n\n## Dependencies on Other Crates\n\n| Crate | What's used |\n|-------|-------------|\n| `librefang-runtime` | `CompletionRequest`, `LlmDriver` trait |\n| `librefang-types` | `StopReason`, `ReasoningEchoPolicy`, `model_catalog` |\n| `librefang-testing` (self) | `TestAppState`, `MockKernelBuilder`, `MockLlmDriver`, `FailingLlmDriver`, `test_request`, `assert_json_ok`, `assert_json_error` |\n| `axum` | `http::{Method, StatusCode}` |\n| `tower` | `ServiceExt::oneshot` |","other-librefang-testing":"# Other — librefang-testing\n\n# librefang-testing\n\nTest infrastructure crate providing mock implementations and API route testing utilities for the librefang workspace.\n\n## Purpose\n\nThis crate centralizes all test-only code so that downstream crates can share consistent, reusable mocks instead of each crate rolling its own. It provides three categories of test support:\n\n- **Mock kernel** — a stand-in for `librefang-kernel` that eliminates the need for real kernel resources during tests.\n- **Mock LLM driver** — simulates LLM interactions without hitting external services.\n- **API route test utilities** — helpers for constructing Axum router instances and issuing HTTP requests against them in isolation.\n\n## Dependencies & Relationships\n\n```mermaid\ngraph TD\n    T[librefang-testing]\n    T --> KT[librefang-types]\n    T --> KK[librefang-kernel]\n    T --> KR[librefang-runtime]\n    T --> KM[librefang-memory]\n    T --> KA[librefang-api]\n    KA -.->|telemetry feature| T\n```\n\nThe crate depends on nearly every sibling library in the workspace, which allows it to construct realistic test environments. The dependency on `librefang-api` is notable because it enables only the `telemetry` feature (with `default-features = false`), avoiding pulling in unnecessary production defaults while still allowing tests to observe telemetry data.\n\n### External crate rationale\n\n| Crate | Why it's here |\n|---|---|\n| `axum` + `tower` | Build test routers and service middleware stacks for route tests |\n| `http-body-util` | Read and inspect HTTP response bodies in assertions |\n| `tokio` | Async test runtime |\n| `dashmap` | Thread-safe state inside mocks (e.g., recording call histories) |\n| `arc-swap` | Atomic swapping of mock configurations mid-test |\n| `tempfile` | Create temporary directories/files for tests that touch the filesystem |\n| `toml` | Parse or generate TOML config fixtures |\n| `serde_json` | Construct and compare JSON in API responses |\n| `uuid` | Generate deterministic or random UUIDs for test entities |\n\n## Usage\n\nAdd the crate as a **dev-dependency** in the crate under test:\n\n```toml\n[dev-dependencies]\nlibrefang-testing = { path = \"../librefang-testing\" }\n```\n\nBecause this is a test-only crate, it should never appear in `[dependencies]` of a published binary or library.\n\n## Design Notes\n\n- **No production call graph.** This crate has no incoming or outgoing runtime calls in the normal execution flow. It exists exclusively on the test compilation target, so it does not contribute to binary size or compile times of production builds.\n- **Shared mocks reduce drift.** By keeping all mock implementations here, changes to `librefang-kernel` or `librefang-api` interfaces only require updating one set of mocks rather than scattered per-crate test helpers.\n- **Telemetry-enabled API dep.** The `librefang-api` dependency uses only the `telemetry` feature so tests can assert on emitted telemetry without enabling heavier default features.","other-librefang-types-locales":"# Other — librefang-types-locales\n\n# librefang-types-locales\n\nFluent (FTL) translation files for API error messages, providing localized user-facing error strings across six languages.\n\n## Overview\n\nThis module holds the **authoritative error message catalog** for the LibreFang API layer. Every error returned by API route handlers resolves to a Fluent message key defined here. The files are consumed at runtime by the Fluent localization system (typically via `fluent-templates` or similar Rust/crate bindings) and interpolated with context variables before being sent as HTTP response bodies.\n\n```\nlibrefang-types/locales/\n├── de/errors.ftl      # German\n├── en/errors.ftl      # English (canonical / most complete)\n├── es/errors.ftl      # Spanish\n├── fr/errors.ftl      # French\n├── ja/errors.ftl      # Japanese\n└── zh-CN/errors.ftl   # Simplified Chinese\n```\n\n## Key Conventions\n\n### Message ID Format\n\nAll keys follow the pattern:\n\n```\napi-error-<domain>-<detail>\n```\n\nFor example, `api-error-agent-not-found` is the agent domain, \"not found\" detail. This naming makes it straightforward to locate the source of any error in route handler code via grep.\n\n### Interpolation Variables\n\nMessages may include Fluent variables wrapped in `{ $var }`:\n\n| Variable | Used by | Purpose |\n|----------|---------|---------|\n| `$error` | `*-failed`, `api-error-generic` | Underlying error string from the system |\n| `$reason` | `api-error-bad-request`, `api-error-message-delivery-failed` | Human-readable reason for rejection |\n| `$name` | Template, provider, webhook keys | Name of the referenced resource |\n| `$id` | Agent, goal, hand, provider keys | Identifier of the referenced resource |\n| `$step` | `api-error-workflow-step-needs-agent` | Specific workflow step causing the error |\n| `$field` | `api-error-agent-invalid-sort` | Invalid field name |\n| `$valid` | `api-error-agent-invalid-sort`, `api-error-webhook-unknown-event` | List of valid values |\n| `$max` | `api-error-file-too-large`, `api-error-skill-description-too-long` | Maximum allowed value |\n| `$status` | `api-error-network-auth-failed` | HTTP status code |\n| `$url` | `api-error-network-a2a-not-found` | URL of a remote resource |\n| `$provider` | `api-error-provider-model-exists` | Provider name |\n| `$alias` | Provider alias keys | Alias string |\n| `$event` | `api-error-webhook-unknown-event` | Event type string |\n\n### The `api-error-generic` Catch-All\n\nThe `api-error-generic` key is a critical stopgap used by 41+ HTTP 500 handlers. It interpolates the raw `$error` string verbatim:\n\n```fluent\napi-error-generic = { $error }          # en\napi-error-generic = Fehler: { $error }   # de\napi-error-generic = エラー: { $error }    # ja\n```\n\nIf this key is missing from a locale file, any `t_args(\"api-error-generic\", …)` call will return the literal key name as the response body, and the `$error` interpolation will never run. **Do not remove this key from any locale.**\n\n## Error Domains\n\nThe English (`en`) file is canonical and contains the most keys. Below is a summary of all domains and their coverage:\n\n| Domain | Example Key | en Keys | Description |\n|--------|-------------|---------|-------------|\n| **agent** | `api-error-agent-not-found` | ~16 | Agent lifecycle: spawn, clone, execution, workspace |\n| **message** | `api-error-message-too-large` | 5 | Inter-agent messaging, streaming |\n| **template** | `api-error-template-not-found` | 6 | Template parsing, manifest validation |\n| **manifest** | `api-error-manifest-signature-mismatch` | 5 | Manifest format and signature checks |\n| **auth** | `api-error-auth-invalid-key`
