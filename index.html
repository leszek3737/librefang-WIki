r, so `assert_eq!` failures point at the first differing path alphabetically rather than depending on `HashMap` insertion order.\n\n### `walkdir_iter(root: &Path) -> Vec<PathBuf>>`\n\nA minimal recursive directory walker that avoids pulling the `walkdir` crate into dev-dependencies. Collects all regular files (ignores symlinks deliberately for cross-platform snapshot stability) and returns them sorted.\n\n### `write_openclaw_workspace(dir: &Path)`\n\nCreates a minimal openclaw source workspace containing:\n\n| Path | Purpose |\n|------|---------|\n| `openclaw.json` | Agent definitions, channel config, memory/session settings (JSON5) |\n| `memory/coder/MEMORY.md` | Per-agent memory file |\n| `sessions/agent_coder_main.jsonl` | A session file that idempotency must not duplicate |\n\nThe fixture mirrors the shape used by the in-crate `create_json5_workspace` helper in `src/openclaw.rs`, trimmed to only what the idempotency assertions need.\n\n### `write_openfang_workspace(dir: &Path)`\n\nCreates a minimal openfang source workspace containing:\n\n| Path | Purpose |\n|------|---------|\n| `config.toml` | Top-level config with `config_version`, `api_listen`, `log_level`, `[default_model]` |\n| `secrets.env` | Environment file that must be copied verbatim |\n| `agents/coder/agent.toml` | Agent manifest (exercises the `.toml` rewrite path) |\n| `data/index.db` | Binary file (exercises byte-exact copy) |\n\n### `opts(source, src, dst) -> MigrateOptions`\n\nConstructs a `MigrateOptions` with `dry_run: false` for the given source type and directory paths.\n\n## Test Cases\n\n### Group A — OpenClaw Idempotency\n\n**`openclaw_second_run_is_byte_identical`**\n\nRuns openclaw migration twice against the same source and destination directories. Asserts:\n\n- The first run produces a non-empty destination tree.\n- The second run's `report.imported` is empty (marker-based short-circuit).\n- `snapshot_tree` output is byte-identical between both runs, including the timestamped marker body at `.openclaw_migrated`.\n\nThe openclaw migrator uses a marker file to detect prior runs. On the second invocation, the marker causes the migrator to return before any writes, guaranteeing the on-disk tree is untouched.\n\n### Group B — OpenFang Idempotency\n\n**`openfang_second_run_is_byte_identical`**\n\nRuns openfang migration twice. Unlike openclaw, openfang has no marker file — it relies on per-entry `dest_path.exists()` checks to skip already-present files. Asserts:\n\n- First run imports entries with no skips.\n- Second run imports nothing and skips every previously-imported entry.\n- The destination tree is byte-identical across both runs.\n\n### Group C — Partial-Write Recovery\n\n**`openclaw_partial_write_is_recoverable`**\n\nSimulates a killed migration by:\n\n1. Running a full migration to establish a baseline snapshot.\n2. Deleting a victim file (preferring an `agent.toml` if present).\n3. Deleting the `.openclaw_migrated` marker so the next run proceeds past the short-circuit guard.\n4. Re-running migration.\n\nAsserts the victim file is recreated with its original byte content, and every other non-marker file is unchanged. Marker existence is verified but its body is not byte-compared (it contains a wall-clock timestamp).\n\n**`openfang_partial_write_is_recoverable`**\n\nSame shape as the openclaw test but simpler — no marker to remove. Deletes `agents/coder/agent.toml` (a rewritten file, so recovery re-exercises the rewrite path) and verifies it is recreated identically while all other files remain untouched.\n\nBoth recovery tests validate the never-clobber semantics implemented by `promote_staging` (reference #3795).\n\n### Group D — Forward Compatibility\n\n**`legacy_v1_config_parses_into_current_kernel_config`**\n\nLoads `tests/fixtures/legacy_config/config_v1.toml` and verifies it deserialises directly into `librefang_types::config::KernelConfig`. The v1 layout has fields like `api_key`, `api_listen`, and `log_level` nested under an `[api]` table. Current `KernelConfig` uses `#[serde(default)]` and ignores unknown fields, so the `[api]` table is silently dropped and missing root-level fields fall back to `Default`.\n\n**`legacy_v1_config_migrates_forward_to_current_version`**\n\nParses the same fixture as a raw `toml::Value` and passes it through `run_migrations(&mut raw, 1)`. Asserts:\n\n- The returned version equals `CONFIG_VERSION` (migration reaches the current version).\n- The `[api]` table is removed.\n- `api_key`, `api_listen`, and `log_level` are hoisted to root level with their original values.\n\n## Fixture: `tests/fixtures/legacy_config/config_v1.toml`\n\nThe legacy config fixture is intentionally minimal — only `config_version = 1` plus the `[api]` table with the three hoisted fields. This is the smallest representation that exercises both raw deserialisation and the v1→v2 migration path. A complete v1 config is not reconstructed because the schema surface area has grown too large to safely mirror from the test side.\n\n## Relationship to Other Code\n\n| Dependency | Usage |\n|------------|-------|\n| `librefang_import::openclaw::migrate` | OpenClaw migration entry point under test |\n| `librefang_import::openfang::migrate` | OpenFang migration entry point under test |\n| `librefang_import::{MigrateOptions, MigrateSource}` | Configuration types passed to migrators |\n| `librefang_types::config::KernelConfig` | Current config struct for forward-compat deserialisation |\n| `librefang_types::config::run_migrations` | Config version migration pipeline |\n| `librefang_types::config::CONFIG_VERSION` | Current config version constant |\n| `tempfile::TempDir` | Isolated temporary directories for source/destination trees |\n\n## Design Decisions\n\n- **No `walkdir` dev-dependency**: The test crate compiles separately from the main crate. A hand-rolled `walkdir_iter` over `std::fs::read_dir` keeps dev-dependencies minimal.\n- **`BTreeMap` for snapshots**: Deterministic ordering makes assertion failures actionable — they always point at the first differing path.\n- **Marker body not byte-compared in recovery tests**: The `.openclaw_migrated` marker contains a wall-clock timestamp. Recovery tests verify its existence but not its content, since a new timestamp is expected on re-run.\n- **Symlinks ignored**: Neither migrator produces symlinks, and ignoring them keeps snapshots stable across platforms.","other-librefang-import":"# Other — librefang-import\n\n# librefang-import\n\nMigration engine for importing agent configurations, prompts, and data from other agent frameworks into LibreFang's internal representation.\n\n## Purpose\n\nSwitching agent frameworks typically requires manually rewriting prompt definitions, tool configurations, and agent metadata. `librefang-import` automates this by parsing foreign configuration files in a variety of formats and converting them into LibreFang-compatible types defined in `librefang-types`.\n\n## Supported Input Formats\n\nThe crate pulls in parsers for five common configuration formats:\n\n| Format | Crate | Typical source frameworks |\n|--------|-------|--------------------------|\n| JSON | `serde_json` | LangChain exports, AutoGPT configs |\n| YAML | `serde_yaml` | Semantic Kernel, CrewAI |\n| JSON5 | `json5` | Hand-written configs with comments |\n| TOML | `toml` | Rust-native agent tools, custom setups |\n\n## Key Dependencies\n\n- **`librefang-types`** — The target data model. All import output is expressed as types from this crate.\n- **`walkdir`** — Recursive directory traversal for batch imports of entire project trees.\n- **`chrono`** — Timestamp normalisation. Foreign frameworks use varied date formats; `chrono` provides a unified parsing and comparison layer.\n- **`dirs`** — Resolves standard platform directories (e.g. locating a user's existing agent framework config path).\n- **`thiserror`** — Derives structured error types for import failures.\n- **`tracing`** — Instrumentation for diagnosing failures during large batch imports.\n\n## Architecture\n\n```mermaid\nflowchart LR\n    A[Foreign Config Files] --> B[Format Detection]\n    B --> C{JSON?}\n    B --> D{YAML?}\n    B --> E{TOML?}\n    B --> F{JSON5?}\n    C & D & E & F --> G[Intermediate Representation]\n    G --> H[librefang-types conversion]\n    H --> I[Validated LibreFang Config]\n```\n\nThe import pipeline follows three stages:\n\n1. **Discovery** — `walkdir` scans a given root directory for candidate files based on extension (`.json`, `.yaml`/`.yml`, `.toml`, `.json5`).\n2. **Parsing** — Each file is deserialised using the appropriate serde-based parser into an intermediate representation.\n3. **Conversion** — The intermediate representation is mapped to `librefang-types` structs, validated, and returned to the caller.\n\n## Error Handling\n\nImport failures are expressed through enums derived with `thiserror`. Common failure modes include:\n\n- Unsupported or unrecognised file formats\n- Malformed configuration that cannot be deserialised\n- Missing required fields in the source framework's config\n- Semantic validation errors after conversion (e.g. an agent definition with no tools)\n\nAll errors carry enough context (file path, field name, expected type) to generate actionable `tracing` events.\n\n## Integration with LibreFang\n\n`librefang-import` is a standalone library crate. It has no incoming or outgoing runtime calls to other LibreFang crates — it depends only on `librefang-types` for the shared data model. This isolation means it can be used:\n\n- As a CLI subcommand for one-off migrations\n- As part of a setup wizard in a TUI or web UI\n- In CI pipelines that validate imported configurations\n\n## Testing\n\nThe dev-dependency on `tempfile` supports integration tests that construct directory trees of foreign config files on disk, run the import pipeline against them, and assert the resulting `librefang-types` output — then clean up automatically.","other-librefang-kernel-handle-tests":"# Other — librefang-kernel-handle-tests\n\n# librefang-kernel-handle — Integration Tests\n\n## Purpose\n\nThis test module validates the **default trait method implementations** provided by `librefang-kernel-handle`. The crate defines a large surface of kernel capability traits (`AgentControl`, `MemoryAccess`, `TaskQueue`, etc.) where most methods carry default implementations so that downstream kernel adapters only override the capabilities they actually support. These tests ensure those defaults behave correctly and that higher-level convenience methods correctly delegate to their lower-level counterparts.\n\n## Test Files\n\n| File | Focus |\n|------|-------|\n| `defaults_approval.rs` | Default gating decisions — approval and tool denial |\n| `defaults_delegation.rs` | Convenience methods delegate to base trait methods |\n| `defaults_returns.rs` | Default return values, error variants, and configuration constants |\n| `send_channel_file_data_zero_copy.rs` | Regression test for zero-copy `Bytes` semantics (#3553) |\n\n## Test Strategy\n\nEvery test file follows the same pattern:\n\n1. **Define a stub struct** (e.g., `NoopKernelHandle`, `TrackingSendHandle`) that implements all required kernel traits.\n2. Most trait methods are given no-op or error-returning bodies — the tests never call these.\n3. Methods that *are* under test are either left as the **default implementation** (to verify its behavior) or instrumented with an `AtomicBool` (to verify delegation).\n4. The test asserts on the return value or on whether the base method was invoked.\n\nThis approach avoids depending on a real kernel runtime while exercising the trait dispatch layer that production code uses.\n\n## Default Behavior Verified\n\n### Approval and Tool Policy (`defaults_approval.rs`)\n\nThe default implementations create a **permissive** execution environment:\n\n| Method | Default | Rationale |\n|--------|---------|-----------|\n| `request_approval` | `ApprovalDecision::Approved` | Auto-approve when no approval backend is configured |\n| `is_tool_denied_with_context` | `false` | No tools are denied in the absence of a policy |\n| `requires_approval` | `false` | No tools require human sign-off by default |\n\n### Delegation Chains (`defaults_delegation.rs`)\n\nSeveral trait methods exist as convenience wrappers that delegate to a simpler base method. Each test uses an `AtomicBool` to confirm the base method was actually called:\n\n```\nsend_to_agent_as(agent, msg, parent)\n  └─► send_to_agent(agent, msg)\n\nsend_to_agent_as_with_key(agent, msg, parent, key)\n  └─► send_to_agent_as(agent, msg, parent)\n       └─► send_to_agent(agent, msg)\n\nsend_to_agent_with_key(agent, msg, key)\n  └─► send_to_agent(agent, msg)\n\nspawn_agent_checked(toml, parent, capabilities)\n  └─► spawn_agent(toml, parent)\n\nrequires_approval_with_context(tool, sender, channel)\n  └─► requires_approval(tool)\n```\n\nThe `TrackingSendHandle`, `TrackingSpawnHandle`, and `TrackingApprovalHandle` stubs each embed a single `AtomicBool` to detect whether the leaf method fires. The test passes only if the flag is set **and** the return value propagates correctly.\n\n### Return Values and Error Variants (`defaults_returns.rs`)\n\nDefault implementations for traits that require a kernel backend return structured errors rather than panicking:\n\n| Trait | Method | Default Return |\n|-------|--------|---------------|\n| `ToolPolicy` | `resolve_user_tool_decision` | `UserToolGate::Allow` |\n| `MemoryAccess` | `memory_acl_for_sender` | `None` |\n| `ToolPolicy` | `tool_timeout_secs` / `tool_timeout_secs_for` | `120` (seconds) |\n| `ToolPolicy` | `max_agent_call_depth` | `5` |\n| `ToolPolicy` | `readonly_workspace_prefixes` / `named_workspace_prefixes` | empty `Vec` |\n| `CronControl` | `cron_create`, `cron_list`, `cron_cancel` | `Err(KernelOpError::Unavailable(\"Cron scheduler\"))` |\n| `WikiAccess` | `wiki_get` | `Err(KernelOpError::Unavailable(\"wiki_get\"))` |\n| `WikiAccess` | `wiki_search` | `Err(KernelOpError::Unavailable(\"wiki_search\"))` |\n| `WikiAccess` | `wiki_write` | `Err(KernelOpError::Unavailable(\"wiki_write\"))` |\n\nThe `KernelOpError::Unavailable` variant carries a **capability name** string, enabling callers to match on the specific unavailable subsystem rather than parsing error messages. The wiki methods each report their own verb (`\"wiki_get\"`, `\"wiki_search\"`, `\"wiki_write\"`) so audit logs can identify which entry point was invoked while the vault was disabled.\n\n### Zero-Copy File Transfer (`send_channel_file_data_zero_copy.rs`)\n\nRegression test for **#3553**. The `ChannelSender::send_channel_file_data` method accepts `bytes::Bytes` instead of `Vec<u8>`. This matters because channel adapters (retry wrappers, metering, fan-out) clone the buffer, and `Bytes::clone()` is a reference-count bump — not a heap allocation.\n\nThree properties are verified:\n\n1. **Cloning shares the allocation** — Multiple `Bytes::clone()` calls produce handles pointing at the same underlying memory address.\n2. **The kernel sees the caller's allocation** — `CapturingFileKernel` records the pointer passed into `send_channel_file_data`. The test confirms it matches the address the caller held (after `.clone()`), proving no silent copy occurred at the trait boundary.\n3. **`Vec ↔ Bytes` round-trip is O(1)** — When `Bytes` uniquely owns its allocation, `Vec::from(bytes)` reuses the same pointer. This pins the `bytes` crate vtable behavior documented for 1.x.\n\n```rust\n// The critical assertion — clone at the call site, kernel sees the same address\nkernel\n    .send_channel_file_data(\"telegram\", \"user@example\", original.clone(), ...)\n    .await;\n\nassert_eq!(seen_addr, expected_addr);\n```\n\n## How to Add a New Default-Method Test\n\n1. Create or reuse a stub struct in the appropriate test file.\n2. Implement all required traits. Boilerplate-heavy traits (`MemoryAccess`, `TaskQueue`, `KnowledgeGraph`, etc.) can return `Err(\"not used\".into())` since they won't be called.\n3. If testing delegation, add an `AtomicBool` field to your stub and set it in the base method.\n4. If testing a return value, leave the method as the default impl and assert on the result.\n5. For `Unavailable` error variants, pattern-match on `KernelOpError::Unavailable(capability_name)`.","other-librefang-kernel-handle":"# Other — librefang-kernel-handle\n\n# librefang-kernel-handle\n\nDefines the `KernelHandle` trait — the primary in-process interface for callers interacting with the LibreFang kernel.\n\n## Purpose\n\nThis crate provides a stable, async-aware abstraction that allows components within the same process to call into the LibreFang kernel. Rather than coupling callers directly to a concrete kernel implementation, dependents code against the `KernelHandle` trait. This separation enables:\n\n- **Testability** — substitute a mock or stub implementation during unit tests without spawning a real kernel.\n- **Decoupling** — callers remain agnostic to whether the kernel is a single-threaded service, a threaded actor, or any other execution strategy.\n- **Boundary clarity** — the trait acts as a well-defined API contract at the kernel edge.\n\n## Architecture\n\n```mermaid\ngraph TD\n    A[In-Process Caller] -->|depends on trait| B[KernelHandle trait]\n    B -->|implemented by| C[Concrete Kernel]\n    B -->|uses types from| D[librefang-types]\n```\n\nAny in-process component that needs to interact with the kernel receives a `dyn KernelHandle` (or a generic constrained by the trait) and calls methods defined here. The concrete kernel lives in a separate crate and provides the actual implementation.\n\n## Dependencies and Their Roles\n\n| Dependency | Role |\n|---|---|\n| `librefang-types` | Shared domain types passed across the trait boundary — request/response structs, error types, identifiers. |\n| `async-trait` | Enables `async` methods in the trait definition. All kernel interactions are inherently asynchronous (I/O, timers, message passing), so callers `await` trait methods. |\n| `bytes` | Efficient byte-buffer handling, likely used for raw frame or payload data flowing through the kernel. |\n| `serde_json` | JSON serialization for message payloads or configuration data exchanged via the handle. |\n| `tracing` | Structured logging and span instrumentation on trait method boundaries. |\n| `uuid` | Unique identifiers for sessions, requests, or kernel-managed entities. |\n\n## Relationship to Other Crates\n\n- **librefang-types** — supplies the data types that appear in `KernelHandle` method signatures. This is the only LibreFang crate this module depends on, keeping the interface layer thin.\n- **Consumer crates** — any crate that needs to call into the kernel adds a dependency on `librefang-kernel-handle` and accepts a `KernelHandle` implementor through dependency injection.\n- **Concrete kernel crate** — implements `KernelHandle`, wiring trait methods to internal kernel state, actors, or message queues.\n\n## Usage Pattern\n\nA typical caller receives a handle at construction time:\n\n```rust\nuse librefang_kernel_handle::KernelHandle;\n\nstruct SomeService {\n    kernel: Box<dyn KernelHandle>,\n}\n\nimpl SomeService {\n    pub async fn do_work(&self) -> Result<(), MyError> {\n        // Call into the kernel through the trait\n        let response = self.kernel.some_operation(/* ... */).await?;\n        Ok(())\n    }\n}\n```\n\nDuring testing, inject a lightweight stub; in production, inject the full kernel implementation.\n\n## Testing\n\nThe `tokio` dev-dependency (with `macros` and `rt` features) supports async test functions in this crate's own tests. When writing tests against `KernelHandle`, you typically:\n\n1. Implement the trait on a test helper struct with controlled responses.\n2. Use `#[tokio::test]` to drive async trait method calls.\n3. Assert that the caller under test behaves correctly given specific kernel responses.\n\n## Build Configuration\n\nThis crate inherits workspace-level settings for `version`, `edition`, `license`, and lint rules via the `[workspace]` inheritance mechanism (`workspace = true`). It follows the same edition and linting standards as the rest of the LibreFang project.","other-librefang-kernel-metering":"# Other — librefang-kernel-metering\n\n# librefang-kernel-metering\n\n## Purpose\n\nCost metering and quota enforcement for the LibreFang kernel. This module tracks resource consumption—primarily LLM token usage and associated costs—and enforces quotas to prevent runaway spending or resource exhaustion.\n\n## Dependencies & What They Imply\n\n```toml\nlibrefang-types    # Shared type definitions used across the kernel\nlibrefang-memory   # Memory management — likely for storing metering state\nlibrefang-runtime  # Runtime infrastructure — lifecycle, async runtime\nlibrefang-llm-driver  # LLM driver — the primary source of billable operations\nserde              # Serialization — metering data is persisted or transmitted\ntracing            # Structured logging — audit trails for cost events\n```\n\nThe dependency on `librefang-llm-driver` is the key signal: this module wraps or intercepts LLM operations to measure them. The `serde` dependency suggests metering state is serialized, likely for persistence across sessions or for reporting. The `tracing` dependency indicates that cost events are logged for observability.\n\n## Integration Points\n\nBased on the dependency graph, this module sits between the LLM driver and the rest of the kernel:\n\n```\n┌─────────────────┐\n│ librefang-llm-  │\n│     driver      │\n└────────┬────────┘\n         │ LLM calls produce\n         │ billable events\n         ▼\n┌─────────────────┐\n│ librefang-      │\n│ kernel-metering │◄── quota configuration\n└────────┬────────┘\n         │ enforce / block\n         ▼\n┌─────────────────┐\n│ librefang-      │\n│    runtime      │\n└─────────────────┘\n```\n\nThe module consumes telemetry or hook points from the LLM driver, accumulates usage, checks against configured limits, and signals back when quotas are exceeded.\n\n## Expected Responsibilities\n\nGiven its stated purpose and dependencies, this module is responsible for:\n\n- **Token counting**: Tracking prompt and completion tokens per request.\n- **Cost accumulation**: Converting token counts to monetary cost using model-specific pricing.\n- **Quota enforcement**: Rejecting or throttling requests when a budget or token limit is reached.\n- **State persistence**: Serializing metering data so it survives restarts (via `serde` and `librefang-memory`).\n- **Audit logging**: Emitting structured trace events for every metered operation.\n\n## Status\n\nNo execution flows or call edges were detected in the static analysis. This indicates the module is either newly scaffolded, contains only type definitions and configuration structs without active call paths, or its interactions are dispatched indirectly (e.g., through trait objects or dynamic dispatch) that the analysis did not resolve.\n\nWhen adding to or consuming this module, inspect the actual source files under `librefang-kernel-metering/src/` for the concrete API surface.","other-librefang-kernel-router":"# Other — librefang-kernel-router\n\n# librefang-kernel-router\n\nHand and template routing engine for the LibreFang kernel.\n\n## Purpose\n\nThis module is responsible for resolving incoming requests to the correct **Hand** implementation based on configurable routing rules. It acts as the dispatch layer between the LibreFang kernel's input sources and the hand implementations that process them.\n\nRouting decisions can be based on pattern matching (via regular expressions), template resolution, and TOML-based configuration. The router determines *which* hand should handle a given input and *how* that hand should be instantiated or parameterized.\n\n## Role in the Architecture\n\n```\n┌─────────────────┐     ┌──────────────────────┐     ┌──────────────────┐\n│  Incoming        │────▶│  kernel-router       │────▶│  librefang-hands │\n│  Requests/Input  │     │  (match & dispatch)  │     │  (Hand impls)    │\n└─────────────────┘     └──────────────────────┘     └──────────────────┘\n                               │\n                               ▼\n                        ┌──────────────────┐\n                        │  librefang-types  │\n                        │  (shared types)   │\n                        └──────────────────┘\n```\n\nThe router sits between the runtime's input layer and the hand implementations. When the kernel receives input, the router evaluates its routing table and dispatches to the matching hand.\n\n## Key Dependencies\n\n| Dependency | Purpose |\n|---|---|\n| `librefang-types` | Shared type definitions used across the kernel — request types, routing results, error types |\n| `librefang-hands` | Hand trait definitions and registry. The router resolves against these hand implementations |\n| `regex-lite` | Lightweight regular expression matching for pattern-based route rules |\n| `serde_json` | Deserializing route configuration or template parameters from JSON |\n| `toml` | Parsing routing table configuration from TOML files |\n| `dirs` | Resolving standard system directories to locate configuration files |\n| `tracing` | Structured logging of routing decisions for debugging and observability |\n\n## How Routing Works\n\n1. **Configuration Loading** — The router reads a routing table from TOML configuration, typically located via platform-standard directories resolved through the `dirs` crate.\n\n2. **Pattern Matching** — Each route entry contains a pattern (potentially a regular expression). When a request arrives, the router evaluates patterns against the input to find a match.\n\n3. **Template Resolution** — Matched routes may reference templates that parameterize how a hand is invoked. `serde_json` handles any structured data involved in template parameter binding.\n\n4. **Dispatch** — The router returns a reference or descriptor identifying which hand from `librefang-hands` should handle the request, along with any extracted parameters from the match.\n\n## Configuration\n\nRouting rules are defined in TOML. The `dirs` crate locates the configuration root, and `toml` parses the routing table. This allows administrators and developers to modify routing behavior without recompiling the kernel.\n\n## Testing\n\nThe dev-dependency on `librefang-runtime` indicates that integration tests exercise the router within the full runtime context, verifying end-to-end dispatch behavior. The `tempfile` crate supports test cases that create temporary configuration files to test different routing scenarios in isolation.\n\n## Integration Points\n\n- **Consumed by**: `librefang-runtime` (and potentially the kernel core) to dispatch incoming requests.\n- **Depends on**: `librefang-types` for shared types, `librefang-hands` for hand definitions and registration.\n- **Configuration**: External TOML files, located via platform conventions.","other-librefang-kernel-src":"# Other — librefang-kernel-src\n\n# Kernel Integration Tests (`kernel/tests.rs`)\n\n## Purpose\n\nThis is the primary integration and regression test suite for `librefang-kernel`. It validates the kernel's core behaviors—agent lifecycle, capability enforcement, hand activation, skill management, provider routing, persistence, and background task orchestration—by booting real `LibreFangKernel` instances against temporary directories and asserting on in-memory state, SQLite rows, and file-system artifacts.\n\nThe tests double as **executable specifications**: many are annotated with issue numbers (e.g., `#3135`, `#2923`, `#2380`) and include doc comments explaining the exact regression they guard against.\n\n## Test Infrastructure\n\n### Kernel Boot Helper\n\nMost tests follow a three-step pattern:\n\n```\n1. tempfile::tempdir()          → isolated home_dir\n2. KernelConfig { home_dir, … } → minimal configuration\n3. LibreFangKernel::boot_with_config(config) → live kernel\n```\n\nThe kernel boots with a SQLite substrate, an empty agent registry, default skill registry, and no external LLM provider unless explicitly configured. Tests that need async operations use `#[tokio::test(flavor = \"multi_thread\")]`.\n\n### Environment Variable Isolation\n\nTests that depend on environment variables (e.g., key rotation) use `set_test_env` / `EnvVarGuard`:\n\n```rust\nfn set_test_env(key: &'static str, value: &str) -> EnvVarGuard\n```\n\nThe guard removes the variable on drop. Tests use **unique env-var names** (e.g., `LIBREFANG_TEST_ROTATION_PRIMARY_KEY_A`) and rely on the single-threaded default test runner for serialization. **Do not** use common names like `OPENAI_API_KEY` in tests.\n\n### Recording Channel Adapter\n\n`RecordingChannelAdapter` is a test double for `ChannelAdapter` that captures sent messages in an `Arc<Mutex<Vec<String>>>`. It's used in notification routing tests (e.g., `test_notify_escalated_approval_prefers_request_route_to`) by inserting it into `kernel.mesh.channel_adapters`.\n\n### Skill Installation Helper\n\n`install_test_skill` writes a minimal valid `skill.toml` + `prompt_context.md` under a given parent directory, enabling tests that exercise skill registry loading without depending on external skill packages.\n\n## Behavioral Domains\n\n### Agent Lifecycle & Capability Enforcement\n\n```mermaid\ngraph TD\n    A[spawn_agent_inner] --> B{parent given?}\n    B -->|No| C[Register with manifest caps]\n    B -->|Yes| D{parent exists in registry?}\n    D -->|No| E[Fail closed: \"not registered\"]\n    D -->|Yes| F{child caps ⊆ parent caps?}\n    F -->|No| G[Fail: \"Privilege escalation denied\"]\n    F -->|Yes| C\n```\n\n| Test | What it guards |\n|------|---------------|\n| `test_spawn_child_exceeding_parent_is_rejected` | Children cannot exceed parent capabilities — prevents privilege escalation through agent spawning (#3044-era hardening) |\n| `test_spawn_child_with_subset_capabilities_is_allowed` | Positive counterpart: subset inheritance works |\n| `test_spawn_with_unknown_parent_fails_closed` | Stale `AgentId` references fail rather than silently degrading to non-parent path |\n| `test_spawn_agent_applies_local_default_model_override` | `\"default\"/\"default\"` provider/model stored at spawn; concrete resolution deferred to `execute_llm_agent` |\n\n### Provider & Model Switching\n\n`test_set_agent_model_clears_overrides_when_provider_changes` is the regression test for issue #2380. When `set_agent_model` switches an agent's provider (e.g., from `\"cloudverse\"` to `\"openrouter\"`), it **must** clear per-agent `api_key_env` and `base_url` overrides. Without this, the agent would continue hitting the old endpoint with stale credentials.\n\nThe test also verifies the **same-provider branch**: when only the model name changes within the same provider, existing overrides are preserved.\n\n### Hand Activation, Runtime Overrides & Persistence\n\nHands are the kernel's pre-configured multi-agent bundles. The test suite covers:\n\n**Activation basics:**\n- `test_hand_activation_does_not_seed_runtime_tool_filters` — tool allowlist/blocklist remain empty so skill and MCP tools stay visible.\n- `test_hand_skills_propagate_to_derived_agent_manifest` (#3135) — hand-level `skills = [...]` propagates into each role agent's `AgentManifest.skills`.\n- `test_hand_skills_intersect_per_role_overrides` — when a per-role agent also declares `skills`, the effective list is the intersection.\n\n**Runtime overrides & reactivation:**\n- `test_hand_reactivation_rebuilds_same_runtime_profile` — deactivate + reactivate rebuilds from the hand definition, not from prior runtime overrides.\n- `reactivate_builds_from_hand_toml_not_override` — every override field (model, provider, api_key_env, base_url, max_tokens, temperature, web_search_augmentation) is reset on fresh activation.\n\n**Persistence across restarts:**\n- `hand_runtime_override_survives_restart_via_activate_hand_with_id` — deterministically replays the `activate_hand_with_id` restore path and asserts all overrides round-trip through `hand_state.json`.\n- `boot_drift_preserves_hand_settings_tail` / `boot_drift_preserves_skill_and_team_tails` — system prompt tails (`## User Configuration`, `## Reference Knowledge`, `## Your Team`) survive restart because `activate_hand_with_id` re-renders them from the HAND.tomL definition.\n\n**Cleanup:**\n- `deactivate_hand_removes_hand_agent_rows_from_sqlite` — after deactivation, SQLite rows are scrubbed even when the in-memory registry has already evicted the agents (the post-restart scenario).\n\n### Tool Availability & Filtering\n\n| Test | Behavior |\n|------|----------|\n| `test_available_tools_returns_empty_when_tools_disabled` | `tools_disabled: true` suppresses all builtin, skill, and MCP tools |\n| `test_available_tools_glob_pattern_matches_mcp_tools` | Glob patterns like `\"file_*\"` correctly match `file_read`, `file_write`, `file_list` |\n| `test_shell_exec_available_when_declared_in_tools_without_explicit_exec_policy` | Agents declaring `shell_exec` in `capabilities.tools` get their exec_policy auto-promoted to `Full` instead of inheriting the global `Deny` default |\n| `test_skill_evolve_tools_default_available_to_restricted_agent` | Skill evolution tools (`skill_evolve_create`, etc.) are available to every agent regardless of declared capabilities |\n\n### Background Sweeps & Task Board\n\nTwo idempotent background loops are tested:\n\n- `test_spawn_approval_sweep_task_is_idempotent` — calling twice only starts one loop; the atomic flag `approval_sweep_started` prevents duplication.\n- `test_spawn_task_board_sweep_task_is_idempotent` — same pattern for task-board sweeper (#2923).\n- `test_task_board_sweep_resets_stuck_in_progress_task` — an in-progress task whose `claimed_at` exceeds the TTL is reset to `pending` with `assigned_to = \"\"`.\n\n### Session Interrupt Cascade (Parent /stop)\n\nWhen a parent agent is stopped mid-turn, the cancellation must propagate to child agents:\n\n```\nparent_interrupt.cancel()  →  child_interrupt.is_cancelled() == true\nchild_interrupt.cancel()   →  parent_interrupt.is_cancelled() == false  (one-way)\n```\n\nKey tests:\n- `cascade_primitives_via_session_interrupts_dashmap` — validates `SessionInterrupt::new_with_upstream` cascade semantics via the `session_interrupts` DashMap.\n- `no_upstream_when_parent_has_no_active_turn` — missing interrupt returns `None` without erroring.\n- `send_to_agent_as_tolerates_unregistered_parent_uuid` — parent id resolution falls back to UUID parsing when the registry entry is gone.\n- `send_to_agent_as_rejects_unparseable_parent_id` — garbage parent ids surface errors rather than panicking.\n\n### Atomic TOML Persistence\n\n`atomic_write_toml` replaces the previous plain `fs::write` with a write-to-temp-then-rename strategy:\n\n```rust\n// Stages to sibling .tmp, then fs::rename (atomic on same filesystem)\nsuper::atomic_write_toml(&path, &content)\n```\n\nTests verify:\n- Content replacement works correctly.\n- No `.tmp` files remain after success.\n- Concurrent writers never produce a partial/corrupt file observable by readers.\n\n### JSON Extraction from LLM Responses\n\n`extract_json_from_llm_response` handles multiple LLM output formats:\n\n| Format | Example |\n|--------|---------|\n| JSON code block | ` ```json\\n{...}\\n``` ` |\n| Bare JSON object | `{...}` |\n| JSON embedded in prose | Text before/after |\n| Nested braces in strings | `{\"k\": \"use {x} syntax\"}` |\n| Multiple code blocks | First valid block wins |\n| Malformed JSON | Returns `None` |\n\n### Sanitization for Background Review\n\n`sanitize_reviewer_block` and `sanitize_reviewer_line` prevent a compromised prior LLM response from injecting fake instructions into the reviewer's context:\n\n- Triple backticks are neutralized (prevent fake JSON blocks).\n- `<\/data>` and `<data>` envelope tags are stripped.\n- `[EXTERNAL SKILL CONTEXT]` brackets become parentheses.\n- Null bytes and control characters are removed.\n- Truncation is char-based (not byte-based) with a `…[truncated]` marker.\n\n### Condition Evaluation\n\n`evaluate_condition` supports a simple DSL for agent routing:\n\n```rust\n\"agent.tags contains 'chat'\"  → true if agent has the \"chat\" tag\n\"\" or None                    → true (unconditional)\n\"some.unknown.expression\"     → false (strict default — prevents injection)\n```\n\n### Peer-Scoped Key Namespacing\n\n`peer_scoped_key` constructs namespaced storage keys with security validations (#5119, #5120):\n\n```rust\npeer_scoped_key(\"car\", Some(\"user-123\"))  → Ok(\"peer:user-123:car\")\npeer_scoped_key(\"car\", None)              → Ok(\"car\")  // global scope\npeer_scoped_key(\"car\", Some(\"u:456\"))     → Err  // colon in peer_id\npeer_scoped_key(\"car\", Some(\"\"))          → Err  // empty peer_id\npeer_scoped_key(\"peer:victim:x\", None)    → Err  // reserved prefix\n```\n\n### Cron Job Peer Context\n\n`test_cron_create_preserves_peer_id` — the regression test for OFP-triggered cron jobs losing peer context. `cron_create` reads `peer_id` from `job_json` and persists it; without the fix, it always stored `None`.\n\n## Conventions for Adding Tests\n\n1. **Use `tempfile::tempdir()`** for every test. Never write to a shared or global path.\n2. **Always call `kernel.shutdown()`** before the test returns, even on error paths. This cleans up background tasks and releases file locks.\n3. **Use `set_test_env`** for environment variables. Never use `std::env::set_var` directly.\n4. **Annotate regressions** with issue numbers in both the test name and doc comment. Future readers need the context.\n5. **Handle graceful skips** for tests that depend on optional hands (like `\"apitester\"`):\n   ```rust\n   Err(e) if e.to_string().contains(\"unsatisfied requirements\") => {\n       eprintln!(\"Skipping test: {e}\");\n       kernel.shutdown();\n       return;\n   }\n   ```\n6. **Prefer synchronous tests** (`#[test]`) when possible. Use `#[tokio::test(flavor = \"multi_thread\")]` only when the code under test is `async`.\n7. **The `#[ignore]` attribute** marks tests that require network or are inherently flaky in sandboxed CI. Run them locally with `cargo test -p librefang-kernel -- --ignored`.","other-librefang-kernel-tests":"# Other — librefang-kernel-tests\n\n# librefang-kernel-tests\n\nIntegration test suite for `librefang-kernel`. Exercises the kernel's public APIs — boot, agent lifecycle, messaging, async tasks, memory, RBAC, cron compaction, hand management, and workflow integration — without requiring a full production runtime.\n\n## Architecture\n\n```mermaid\ngraph TD\n    subgraph \"Test Suite (librefang-kernel/tests)\"\n        COMMON[\"common/mod.rs<br/>boot helpers\"]\n        ASYNC[\"async_task_tracker_test.rs\"]\n        AUDIT_CH[\"audit_cron_channel_name_test.rs\"]\n        AUDIT_RET[\"audit_retention_test.rs\"]\n        COMPACT[\"cron_compaction_test.rs\"]\n        MEM_ISO[\"cross_chat_memory_isolation_5227_test.rs\"]\n        INTEGRATION[\"integration_test.rs\"]\n        KH_BROADER[\"kernel_handle_contract_broader.rs\"]\n        KH_CRON[\"kernel_handle_contract_cron_spawn.rs\"]\n        KH_MEM[\"kernel_handle_contract_memory.rs\"]\n        KH_RBAC[\"kernel_handle_contract_rbac.rs\"]\n        KH_SPAWN[\"kernel_handle_contract_spawn_checked.rs\"]\n        KH_TASK[\"kernel_handle_contract_task.rs\"]\n        MULTI[\"multi_agent_test.rs\"]\n    end\n\n    subgraph \"Kernel Surfaces Under Test\"\n        KERNEL[\"LibreFangKernel\"]\n        HANDLE[\"KernelHandle trait\"]\n        TASK_REG[\"task registry\"]\n        MEMORY[\"memory substrate\"]\n        HANDS[\"hand registry\"]\n    end\n\n    COMMON --> KERNEL\n    ASYNC --> TASK_REG\n    KH_MEM --> HANDLE\n    KH_RBAC --> HANDLE\n    KH_SPAWN --> HANDLE\n    MULTI --> HANDS\n```\n\n## Common Utilities\n\n**`common/mod.rs`** provides shared boot helpers:\n\n- `boot_kernel()` — Boots a `LibreFangKernel` with a temp directory, network disabled, and an in-memory SQLite store. Returns `(LibreFangKernel, TempDir)`.\n- `boot_kernel_with_users(users)` — Same as above but seeds `UserConfig` entries (used by RBAC contract tests).\n\nMost test files in this crate define their own `test_config(name)` helper that creates an isolated temp directory per test. The `common/mod.rs` helpers are consumed by the `kernel_handle_contract_*` files via `mod common;`.\n\n## Test Domains\n\n### Async Task Tracker (`async_task_tracker_test.rs`)\n\nTests the `register_async_task` / `complete_async_task` lifecycle. Covers:\n\n| Test | Contract |\n|------|----------|\n| `register_inserts_into_registry_and_returns_handle` | Registration inserts into the registry and the handle is lookable-up via `lookup_async_task` |\n| `complete_workflow_task_injects_signal_into_originating_session` | Workflow completion injects `AgentLoopSignal::TaskCompleted` into the originating session's injection channel and removes the registry entry |\n| `complete_delegation_task_injects_signal_with_delegation_kind` | Delegation completion carries the correct `TaskKind::Delegation` and status through the signal |\n| `complete_with_no_attached_receiver_still_removes_entry` | Delete-on-delivery contract: entry is removed even when no receiver is attached (`self_handle` unset → `Ok(false)`) |\n| `wake_idle_path_returns_true_when_self_handle_is_set` | With `set_self_handle`, the wake-idle path spawns a turn and returns `Ok(true)` |\n| `double_completion_is_a_noop_on_second_call` | Idempotency: second `complete_async_task` returns `Ok(false)`, no duplicate signal |\n| `complete_unknown_task_id_returns_ok_false` | Unknown IDs return `Ok(false)` without panicking |\n| `register_dedupes_workflow_kind_against_existing_run_id` | Same `TaskKind::Workflow { run_id }` returns the existing handle |\n| `register_dedupes_delegation_kind_against_existing_target_and_hash` | Same `(target, prompt_hash)` returns the existing handle |\n| `register_does_not_dedupe_distinct_delegations_to_same_target` | Different `prompt_hash` values produce distinct task IDs |\n| `register_dedupe_is_cross_session_for_delegation_kind` | Dedupe is structural on `kind` — cross-session callers sharing `(target, prompt_hash)` get the same handle; completion routes to the first caller's session only |\n| `complete_falls_through_to_wake_idle_when_injection_channel_is_full` | `Backpressure(Full)` on the injection channel falls through to the wake-idle spawn path rather than returning an error |\n| `recovery_synthesizes_failed_event_for_matching_pending_workflow` | `synthesize_task_failures_for_recovered_runs` drains matching entries and injects a `Failed(\"workflow run interrupted by daemon restart\")` signal |\n\nKey helper: `attach_injection_receiver` manually wires an `mpsc::channel` into the kernel's `injection_senders_ref()` map so tests can receive `AgentLoopSignal` values without going through the agent loop.\n\n### Audit: Channel Name Reservation (`audit_cron_channel_name_test.rs`)\n\nRegression test for a security audit issue where external callers could pass `channel = \"cron\"` and collide with the kernel's internal cron session. The fix applies `sanitize_channel_name` at every external ingress point, renaming reserved names to `ext-<name>`.\n\nTests assert:\n- External variants of `\"cron\"`, `\"autonomous\"`, `\"webui\"` (case-insensitive, with whitespace) never derive the same `SessionId` as the internal path\n- The sanitizer only renames reserved names; benign channels pass through unchanged\n- Sanitized external channels are stable across invocations (two external adapters sharing the same reserved name land on the same `ext-` session)\n\n### Audit: Retention Trimming (`audit_retention_test.rs`)\n\nTests that `start_background_agents()` spawns the periodic trim task and the self-audit `RetentionTrim` row is recorded when a trim cycle drops entries. Uses a `trim_interval_secs = 1` and `max_in_memory_entries = 10` with 50 seeded entries, then waits ~2.5s for the periodic task to fire.\n\nRequires `#![recursion_limit = \"256\"]` because `start_background_agents()` spawns many closures whose combined async-block layouts exceed the default limit.\n\n### Cron Session Compaction (`cron_compaction_test.rs`)\n\nTests the `try_summarize_trim` logic through the `librefang_runtime::compactor` surface:\n\n- **Successful LLM summarization**: `compact_session` with a `FakeDriver` produces a non-empty summary with `used_fallback = false`. The output is `[summary_msg] + kept_tail`.\n- **LLM failure fallback**: A `FailingDriver` causes `compact_session` to return `Ok(result)` with `used_fallback = true` (not an `Err`). The kernel checks `!result.used_fallback` to reject these.\n- **Tool pair integrity**: `adjust_split_for_tool_pair` shifts the split point so an `Assistant{ToolUse}` / `User{ToolResult}` pair is never separated across the summary/tail boundary.\n\n### Cross-Chat Memory Isolation (`cross_chat_memory_isolation_5227_test.rs`)\n\nRegression test for #5227 where memories extracted in a WhatsApp group chat bled into a 1:1 DM. Tests verify:\n\n- `SessionId::for_sender_scope` produces distinct session IDs for DM vs group of the same peer\n- `ProactiveMemoryHooks::auto_memorize` stamps every stored memory with `CHAT_SCOPE_METADATA_KEY` matching the originating channel\n- Unscoped callers (`chat_scope = None`) retain legacy recall behavior — no filtering\n- `compose_sender_scope` formula matches `for_sender_scope` for WhatsApp (pre-qualified), Telegram/Slack/Discord (bare channel + chat_id), and empty chat_id shapes\n\n### Live LLM Integration (`integration_test.rs`)\n\nFull pipeline tests that require `GROQ_API_KEY`. Marked `#[ignore]`. Tests:\n- Boot → spawn agent → send message → receive response → kill agent\n- Multiple agents with different models running concurrently\n\n### KernelHandle Contract Tests\n\nA family of test files exercising the `KernelHandle` trait (from `librefang-kernel-handle`), which is the stable API surface consumed by adapters and the HTTP layer.\n\n#### `kernel_handle_contract_broader.rs`\n\nGeneral `KernelHandle` methods:\n- Roster upsert/remove/members round-trip\n- `goal_list_active` returns empty by default\n- `list_a2a_agents` / `get_a2a_agent_url` defaults\n- `kill_agent` on unknown ID returns error\n- `publish_event` succeeds\n\n#### `kernel_handle_contract_cron_spawn.rs`\n\nCron job creation and agent spawning:\n- `cron_create` preserves `peer_id` and omits it when not provided\n- `spawn_agent` returns valid identity and the agent appears in `list_agents`\n- `find_agents` matches by name\n\n#### `kernel_handle_contract_memory.rs`\n\nMemory subsystem isolation, security, and validation:\n\n**Isolation**: Per-agent writes are invisible to other agents. Peer-scoped keys are isolated per peer. Global (agent_id=None) namespace is independent.\n\n**Security (#5119 / #5120)**:\n- `peer:`-prefixed keys are rejected at the boundary (prevents LLM-planted rows surfacing in victim's namespace)\n- Colon-bearing `peer_id` values (e.g. Slack-style `\"T1:U2\"`) are rejected\n- Empty `peer_id` is rejected (prevents ambiguous `peer::{key}` collision)\n- Pre-fix planted rows are not enumerable via `memory_list` (round-trip guard)\n- Empty keys are rejected (#5138)\n- Oversized values (>256 KiB) are rejected (#5138)\n\n**Concurrency (#5138)**: `test_concurrent_goal_update_loses_no_writes_5138` verifies that concurrent `goal_update` calls using `structured_modify` don't lose writes (fixes a prior get→mutate→set race).\n\n#### `kernel_handle_contract_rbac.rs`\n\nRBAC policy resolution:\n- Unconfigured users default-allow (guest mode)\n- Tool deny and memory ACL policies match on `(sender_id, channel_binding)` — wrong channel doesn't match\n- `requires_approval_with_context` delegates to `requires_approval`\n\n#### `kernel_handle_contract_spawn_checked.rs`\n\nCapability-checked spawning:\n- `spawn_agent_checked` succeeds with empty parent caps\n- Parent ID is tracked\n- Capability escalation (child requesting `shell_exec` when parent only has `FileRead`) is rejected\n\n#### `kernel_handle_contract_task.rs`\n\nTask lifecycle:\n- `task_post` preserves `assigned_to` and `created_by`\n- `task_claim` returns the assigned task\n- `task_complete` updates status to `\"completed\"`\n- Unassigned tasks have null/empty fields\n\n### Multi-Agent / Hand Lifecycle (`multi_agent_test.rs`)\n\nComprehensive tests for the hand system (preconfigured agent templates):\n\n**Lifecycle**: `activate_hand` → spawns agent → `deactivate_hand` → kills agent. `pause_hand` / `resume_hand` change status without killing.\n\n**Deterministic IDs**: `AgentId::from_hand_agent(hand_id, role, instance_id)` produces stable IDs. Single-instance activations use legacy format (same ID on reactivation).\n\n**Coordinator roles**: Multi-agent hands with an explicit `[agents.planner] coordinator = true` route through the coordinator role, not the default \"main\".\n\n**Agent metadata**: Spawned agents are tagged with `hand:<hand_id>` and `hand_instance:<uuid>`.\n\n**Tool inheritance**: Hand-defined tools are applied to the spawned agent's capabilities.\n\n**Settings**: `[[settings]]` blocks with `default` values are seeded into the instance config on activation. User overrides take precedence over schema defaults.\n\n**State persistence**: Hand state is written to `hand_state.json` (version 5 format) with typed fields (`instance_id`, `status`, `activated_at`, `agent_ids` map, `coordinator_role`).\n\n**Triggers**: Hand trigger patterns survive reactivation and are restored to original roles.\n\n**Coexistence**: Multiple hands can be active simultaneously.\n\n## Running the Tests\n\n```bash\n# All unit-style tests (no API keys needed)\ncargo test -p librefang-kernel\n\n# Live LLM integration tests (requires API key)\nGROQ_API_KEY=gsk_... cargo test -p librefang-kernel --test integration_test -- --nocapture --ignored\n\n# Specific test domain\ncargo test -p librefang-kernel --test async_task_tracker_test\ncargo test -p librefang-kernel --test kernel_handle_contract_memory\n```\n\nMost tests require `#[tokio::test(flavor = \"multi_thread\")]` because the kernel spawns blocking tasks internally via `tokio::task::block_in_place`.\n\n## Recursion Limit\n\nSeveral test files set `#![recursion_limit = \"256\"]`. This is required because `send_message_full` and `start_background_agents` nest deeply monomorphized async closures that exceed the compiler's default limit of 128. The crate root (`librefang-kernel/src/lib.rs`) sets the same limit.","other-librefang-kernel":"# Other — librefang-kernel\n\n# librefang-kernel\n\nCore orchestration crate for the LibreFang Agent Operating System. Manages agent lifecycles, scheduling, permissions, inter-agent communication, and the message-handling loop that fans requests out to LLM drivers, tools, and the memory substrate.\n\n## Architecture\n\n```mermaid\ngraph TD\n    API[\"librefang-api<br/>(HTTP/WS surface)\"]\n    K[\"librefang-kernel<br/>(orchestration)\"]\n    RT[\"librefang-runtime<br/>(execution)\"]\n    MEM[\"librefang-memory<br/>(storage)\"]\n    EXT[\"librefang-extensions\"]\n\n    API --> K\n    K --> RT\n    K --> MEM\n    EXT -.->|KernelHandle trait| K\n\n    subgraph Kernel Subsystems\n        REG[\"registry::AgentRegistry\"]\n        CRON[\"kernel::cron\"]\n        EV[\"kernel::event_bus\"]\n        SL[\"kernel::session_lifecycle\"]\n        SCH[\"kernel::scheduler\"]\n        M[\"metering (re-exported)\"]\n        R[\"router (re-exported)\"]\n    end\n```\n\nThe kernel sits between the HTTP surface layer (`librefang-api`) and the execution layer (`librefang-runtime`). It does **not** depend on `librefang-api` or `librefang-extensions`. When those crates need kernel callbacks, they go through the `KernelHandle` trait defined in `librefang-runtime`.\n\n## Boot\n\nEntry point:\n\n```rust\nLibreFangKernel::boot_with_config(KernelConfig)\n```\n\n`LibreFangKernel` is a large struct (~18k LOC, 50+ fields — tracked in #3565). Do not add new fields without coordination.\n\n## Subsystem Modules\n\n| Module | Responsibility |\n|---|---|\n| `kernel::LibreFangKernel` | Top-level orchestrator. Boot, shutdown, field access. |\n| `registry::AgentRegistry` | Concurrent agent table. Spawn, lookup, kill agents. |\n| `kernel::cron` | Cron scheduling. Resolves `session_mode` per-job → manifest → historical Persistent. |\n| `kernel::event_bus` | Broadcast event bus. |\n| `kernel::session_lifecycle` | Session state machine. |\n| `kernel::scheduler` | Task scheduling and queue management. |\n| `kernel::approval` | Approval and permission gates. |\n| `kernel::auth` | Authentication. |\n| `kernel::auto_dream` | Automatic dream/background processing. |\n| `kernel::inbox` | Agent inbox management. |\n| `kernel::pairing` | Agent pairing. |\n| `metering` | Token and cost accounting (re-exported from `librefang-kernel-metering`). Uses kernel's `model_catalog`. |\n| `router` | Model router, alias resolution (re-exported from `librefang-kernel-router`). |\n\n## Hot Fields and Lock Strategy\n\n### `model_catalog: arc_swap::ArcSwap<ModelCatalog>`\n\nAtomic-load reads (#3384). Writers use `model_catalog_update(|cat| ...)` for RCU-style updates. Do **not** replace with `RwLock<ModelCatalog>`.\n\n### `skill_registry: std::sync::RwLock<SkillRegistry>`\n\nHot-reload on skill install/uninstall. Keep reads brief — copy out what you need and drop the lock.\n\n### `running_tasks: dashmap::DashMap<(AgentId, SessionId), RunningTask>`\n\nKeyed by `(agent, session)` tuple, **not** by `AgentId` alone. Pre-#3172 it was keyed only by `AgentId`, which silently overwrote concurrent loops. Do not degrade this.\n\n### `mcp_oauth_provider: Arc<dyn McpOAuthProvider + Send + Sync>`\n\nPluggable OAuth provider. Implemented in `librefang-api` to keep the daemon free of HTTP concerns. New OAuth flows go through this trait, never as direct kernel logic.\n\n### `event_bus` history: `parking_lot::Mutex<VecDeque<Arc<Event>>>`\n\nFixed in #3385. Do **not** switch back to `RwLock<VecDeque<Event>>`.\n\n### Choosing a lock strategy for new fields\n\n| Access pattern | Use |\n|---|---|\n| Hot read, rare write | `arc_swap::ArcSwap` |\n| Hot read, hot write | `parking_lot::Mutex` or `dashmap` |\n| Append-only history | `parking_lot::Mutex<VecDeque<Arc<T>>>` |\n\n## Determinism (#3298)\n\nAnything that reaches an LLM prompt **must** be ordered before stringifying. Use `BTreeMap` / `BTreeSet`. `HashMap` iteration order varies across processes and silently invalidates provider prompt caches.\n\nRegression tests guard each boundary. See `kernel::tests::mcp_summary_is_byte_identical_across_input_orders`.\n\n**Rule:** No `HashMap<K, V>` in any field that ends up in an LLM prompt. Use `BTreeMap`.\n\n## Configuration Knobs\n\n| Knob | Default | Notes |\n|---|---|---|\n| `KernelConfig.max_history_messages` | (varies) | Global default. Clamped up to `MIN_HISTORY_MESSAGES = 4` with a WARN log. Per-agent override in `agent.toml`. |\n| `KernelConfig.queue.concurrency.trigger_lane` | 8 | Global semaphore on `Lane::Trigger`. |\n| `KernelConfig.queue.concurrency.default_per_agent` | 1 | Fallback when `agent.toml: max_concurrent_invocations` is unset. |\n| `KernelConfig.workflow_stale_timeout_minutes` | (varies) | Cutoff for `recover_stale_running_runs` at boot. |\n\n## Adding a New Field to `LibreFangKernel`\n\n1. **Visibility:** `pub(crate)` unless an external crate truly needs read access.\n2. **Config counterpart:** If the field has a config-side value, add it to the `Default` impl on `KernelConfig`. Omitting this silently breaks the build.\n3. **Trait objects:** If the field is `Option<Arc<dyn Trait>>`, mark it `#[serde(skip)]` and implement `Serialize`/`Deserialize`/`Clone`/`Debug` manually.\n4. **Lock strategy:** Follow the table in the lock strategy section above.\n\n## Dependency Boundaries\n\n**Owns:** registry, scheduling, approval, auth, auto_dream, cron, event_bus, inbox, pairing, scheduler, session_lifecycle, metering, router.\n\n**Does NOT own:**\n\n- Agent loop body, tool dispatch → `librefang-runtime`\n- Channel adapters → `librefang-channels`\n- HTTP routing, dashboard SPA → `librefang-api`\n\n**Does NOT depend on:** `librefang-api`, `librefang-extensions`. Reverse the dependency via `KernelHandle` when those crates need a kernel callback.\n\n## Testing\n\n- **Unit tests** live inside `crates/librefang-kernel/src/kernel/`.\n- **Integration tests** against a real router belong in `librefang-api/tests/` using `#[tokio::test]` against `TestServer` (refs #3721).\n\n### Commands\n\n```bash\n# Run kernel tests only\ncargo test -p librefang-kernel\n\n# Type-check the workspace (no full build)\ncargo check --workspace --lib\n```\n\n### Forbidden commands\n\n- `cargo test` (workspace-wide) — causes target/ contention with active user sessions.\n- `cargo build` — use `cargo check --workspace --lib`. Real builds run in CI.\n\n## Hard Rules\n\n- **No daemon spawning.** The CLI binary owns `start`. Kernel just runs.\n- **No `tokio::block_on`.** The kernel runs inside an existing runtime. Nesting is dangerous.\n- **No direct LLM HTTP calls.** Route through `librefang-runtime` drivers.\n- **No `Result<_, String>` returns** on new `KernelHandle` methods (#3541). Use typed errors.\n- **No `HashMap` in prompt-bound data** (#3298). Use `BTreeMap`.\n\n## Auxiliary Binary\n\n`purge_sentinels` (`bin/purge_sentinels.rs`) — standalone utility for cleaning up sentinel files.\n\n## Key Dependencies\n\n| Crate | Purpose |\n|---|---|\n| `librefang-types` | Shared type definitions |\n| `librefang-memory` | Storage substrate |\n| `librefang-runtime` | Execution engine (agent loops, tool dispatch) |\n| `librefang-skills` | Skill definitions |\n| `librefang-hands` | Tool/hand implementations |\n| `librefang-kernel-router` | Model routing (re-exported) |\n| `librefang-kernel-metering` | Token/cost accounting (re-exported) |\n| `dashmap` | Concurrent maps (`running_tasks`) |\n| `arc-swap` | RCU-style atomic reads (`model_catalog`) |\n| `parking_lot` | Lightweight mutex for history buffers |\n| `tera` | Jinja2-style templating for workflow `Transform` operations — sandboxed, no I/O, no shell escape |","other-librefang-llm-driver":"# Other — librefang-llm-driver\n\n# librefang-llm-driver\n\nTrait definitions and shared error types for LibreFang's LLM integration layer. This crate defines the `LlmDriver` trait and the `LlmError` enum — the contract that every provider implementation must satisfy. **No concrete provider code lives here.**\n\n## Why This Crate Exists\n\nSplitting the trait from its implementations serves a specific purpose: downstream crates (tests, kernel orchestration) can depend on the trait alone without pulling in `reqwest`, native TLS libraries, or vendored SDKs. The concrete implementations live in the sibling crate `librefang-llm-drivers` (note the trailing **s**).\n\nThis is an intentional architectural boundary. Do not merge the two crates.\n\n## Architecture\n\n```mermaid\ngraph TD\n    A[librefang-llm-driver] -->|depends on| B[librefang-types]\n    C[librefang-llm-drivers] -->|implements trait from| A\n    C -->|depends on| A\n    D[librefang-testing] -->|mock impls| A\n    E[consumer crates] -->|depend on trait| A\n    E -->|optional| C\n```\n\n- **This crate** owns the interface and shared types only.\n- **`librefang-llm-drivers`** provides concrete implementations (Anthropic, OpenAI, Gemini, Groq, etc.).\n- **`librefang-testing`** provides mock driver implementations for unit testing (see `MockKernelBuilder`).\n- Consumer crates depend on `librefang-llm-driver` for the trait. They opt into `librefang-llm-drivers` only when they need a real HTTP-backed provider.\n\n## Key Components\n\n### `LlmDriver` Trait\n\nThe core async trait that every LLM provider must implement. Defined in `lib.rs` using `async-trait`. This trait is the sole integration point between LibreFang's runtime and any LLM provider.\n\n### `LlmError` Enum\n\nDefined in `llm_errors.rs`. The structured error type returned by `LlmDriver` methods. Uses `thiserror` for ergonomic error derivation and `source()` chain preservation.\n\nEach variant answers specific diagnostic questions:\n\n| Question | Method |\n|---|---|\n| Can the caller safely retry? | `is_retryable()` |\n| Is this an auth or quota issue? | Structured into the variant |\n| Did the model produce invalid output? | Dedicated variant |\n\nThe `Partial` variant preserves bytes received before a streaming error occurred. Callers use these bytes to settle metering and billing rather than discarding partial work.\n\n### Shared Driver-Side Types\n\nCommon types used across all provider implementations. These live here to avoid duplication and to keep `librefang-llm-drivers` focused on HTTP wiring and provider-specific serialization.\n\n## Error Handling Design\n\n`LlmError` follows specific conventions:\n\n- **Structured variants only.** Every variant carries typed fields, not a catch-all `String`. This enables programmatic matching and recovery logic.\n- **No `Box<dyn Error>` in trait return types.** All `LlmDriver` methods return `Result<_, LlmError>`.\n- **Source chains are preserved** per the pattern established in `#3745`. Each variant that wraps an underlying error implements `std::error::Error::source()` correctly.\n- **Retry classification is built in.** `is_retryable()` and similar methods live directly on the enum, so callers don't need to match on variants to decide whether to retry.\n\n## Dependencies\n\nIntentionally minimal:\n\n| Dependency | Purpose |\n|---|---|\n| `librefang-types` | Shared domain types |\n| `async-trait` | Async trait definition |\n| `dashmap` | Concurrent map for driver-side caches/state |\n| `serde` / `serde_json` | Serialization of shared types |\n| `thiserror` | Error enum derivation |\n| `tokio` | Async runtime primitives |\n| `tracing` | Instrumentation |\n\n**Notably absent:** `reqwest`, TLS crates, vendor SDKs, `librefang-runtime`, `librefang-kernel`. This crate must compile fast and stay lightweight.\n\n## When to Modify This Crate\n\nMost changes to LLM integration happen in `librefang-llm-drivers`. You should only touch this crate when:\n\n- **A new trait method is genuinely needed.** This is rare. Open an issue for discussion first.\n- **A new `LlmError` variant is needed.** Add it as a structured variant with typed fields. Preserve the `source()` chain. Do not add a `String` catch-all.\n- **A new shared driver-side type is needed** by multiple providers.\n\nIf you're adding a new provider (Anthropic, Mistral, etc.), the implementation goes entirely in `librefang-llm-drivers`. No changes here should be required.\n\n## Testing\n\n- **Trait conformance** is validated by mock implementations in `librefang-testing` (see `MockKernelBuilder`).\n- **No HTTP fixture tests belong here.** Those live in `librefang-llm-drivers` alongside the provider implementation under test.\n- This crate's own tests should cover error variant behavior (`is_retryable()`, source chains, `Partial` byte preservation) and type serialization round-trips.\n\n## Hard Boundaries\n\nThese are non-negotiable constraints:\n\n1. **No `reqwest` or TLS dependencies.** This crate defines interfaces, not HTTP clients.\n2. **No import of `librefang-llm-drivers`.** It would create a circular dependency.\n3. **No import of `librefang-runtime` or `librefang-kernel`.** The driver trait must stand alone.\n4. **No `String`-typed error variants.** Use structured enum fields.\n5. **No `Box<dyn Error>` in trait signatures.** Use `LlmError`.","other-librefang-llm-drivers-tests":"# Other — librefang-llm-drivers-tests\n\n# librefang-llm-drivers Integration Tests\n\n## Purpose\n\nThis is the integration test suite for the `librefang-llm-drivers` crate. It validates the **wire contract** between each LLM provider driver and its upstream API — request shapes, response parsing, retry behaviour, streaming aggregation, and observability header propagation — against a local `wiremock` HTTP server rather than live endpoints.\n\nThe tests exist to catch regressions where a driver refactor silently breaks the HTTP envelope the provider expects, or where a response shape change stops being parsed correctly. They are intentionally **not** unit tests of internal driver logic; they treat each driver as a black box and inspect what actually goes over the wire.\n\n## Architecture\n\n```mermaid\ngraph TD\n    subgraph \"Test Harness (common/mod.rs)\"\n        IE[isolated_env] --> TD[TempDir + env vars]\n        IE --> ZB[ZeroBackoffGuard]\n        MD[mock_*_driver] --> WS[wiremock::MockServer]\n        CS[collect_stream] --> TX[mpsc channel]\n    end\n\n    subgraph \"Wire Contract Tests\"\n        RS[request_shape tests] --> MD\n        RS --> RQ[Inspect request JSON + headers]\n    end\n\n    subgraph \"Retry Tests\"\n        RT[retry tests] --> MD\n        RT --> LF[lockout_file_exists]\n    end\n\n    subgraph \"Trace Header Tests\"\n        TH[trace_header tests] --> MD\n        TH --> HD[Inspect x-librefang-* headers]\n    end\n```\n\n## Test File Organisation\n\nEach driver gets up to three dedicated test files plus the shared `common/mod.rs`:\n\n| File | Scope |\n|------|-------|\n| `common/mod.rs` | Shared harness — mock server construction, request builders, response fixtures, stream collector |\n| `<driver>_request_shape.rs` | Request body, headers, URL path, tool serialisation, response parsing (text + tool_calls), streaming text aggregation |\n| `<driver>_retry.rs` | HTTP 429/529/503 retry loops, lockout file creation, error variant mapping |\n| `<driver>_trace_headers.rs` | `x-librefang-agent-id`, `x-librefang-session-id`, `x-librefang-step-id` header emission/suppression |\n| `ollama_driver.rs` | Full Ollama-native driver coverage (request shape + retry + streaming + multimodal + error mapping in one file) |\n\nDrivers covered: **OpenAI**, **Anthropic**, **Gemini**, **Ollama** (native `/api/chat`), **Bedrock**, **ChatGPT** (Responses API), **Copilot**.\n\n## Shared Test Harness — `common/mod.rs`\n\nEvery test begins by calling `isolated_env()` which returns a `TestEnv` that:\n\n1. Creates a `tempfile::TempDir` and sets `LIBREFANG_HOME` to it, so rate-limit lockout files land in an isolated directory.\n2. Sets `NO_PROXY` / `no_proxy` to `127.0.0.1,localhost` so the drivers reach the local wiremock server instead of a corporate proxy.\n3. Activates `backoff::enable_test_zero_backoff()` via a `ZeroBackoffGuard`, collapsing all retry backoff intervals to zero so tests run in milliseconds rather than waiting real seconds.\n\n### Driver Constructors\n\nEach `mock_<provider>_driver(server)` function builds a real driver instance pointed at the wiremock server URI with a randomised API key and a 5-second timeout:\n\n```rust\npub fn mock_anthropic_driver(server: &MockServer) -> AnthropicDriver {\n    AnthropicDriver::with_proxy_and_timeout(\n        format!(\"sk-ant-test-{}\", Uuid::new_v4()),\n        server.uri(),\n        None,\n        Some(5),\n    )\n}\n```\n\nEquivalent constructors exist for `OpenAIDriver`, `GeminiDriver`, and `OllamaDriver`. Bedrock, ChatGPT, and Copilot tests construct their drivers inline because they have non-standard auth flows (bearer tokens, PAT exchange).\n\n### Request Builders\n\n- **`simple_request(model)`** — minimal `CompletionRequest` with one user message, 16 max tokens, no tools, no system prompt.\n- **`request_with_tools(model)`** — includes a single `ToolDefinition` (`get_weather` with a `location` parameter) and 256 max tokens.\n- **`request_with_temperature(model, temp)`** — overrides the sampling temperature.\n- **`o_series_request()`** — targets the `o3-mini` model with temperature 1.0 and 1000 max tokens.\n\n### Response Fixtures\n\nPre-built JSON response bodies matching each provider's wire format:\n\n| Fixture | Provider | Shape |\n|---------|----------|-------|\n| `openai_200_body(text)` | OpenAI | `choices[0].message.content` |\n| `anthropic_200_body(text)` | Anthropic | `content[0].text` |\n| `gemini_200_body(text)` | Gemini | `candidates[0].content.parts[0].text` |\n| `openai_sse_body(chunks)` | OpenAI | SSE `data:` lines with `[DONE]` sentinel |\n| `anthropic_sse_body(text)` | Anthropic | Full SSE event sequence (`message_start` → `content_block_delta` → `message_stop`) |\n| `gemini_sse_body(text)` | Gemini | Single `data:` line with candidates |\n\nError fixtures: `openai_429_response`, `anthropic_429_response`, `anthropic_529_response`, `gemini_429_response`, `gemini_503_response`, and Ollama-specific ones (404, 401, 502).\n\n### Stream Collection\n\n`collect_stream(driver, request)` drives `driver.stream()` with an `mpsc` channel, returns `(Result<CompletionResponse, LlmError>, Vec<StreamEvent>)`. Every streaming test uses this to assert both the final aggregated response and the individual events.\n\n### Lockout File Helpers\n\n- **`lockout_file_exists(provider, api_key)`** — checks whether `shared_rate_guard` wrote a rate-limit lockout file under `$LIBREFANG_HOME/rate_limits/`.\n- **`create_lockout_file(provider, api_key, until)`** — pre-creates a lockout to test the \"already locked out\" code path.\n\n## Wire Contract Tests\n\nThese lock in the exact shape of HTTP requests the driver emits and the way it parses responses. They are the primary regression guard against silent wire-format breakage.\n\n### What They Assert\n\n**Request side** (by inspecting `server.received_requests()`):\n\n- HTTP method and path (e.g. `POST /v1/messages` for Anthropic, `POST /v1beta/models/<model>:generateContent` for Gemini, `POST /api/chat` for Ollama).\n- Auth headers: `Authorization: Bearer ...` for OpenAI/Gemini/Ollama, `x-api-key` for Anthropic, `Authorization: Bearer` for Bedrock.\n- Provider-specific required headers: `anthropic-version: 2023-06-01`, `content-type: application/json`.\n- Body fields: `model`, `max_tokens`/`max_completion_tokens`, `messages`, `system`, `tools` with their provider-specific envelope shape.\n- Ollama-specific: `options.num_predict` instead of top-level `max_tokens`, native `think` boolean, `images[]` for multimodal, `role: \"tool\"` with `tool_name` for tool results.\n\n**Response side:**\n\n- Non-streaming text responses: `resp.text()` matches the fixture text, `stop_reason` is `EndTurn`.\n- Non-streaming tool-call responses: `resp.tool_calls` has the correct id/name/input, `stop_reason` is `ToolUse`, `resp.usage` has correct token counts.\n  - Anthropic: `tool_use` content block with `id`, `name`, `input`.\n  - OpenAI: `tool_calls[].function` with string-encoded `arguments` (driver must decode).\n  - Gemini: `functionCall` part — driver must mint a synthetic `id` since Gemini doesn't provide one.\n  - Ollama: `tool_calls[].function` with synthesised `ollama-call-*` IDs.\n\n**Streaming side:**\n\n- `TextDelta` events concatenate to the same string as `resp.text()`.\n- A terminal `ContentComplete` event always closes the stream.\n- Ollama NDJSON streaming: per-chunk `content` deltas, `thinking` deltas route to `ThinkingDelta` events, tool calls emit `ToolUseStart`/`ToolUseEnd` pairs.\n\n## Retry Tests\n\nEach provider has a retry test file that exercises the retry loop without waiting real time (thanks to `ZeroBackoffGuard`):\n\n### OpenAI (`openai_retry_complete.rs`, `openai_retry_stream.rs`)\n\n| Test | Behaviour |\n|------|-----------|\n| `oc1_429_retry_then_success` | Two 429s then 200 → success after 3 requests, lockout file created |\n| `oc2_429_exhaustion` | All 429s → `LlmError::RateLimited` after 4 attempts |\n| `oc3_preexisting_lockout_blocks_request` | Lockout file exists → `RateLimited` with zero HTTP requests |\n| `oc4_max_tokens_to_max_completion_tokens` | 400 \"unsupported max_tokens\" → retry with `max_completion_tokens` |\n| `oc5_temperature_strip` | 400 \"unsupported temperature\" → retry without `temperature` field |\n| `oc6_toolless_retry_on_500` | 500 server error → retry with tools stripped |\n| `oc7_max_tokens_auto_cap` | 400 \"max ≤ N\" → retry with capped value |\n| Stream equivalents | Same patterns for the streaming path |\n\n### Anthropic (`anthropic_retry.rs`)\n\n| Test | Behaviour |\n|------|-----------|\n| `aa1_429_retry_then_success` | Two 429s → 200, lockout file created |\n| `aa2_429_exhaustion` | Four 429s → `RateLimited`, lockout file created |\n| `aa3_529_retry_then_success_no_lockout` | 529 overloaded → 200, **no** lockout file (overloaded ≠ account rate limit) |\n| `aa4_529_exhaustion_overloaded` | Four 529s → `LlmError::Overloaded` |\n| `aa5_stream_429_retry` | Streaming path retries on 429 |\n\nKey distinction: Anthropic 429 creates a lockout file (account-level rate limit), while 529 does not (transient overload).\n\n### Gemini (`gemini_retry.rs`)\n\nUses a custom `SequencedResponder` (implements `wiremock::Respond`) to return a programmed sequence of responses, enabling ordered response chains without priority-based mock matching:\n\n| Test | Behaviour |\n|------|-----------|\n| `ag1_429_retry_then_success` | Two 429s → 200, lockout created |\n| `ag2_429_exhaustion` | Four 429s → `RateLimited` |\n| `ag3_503_retry_then_success_no_lockout` | 503 overload → 200, no lockout |\n| `ag4_auth_failure_403` | 403 → `LlmError::AuthenticationFailed`, no retry |\n| `ag5_stream_429_retry` | Streaming retries on 429 |\n\n## Trace Header Tests\n\nEvery driver has a `*_trace_headers.rs` file verifying three `x-librefang-*` headers:\n\n- `x-librefang-agent-id` ← `CompletionRequest.agent_id`\n- `x-librefang-session-id` ← `CompletionRequest.session_id`\n- `x-librefang-step-id` ← `CompletionRequest.step_id`\n\nEach file contains three or four tests:\n\n1. **Headers emitted when IDs are set** — all three headers present with correct values on both `complete()` and `stream()`.\n2. **Headers omitted when IDs are absent** — `None` values → no `x-librefang-*` headers at all.\n3. **Headers suppressed when emit flag is disabled** — `driver.with_emit_caller_trace_headers(false)` suppresses headers even when IDs are populated. This is the operator opt-out.\n4. **Stream variant** (some files) — same assertions via the streaming path.\n\nProvider-specific notes:\n- **Copilot** delegates to an inner `OpenAIDriver`; uses `CopilotDriver::new_for_test()` which bypasses the GitHub PAT→Copilot-token exchange.\n- **ChatGPT** uses a synthetic session token with `ChatGptDriver::with_proxy()`.\n- **Bedrock** uses Bearer token auth (`BedrockDriver::new_for_test`); tests note that a future SigV4 migration would need regression tests for unsigned pass-through headers.\n\n## Ollama Driver Tests\n\n`ollama_driver.rs` is a comprehensive single-file test suite because the Ollama driver has unique characteristics compared to the cloud providers:\n\n### Native API Surface\n\nThe driver targets `/api/chat` (Ollama native), never `/v1/chat/completions` (OpenAI compat shim). The test `request_targets_native_api_chat_with_native_body_shape` pins this with an explicit assertion.\n\n### Key Tests\n\n| Test | What It Validates |\n|------|-------------------|\n| `request_targets_native_api_chat_with_native_body_shape` | POST to `/api/chat`, `max_tokens` under `options.num_predict`, no top-level `max_tokens` |\n| `auth_header_only_emitted_when_api_key_configured` | Empty key → no header; explicit key → `Bearer` header |\n| `thinking_request_sets_native_think_true_field` | `ThinkingConfig` → `think: true` in body |\n| `non_streaming_tool_calls_parse_with_synthesised_ids` | `tool_calls` → `StopReason::ToolUse`, synthetic `ollama-call-*` IDs |\n| `non_streaming_first_class_thinking_routes_to_thinking_block` | `message.thinking` → `ContentBlock::Thinking`, separate from text |\n| `streaming_ndjson_aggregates_text_and_reports_usage` | Multi-chunk NDJSON → concatenated text, usage from `done: true` chunk |\n| `streaming_thinking_deltas_route_to_thinking_event` | `ThinkingDelta` events, no thinking leak into `TextDelta` |\n| `streaming_tool_calls_emit_start_end_pair` | `ToolUseStart` / `ToolUseEnd` event pair |\n| `http_404_maps_to_model_not_found` | 404 → `LlmError::ModelNotFound` |\n| `http_401_maps_to_authentication_failed` | 401 → `LlmError::AuthenticationFailed` |\n| `http_502_passes_through_raw_body_in_api_error` | Non-JSON 502 → `LlmError::Api` with raw body |\n| `multimodal_image_block_serialises_as_native_images_array` | `ContentBlock::Image` → native `images: [...]`, not OpenAI `image_url` |\n| `tool_result_serialises_as_role_tool_with_tool_name` | `ContentBlock::ToolResult` → `role: \"tool\"` with `tool_name`, not `tool_call_id` |\n| `streaming_tool_call_with_stringified_arguments_is_coerced` | Double-encoded JSON arguments → coerced to object |\n| `streaming_unparseable_tool_calls_chunk_keeps_prior_snapshot` | Malformed chunk doesn't erase valid prior snapshot |\n| `streaming_truncated_response_returns_partial_with_zero_usage` | No `done: true` → partial text, zero usage (not a hard error) |\n| `reverse_proxy_v1_path_is_not_stripped` | Custom mount `/openai/v1` preserved verbatim |\n| `legacy_v1_suffix_in_user_base_url_is_silently_stripped` | Bare `/v1` suffix stripped for backward compat |\n\n## Running the Tests\n\nAll tests are marked `#[serial_test::serial]` to prevent parallel execution from interfering with environment variables and lockout files. They are async (`#[tokio::test]`) and require no external network access — the wiremock server binds to `127.0.0.1`.\n\n```bash\n# All driver integration tests\ncargo test -p librefang-llm-drivers --test '*'\n\n# Specific driver\ncargo test -p librefang-llm-drivers --test anthropic_request_shape\ncargo test -p librefang-llm-drivers --test ollama_driver\n```\n\n## Adding Tests for a New Driver\n\n1. Add a `mock_newdriver_driver(server)` constructor to `common/mod.rs`.\n2. Create `newdriver_request_shape.rs` — assert the URL path, auth header, body shape (model, messages, tools envelope), tool-call response parsing, and streaming text aggregation.\n3. Create `newdriver_retry.rs` — exercise 429 and any provider-specific retryable status codes, verify lockout file creation/suppression.\n4. Create `newdriver_trace_headers.rs` — copy the three-test pattern (emit when set, omit when absent, suppress when flag disabled).\n5. All tests must call `isolated_env()` at the top and hold the returned `TestEnv` for the test lifetime.","other-librefang-llm-drivers":"# Other — librefang-llm-drivers\n\n# librefang-llm-drivers\n\nConcrete LLM provider drivers for the LibreFang platform. This crate implements the `LlmDriver` trait (from `librefang-llm-driver`) for Anthropic, OpenAI, Gemini, Groq, Ollama, and other providers, and wraps those implementations with production-grade infrastructure: credential pooling, fallback chains, rate-limit tracking, retry with backoff, and stream backpressure handling.\n\n## Architecture\n\n```mermaid\ngraph TD\n    A[Consumer code] --> B[FallbackChain]\n    B --> C1[Anthropic Driver]\n    B --> C2[OpenAI Driver]\n    B --> C3[Gemini Driver]\n    B --> C4[Ollama Driver]\n    B --> C5[Groq / others]\n    C1 & C2 & C3 & C4 & C5 --> D[ArcCredentialPool]\n    C1 & C2 & C3 & C4 & C5 --> E[RateLimitBucket]\n    C1 & C2 & C3 & C4 & C5 --> F[backoff / retry_after]\n    C1 & C2 & C3 & C4 & C5 --> G[stream_backpressure / utf8_stream]\n    C1 & C2 & C3 & C4 & C5 --> H[librefang-http]\n```\n\nAll drivers implement the trait defined in `librefang-llm-driver`, which defines the contract for sending prompts, receiving completions, and handling streaming responses. This crate turns that contract into working HTTP calls against each provider's API.\n\n## Key Components\n\n### Per-Provider Drivers (`drivers::*`)\n\nEach provider lives in its own submodule under `drivers`. Every driver:\n\n- Builds provider-specific HTTP requests (URL, headers, body schema).\n- Maps provider-specific error responses into the shared `llm_errors` types re-exported from `l
