site `Interest` cache.\n3. Without `rebuild_interest_cache()`, callsites already resolved to `Always`/`Never` would never re-query the new filter.\n\n### Baseline Preservation\n\nThis is critical: without it, a dashboard \"set debug\" toggle would call `EnvFilter::try_new(\"debug\")` and silently drop per-target overrides like `librefang_kernel=warn` that boot-time init had applied. The reload function always reapplies stored baselines.\n\n### `CliLogLevelReloader`\n\nImplements `librefang_kernel::log_reload::LogLevelReloader` so the kernel can trigger reloads through the same path without depending on CLI internals.\n\n## Bundled Agents / Registry Sync\n\n**File:** `bundled_agents.rs`\n\nA thin backwards-compatibility shim that delegates to `librefang_runtime::registry_sync::sync_registry`. Called during `init` to populate the local LibreFang home directory with built-in agent templates from the registry.\n\n## Tracing Initialization\n\nThe CLI configures tracing differently depending on the command:\n\n- **`init_tracing_stderr`** — Used by the daemon path. Installs `ReloadableEnvFilter` with per-target baseline overrides, plus an OTel exporter reload slot.\n- **`init_tracing_file`** — Used by the daemon's file logging. Writes structured logs to a timestamped file under `~/.librefang/logs/`.\n- **Single-shot commands** — Use a simpler tracing setup appropriate for their lifetime.\n\nTrace IDs are propagated via `WithTraceId` for correlation across daemon boundaries.\n\n## Configuration and Environment\n\n- **Config file:** `~/.librefang/config.toml` (or `$LIBREFANG_HOME`)\n- **Environment variables:** Loaded from `.env` at startup; API keys stored in `.env` rather than config for security\n- **Daemon info:** Written to `~/.librefang/daemon.json` on start; contains URL, PID, and auth token. Read by `read_daemon_info` to discover the running daemon.\n- **Log retention:** Old logs are pruned after `LOG_RETENTION_DAYS` (7 days) during `init --upgrade`.\n\n## Exit Codes\n\nThe `status` command uses specific exit codes for scripting:\n\n| Code | Meaning |\n|---|---|\n| 0 | Daemon running and healthy |\n| 1 | Daemon not running (in-process fallback) |\n| 2 | Daemon running but degraded |\n| 3 | Port open but `/api/health` unreachable |","dashboard-data-layer":"# Dashboard Data Layer\n\n# Dashboard Data Layer\n\nThe data layer mediates between the React UI and the Librefang daemon API. It covers HTTP transport, TanStack Query cache management, agent manifest TOML round-tripping, chat message normalization, and a collection of shared utilities.\n\n## Architecture\n\n```mermaid\ngraph TD\n    Pages[\"Pages / Components\"]\n    Mutations[\"mutations/*\"]\n    Queries[\"queries/*\"]\n    ClientFacade[\"http/client.ts\"]\n    ApiModule[\"api.ts\"]\n    Errors[\"http/errors.ts\"]\n    Daemon[\"Daemon HTTP API\"]\n\n    Pages -->|read| Queries\n    Pages -->|write| Mutations\n    Mutations --> ClientFacade\n    Queries --> ClientFacade\n    ClientFacade --> ApiModule\n    ApiModule --> Errors\n    ApiModule --> Daemon\n```\n\nAll data flows through a single import boundary (`http/client.ts`). Pages never import `api.ts` directly — the whitelist facade ensures every consumed symbol is intentional and that renames in `api.ts` surface as compile errors in the facade rather than silently propagating to hooks.\n\n---\n\n## HTTP Layer\n\n### Client Facade — `http/client.ts`\n\nAn explicit re-export layer. It does three things:\n\n1. **Re-exports query functions** (`listAgents`, `getAgentDetail`, `listModels`, etc.) — every read operation the UI needs.\n2. **Re-exports mutation functions** (`spawnAgent`, `deleteSession`, `installSkill`, etc.) — every write operation.\n3. **Re-exports types** (`UserItem`, `PromptExperiment`, `ProviderBudgetRow`, etc.) — shared shapes consumed by hooks and pages.\n\nThe file uses named exports only (no `export *`) so the surface is auditable. Removing a symbol from `api.ts` breaks here first, not in downstream hooks.\n\n### Error Handling — `http/errors.ts`\n\n`ApiError` is the structured error thrown by `api.ts`'s `parseError` helper. It captures:\n\n| Field | Source |\n|-------|--------|\n| `status` | HTTP status code |\n| `code` | Error code string from the response body |\n| `message` | Human-readable message |\n\n`ApiError.fromResponse(response)` parses the response body, trying four envelope shapes in priority order:\n\n1. Nested: `{ error: { code, message, request_id } }`\n2. Flat detail: `{ detail: \"...\" }`\n3. Flat message: `{ message: \"...\" }`\n4. Flat error: `{ error: \"...\" }`\n\nThe `toastErr` helper in `errors.ts` unwraps unknown thrown values into display strings, walking the `cause` chain up to 5 levels deep to find the most specific message.\n\n---\n\n## Query and Mutation Layer\n\n### Query Key Factories — `queries/keys.ts`\n\nEach domain has a factory object producing stable, hierarchical query keys:\n\n```ts\nagentKeys.all          → [\"agents\"]\nagentKeys.lists()      → [\"agents\", \"list\"]\nagentKeys.detail(id)   → [\"agents\", \"detail\", id]\nagentKeys.sessions(id) → [\"agents\", \"sessions\", id]\n```\n\nThese keys drive both cache lookups in query hooks and targeted invalidation in mutation `onSuccess` callbacks.\n\n### Mutation Patterns — `mutations/*`\n\nMutations follow a consistent structure:\n\n1. **Import the API function** from `http/client.ts`.\n2. **Wrap with `useMutation`**, passing the API function as `mutationFn`.\n3. **Invalidate affected queries** in `onSuccess` using the key factories.\n\nTwo invalidation strategies are used:\n\n**Broad invalidation** — most mutations invalidate a whole subtree:\n\n```ts\nonSuccess: (_data, variables) => {\n  qc.invalidateQueries({ queryKey: agentKeys.lists() });\n  qc.invalidateQueries({ queryKey: agentKeys.detail(variables.agentId) });\n}\n```\n\n**Optimistic cache patch** — mutations whose API returns the updated entity patch the cache directly, then invalidate as a safety net:\n\n```ts\nonSuccess: (data, variables) => {\n  qc.setQueryData<PromptExperiment[]>(\n    agentKeys.experiments(variables.agentId),\n    (prev) => prev?.map((e) => (e.id === data.id ? data : e)),\n  );\n  qc.invalidateQueries({ queryKey: agentKeys.experiments(variables.agentId) });\n}\n```\n\nThis eliminates the stale-read window between the mutation completing and the refetch landing.\n\n### Agent Mutations — `mutations/agents.ts`\n\nThe largest mutation file. Notable hooks:\n\n| Hook | Endpoint | Scope |\n|------|----------|-------|\n| `usePatchAgent` | `PATCH /agents/{id}` | Manifest-level fields (name, description, system_prompt, mcp_servers) |\n| `usePatchAgentConfig` | `PATCH /agents/{id}/config` | Model-tuning for standalone agents |\n| `usePatchHandAgentRuntimeConfig` | `PATCH /agents/{id}/hand-runtime-config` | Per-role overrides inside a hand group |\n| `useClearHandAgentRuntimeConfig` | `DELETE /agents/{id}/hand-runtime-config` | Restores HAND.toml defaults |\n\n`usePatchAgentConfig` and `usePatchHandAgentRuntimeConfig` accept the same `AgentConfigPatch` type (model, provider, temperature, max_tokens). Hand overrides additionally support `api_key_env` and `base_url` as tri-state fields (absent = unchanged, empty = clear, non-empty = set).\n\nHand-agent mutations invalidate `handKeys.details()` in addition to agent keys, because the hand-detail view surfaces per-role runtime state.\n\n### Query Options — `queries/options.ts`\n\nSeveral query hooks (agents, skills, MCP, models) route through a `withOverrides` helper that merges caller-provided `UseQueryOptions` with defaults. This allows pages to customize `enabled`, `staleTime`, or `select` without re-implementing the query function.\n\n---\n\n## Agent Manifest — TOML Round-Tripping\n\n### Core Module — `agentManifest.ts`\n\nManages bi-directional conversion between TOML text and a structured form state, with a critical property: **unknown fields survive the round-trip**.\n\n#### Data Model\n\n```ts\ninterface ManifestFormState { /* ~60 fields covering the form UI */ }\ninterface ManifestExtras {\n  topLevel: TomlTable;   // unknown top-level keys\n  model: TomlTable;      // unknown keys under [model]\n  resources: TomlTable;  // unknown keys under [resources]\n  capabilities: TomlTable; // unknown keys under [capabilities]\n}\n```\n\nThe form covers fields the visual editor exposes. Anything the form doesn't understand (tools tables, metadata, profile sections, provider-specific flattened fields) is captured in `extras` and re-emitted unchanged during serialization.\n\n#### Parse Flow — `parseManifestToml`\n\n1. Parse TOML with `smol-toml`.\n2. Populate `ManifestFormState` using type-coercing helpers (`asString`, `asNumberString`, `asBoolean`, `asStringArray`, `asEnum`).\n3. For each section (`[model]`, `[resources]`, `[capabilities]`), strip known keys — everything remaining goes into the corresponding `extras` bucket.\n4. Handle special cases:\n   - `exec_policy` aliases (`none`→`deny`, `restricted`→`allowlist`, etc.) are normalized at parse time.\n   - `response_format` with an unknown `type` falls back to `{ mode: \"text\" }` and the raw table is preserved in `topLevel` extras.\n   - `[[fallback_models]]` entries capture provider-specific flattened extras (e.g., Qwen's `enable_memory`) per-item.\n\nReturns `ParseResult | ParseError` — the latter carries `line`/`column` from `smol-toml`'s `TomlError`.\n\n#### Serialize Flow — `serializeManifestForm`\n\n1. Emit top-level scalars, omitting defaults (e.g., `priority: \"Normal\"` is not emitted).\n2. Emit section blocks (`[model]`, `[resources]`, `[capabilities]`).\n3. Emit conditional sections (`[thinking]`, `[autonomous]`, `[routing]`) only when enabled.\n4. Emit array-of-tables (`[[fallback_models]]`, `[[context_injection]]`).\n5. Re-emit deferred extras — sub-tables discovered inside section extras are emitted as proper top-level `[section.subtable]` headers to avoid scoping violations.\n6. Emit top-level table extras last (TOML scoping requirement).\n\nKey safety measure: `renderExtraScalars` refuses multi-line output. A stray `[name]` header embedded inside a section block would re-anchor TOML scoping and corrupt the output.\n\n#### Numeric Handling\n\nAll numeric form fields are stored as raw strings. `parseInteger` rejects negatives and values beyond `MAX_SAFE_INTEGER` (the kernel uses unsigned Rust types). `parseFloatish` rejects negatives for cost/quota fields. Empty strings are omitted rather than defaulted to zero — this preserves kernel defaults when the user leaves a field blank.\n\n#### Validation — `validateManifestForm`\n\nReturns an array of field names that are required but empty (`name`, `model.provider`, `model.model`). Empty array = submittable.\n\n### Markdown Renderer — `agentManifestMarkdown.ts`\n\nConverts `ManifestFormState` + `ManifestExtras` into human-readable Markdown for documentation, code review, or sharing. Structure mirrors the form layout:\n\n- **Header** — name, version, description, author, tags, enabled status\n- **Model** — provider, model, temperature, system prompt\n- **Resources** — table of configured limits\n- **Capabilities** — bullet list of granted permissions\n- **Advanced sections** — schedule, fallback models, thinking, autonomous, routing, context injection, response format (only emitted when non-default)\n- **Lifecycle & Overrides** — fields that differ from kernel defaults\n- **Advanced configuration appendix** — anything preserved from extras\n\n### UIDs\n\n`generateUid()` produces monotonically increasing string IDs for dynamic form rows (fallback models, context injection entries). These are client-only identifiers that never reach TOML.\n\n---\n\n## Chat Data Flow\n\n### Message Normalization — `chat.ts`\n\n| Function | Purpose |\n|----------|---------|\n| `normalizeRole` | Maps kernel role strings (`\"User\"`, `\"Assistant\"`, `\"System\"`) to lowercase |\n| `asText` | Serializes unknown values to strings, handling circular references |\n| `formatMeta` | Formats token counts, iterations, and cost into a compact display string |\n| `normalizeToolOutput` | Extracts tool name, result text, and error status from tool-result events |\n| `extractAssistantHistoryParts` | Splits persisted `ContentBlock[]` into visible text and thinking strings |\n\n`extractAssistantHistoryParts` handles the reload path: when a chat is reloaded from the server, assistant messages arrive as `ContentBlock[]` arrays rather than the flat strings used during live streaming. The function joins multiple `text` blocks and multiple `thinking` blocks with `\\n\\n` (paragraph break for markdown), matching the live-streaming accumulation model. `tool_use` and `tool_result` blocks are skipped — the chat UI reads those from the separate `msg.tools` field.\n\n### Chat Picker — `chatPicker.ts`\n\nPartitions agents into standalone agents and hand-groups for the chat sidebar:\n\n1. Filter hand instances to \"usable\" ones (Active status, has agent mappings, has `hand_id`/`hand_name`).\n2. Build a membership lookup: agent_id → hand metadata + role + isCoordinator.\n3. Group agents by `hand_id`, sort within groups (coordinator first, then alphabetical by role), sort groups by `hand_name`.\n4. `is_hand` agents whose hand instance is inactive or missing are dropped entirely.\n\nHandles the loading state gracefully: when `handInstances` is `undefined` (query unresolved), all agents appear as standalone to prevent URL-pinned hand agents from disappearing during bootstrap.\n\n### Session Cache — `chatSessionCache.ts`\n\nAn in-memory LRU cache for chat session message history. Limits:\n\n- **50 entries** maximum\n- **30 minute TTL** per entry\n- Evicts expired entries first, then oldest insertion-order entries down to 80% capacity on overflow\n\nKeyed by `agentId:sessionId`. Agent-scoped bulk clear (`clearChatSessionCacheForAgent`) is used by `useResetAgentSession`.\n\n---\n\n## Utility Modules\n\n### `bundleMode.ts`\n\nPatches `window.fetch` and `window.WebSocket` for the mobile Tauri shell. In release builds, the dashboard loads from `tauri://localhost` but API requests must go to the daemon. The shell encodes the daemon URL in `#api=<encoded>`, which this module extracts, persists to localStorage, and uses to rewrite same-origin paths.\n\n`PatchedWS` extends the real `WebSocket` constructor so `instanceof` checks and static constants (`OPEN`, `CONNECTING`, etc.) work correctly.\n\n**Critical timing**: `setupBundleMode()` must run before `createRoot().render()` in `main.tsx`. Any module that eagerly fetches during evaluation would bypass the patches.\n\n### `canvas.ts`\n\nSingle pure function: `removeNodeAndCascadeEdges`. Removes a workflow node and all edges referencing it. Mirrors xyflow's built-in Backspace deletion for the context-menu delete path.\n\n### `clipboard.ts`\n\n`copyToClipboard` — prefers `navigator.clipboard.writeText` (secure contexts), falls back to `document.execCommand(\"copy\")` with a detached textarea for LAN-IP HTTP deployments.\n\n### `csvParser.ts`\n\nRFC-4180 compliant CSV tokenizer for user bulk import. Handles:\n- UTF-8 BOM stripping\n- Quoted fields with embedded commas, newlines, and escaped quotes (`\"\"`)\n- CRLF, LF, and CR line endings\n\n`parseUsersCsv` is the semantic layer: validates `name`/`role` columns, collects extra columns as `channel_bindings`, and reports per-row errors while still returning parseable rows.\n\n### `datetime.ts`\n\nFormatting helpers: `formatDateTime`, `formatDate`, `formatTime` (locale-aware), `formatRelativeTime` (\"3m ago\", \"2h ago\"), `formatUptime` (\"1d 2h\").\n\n### `format.ts`\n\nNumber formatters: `formatCompact` (1.2K, 3.4M), `formatCost` (USD with 2 or 4 decimal places), `formatBytes` (KB, MB, GB).\n\n### `hiddenModels.ts`\n\nManages model visibility. `modelKey(m)` produces `\"provider:id\"`, `filterVisible` excludes hidden keys. Used by the model settings page to let users hide unwanted models.\n\n### `drawerStore.ts`\n\nZustand store for the global push-drawer slot. One drawer open at a time; opening a new one replaces the current. The `<PushDrawer>` host in `App.tsx` is a flex sibling that pushes main content rather than overlaying.\n\n### `hooks/useMathPlugins.ts`\n\nLazy-loads `remark-math` + `rehype-katex` + KaTeX CSS only when content contains math delimiters (`$...$`, `$$...$$`, `\\(...\\)`, `\\[...\\]`). The resolved plugin pair is cached globally so subsequent consumers don't re-trigger dynamic imports.\n\n---\n\n## Adding a New Query or Mutation\n\n### New Query\n\n1. Add the API function to `api.ts`.\n2. Add a named re-export in `http/client.ts` under the \"Query functions\" section.\n3. If it returns a new type, add a type re-export in `http/client.ts` under \"Type re-exports\".\n4. Add a key factory entry in `queries/keys.ts`.\n5. Create the query hook in the appropriate `queries/*.ts` file, routing through `withOverrides` if callers need customization.\n\n### New Mutation\n\n1. Add the API function to `api.ts`.\n2. Add a named re-export in `http/client.ts` under the \"Mutation functions\" section.\n3. Create the mutation hook in the appropriate `mutations/*.ts` file.\n4. In `onSuccess`, invalidate every query key that might be affected. Use `qc.removeQueries` when the mutation deletes an entity (e.g., `useDeleteAgent` removes the detail cache). If the API returns the updated entity, patch the cache with `setQueryData` before invalidating.\n\n### TOML Form Fields\n\n1. Add the field to `ManifestFormState` in `agentManifest.ts`.\n2. Add the key to the appropriate `FORM_*_KEYS` set.\n3. Set a default in `emptyManifestForm`.\n4. Add parse logic in `parseManifestToml`.\n5. Add emit logic in `serializeManifestForm`.\n6. Add rendering in `agentManifestMarkdown.ts` if the field should appear in the Markdown preview.","dashboard-ui":"# Dashboard UI\n\n# Dashboard UI\n\nThe LibreFang Dashboard is a single-page React application that provides a browser-based management console for the LibreFang agent runtime. It communicates with the kernel's HTTP API through a typed API client layer backed by OpenAPI-generated TypeScript types.\n\n## Architecture\n\n```mermaid\ngraph TD\n    subgraph \"Browser\"\n        P[Pages] --> Q[React Query hooks]\n        Q --> A[api.ts client]\n        A --> H[HTTP fetch]\n        A --> WS[WebSocket / SSE]\n    end\n    subgraph \"Build-time\"\n        OAS[OpenAPI spec] --> GEN[openapi-typescript]\n        GEN --> TYPES[generated.ts]\n    end\n    subgraph \"Shared libs\"\n        A --> ERR[ApiError]\n        P --> LIB[lib utilities]\n    end\n    TYPES -.-> A\n    Q -.-> TYPES\n```\n\n## Key Layers\n\n### OpenAPI Type Definitions (`openapi/generated.ts`)\n\nAuto-generated by `openapi-typescript` from the server's OpenAPI schema. Exports the `paths` and `operations` interfaces that type every API route, request body, and response shape. **Do not edit this file directly** — regenerate from the schema when the backend contract changes.\n\nThe generated types cover all REST endpoints under `/api/*`, `/a2a/*`, and `/hooks/*`, organized by path with per-method operation IDs (e.g., `operations[\"spawn_agent\"]`, `operations[\"list_agents\"]`).\n\n### API Client (`src/api.ts`)\n\nThe central HTTP client module. All backend communication flows through here.\n\n**Primitive functions:**\n\n| Function | Purpose |\n|---|---|\n| `get<T>(path)` | GET with JSON parsing |\n| `post<T>(path, body)` | POST with JSON body |\n| `put<T>(path, body)` | PUT with JSON body |\n| `del<T>(path)` | DELETE |\n| `patch<T>(path, body)` | PATCH with JSON body |\n| `getText(path)` | GET returning raw string (e.g., TOML config) |\n| `fetchWithTimeout(url, opts)` | Low-level fetch with configurable timeout |\n\n**Authentication flow:**\n\nAll primitives call `buildHeaders()` → `authHeader()` → `getStoredApiKey()` to attach the stored session token to every request. The key is obtained during login and persisted in the browser.\n\n**Error handling:**\n\nEvery primitive wraps the response in `parseError()`, which delegates to `fromResponse()` in `lib/http/errors.ts` to produce structured `ApiError` objects. Callers never see raw HTTP errors — they always get `ApiError` with status, message, and body details.\n\n**WebSocket/SSE:**\n\n`buildAuthenticatedWebSocket(path)` constructs a WebSocket URL with the auth token for streaming endpoints like session events and log tails.\n\n**Representative domain functions:**\n\nThe module exports dozens of named functions that map 1:1 to backend endpoints:\n\n- **Agents**: `getAgentDetail`, `deleteAgent`, `createAgentSession`, `clearHistory`\n- **A2A**: `sendA2ATask`, `listExternalAgents`\n- **Skills/ClawHub**: `getSkillDetail`, `installSkill`, `uninstallPlugin`, `clawhubCnBrowse`, `fanghubListSkills`\n- **Providers**: `deleteProviderKey`, `setConfigValue`\n- **Memory**: agent KV get/set/delete, memory consolidation\n- **Approvals**: `fetchApprovalCount`, `resolveApproval`, `rejectApproval`\n- **Audio**: `transcribeAudio`\n- **Config**: `getRawConfigToml`, `setConfigValue`\n- **Cron**: `updateSchedule`\n- **Auth**: `totpStatus`, `totpConfirm`\n\n### Data Fetching (`lib/queries/`, `lib/mutations/`)\n\nReact Query hooks that wrap the API client functions. Two execution flows illustrate the pattern:\n\n**Read path (query):**\n```\nqueryFn → apiClientFunction → get() → parseError() → ApiError\n```\n\n**Write path (mutation):**\n```\nmutationFn → apiClientFunction → post() → parseError() → ApiError\n```\n\nBoth flows also pass through `buildHeaders()` → `authHeader()` → `getStoredApiKey()` for authentication.\n\n## Pages\n\nEach page is a top-level route component mounted by `App.tsx`:\n\n| Page | Route | Purpose |\n|---|---|---|\n| `OverviewPage` | `/` | System-wide KPI tiles, relative timestamps |\n| `AgentsPage` | `/agents` | Agent CRUD, manifest editing, session management |\n| `ChatPage` | `/chat` | Live chat with agent, SSE streaming, tool output |\n| `SessionsPage` | `/sessions` | Session list, history browsing |\n| `AuditPage` | `/audit` | Filtered audit log with export |\n| `LogsPage` | `/logs` | Real-time log streaming |\n| `ProvidersPage` | `/providers` | Provider cards, credential details |\n| `SkillsPage` | `/skills` | ClawHub marketplace, install/uninstall |\n| `A2APage` | `/a2a` | Agent-to-agent task management |\n| `CommsPage` | `/comms` | Inter-agent communication topology |\n| `NetworkPage` | `/network` | OFP network status |\n| `WorkflowsPage` | `/workflows` | Workflow list and scheduling |\n| `UsersPage` | `/users` | User management, CSV import |\n\n## Library Utilities (`src/lib/`)\n\nShared helpers consumed across pages and components:\n\n### `datetime.ts`\n\nFormatting functions used pervasively:\n- `formatRelativeTime` — \"3 minutes ago\" style timestamps (OverviewPage, AgentsPage, AuditPage, SessionsPage)\n- `formatTime` / `formatDateTime` — absolute timestamps (LogsPage, ProvidersPage, A2APage, NetworkPage, Memory)\n- `formatDate` — date-only format (WorkflowsPage, SkillsPage, PendingSkillsSection)\n\n### `agentManifest.ts`\n\nAgent manifest (TOML) parsing and validation:\n- `parseManifestToml` — deserializes TOML into form state (used when switching create mode)\n- `serializeManifestForm` — serializes form state back to TOML\n- `validateManifestForm` — form validation before submission\n- `generateUid` — generates unique identifiers for new agents\n\n### `agentManifestMarkdown.ts`\n\n- `generateManifestMarkdown` — converts form state to Markdown for display/export\n\n### `chatPicker.ts`\n\n- `groupedPicker` — organizes agents/sessions into groups for the chat target picker\n\n### `chatSessionCache.ts`\n\n- `deleteCachedChatMessages` — clears local message cache; called on history clear and unmount\n\n### `chat.ts`\n\n- `normalizeToolOutput` — normalizes tool execution output for display in chat bubbles\n\n### `clipboard.ts`\n\n- `copyToClipboard` — cross-browser clipboard API wrapper\n\n### `csvParser.ts`\n\n- `parseUsersCsv` — parses CSV files for bulk user import on UsersPage\n\n### `bundleMode.ts`\n\n- `setupBundleMode` — initializes the dashboard when running as a bundled Tauri desktop app (called from `main.tsx`)\n\n## Components\n\n### `AgentManifestForm`\n\nThe agent creation/editing form. Manages fields like name, description, system prompt, model, skills, tools, and MCP servers. Calls `updateAutonomous()` internally to toggle autonomous mode. Uses `generateUid()` for new agent IDs.\n\n### Memory Components (`Memory/components/`)\n\n- `AgentKvRows` — tabular KV memory editor with `formatDateTime` timestamps\n- `MemoryRecordCard` — card view for a proactive memory record\n\n### `PendingSkillsSection`\n\n- `CandidateRow` — individual skill candidate with `formatDate` for timestamps\n\n## Error Handling Contract\n\nAll API errors flow through a single pipeline:\n\n1. `fetch` returns a non-OK response\n2. `parseError()` in `api.ts` catches it\n3. Delegates to `fromResponse()` in `lib/http/errors.ts`\n4. Produces an `ApiError` instance with structured fields\n\nPages and mutations handle `ApiError` uniformly — typically displaying the error message in a toast or inline alert. The `ApiError` class carries the HTTP status code, human-readable message, and the raw response body for debugging.\n\n## Contributing Guidelines\n\n**Adding a new API call:**\n1. Ensure the endpoint exists in `openapi/generated.ts` (regenerate if needed)\n2. Add a typed wrapper function in `api.ts` using the appropriate primitive (`get`, `post`, `put`, `del`, `patch`)\n3. Create a React Query hook in `lib/queries/` or `lib/mutations/`\n4. Consume the hook from the target page component\n\n**Adding a new page:**\n1. Create the component in `src/pages/`\n2. Import utility functions from `src/lib/` (datetime, clipboard, etc.) rather than reimplementing\n3. Use the shared `ApiError` handling — don't catch raw fetch errors\n4. Register the route in `App.tsx`\n\n**Modifying the OpenAPI types:**\n1. Update the backend OpenAPI spec\n2. Run `openapi-typescript` to regenerate `generated.ts`\n3. Fix any type errors in dependent code","data-import-migration":"# Data Import & Migration\n\n# Data Import & Migration (`librefang-import`)\n\nMigrates agent configurations, memory, sessions, and related data from external agent frameworks into LibreFang's native format.\n\n## Supported Sources\n\n| Source | Status | Format |\n|---|---|---|\n| OpenClaw (modern) | Supported | Single `openclaw.json` (JSON5) |\n| OpenClaw (legacy) | Supported | `config.yaml` + per-agent `agent.yaml` |\n| OpenFang | Supported | Same TOML format, field remapping |\n| LangChain | Planned | — |\n| AutoGPT | Planned | — |\n\n## Entry Points\n\nThe crate exposes one public function for executing migrations and two for pre-migration inspection:\n\n```rust\n// Execute a migration\npub fn run_migration(options: &MigrateOptions) -> Result<MigrationReport, MigrateError>;\n\n// Pre-migration inspection (OpenClaw only)\npub fn detect_openclaw_home() -> Option<PathBuf>;\npub fn scan_openclaw_workspace(path: &Path) -> ScanResult;\n```\n\n### Callers\n\n- **CLI** — `librefang-cli` calls `run_migration` via `cmd_migrate`, then prints the report summary.\n- **TUI init wizard** — `tui/screens/init_wizard.rs` calls `detect_openclaw_home` and `scan_openclaw_workspace` to show the user what's available, then `run_migration` when confirmed.\n- **HTTP API** — `src/routes/config.rs` exposes `migrate_detect`, `migrate_scan`, and `run_migrate` endpoints.\n\n## Migration Options\n\n```rust\npub struct MigrateOptions {\n    pub source: MigrateSource,   // Which framework to import from\n    pub source_dir: PathBuf,     // Path to the source workspace\n    pub target_dir: PathBuf,     // Path to LibreFang home (~/.librefang)\n    pub dry_run: bool,           // Report only, no disk writes\n}\n```\n\nSet `dry_run: true` to get a full `MigrationReport` without modifying any files. The CLI and TUI both use this for preview-before-commit workflows.\n\n## Architecture\n\n```mermaid\nflowchart TD\n    A[run_migration] --> B{source?}\n    B -->|OpenClaw| C[openclaw::migrate]\n    B -->|OpenFang| D[openfang::migrate]\n    B -->|LangChain / AutoGPT| E[UnsupportedSource error]\n\n    C --> F{Config format?}\n    F -->|JSON5| G[migrate_from_json5]\n    F -->|YAML| H[migrate_from_legacy_yaml]\n\n    G --> G1[Config → config.toml]\n    G --> G2[Agents → agents/&lt;id&gt;/agent.toml]\n    G --> G3[Memory → agents/&lt;id&gt;/imported_memory.md]\n    G --> G4[Workspaces → agents/&lt;id&gt;/workspace/]\n    G --> G5[Sessions → imported_sessions/]\n    G --> G6[Channels → secrets.env + skipped items]\n\n    H --> H1[Config → config.toml]\n    H --> H2[Agents → agents/&lt;id&gt;/agent.toml]\n    H --> H3[Memory + Workspaces]\n\n    C --> I{dry_run?}\n    I -->|yes| J[Return report]\n    I -->|no| K[Write to staging dir]\n    K --> L[promote_staging → target]\n    L --> M[Write .openclaw_migrated marker]\n```\n\n## Atomic Migration Pipeline\n\nAll non-dry-run OpenClaw migrations follow a write-to-staging-then-promote pattern:\n\n1. **Staging directory** — A sibling directory `<target>.migrate-staging` receives all output. If this directory already exists (from a previous failed run), migration aborts with `MigrateError::StagingExists` to prevent silent corruption.\n\n2. **Per-entry atomic writes** — Each file is written to a `.tmp` sibling then renamed (`atomic_write`). Existing files in the target are backed up to `.bak.<timestamp>` siblings before any overwrite.\n\n3. **Promotion** — `promote_staging` recursively moves files from staging into the real target. Files that already exist in the target are **never clobbered** (the staged copy is dropped and a warning is emitted). On cross-device renames, a copy-then-rename fallback preserves atomicity.\n\n4. **Marker** — A `.openclaw_migrated` marker is written inside staging before promotion. Subsequent runs detect this marker and skip entirely to preserve user edits.\n\n## OpenClaw Config Discovery\n\n`find_config_file` searches the source directory for known config file names, in priority order:\n\n1. `openclaw.json` (modern)\n2. `clawdbot.json`, `moldbot.json`, `moltbot.json` (legacy names)\n3. `config.yaml` (very old installs)\n\nIf a JSON file is found, the JSON5 code path runs. Otherwise, the legacy YAML path runs.\n\n`detect_openclaw_home` checks standard locations (`~/.openclaw`, `~/.clawdbot`, `~/.moldbot`, `~/.moltbot`, `~/.config/openclaw`, `%APPDATA%/openclaw`, `%LOCALAPPDATA%/openclaw`) plus the `OPENCLAW_STATE_DIR` env override.\n\n## Schema Version Validation\n\nOpenClaw JSON5 configs may declare a `version` (or `schemaVersion`) field. The migrator accepts versions `1` and `2` only. Any other version produces `MigrateError::UnsupportedVersion`. A missing version field is allowed with a warning.\n\n## What Gets Migrated\n\n### Config\n\nThe top-level OpenClaw config is converted to LibreFang's `config.toml`:\n\n| OpenClaw | LibreFang |\n|---|---|\n| `agents.defaults.model` | `[default_model]` provider/model/api_key_env |\n| `agents.defaults.memory` | `[memory]` decay_rate |\n| — | `config_version` (current) |\n| — | `api_listen` (default) |\n\n### Agents\n\nEach agent in `agents.list` (JSON5) or `agents/<name>/agent.yaml` (legacy) becomes `agents/<id>/agent.toml`:\n\n- **Model** — The `\"provider/model\"` string is split; fallback models become `[[fallback_models]]` entries.\n- **Tools** — Individual tool names are mapped via `librefang_types::tool_compat::map_tool_name`. Unrecognized tools are reported as warnings. Tool profiles (`\"minimal\"`, `\"coding\"`, etc.) map to `ToolProfile::tools()`.\n- **Capabilities** — Derived from the tool list: `shell_exec` → `[capabilities].shell`, `web_fetch`/`web_search` → `.network`, `agent_send`/`agent_list` → `.agent_message` + `.agent_spawn`.\n- **Identity** — `extract_identity_prompt` handles both plain strings and structured objects, searching common keys (`systemPrompt`, `prompt`, `instructions`, etc.) recursively.\n- **Tool blocklist** — OpenClaw's `tools.deny` list is preserved as `tool_blocklist` in the agent manifest.\n- **Skills** — Per-agent skill allowlists from `entry.skills` are preserved as the `skills` array.\n- **Workspace** — Custom workspace paths from `entry.workspace` are carried over.\n\n### Memory\n\n`memory/<agent>/MEMORY.md` (or `agents/<agent>/MEMORY.md` in legacy layouts) is copied to `agents/<agent>/imported_memory.md`. Empty files are skipped. Deduplication ensures the JSON5 layout takes precedence if both exist.\n\n### Workspaces\n\n`workspaces/<agent>/` (or `agents/<agent>/workspace/`) directories are copied recursively to `agents/<agent>/workspace/`.\n\n### Sessions\n\n`sessions/*.jsonl` files are copied to `imported_sessions/` in the target.\n\n### Channel Secrets\n\nAll messaging channels have migrated to out-of-process sidecar adapters. The migrator extracts bot tokens and API keys from the OpenClaw channel config and writes them to `secrets.env` (with `0o600` permissions on Unix). Each channel is reported as a `SkippedItem` with instructions for configuring the corresponding sidecar.\n\nSupported secret extraction:\n\n| Channel | Secrets written |\n|---|---|\n| Telegram | `TELEGRAM_BOT_TOKEN` |\n| Discord | `DISCORD_BOT_TOKEN` |\n| Slack | `SLACK_BOT_TOKEN`, `SLACK_APP_TOKEN` |\n| Mattermost | `MATTERMOST_TOKEN` |\n\nAll other channels (WhatsApp, Signal, Matrix, Google Chat, Teams, IRC, Feishu, iMessage, BlueBubbles) are reported as skipped with no secret extraction.\n\n### Skipped Features\n\nThese OpenClaw features have no LibreFang equivalent and appear as skipped items in the report:\n\n- **Cron jobs** — Use LibreFang's `ScheduleMode::Periodic`\n- **Hooks** — Use the event system\n- **Auth profiles** — Security-sensitive; set env vars manually\n- **Skills** — Must be reinstalled via `librefang skill install`\n- **Vector index** (`memory-search/index.db`) — Rebuilt automatically\n- **Auth profiles file** (`auth-profiles.json`) — Security-sensitive\n- **Session config** — Different scoping model\n- **Memory backend config** — LibreFang uses SQLite with vector embeddings\n\n## Security Measures\n\n- **Path traversal prevention** (#3794) — `validate_migration_id` rejects agent IDs containing `..`, absolute paths, or NUL bytes. Only single normal path components are accepted.\n- **Atomic file writes** — All output files are written via `atomic_write` (write to `.tmp`, then rename).\n- **Backup before overwrite** — `write_with_backup` renames any existing target to `.bak.<timestamp>` before writing.\n- **Secret file permissions** — `write_secret_env` restricts `secrets.env` to `0o600` on Unix.\n- **Idempotency protection** — The `.openclaw_migrated` marker prevents accidental re-imports from overwriting user edits.\n\n## Error Handling\n\n```rust\npub enum MigrateError {\n    SourceNotFound(PathBuf),       // source_dir doesn't exist\n    ConfigParse(String),           // malformed config\n    AgentParse(String),            // malformed agent definition\n    Io(std::io::Error),            // filesystem errors\n    Yaml(serde_yaml::Error),       // YAML parse errors\n    Json5Parse(String),            // JSON5 parse errors\n    TomlSerialize(toml::ser::Error), // TOML output errors\n    UnsupportedSource(String),     // LangChain, AutoGPT, etc.\n    InvalidId(String),             // path traversal in agent id (#3794)\n    UnsupportedVersion(u32),       // unknown schema version (#3797)\n    StagingExists(PathBuf),        // stale staging from failed run (#3798)\n}\n```\n\nOn failure, the staging directory is intentionally left in place so users can inspect partial output. A subsequent run will refuse to proceed until the staging directory is manually removed.\n\n## Migration Report\n\n`MigrationReport` tracks everything that happened during a run:\n\n- **`imported`** — `Vec<MigrateItem>` listing every file written, with `kind` (Config, Agent, Memory, Session, Secret, Skill) and destination path.\n- **`skipped`** — `Vec<SkippedItem>` for features that couldn't be auto-migrated, with human-readable `reason` strings.\n- **`warnings`** — Non-fatal issues (unmapped tools, backed-up files, etc.).\n- **`dry_run`** — Whether the report was produced without writing to disk.\n\nThe report is serialized to `migration_report.md` inside the target after a successful migration.\n\n## Provider Mapping\n\n`map_provider` normalizes OpenClaw provider names:\n\n| OpenClaw | LibreFang |\n|---|---|\n| `anthropic`, `claude` | `anthropic` |\n| `openai`, `gpt` | `openai` |\n| `google`, `gemini` | `google` |\n| `xai`, `grok` | `xai` |\n| Others (groq, ollama, openrouter, deepseek, together, mistral, fireworks, cerebras, sambanova) | Passed through unchanged |\n\n`default_api_key_env` maps each provider to its standard environment variable name (e.g., `ANTHROPIC_API_KEY`). Ollama returns an empty string (no key needed).\n\n## OpenFang Migration\n\nOpenFang uses the same TOML format as LibreFang (it's a community fork). The `openfang::migrate` function handles field remapping and schema drift detection, calling into `rewrite_toml_content` and `rewrite_env_content` for format adjustments. It uses `librefang_types::config::validation::detect_unknown_fields` to warn about unrecognized fields.","desktop-application":"# Desktop Application\n\n# LibreFang Desktop Application\n\nA native desktop and mobile wrapper built on **Tauri 2.0** that hosts the LibreFang Agent OS. The application can either boot an embedded kernel + API server locally (desktop only) or operate as a thin client connecting to a remote LibreFang daemon. It provides system tray integration, native OS notifications, global keyboard shortcuts, auto-start on login, auto-updates, and a built-in connection screen for switching between modes.\n\n## Architecture\n\n```mermaid\ngraph TD\n    subgraph Desktop\n        CLI[CLI args / env / saved pref] --> RUN[run]\n        RUN -->|ConnectionScreen| CS[Connection Screen HTML]\n        RUN -->|Local| SRV[start_server]\n        RUN -->|Remote| WV[WebView → daemon URL]\n        SRV --> K[LibreFangKernel]\n        SRV --> AX[axum API server]\n        K --> EV[Event Bus]\n        EV --> FWD[forward_kernel_events]\n        FWD --> NOTIF[OS Notifications]\n    end\n    subgraph Mobile\n        MOB[mobile_main] --> RUN\n        RUN -->|Remote| MWV[WebView → bundled/remote]\n        RUN -->|ConnectionScreen| CS\n    end\n    WV --> UI[WebUI Dashboard]\n    CS -->|IPC| CONNECT[connect_remote / start_local]\n    CONNECT --> WV2[WebView navigate]\n```\n\n## Startup Flow\n\nEntry points:\n\n- **Desktop**: `run(server_url, force_local)` — called from `main.rs` with parsed CLI arguments.\n- **Mobile**: `mobile_main()` — zero-argument wrapper required by `tauri::mobile_entry_point`, delegates to `run(None, false)`.\n\nThe startup mode is resolved in priority order:\n\n1. **CLI `--server-url`** → `StartupMode::Remote(url)` — skip the connection screen, connect directly.\n2. **CLI `--local`** → `StartupMode::Local` — desktop only; boot the embedded server immediately.\n3. **Environment variable `LIBREFANG_SERVER_URL`** → `StartupMode::Remote(url)`.\n4. **Saved preference** in `~/.librefang/desktop.toml` → restores the user's last choice (remote URL or local mode).\n5. **Fallback** → `StartupMode::ConnectionScreen` — loads the built-in HTML connection screen.\n\nBefore opening a window, `run()` calls `validate_server_url()` on any resolved remote URL. Invalid URLs cause an immediate exit with a diagnostic message.\n\n## Managed State\n\nTauri managed state is registered once during setup with interior-mutable `RwLock` wrappers. IPC commands and tray handlers update state by writing through the locks — `manage()` is never called twice.\n\n| State Type | Inner Type | Purpose |\n|---|---|---|\n| `PortState` | `RwLock<Option<u16>>` | Port the embedded server listens on. `None` in remote mode or before local boot. |\n| `KernelState` | `RwLock<Option<KernelInner>>` | Kernel instance + `Instant` boot time. `None` in remote mode. |\n| `ServerUrlState` | `RwLock<String>` | URL the WebView points at (local `127.0.0.1` or remote). |\n| `RemoteMode` | `RwLock<bool>` | `true` when connected to a remote server. |\n| `ServerHandleHolder` | `Mutex<Option<ServerHandle>>` | Handle to the running server. Desktop only — filled by `start_local` or direct boot. |\n\n`KernelInner` holds an `Arc<LibreFangKernel>` and the `Instant` the kernel started, used for uptime reporting.\n\n## Connection Modes\n\n### Local Mode (Desktop Only)\n\n`start_local` (IPC command) or direct boot calls `server::start_server()`, which:\n\n1. Boots `LibreFangKernel` synchronously on the calling thread.\n2. Binds `TcpListener` to `127.0.0.1:0` to acquire a random free port.\n3. Spawns a named thread (`librefang-server`) with its own multi-threaded tokio runtime.\n4. Inside that runtime: starts background agents, spawns the approval expiry sweep task, then runs `axum::serve` with graceful shutdown via a `watch` channel.\n\nThe resulting `ServerHandle` is stored in `ServerHandleHolder`. Dropping or calling `shutdown()` on it sends the shutdown signal and joins the server thread.\n\n### Remote Mode\n\n`connect_remote` (IPC command) or direct boot with a URL:\n\n1. Validates the URL via `validate_server_url`.\n2. Sends a `GET /api/health` request with a 10-second timeout to verify the server is reachable.\n3. Optionally persists the preference to `~/.librefang/desktop.toml`.\n4. Updates all managed state: sets `RemoteMode` to `true`, clears `PortState` and `KernelState` to `None`, writes the URL to `ServerUrlState`.\n5. Navigates the WebView to the resolved target (see below).\n\n### Navigation Target\n\nOn mobile release builds (`cfg(all(mobile, not(debug_assertions)))`), the dashboard is bundled into the app and loaded via `tauri://localhost/index.html#api=<encoded daemon URL>`. The dashboard's `bundleMode` then proxies API and WebSocket requests to the daemon.\n\nOn all other builds (desktop, mobile debug), the WebView navigates directly to the daemon URL.\n\n## URL Validation\n\n`validate_server_url` enforces a security policy to prevent MITM attacks via IPC injection (issue #3673):\n\n- **HTTPS** — always allowed.\n- **HTTP + loopback** — allowed (`localhost`, `127.x.x.x`, `[::1]`).\n- **HTTP + non-loopback** — rejected with a message directing the user to HTTPS.\n- **Userinfo in authority** — rejected. Patterns like `http://[::1]@evil.com/` would pass the loopback check but cause wry/reqwest to connect to the attacker host.\n- **No scheme, unknown schemes, empty host** — rejected.\n\nTests cover case-insensitive schemes, IPv6 literals, malformed URLs, and userinfo bypass attempts.\n\n## Event Forwarding and Notifications\n\n`forward_kernel_events` subscribes to the kernel event bus and forwards critical events as native OS notifications:\n\n| Event | Notification Title |\n|---|---|\n| `LifecycleEvent::Crashed { agent_id, error }` | \"Agent Crashed\" |\n| `SystemEvent::KernelStopping` | \"Kernel Stopping\" |\n| `SystemEvent::QuotaEnforced { agent_id, spent, limit }` | \"Quota Enforced\" |\n\nThe listener uses `recv_event_skipping_lag` from the kernel event bus, so consumer-side lag drops are counted in the bus's `dropped_count()` and surface as `error!` logs rather than silent warnings.\n\nThis task is spawned in two places:\n- `run()` setup for direct local-boot mode.\n- `start_local` IPC command for connection-screen-initiated local boot.\n\n## IPC Commands (`commands.rs`)\n\nAll commands are `#[tauri::command]` functions invoked from the WebView frontend. Desktop-only commands are gated with `cfg(not(mobile))`; mobile-only commands with `cfg(mobile)`.\n\n### Kernel Status\n\n| Command | Returns | Notes |\n|---|---|---|\n| `get_port` | `u16` | Port the embedded server is listening on. |\n| `get_status` | `serde_json::Value` | JSON with `status`, `port`, `agents`, `uptime_secs`. |\n| `get_agent_count` | `usize` | Number of registered agents. |\n\n### Agent and Skill Import\n\n| Command | Description |\n|---|---|\n| `import_agent_toml` | Opens a native file picker (`.toml` filter), parses the file as `AgentManifest`, copies it to `~/.librefang/workspaces/agents/{name}/agent.toml`, then spawns the agent on the kernel. |\n| `import_skill_file` | Opens a native file picker (`.md`, `.toml`, `.py`, `.js`, `.wasm`), copies to `~/.librefang/skills/`, then calls `kernel.reload_skills()`. |\n\n### Desktop-Only Commands\n\n| Command | Description |\n|---|---|\n| `get_autostart` / `set_autostart` | Query or toggle auto-start on login via `tauri-plugin-autostart`. |\n| `check_for_updates` | On-demand update check, returns `UpdateInfo`. |\n| `install_update` | Downloads and installs the latest update, then restarts. |\n\n### Mobile-Only Commands\n\n| Command | Description |\n|---|---|\n| `store_credentials` | Stores `{\"base_url\": ..., \"api_key\": ...}` in the OS keyring via the `keyring` crate. |\n| `get_credentials` | Retrieves stored credentials. Returns `null` if none exist. |\n| `clear_credentials` | Removes stored credentials. |\n\n### Utility Commands\n\n| Command | Description |\n|---|---|\n| `open_config_dir` | Opens `~/.librefang/` in the OS file manager. |\n| `open_logs_dir` | Opens `~/.librefang/logs/` in the OS file manager. |\n| `uninstall_app` | Platform-specific uninstall (see below). |\n\n### Uninstall Behavior\n\n`uninstall_app` runs platform-native uninstall logic:\n\n- **Windows**: Queries the NSIS registry key for `UninstallString`, spawns it, exits.\n- **macOS**: Walks up from the executable to find the enclosing `.app` bundle, moves it to Trash via `osascript` + Finder, exits.\n- **Linux/AppImage**: Deletes the AppImage binary (or `$APPIMAGE` env var). For system packages, returns a hint string with the appropriate `apt`/`dnf`/`pacman` command.\n- **Mobile**: Returns an error directing the user to the platform app store.\n\n## Connection Screen (`connection.rs`)\n\n`connection_html()` returns a self-contained HTML/CSS/JS page served via the custom `lfconnect://` URI scheme (not `about:blank` — WebKitGTK 2.50 no-ops on `document.write` from `about:blank`, issue #3052).\n\nThe page provides:\n\n- **Server URL input** with \"Test Connection\" and \"Connect\" buttons.\n- **\"Start Local Server\" button** — removed on mobile via literal sentinel replacement at compile time, with `debug_assert` guards to catch HTML reformats that break the sentinels.\n- **\"Remember this choice\" checkbox** — persists to `~/.librefang/desktop.toml`.\n- **\"Uninstall LibreFang\" button** — triggers the platform uninstaller.\n\nJavaScript in the page polls for `window.__TAURI__` availability (up to 8 seconds) before invoking IPC, avoiding TDZ errors on `about:blank` pages where Tauri's IPC is injected asynchronously by WebView2.\n\n### Preference Persistence\n\n`ConnectionPreference` is serialized as TOML:\n\n```toml\n[connection]\nmode = \"remote\"\nserver_url = \"http://192.168.1.100:4545\"\n```\n\nOr for local mode:\n\n```toml\n[connection]\nmode = \"local\"\n```\n\n## Embedded Server (`server.rs`)\n\nDesktop-only. `start_server()` returns a `ServerHandle` with:\n\n- `port` — the allocated port.\n- `kernel` — `Arc<LibreFangKernel>`.\n- `shutdown_tx` — `watch::Sender<bool>` for graceful shutdown.\n- `server_thread` — join handle for the background thread.\n\nThe `Drop` implementation sends the shutdown signal non-blocking. An `AtomicBool` guard prevents double-shutdown (explicit `shutdown()` call + `Drop` during cleanup).\n\nThe embedded server syncs dashboard assets via `librefang_api::webchat::sync_dashboard` in a background task after binding.\n\n## System Tray (`tray.rs`)\n\nDesktop-only, additionally gated on Linux behind the `linux-tray` Cargo feature due to GTK3 unmaintained-crate advisories (RUSTSEC-2024-0411 through 0429, issue #3667).\n\nMenu items:\n\n| Item | Behavior |\n|---|---|\n| Show Window | Shows, unminimizes, and focuses the main window. |\n| Open in Browser | Opens `ServerUrlState` URL in the default browser. |\n| Change Server... | Shuts down local server (if running), clears kernel state, navigates back to connection screen via `document.write`. |\n| Status / Agents | Display-only items showing uptime, agent count, and remote/local status. |\n| Launch at Login | Toggle via `tauri-plugin-autostart`. |\n| Check for Updates... | Triggers update check + silent install if available. |\n| Open Config Directory | Opens `~/.librefang/` in the file manager. |\n| Quit LibreFang | Calls `app.exit(0)`. |\n\nLeft-click on the tray icon shows/focuses the window.\n\n## Global Shortcuts (`shortcuts.rs`)\n\nDesktop-only. Three system-wide hotkeys registered via `tauri-plugin-global-shortcut`:\n\n| Shortcut | Action |\n|---|---|\n| `Ctrl+Shift+O` | Show/focus the window. |\n| `Ctrl+Shift+N` | Show/focus + emit `\"navigate\"` event with `\"agents\"` payload. |\n| `Ctrl+Shift+C` | Show/focus + emit `\"navigate\"` event with `\"chat\"` payload. |\n\nThe frontend listens for the `\"navigate\"` event to route accordingly. Registration failure is non-fatal — the app logs a warning and continues.\n\n## Auto-Updater (`updater.rs`)\n\nDesktop-only. On startup, `spawn_startup_check` waits 10 seconds, then probes the update manifest endpoint with a HEAD request. If the manifest is unreachable (e.g., no `latest.json` in the GitHub release), it skips silently to avoid log noise.\n\nWhen an update is found:\n1. A notification is shown (\"Installing v{version}...\").\n2. After a 3-second delay for the notification to be visible, `download_and_install_update` runs.\n3. On success, `app_handle.restart()` is called — the function never returns.\n\nManual update checks from the tray or IPC follow the same path through `check_for_update` → `do_check` → `UpdateInfo`.\n\n## Platform Differences Summary\n\n| Feature | Desktop | Mobile |\n|---|---|---|\n| Embedded server | ✅ | ❌ (thin client only) |\n| System tray | ✅ (Linux needs `linux-tray` feature) | ❌ |\n| Global shortcuts | ✅ | ❌ |\n| Auto-start on login | ✅ | ❌ |\n| Auto-updates | ✅ | ❌ (stores handle it) |\n| Credential storage | — | OS keyring via `keyring` crate |\n| Window management | Built in `setup()` | Declared in `tauri.{ios,android}.conf.json` |\n| Close behavior | Hides to tray | Standard close |\n| Single instance | ✅ via `tauri-plugin-single-instance` | ❌ |\n\n## External Dependencies\n\nThe desktop app depends on these at the crate level:\n\n- **`librefang-kernel`** — kernel boot, agent management, event bus, skill reload.\n- **`librefang-api`** — `build_router` for the embedded axum server, `sync_dashboard` for WebUI assets.\n- **`librefang-types`** — `AgentManifest`, event types (`EventPayload`, `LifecycleEvent`, `SystemEvent`).\n- **`librefang-extensions`** — `dotenv::load_dotenv` for `~/.librefang/.env` loading.\n- **`tauri-plugin-*`** — dialog, notification, autostart, updater, global-shortcut, shell, single-instance.\n- **`keyring`** — OS keyring access (mobile only).\n- **`open`** — open paths/URLs in default OS applications.","docker-sandbox":"# Docker Sandbox\n\n# Docker Sandbox Module\n\nOS-level isolation layer that executes agent code inside Docker containers with strict security boundaries — capability dropping, network isolation, read-only filesystems, and resource limits.\n\n## Architecture\n\n```mermaid\nflowchart TD\n    A[create_sandbox] --> B[validate_image_name]\n    A --> C[validate_sandbox_config]\n    C --> D[validate_network]\n    C --> E[validate_capability]\n    A --> F[sanitize_container_name]\n    A --> G[agent_id_container_suffix]\n    A --> H[\"docker run -d ...\"]\n    I[exec_in_sandbox] --> J[validate_command]\n    J --> K[contains_shell_metacharacters]\n    I --> L[\"docker exec ...\"]\n    M[ContainerPool] --> A\n    M --> N[destroy_sandbox]\n```\n\n## Data Structures\n\n### `SandboxContainer`\n\nTracks a running sandbox container. Returned by `create_sandbox`, consumed by `exec_in_sandbox` and `destroy_sandbox`.\n\n| Field | Type | Description |\n|---|---|---|\n| `container_id` | `String` | Docker container ID (stdout of `docker run`) |\n| `agent_id` | `String` | Agent this container belongs to |\n| `created_at` | `DateTime<Utc>` | Creation timestamp |\n\n### `ExecResult`\n\nOutcome of a command executed inside a container via `exec_in_sandbox`. stdout and stderr are truncated at 50,000 characters (UTF-8 boundary–safe) if they exceed that limit.\n\n| Field | Type | Description |\n|---|---|---|\n| `stdout` | `String` | Captured standard output |\n| `stderr` | `String` | Captured standard error |\n| `exit_code` | `i32` | Process exit code (`-1` if unavailable) |\n\n### `ContainerPool`\n\nConcurrent-safe container reuse pool backed by `DashMap`. Containers are keyed by their Docker ID and matched by a config hash. See [Container Pooling](#container-pooling) for usage details.\n\n## Public API\n\n### Lifecycle Functions\n\n#### `is_docker_available() -> bool`\n\nChecks whether Docker is reachable by running `docker version --format {{.Server.Version}}`. Returns `true` if the command succeeds. Use this at startup to gate sandbox features.\n\n#### `create_sandbox(config, agent_id, workspace) -> Result<SandboxContainer, String>`\n\nCreates and starts a new Docker container configured per the provided `DockerSandboxConfig`. The workspace directory is mounted read-only at the container's working directory.\n\n**Security operations performed in order:**\n\n1. `validate_image_name` — rejects empty names and shell metacharacters in the image string.\n2. `validate_sandbox_config` — rejects `host`/`container:*` network modes and capabilities outside the `SAFE_CAPS` allowlist.\n3. `sanitize_container_name` — validates the derived container name is `[a-zA-Z0-9-]{1,63}`.\n4. Constructs and runs `docker run -d` with:\n   - `--cap-drop ALL` + `--security-opt no-new-privileges`\n   - Selective `--cap-add` for each entry in `config.cap_add` (already validated against allowlist)\n   - `--network` set to `config.network` (already validated)\n   - Resource limits: `--memory`, `--cpus`, `--pids-limit`\n   - `--read-only` if `config.read_only_root` is true\n   - `--tmpfs` entries from `config.tmpfs`\n   - Workspace bind-mounted read-only at `config.workdir`\n   - Entrypoint: `sleep infinity` (container stays alive for `exec` calls)\n\n#### `exec_in_sandbox(container, command, timeout) -> Result<ExecResult, String>`\n\nExecutes `sh -c <command>` inside a running container. The command is first validated by `validate_command`, which rejects shell metacharacters (pipes, semicolons, backticks, `$()`, `${}`, redirections, etc.). A `tokio::time::timeout` wraps the operation; on expiry, returns an error indicating the timeout in seconds.\n\nOutput is truncated at 50,000 bytes using `helpers::safe_truncate_str` to avoid UTF-8 boundary panics.\n\n#### `destroy_sandbox(container) -> Result<(), String>`\n\nForce-stops and removes the container via `docker rm -f`. Failures are logged at `warn!` level but do not propagate as errors (the container may already be gone).\n\n### Validation Functions\n\n#### `validate_sandbox_config(config) -> Result<(), String>`\n\nEntrypoint for full config validation. Checks network mode and each capability in `cap_add`. Emits `error!`-level logs for every rejection so failures appear in daemon startup logs even if the caller discards the `Result`.\n\n#### `validate_bind_mount(path, blocked) -> Result<(), String>`\n\nValidates that a proposed bind mount path does not expose sensitive host resources:\n\n- Requires absolute paths\n- Rejects `..` path traversal components\n- Blocks a hardcoded list: `/etc`, `/proc`, `/sys`, `/dev`, `/var/run/docker.sock`, `/root`, `/boot`\n- Blocks user-configured paths from the `blocked` parameter\n- **Symlink escape detection**: canonicalizes the path (or its nearest existing ancestor for non-existent paths) and re-checks the resolved path against all blocklists. This prevents creating a symlink at a non-existent path that later resolves into a blocked directory.\n\n#### `config_hash(config) -> u64`\n\nDeterministic hash of selected config fields (`image`, `network`, `memory_limit`, `workdir`) using `DefaultHasher`. Used by `ContainerPool` to match containers to configs.\n\n### Helper Module (`helpers`)\n\nPublished as `pub mod helpers` to enable parity testing against the canonical implementations in `librefang-runtime`. These are deliberate duplicates to avoid cyclic dependencies.\n\n#### `safe_truncate_str(s, max_bytes) -> &str`\n\nUTF-8-safe string truncation. If the string exceeds `max_bytes`, it backs up to the nearest character boundary.\n\n#### `contains_shell_metacharacters(command) -> Option<String>`\n\nScans for dangerous shell constructs. Returns `Some(reason)` if any are found, `None` if the command appears safe.\n\n**Always scanned on the raw string** (effective inside double quotes too):\n- Backticks (`` ` ``) — command substitution\n- `$(` — command substitution\n- `${` — variable expansion\n- Newlines (`\\n`, `\\r`)\n- Null bytes (`\\0`)\n\n**Scanned after stripping quoted regions** (only dangerous outside quotes):\n- `;` — command chaining\n- `|` — pipes\n- `<>` — I/O redirection\n- `{}` — brace expansion\n- `&` — background/compound operators\n\n## Security Model\n\n### Capability Allowlist (`SAFE_CAPS`)\n\nThe module drops all Linux capabilities (`--cap-drop ALL`) then adds back only the 14 capabilities in the `SAFE_CAPS` constant:\n\n```\nCHOWN, DAC_OVERRIDE, FOWNER, FSETID, KILL, SETGID, SETUID,\nSETPCAP, NET_BIND_SERVICE, NET_RAW, SYS_CHROOT, MKNOD,\nAUDIT_WRITE, SETFCAP\n```\n\n**Explicitly excluded** (sandbox-collapse vectors):\n\n| Capability | Risk |\n|---|---|\n| `SYS_ADMIN` | Mount, kexec, BPF, namespace manipulation — near-root |\n| `NET_ADMIN` | Interface reconfiguration, firewall rules, raw sockets |\n| `SYS_PTRACE` | Process attachment; defeats `no-new-privileges` |\n| `BPF` | eBPF loading for kernel-level interference |\n| `SYS_MODULE` | Kernel module insertion |\n| `SYS_BOOT`, `SYS_RAWIO`, `SYS_TIME` | Hardware-level manipulation |\n\n`NET_RAW` is retained because `ping`/`traceroute` require it, but it's documented as a minor SSRF amplifier. The network namespace boundary is the primary protection.\n\n### Network Isolation\n\n`validate_network` rejects three categories:\n\n1. **`host`** — shares the host network namespace, exposing loopback, cloud metadata at `169.254.169.254`, and the daemon's listener on port 4545.\n2. **`container:<name>`** — joins another container's namespace, transitively inheriting its access.\n3. **Invalid characters** — anything outside `[A-Za-z0-9_-]+` fails fast rather than deferring to a `docker run` error.\n\nAccepted values: `bridge`, `none`, or any user-defined Docker network name matching the character class. Default in `DockerSandboxConfig` is `none`.\n\n### Container Naming\n\nContainer names are derived via `agent_id_container_suffix`, which computes `SHA-256(agent_id)[..8 hex chars]` and prepends the configured `container_prefix`. This replaced a previous lossy character-replacement scheme where agent IDs like `\"foo/bar\"` and `\"foo-bar\"` both collapsed to `\"foo-bar\"`, causing distinct agents to share a container.\n\nThe suffix is bijective with cryptographic confidence — the 8-character hex prefix provides a 2³² space, making collisions negligible for realistic agent counts on a single host.\n\n## Container Pooling\n\n`ContainerPool` enables container reuse across agent sessions to avoid the startup cost of repeated `docker run` calls.\n\n```rust\nlet pool = ContainerPool::new();\n\n// Release a container back to the pool\npool.release(container, config_hash(&config));\n\n// Acquire a matching container (same config hash, cooled for at least N seconds)\nif let Some(container) = pool.acquire(config_hash(&config), 30) {\n    // reuse\n}\n\n// Periodic cleanup of stale entries\npool.cleanup(idle_timeout_secs: 300, max_age_secs: 3600).await;\n```\n\n### Pool Entry Matching\n\nAn `acquire` call matches on:\n- **`config_hash`** — must be identical (same image, network, memory limit, workdir)\n- **`cool_secs`** — the container must have been idle for at least this many seconds (prevents immediate reuse of a potentially contaminated container)\n\n### Cleanup\n\n`cleanup(idle_timeout_secs, max_age_secs)` removes containers that exceed either the idle timeout or the maximum age, destroying them via `destroy_sandbox`. Call this on a periodic timer.\n\n## Integration Points\n\n- **Config type**: `librefang_types::config::DockerSandboxConfig` — provides all tunables (image, network, resource limits, capabilities, tmpfs mounts).\n- **Helper parity**: The `helpers` module is intentionally duplicated from `librefang-runtime` to avoid cyclic dependencies. A parity test at `crates/librefang-runtime/tests/docker_sandbox_helpers_parity.rs` asserts byte-for-byte equivalence with the canonical implementations.\n- **Logging**: Uses `tracing` throughout — `debug!` for lifecycle events, `warn!` for non-fatal failures, `error!` for config validation rejections that should appear in startup logs.","extensions-vault":"# Extensions & Vault\n\n# Extensions & Vault (`librefang-extensions`)\n\n## Purpose\n\n`librefang-extensions` manages the full lifecycle of MCP (Model Context Protocol) server integrations: discovering server templates, storing and resolving credentials, installing servers into the user's config, monitoring health, and handling OAuth authentication flows. It is consumed by the CLI, TUI, desktop app, API server, and kernel.\n\n## Architecture Overview\n\n```mermaid\ngraph TD\n    subgraph Startup [\"Process Startup (sync main)\"]\n        A[\"load_dotenv()\"] --> B[\"preseed_vault_key_from()\"]\n        A --> C[\"load_vault()\"]\n        A --> D[\"load_env_file() (.env + secrets.env)\"]\n    end\n\n    subgraph Runtime [\"Runtime Operations\"]\n        E[\"McpCatalog\"] --> F[\"install_integration()\"]\n        G[\"CredentialResolver\"] --> F\n        H[\"CredentialVault\"] --> G\n        F --> I[\"McpServerConfigEntry\"]\n        J[\"HealthMonitor\"] --> K[\"DashMap&lt;McpHealth&gt;\"]\n        L[\"run_pkce_flow()\"] --> H\n    end\n\n    B -.->|\"LIBREFANG_VAULT_KEY\"| C\n    C -->|\"inject secrets into std::env\"| D\n    I -->|\"persist to config.toml\"| M[\"Kernel reload\"]\n```\n\n## Modules\n\n### Vault (`vault.rs`)\n\nAES-256-GCM encrypted secret storage at `~/.librefang/vault.enc`.\n\n**Key derivation.** The master key is resolved from (in priority order):\n\n1. `LIBREFANG_VAULT_KEY` environment variable (base64-encoded 32 bytes)\n2. OS keyring (Windows Credential Manager, macOS Keychain, Linux Secret Service)\n3. File fallback at `<data_local_dir>/librefang/.keyring` — an AES-256-GCM-wrapped key derived from a per-machine fingerprint via Argon2id\n\nThe raw master key feeds into `derive_key()`, which runs Argon2id to produce the actual AES-256-GCM encryption key. This means the on-disk file is doubly protected: you need the master key *and* the Argon2 salt to decrypt.\n\n**On-disk format.** A `VaultFile` (TOML-serializable) containing:\n- `version` — file format version (currently 1)\n- `salt` — Argon2 salt (base64)\n- `nonce` — AES-256-GCM nonce (base64)\n- `ciphertext` — encrypted `VaultEntries` JSON (base64)\n- `schema_version` — AAD schema version (0 = legacy path-only, 1 = schema version + path bytes)\n\n**Sentinel validation (#3651).** Every vault contains a reserved key `__sentinel__` with known plaintext `\"librefang-vault-sentinel-v1\"`. On boot, `verify_or_install_sentinel()` confirms the sentinel decrypts correctly — a mismatch means the master key is wrong, and the daemon refuses to start. This prevents silent data loss from a misconfigured `LIBREFANG_VAULT_KEY`. The sentinel is backfilled on legacy vaults that predate this feature.\n\n**Lazy initialization.** `set()` on a handle with no existing vault file automatically runs `init()`, so the first credential write materializes the vault. The reserved sentinel key is rejected before any disk side effects.\n\n**Key rotation.** `rewrap_with_new_key()` re-encrypts the entire vault under a new master key using the same atomic write path as normal saves.\n\n**macOS keyring behavior.** The OS keyring is disabled by default on macOS because the Keychain ACL is per-binary-code-signature — every `cargo build` invalidates it and triggers a prompt. Set `LIBREFANG_VAULT_NO_KEYRING=1` on other platforms to force the file fallback.\n\n**Platform gating.** The `os_keyring` module is conditionally compiled: real `keyring` crate calls on glibc Linux, macOS, and Windows; a stub returning \"unavailable\" everywhere else (musl, Android).\n\n### Dotenv (`dotenv.rs`)\n\nLoads secrets into the process environment from multiple sources. Called **once** from synchronous `main()` before the tokio runtime starts — `std::env::set_var` is UB once other threads exist (Rust 1.80+).\n\n**Priority order** (highest first, existing env vars are never overridden):\n\n| Priority | Source | Notes |\n|----------|--------|-------|\n| 1 | System environment variables | Already in `std::env` |\n| 2 | Credential vault (`vault.enc`) | Injected by `load_vault()` |\n| 3 | `~/.librefang/.env` | Standard dotenv format |\n| 4 | `~/.librefang/secrets.env` | Secondary file |\n\n**Vault key bootstrap (#5139).** A chicken-and-egg problem: the vault master key (`LIBREFANG_VAULT_KEY`) may itself live in `.env`, but `load_vault()` needs it in the process environment. `preseed_vault_key_from()` scans `.env` and `secrets.env` for *only* this one key and sets it before `load_vault()` runs. All other keys respect the normal priority order.\n\n**File writing.** `save_env_key()` and `remove_env_key()` manage `~/.librefang/.env` with:\n- Atomic writes via `.env.tmp.<pid>` staging file\n- Mode 0600 at creation time (no TOCTOU window)\n- `fsync` + `sync_all` + `rename` for crash safety\n- Proper escape handling for embedded newlines, backslashes, and quotes (`escape_env_value` / `unescape_env_value`)\n\n**Idempotency.** `load_dotenv()` is gated by `Once` — repeated calls are no-ops.\n\n### Credentials (`credentials.rs`)\n\nMulti-source credential resolution for MCP integrations. Tries each source in order:\n\n1. **Encrypted vault** (`~/.librefang/vault.enc`) — only if unlocked\n2. **Dotenv file** (loaded at construction, snapshot from boot time)\n3. **Process environment variable**\n4. **Interactive prompt** (CLI only, when `interactive` is `true`)\n\n**Vault source abstraction.** `VaultSource` enum provides two modes:\n\n- `Owned(CredentialVault)` — for short-lived callers (CLI subcommands, tests) that manage their own vault\n- `Shared(Arc<RwLock<CredentialVault>>)` — for long-lived callers (API request handlers) that share the kernel's cached vault handle, avoiding re-running Argon2id KDF on every request\n\nConstruct with `CredentialResolver::new()` for owned mode or `CredentialResolver::with_vault_handle()` for shared mode.\n\n**Key methods:**\n- `resolve(key)` → `Option<Zeroizing<String>>` — tries all sources in order\n- `resolve_all(&[keys])` → `HashMap<String, Zeroizing<String>>` — batch resolution\n- `missing_credentials(&[keys])` → `Vec<String>` — check which keys are unavailable (no prompting)\n- `store_in_vault(key, value)` — write a credential to the backing vault\n- `clear_dotenv_cache(key)` — invalidate a boot-time dotenv snapshot after a dashboard deletion\n\n### Catalog (`catalog.rs`)\n\nRead-only in-memory index of MCP server templates loaded from `~/.librefang/mcp/catalog/`. Templates are refreshed from the upstream `librefang-registry` by `librefang_runtime::registry_sync`.\n\n**Two on-disk layouts:**\n\n| Layout | Pattern | ID source |\n|--------|---------|-----------|\n| Flat file | `<id>.toml` | Filename minus `.toml` |\n| Directory | `<id>/MCP.toml` | Directory name |\n\n**Full-reload semantics.** `load()` clears all entries before scanning, so deleted/renamed files don't linger.\n\n**Query methods:**\n- `get(id)` → single entry lookup\n- `list()` → all entries sorted by ID\n- `list_by_category(category)` → filtered by `McpCategory`\n- `search(query)` → case-insensitive match against ID, name, description, and tags\n\nInstalled servers reference catalog entries via `template_id` in their `[[mcp_servers]]` config, but the catalog itself is never modified by user actions.\n\n### Installer (`installer.rs`)\n\nPure transforms — no side effects. Converts a catalog entry + provided credentials into an `McpServerConfigEntry` that the caller persists to `config.toml`.\n\n**`install_integration()` flow:**\n1. Look up the catalog template by ID\n2. Store any provided credentials in the vault (best-effort)\n3. Check which required env vars are still missing\n4. Map the template's transport + env requirements into a `McpServerConfigEntry`\n5. Return an `InstallResult` with status (`Ready` or `Setup`), missing credential names, and a user-facing message\n\n**`catalog_entry_to_mcp_server()`** maps `McpCatalogTransport` to `McpTransportEntry`, copies required env var names, and sets `template_id` so the kernel/dashboard can trace back to the catalog source.\n\n**Scaffolding.** `scaffold_integration()` and `scaffold_skill()` generate starter TOML files for custom MCP servers and skills respectively.\n\n### Health Monitor (`health.rs`)\n\nConcurrent health tracking for MCP servers using `DashMap` for lock-free access from background tasks.\n\n**`McpHealth`** tracks per-server state: status, tool count, last success/error timestamps, consecutive failure count, reconnect state, and connected-since time.\n\n**Auto-reconnect** with exponential backoff:\n- Base interval: 5s\n- Doubles each attempt: 5s → 10s → 20s → 40s → ...\n- Capped at 300s (5 minutes)\n- Max 10 attempts (configurable via `HealthMonitorConfig`)\n- Disabled entirely when `auto_reconnect: false`\n\n**Usage pattern:** The kernel registers servers via `register()`, background tasks call `report_ok()` / `report_error()`, and the API layer reads via `get_health()` / `all_health()`.\n\n### OAuth (`oauth.rs`)\n\nOAuth2 PKCE flows for provider authentication (Google, GitHub, Microsoft, Slack). Launches a temporary localhost HTTP server, opens the browser, receives the callback, and exchanges the authorization code for tokens.\n\n**State token security (#3791).** State tokens are HMAC-SHA256 signed and bind to:\n- `provider` (auth URL)\n- `client_id`\n- `redirect_uri` (loopback port)\n- `nonce` (16 random bytes)\n- `exp` (10-minute absolute expiry)\n\n`verify_signed_state()` rejects malformed tokens, bad HMAC, expired payloads, and any field mismatch. Only the first valid callback wins; subsequent attempts on the same listener are rejected. The HMAC signing key is process-scoped (`OnceLock` with a random 32-byte value), so a daemon restart invalidates any in-flight flows.\n\n**Client IDs.** Default placeholder IDs are provided for public PKCE flows (no client secret needed). Override via `OAuthConfig` fields (e.g., `google_client_id`).\n\n**Token storage.** Returned `OAuthTokens` are stored in the credential vault by the caller.\n\n### HTTP Client (`http_client.rs`)\n\nShared `reqwest::Client` builder with:\n- Native CA roots from the OS trust store, falling back to `webpki-roots` bundled certs\n- `rustls` with `aws_lc_rs` crypto provider (not OpenSSL)\n- 10s connect timeout, 30s read timeout\n- Max 5 redirects\n\n### Error Types (`lib.rs`)\n\n`ExtensionError` covers all failure modes:\n\n| Variant | Meaning |\n|---------|---------|\n| `NotFound(id)` | Catalog entry doesn't exist |\n| `AlreadyInstalled(id)` | Server already in config |\n| `NotInstalled(id)` | Server not in config |\n| `CredentialNotFound(key)` | Required credential missing |\n| `Vault(msg)` | Vault I/O or format error |\n| `VaultLocked` | Vault not unlocked |\n| `VaultKeyMismatch { hint }` | Wrong master key detected via sentinel |\n| `OAuth(msg)` | OAuth flow failure |\n| `TomlParse(msg)` | Invalid TOML |\n| `Io(err)` | Filesystem error |\n| `Http(msg)` | Network error |\n| `HealthCheck(msg)` | MCP ping failure |\n\n`From<ExtensionError>` for `librefang_types::integration::IntegrationError` bridges this crate's error space to the dependency-free type used at the kernel API boundary, preserving discriminants for HTTP status code mapping (`NotFound` → 404, everything else → 500).\n\n## Integration Points\n\n**Entry points that call into this crate:**\n\n- **CLI (`librefang-cli`):** `main()` calls `load_dotenv()`; subcommands call `McpCatalog::load()`, `install_integration()`, `CredentialVault::init()/unlock()`, `HealthMonitor::register()/report_ok()`, `save_env_key()`, `remove_env_key()`\n- **Desktop (`librefang-desktop`):** `main()` and `run()` both call `load_dotenv()`\n- **API server (`librefang-api`):** `resolve_dashboard_credential()` calls `vault.unlock()` and `vault.get()` to read the dashboard session token on every authenticated request\n- **TUI:** `init_wizard::run()` and `free_provider_guide::submit_key()` call `save_env_key()`\n- **Dashboard routes:** `get_extension()` and `list_extensions()` call `health.get_health()` to surface server status\n\n**Startup sequence (all entry points):**\n\n```\nmain()\n ├─ load_dotenv()           # sync, before tokio\n │   ├─ preseed_vault_key_from(.env)\n │   ├─ preseed_vault_key_from(secrets.env)\n │   ├─ load_vault()        # unlock + inject into std::env\n │   ├─ load_env_file(.env)\n │   └─ load_env_file(secrets.env)\n ├─ tokio::runtime::Builder::new_current_thread()  (or similar)\n └─ async { ... }\n```\n\n## Contributing Guidelines\n\n- **No `std::env::set_var` after tokio starts.** All env mutation happens in `load_dotenv()` during synchronous `main()`. Runtime code must use `CredentialResolver` or vault APIs instead.\n- **Reserved keys.** `__sentinel__` is owned by the vault internals. Never read or write it directly. Use `list_keys()` (which filters it) for user-facing operations, `list_keys_including_internal()` only for migration/rotation code.\n- **Zeroizing.** All credential values flow through `Zeroizing<String>` or `Zeroizing<[u8; 32]>` to ensure memory is cleared on drop. Never convert to bare `String` for longer than needed.\n- **Serial test annotation.** Tests that mutate process-wide env vars must use `#[serial_test::serial]` to prevent data races under `cargo test`'s parallel runner.\n- **Pure transforms in installer.** `install_integration()` does not write to config.toml or start servers. The caller (CLI/API) decides when and how to persist and activate the result.","hands-orchestration":"# Hands Orchestration\n\n# Hands Orchestration\n\nA Hand is a pre-built, domain-complete autonomous agent package that users activate from a marketplace. Unlike regular agents (which users chat with interactively), Hands run autonomously in the background — the user checks in on them rather than driving them turn-by-turn.\n\nThe module is split into two files:\n\n- **`lib.rs`** — Core types (`HandDefinition`, `HandInstance`, `HandAgentManifest`, etc.), TOML parsing with legacy-format fallback, base template resolution, and settings resolution logic.\n- **`registry.rs`** — `HandRegistry`, a concurrent-safe store for definitions and live instances, with disk persistence, requirement checking, and lifecycle management.\n\n## Architecture\n\n```mermaid\ngraph TD\n    subgraph \"Disk\"\n        HT[\"HAND.toml\"]\n        SK[\"SKILL.md / SKILL-{role}.md\"]\n        AT[\"agents/{template}/agent.toml\"]\n        PS[\"hand_state.json\"]\n    end\n\n    subgraph \"lib.rs — Types & Parsing\"\n        HD[\"HandDefinition\"]\n        HI[\"HandInstance\"]\n        HA[\"HandAgentManifest\"]\n        RS[\"resolve_settings()\"]\n        PHD[\"parse_hand_definition()\"]\n    end\n\n    subgraph \"registry.rs — HandRegistry\"\n        DEF[\"definitions<br/>(DashMap&lt;id, HandDefinition&gt;)\"]\n        INST[\"instances<br/>(DashMap&lt;Uuid, HandInstance&gt;)\"]\n        AIDX[\"agent_index<br/>(agent_id → instance_id)\"]\n        RIDX[\"active_index<br/>(hand_id → instance_id)\"]\n    end\n\n    HT --> PHD --> HD\n    AT --> PHD\n    SK --> HD\n    HD --> DEF\n    INST --> PS\n    PS -->|\"restart recovery\"| INST\n    HI --> INST\n    RS -->|\"prompt_block + env_vars\"| Kernel\n    DEF -->|\"activate()\"| HI\n    INST -->|\"find_by_agent()\"| Kernel\n```\n\n## Core Types\n\n### `HandDefinition`\n\nThe static blueprint for a Hand, parsed from `HAND.toml`. Key fields:\n\n| Field | Purpose |\n|---|---|\n| `id` | Unique identifier (e.g. `\"clip\"`) |\n| `version` | Semantic version, defaults to `\"0.0.0\"` |\n| `agents` | `BTreeMap<String, HandAgentManifest>` — agent manifests keyed by role name |\n| `requires` | Prerequisites (binaries, env vars, API keys) |\n| `settings` | Configurable options shown in the activation modal |\n| `tools` / `skills` / `mcp_servers` | Allowlists for spawned agents |\n| `dashboard` | Metrics schema for the dashboard view |\n| `routing` | Keywords for deterministic hand selection |\n| `i18n` | Localized strings keyed by language code |\n| `skill_content` | Bundled skill markdown (loaded at runtime, not in TOML) |\n| `agent_skill_content` | Per-role skill overrides from `SKILL-{role}.md` files |\n\nThe `coordinator()` method returns the agent marked as coordinator (or the first agent by role name as fallback). The `agent()` method is a backward-compatible accessor that returns the coordinator's `AgentManifest`.\n\n### `HandInstance`\n\nA runtime instance of a Hand — links a `HandDefinition` to its spawned agents.\n\n| Field | Purpose |\n|---|---|\n| `instance_id` | Unique UUID for this instance |\n| `hand_id` | Which definition this is an instance of |\n| `status` | `Active`, `Paused`, `Error(String)`, or `Inactive` |\n| `agent_ids` | `BTreeMap<String, AgentId>` — spawned agents keyed by role |\n| `coordinator_role` | Which role receives user messages |\n| `config` | User-provided setting overrides |\n| `agent_runtime_overrides` | Per-role model/provider overrides from the dashboard |\n\n### `HandAgentManifest`\n\nWraps an `AgentManifest` with hand-specific fields:\n\n- `coordinator: bool` — whether this agent receives user messages\n- `invoke_hint: Option<String>` — hint for other agents on when to invoke it\n- `base: Option<String>` — reference to an agent template from the `agents/` registry\n\n### `HandStatus`\n\n```rust\npub enum HandStatus {\n    Active,\n    Paused,\n    Error(String),\n    Inactive,\n}\n```\n\n### `HandAgentRuntimeOverride`\n\nCaptures dashboard-edited model, provider, max_tokens, temperature, and web_search_augmentation values on a per-role basis. These survive daemon restarts via the v5 persistence format.\n\n## HAND.toml Format\n\nHands support two agent configuration formats:\n\n### Single-Agent (`[agent]`)\n\n```toml\nid = \"clip\"\nname = \"Clip Maker\"\ndescription = \"Autonomous video clipping\"\ncategory = \"content\"\nicon = \"🎬\"\ntools = [\"shell_exec\"]\n\n[agent]\nname = \"clip-agent\"\ndescription = \"Creates video clips\"\nsystem_prompt = \"You create viral video clips.\"\n\n[agent.model]\nprovider = \"anthropic\"\nmodel = \"claude-sonnet-4-20250514\"\nmax_tokens = 4096\ntemperature = 0.7\n```\n\nSingle-agent hands are internally stored as `{\"main\": HandAgentManifest { coordinator: true, ... }}`.\n\n### Multi-Agent (`[agents.role]`)\n\n```toml\nid = \"research\"\nname = \"Research Hand\"\ndescription = \"Multi-agent research pipeline\"\ncategory = \"content\"\n\n[agents.planner]\ncoordinator = true\ninvoke_hint = \"Use planner for task decomposition\"\nname = \"planner-agent\"\ndescription = \"Plans research tasks\"\nsystem_prompt = \"You plan research.\"\n\n[agents.planner.model]\nprovider = \"anthropic\"\nmodel = \"some-anthropic-model\"\n\n[agents.analyst]\nname = \"analyst-agent\"\ndescription = \"Analyzes data\"\nsystem_prompt = \"You analyze data.\"\n\n[agents.analyst.model]\nprovider = \"
