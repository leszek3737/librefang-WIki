message`, `/message`, `/detail` pointers\n3. **Redact secrets** — strips `sk-*`, `key-*`, `Bearer *` patterns\n4. **Strip LLM wrapper** — removes `\"LLM driver error: API error (NNN): \"` prefix\n5. **Cap length** — truncates to 200 chars at UTF-8 character boundaries (safe for CJK/emoji)\n\n### Retry Delay Extraction\n\n`extract_retry_delay(message)` recognizes patterns like `\"retry after 30\"`, `\"retry-after: 5\"`, `\"try again in 10\"` (seconds) and `\"retry after 500ms\"` (milliseconds). Returns milliseconds.\n\n### Transient Detection\n\n`is_transient(message)` is a quick heuristic (no full classification) that returns `true` for timeout, overloaded, rate-limit, and SSL transient patterns (`bad record mac`, `ssl alert`, etc.). Excludes SSL handshake failures (those are configuration errors, not transient).\n\n## Configuration: `DriverConfig`\n\n### Security\n\n- `api_key` and `proxy_url` have `#[serde(skip_serializing)]` — any `serde_json::to_*` or `toml::to_*` of a `DriverConfig` (cache dump, diagnostic snapshot, `mcp_config.json`) never emits these in cleartext. `Deserialize` is unaffected so config files still populate them on load.\n- Custom `Debug` impl redacts both fields to `\"<redacted>\"`.\n- `mcp_bridge` is `#[serde(skip)]` (not serialized at all) — set only by the kernel at construction time.\n\n### Key Fields\n\n| Field | Default | Purpose |\n|---|---|---|\n| `provider` | `\"\"` | Provider identifier |\n| `api_key` | `None` | Provider API key |\n| `base_url` | `None` | Override API endpoint |\n| `skip_permissions` | `true` | `--dangerously-skip-permissions` for CLI drivers |\n| `message_timeout_secs` | `300` | Inactivity timeout for CLI-based providers |\n| `request_timeout_secs` | `None` | Per-provider HTTP read timeout |\n| `emit_caller_trace_headers` | `true` | Emit `x-librefang-{agent,session,step}-id` headers |\n| `vertex_ai` | default | Vertex AI project/region/credentials |\n| `azure_openai` | default | Azure endpoint/deployment/apiversion |\n\n## Integration Points\n\n### Fallback Chain (`librefang-llm-drivers`)\n\nThe `FallbackChain` driver wraps multiple providers and uses:\n- `ProviderExhaustionStore` to pre-skip exhausted slots before attempting\n- `LlmError::failover_reason()` to classify failures and decide whether to retry or advance\n- `ProviderExhaustionDetail` (sorted by `provider_id`) when constructing `AllProvidersExhausted`\n\n### Metering Layer (`librefang-kernel-metering`)\n\n- Calls `ProviderExhaustionStore::mark_exhausted` with `ExhaustionReason::BudgetExceeded` when an operator-set budget cap triggers pre-dispatch\n- Reads `ExhaustionReason::as_metric_label()` for metric tags in budget route handlers\n\n### Runtime (`librefang-runtime`)\n\n- Constructs `CompletionRequest` for routing, compaction, web augmentation, and agent loop turns\n- Reads `CompletionResponse::text()` for agent loop tool-call staging and max-tokens detection\n- Uses `classify_error` in the agent loop retry handler for building user-facing error messages\n\n### API Layer (`librefang-api`)\n\n- Calls `classify_error` for WebSocket streaming error classification\n- Emits stream events via the `Sender<StreamEvent>` channel\n\n### Testing (`librefang-testing`)\n\n- Provides mock `LlmDriver` implementations\n- Constructs `CompletionRequest` for test fixtures","llm-drivers-librefang-llm-drivers-src":"# LLM Drivers — librefang-llm-drivers-src\n\n# librefang-llm-drivers\n\nLLM provider drivers, retry infrastructure, and multi-credential failover for the LibreFang agent runtime.\n\n## Overview\n\nThis crate implements the transport layer between the LibreFang kernel and upstream LLM providers (Anthropic, OpenAI, Gemini, Bedrock, and CLI-based backends like Aider and Claude Code). It provides:\n\n- A uniform `LlmDriver` trait that the kernel calls regardless of provider\n- Jittered exponential backoff with server-supplied `Retry-After` support\n- Thread-safe credential pools with pluggable selection strategies\n- Per-provider request serialization, response parsing, and streaming (SSE)\n\n```mermaid\ngraph TD\n    K[Kernel / pooled_driver] -->|acquire + complete| CP[CredentialPool]\n    K -->|complete / stream| LD[LlmDriver trait]\n    LD --> AD[AnthropicDriver]\n    LD --> OD[OpenAI / ChatGPT]\n    LD --> GD[GeminiDriver]\n    LD --> BD[BedrockDriver]\n    LD --> AID[AiderDriver]\n    LD --> CD[ClaudeCodeDriver]\n    AD -->|429 / 529 retry| BO[backoff::jittered_backoff]\n    OD -->|429 retry| BO\n    GD -->|429 retry| BO\n    CP -->|exhausted key| MK[mark_exhausted / mark_credit_exhausted]\n```\n\n---\n\n## Module Structure\n\n| File | Purpose |\n|---|---|\n| `backoff.rs` | Jittered exponential backoff computation |\n| `credential_pool.rs` | Multi-key failover pool with strategy-based selection |\n| `drivers/anthropic.rs` | Anthropic Messages API — non-streaming and SSE streaming |\n| `drivers/aider.rs` | Aider CLI subprocess driver |\n| `drivers/mod.rs` | `LlmDriver` trait, driver factory, provider detection |\n| `rate_limit_tracker.rs` | HTTP header parsing for provider rate-limit telemetry |\n| `shared_rate_guard.rs` | Cross-process 429 lockout persistence |\n| `retry_after.rs` | `Retry-After` header parsing (seconds and HTTP-date) |\n| `utf8_stream.rs` | Partial-UTF-8 buffering for SSE chunk boundaries |\n\n---\n\n## `backoff` — Retry Delay Computation\n\nComputes `delay = max(exp_delay, floor) + jitter` where:\n\n- `exp_delay = min(base × 2^(attempt−1), max_delay)`\n- `jitter ∈ [0, jitter_ratio × base_for_jitter]`\n\n### Entropy source\n\nThe random seed XORs `SystemTime::now().subsec_nanos()` with a process-global Weyl-sequence counter (`JITTER_COUNTER`), then mixes with an LCG step. This ensures diversity even when concurrent retry loops fire within the same OS clock tick.\n\n### Key functions\n\n| Function | Use case |\n|---|---|\n| `jittered_backoff(attempt, base, max, ratio, floor)` | Generic — full control over all parameters |\n| `standard_retry_delay(attempt, floor)` | LLM API retries: 2 s base, 60 s cap, 50 % jitter |\n| `tool_use_retry_delay(attempt)` | Tool-use failures: 1.5 s base, 60 s cap, 50 % jitter |\n\nThe `floor` parameter accepts a `Duration` parsed from a `Retry-After` header so the server-supplied minimum is always honoured. Floor is capped at 300 s internally.\n\n### Test override\n\n`enable_test_zero_backoff()` returns a `ZeroBackoffGuard` that forces all backoff delays to zero (or the floor, whichever is smaller). The guard re-enables normal backoff on drop. Integration tests use this to avoid sleeping:\n\n```rust\nlet _guard = librefang_llm_drivers::backoff::enable_test_zero_backoff();\n// ... run test that exercises retry loops ...\n```\n\n### Overflow safety\n\nThe exponential component is computed entirely in `f64` space and clamped against `max_delay` before constructing a `Duration`. This avoids the `Duration::mul_f64` panic that occurs when `base × 2^exp` overflows the internal `u64` nanosecond counter (which happens at attempt ~34 with a 2 s base).\n\nNon-finite `jitter_ratio` values (NaN, Infinity) are coerced to `0.0` so the retry hot path never panics from a bad caller-supplied ratio.\n\n---\n\n## `credential_pool` — Multi-Key Failover\n\n### Purpose\n\nWhen the kernel is configured with multiple API keys for a single provider, the credential pool manages key selection, exhaustion tracking, and automatic recovery. It is `Send + Sync` and designed to live behind an `Arc<CredentialPool>`.\n\n### Selection strategies\n\n| Strategy | Behavior |\n|---|---|\n| `FillFirst` | Always pick the highest-priority available key; fall back only when exhausted |\n| `RoundRobin` | Cycle through available keys in priority order |\n| `Random` | Choose a random available key (LCG-seeded, no `rand` dependency) |\n| `LeastUsed` | Pick the key with the lowest `request_count` |\n\n### Exhaustion and cooldown\n\nCredentials enter cooldown when a request returns 429 (rate-limited) or 402 (credits exhausted). Two separate TTLs control recovery:\n\n| Event | Method | Default TTL |\n|---|---|---|\n| HTTP 429 | `mark_exhausted()` | 1 hour (`DEFAULT_EXHAUSTED_TTL`) |\n| HTTP 402 | `mark_credit_exhausted()` | 24 hours (`DEFAULT_CREDIT_EXHAUSTED_TTL`) |\n| Auth failure | `mark_permanent()` | ~100 years (effectively permanent) |\n\n`mark_success()` clears any active exhaustion marker and increments the request counter, enabling early recovery if the provider begins accepting the key again.\n\n### Construction\n\n```rust\n// Simple — no labels\nlet pool = CredentialPool::new(\n    vec![(\"sk-key-a\".into(), 10), (\"sk-key-b\".into(), 5)],\n    PoolStrategy::RoundRobin,\n);\n\n// With operator-facing labels (preferred for diagnostics)\nlet pool = CredentialPool::new_with_labels(\n    vec![\n        (\"sk-key-a\".into(), \"Primary\".into(), 10),\n        (\"sk-key-b\".into(), \"Backup\".into(), 5),\n    ],\n    PoolStrategy::RoundRobin,\n);\n\n// Arc-wrapped for sharing across tasks\nlet arc_pool = new_arc_pool_with_labels(keys, PoolStrategy::RoundRobin);\n```\n\nCredentials are sorted descending by priority on construction. Labels are carried inside each `PooledCredential` — never reconstructed by positional indexing into the config list (which loses alignment when env var resolution skips a key).\n\n### Lifecycle\n\n```rust\n// Select a key\nif let Some(key) = pool.acquire() {\n    // ... make API request with key ...\n    match response_status {\n        200 => pool.mark_success(&key),\n        429 => pool.mark_exhausted(&key),\n        402 => pool.mark_credit_exhausted(&key),\n        401 | 403 => pool.mark_permanent(&key),\n        _ => {} // transient server error — don't mark the key\n    }\n}\n```\n\n### Diagnostics\n\n`pool.snapshot()` returns `Vec<CredentialSnapshot>` with redacted key hints (`****abcd`), labels, priorities, request counts, and cooldown remaining. Safe for HTTP endpoints, logs, and dashboards — the raw API key is never exposed.\n\n### RoundRobin internals\n\nThe round-robin implementation uses a cycle-aware single scan: starting from the normalized cursor, it wraps around the credential list in one pass, returning both the selected key and the next cursor position from a single atomic snapshot. This eliminates a previous TOCTOU race where the cursor was recomputed separately from the key selection.\n\nThe cursor is normalized (`idx % credentials.len()`) on every `acquire` call, so hot-reload scenarios that shrink the credential list cannot cause an out-of-bounds index.\n\n---\n\n## `drivers/anthropic` — Anthropic Claude API\n\nFull implementation of the Anthropic Messages API (`/v1/messages`) with:\n\n- System prompt extraction (from `CompletionRequest.system` or the first system-role message)\n- Tool use (bidirectional: `tool_use` blocks in responses, `tool_result` blocks in follow-up messages)\n- Extended thinking with configurable `budget_tokens` (minimum 1024)\n- Prompt caching with configurable strategy and TTL\n- SSE streaming with incremental `TextDelta`, `ToolUseStart`/`ToolInputDelta`/`ToolUseEnd`, and `ThinkingDelta` events\n- Retry on 429 (rate-limited) and 529 (overloaded) with cross-process lockout persistence\n\n### Request construction\n\n`build_anthropic_request()` converts a `CompletionRequest` into the Anthropic wire format. Key transformations:\n\n1. **System prompt** → extracted and optionally wrapped with `cache_control` marker\n2. **Messages** → `ContentBlock` variants mapped to Anthropic block types; `Thinking` blocks filtered out (Anthropic doesn't accept them as input); `ImageFile` blocks read synchronously via `tokio::task::block_in_place` and base64-encoded\n3. **Tools** → `ToolDefinition` mapped to `ApiTool`; last tool optionally stamped with `cache_control`\n4. **Extended thinking** → `{\"type\": \"enabled\", \"budget_tokens\": N}`; forces `temperature` to `None` and `max_tokens > budget_tokens`\n5. **`max_tokens`** → falls back to 8192 if left at 0 (Anthropic rejects 0 with HTTP 400)\n\n### Prompt caching\n\nThe cache breakpoint budget is 4 per request (Anthropic limit), allocated in most-stable-first order:\n\n1. System block (1 slot)\n2. Last tool schema (1 slot, only for `SystemAndN` strategy)\n3. Trailing messages (remaining slots, newest-first)\n\nControlled by `CompletionRequest.prompt_caching` (master switch) and `prompt_cache_strategy` (placement). TTL defaults to 5 minutes; `cache_ttl: Some(\"1h\")` activates the `extended-cache-ttl-2025-04-11` beta header for 1-hour caching.\n\n### Streaming\n\nThe SSE parser handles partial UTF-8 across chunk boundaries via `Utf8StreamDecoder`. If the consumer drops the `mpsc::Sender` receiver, the driver detects the send failure and aborts the upstream stream on the next iteration rather than continuing to fetch data for nobody.\n\n### Error classification\n\nAnthropic's `error.type` field is mapped to `ProviderErrorCode` for typed failover decisions:\n\n| `error.type` | `ProviderErrorCode` |\n|---|---|\n| `rate_limit_error` | `RateLimit` |\n| `overloaded_error` | `ServerUnavailable` |\n| `authentication_error` / `permission_error` | `AuthError` |\n| `billing_error` | `CreditExhausted` |\n| `not_found_error` | `ModelNotFound` |\n| `invalid_request_error` + status 413 | `ContextLengthExceeded` |\n| `invalid_request_error` (other) | `BadRequest` |\n| `api_error` | `ServerError` |\n\n### Retry and cross-process guarding\n\nBoth `complete()` and `stream()` retry up to 3 times on 429/529. On 429, the key ID hash and cooldown are persisted to a shared file so that a second daemon process (or a restarted process) does not immediately hammer the same exhausted key.\n\n529 (overloaded) triggers retries but does **not** persist a lockout — it reflects server capacity, not an account-level rate limit.\n\n---\n\n## `drivers/aider` — Aider CLI Subprocess Driver\n\nSpawns the `aider` CLI in non-interactive mode (`--message`) as a child process. Aider handles its own LLM provider authentication via standard environment variables (`OPENAI_API_KEY`, `ANTHROPIC_API_KEY`, etc.).\n\n### Model ID mapping\n\nModel IDs with the `aider/` prefix are stripped: `\"aider/sonnet\"` → `--model sonnet`. Unprefixed model IDs pass through unchanged.\n\n### Construction\n\n```rust\nlet driver = AiderDriver::new(\n    Some(\"/usr/local/bin/aider\".into()), // cli_path; None defaults to \"aider\"\n    false,                                // skip_permissions\n);\n```\n\n### Detection\n\n`AiderDriver::detect()` runs `aider --version` and returns the version string if the CLI is available. Returns `None` if the binary is not on PATH or exits with a non-zero status.\n\n---\n\n## How It Connects to the Rest of the Codebase\n\n### Kernel boot\n\n`kernel/boot.rs` calls `create_driver()` in `drivers/mod.rs` to instantiate the appropriate driver based on configuration. For providers with multiple API keys, `kernel/pooled_driver.rs` wraps the driver in a credential pool via `new_arc_pool()` or `new_arc_pool_with_labels()`.\n\n### Config hot-reload\n\n`kernel/config_reload_ops.rs` calls `rebuild_credential_pools()` → `new_arc_pool_with_labels()` to construct fresh pools when the operator edits `config.toml`. Production hot-reload creates a brand-new `CredentialPool` rather than mutating the existing one.\n\n### Provider detection\n\n`drivers/mod.rs::detect_available_provider()` probes for available backends (checking for CLI binaries, credential files, env vars). The TUI wizard (`tui/screens/wizard.rs`) and CLI doctor (`librefang-cli/src/main.rs`) both call this to surface available providers to the operator.\n\n### Health probing\n\n`librefang-runtime/src/provider_health.rs` calls `provider_api_format()` to construct lightweight health-check requests that exercise the same driver path without requiring a full conversation.\n\n### Integration tests\n\nIntegration tests in `librefang-llm-drivers/tests/` exercise:\n- Retry behavior under synthetic 429/529 responses (`anthropic_retry.rs`)\n- Request shape validation — headers, model field, tools (`anthropic_request_shape.rs`, `gemini_request_shape.rs`)\n- Trace header emission and omission (`*_trace_headers.rs`)\n- Cross-process rate guard interaction (`shared_rate_guard_integration.rs`)\n\nTests call `enable_test_zero_backoff()` to eliminate real delays in retry loops.","llm-drivers":"# LLM Drivers\n\n# LLM Drivers\n\nThe LLM Drivers module group provides LibreFang's complete transport layer to upstream LLM providers. It splits cleanly into a thin abstraction crate and a heavy implementations crate.\n\n## Structure\n\n| Crate | Role |\n|---|---|\n| [librefang-llm-driver](librefang-llm-driver-src.md) | Defines the `LlmDriver` trait, shared request/response types (`CompletionRequest`, `CompletionResponse`), error taxonomy (`LlmError`, `classify_error`), and exhaustion tracking (`ProviderExhaustionStore`). |\n| [librefang-llm-drivers](librefang-llm-drivers-src.md) | Implements `LlmDriver` for every supported provider (Anthropic, OpenAI, Gemini, Bedrock, Claude Code, Codex CLI, Qwen Code, Gemini CLI) and supplies cross-cutting infrastructure: credential pools, jittered backoff, rate-limit guards, token rotation, and fallback chains. |\n\n## How They Fit Together\n\n```mermaid\ngraph LR\n    subgraph \"librefang-llm-driver (abstraction)\"\n        T[\"LlmDriver trait\"]\n        REQ[\"CompletionRequest / Response\"]\n        ERR[\"LlmError · classify_error\"]\n        EXH[\"ProviderExhaustionStore\"]\n    end\n\n    subgraph \"librefang-llm-drivers (implementations)\"\n        PROV[\"Anthropic · OpenAI · Gemini<br/>Bedrock · Claude Code · Codex CLI<br/>Qwen Code · Gemini CLI\"]\n        INFRA[\"CredentialPool · Backoff<br/>RateLimitTracker · FallbackChain\"]\n    end\n\n    T -.->|implemented by| PROV\n    PROV -->|produces| REQ\n    PROV -->|raises| ERR\n    INFRA -->|marks / checks| EXH\n    ERR -->|feeds| EXH\n```\n\nThe kernel depends only on the `LlmDriver` trait and its types from the abstraction crate. Concrete providers and their supporting infrastructure live in the implementations crate and are wired together at runtime.\n\n## Key Cross-Crate Workflows\n\n**Request lifecycle.** The kernel acquires a credential from a `CredentialPool`, builds a `CompletionRequest`, and calls `LlmDriver::complete`. The chosen provider serialises the request, handles SSE streaming, and parses the response back into a `CompletionResponse`.\n\n**Error classification → exhaustion marking.** When a provider call fails, the error flows through `classify_error` to determine its `FailoverReason`. Retriable errors trigger jittered exponential backoff (respecting `Retry-After` headers). Non-recoverable errors call `mark_exhausted` on the `ProviderExhaustionStore`, which causes credential pools and fallback chains to skip that provider on subsequent attempts.\n\n**Fallback chains.** A `FallbackChain` iterates over an ordered list of `ChainEntry` providers. Each entry consults the shared exhaustion store before attempting a call, ensuring that a provider that has permanently failed (authentication error, billing issue, model not found) is not retried.","mcp-protocol":"# MCP Protocol\n\n# MCP Protocol Module\n\nThe `librefang-runtime-mcp` crate implements the client side of the Model Context Protocol (MCP). It connects to external MCP servers, discovers their tools, and dispatches tool calls from the LLM runtime while enforcing security boundaries around credential exfiltration, caller identity, and network access.\n\n## Architecture Overview\n\n```mermaid\ngraph TD\n    TR[\"tool_runner::dispatch\"] -->|\"resolve server, call tool\"| CC[\"McpConnection\"]\n    CC -->|Rmcp| STD[\"Stdio subprocess\"]\n    CC -->|JSON-RPC| SSE[\"SSE HTTP POST\"]\n    CC -->|Rmcp| HTTP[\"Streamable HTTP\"]\n    CC -->|reqwest| HC[\"HttpCompat adapter\"]\n    CC --> TS[\"Taint scanner\"]\n    CC --> CI[\"Caller-context injection\"]\n```\n\nAll MCP tools are namespaced as `mcp_{server}_{tool}` to prevent collisions when multiple servers are connected.\n\n---\n\n## Core Types\n\n### `McpServerConfig`\n\nHolds all configuration for a single MCP server connection. Key fields:\n\n| Field | Purpose |\n|---|---|\n| `name` | Display name, used in tool namespacing |\n| `transport` | Transport variant (`Stdio`, `Sse`, `Http`, `HttpCompat`) |\n| `timeout_secs` | Per-request deadline (default 60) |\n| `env` | Declared environment variables for subprocess |\n| `headers` | Extra HTTP headers for SSE/HTTP transports |\n| `taint_scanning` | Enable outbound credential scanning (default `true`) |\n| `taint_policy` | Fine-grained per-tool, per-path exemptions |\n| `taint_rule_sets` | Live `ArcSwap` handle to named taint rule sets for downgrade logic |\n| `roots` | Filesystem directories advertised via MCP Roots capability |\n\n### `McpConnection`\n\nActive connection to an MCP server. Lifecycle:\n\n1. **`McpConnection::connect(config)`** — Establishes transport, performs MCP handshake, discovers tools via `tools/list`.\n2. **`conn.call_tool_with_caller(name, arguments, caller)`** — Dispatches a tool call after taint scanning and caller-context injection.\n3. **`conn.close()`** — Explicitly shuts down the transport (preferred over implicit `Drop` for hot-reload).\n\nThe `Drop` implementation provides a best-effort fallback: if the runtime is available, it spawns a bounded async close; otherwise the rmcp `DropGuard` fires synchronously.\n\n### `McpTransport` (enum)\n\n| Variant | Protocol | SDK |\n|---|---|---|\n| `Stdio { command, args }` | MCP over stdin/stdout | `rmcp` SDK with `TokioChildProcess` |\n| `Sse { url }` | JSON-RPC over HTTP POST | Manual reqwest |\n| `Http { url }` | Streamable HTTP (2025-03-26 spec) | `rmcp` SDK `StreamableHttpClientTransport` |\n| `HttpCompat { base_url, headers, tools }` | Plain HTTP/JSON adapter | Manual reqwest |\n\n---\n\n## Tool Namespacing\n\nAll tools from MCP servers are prefixed to avoid naming collisions:\n\n- **`format_mcp_tool_name(server, tool)`** → `mcp_{server}_{tool}` (both parts normalized to lowercase with hyphens replaced by underscores).\n- **`is_mcp_tool(name)`** → checks `mcp_` prefix.\n- **`resolve_mcp_server_from_known(tool_name, server_names)`** → reverse lookup using longest-prefix match against known server names. This is the robust variant used by `tool_runner::dispatch`; the simpler `extract_mcp_server` splits on the first underscore and is unreliable for multi-word server names.\n\n---\n\n## Caller Context (Identity Attestation)\n\nThe kernel injects an attested identity into every MCP tool call so servers can enforce per-user authorization.\n\n### `CallerContext`\n\n```rust\npub struct CallerContext {\n    pub peer_id: Option<String>,    // e.g. Telegram user id\n    pub channel: Option<String>,    // \"telegram\", \"slack\", …\n    pub chat_id: Option<String>,    // conversation id\n    pub session_id: Option<String>, // LibreFang SessionId\n}\n```\n\nBuilt via `CallerContext::from_parts(...)` from `ToolExecContext` fields. Returns `None` when all signals are absent, preserving byte-for-byte payload parity with pre-attestation calls.\n\n### Injection mechanism\n\nThe strip-then-set ordering is the security boundary:\n\n1. Clone `arguments`, coerce to `{}` if null/non-object.\n2. **Remove** any agent-supplied `_librefang_caller` key — the agent must never control this value.\n3. **Insert** the kernel-attested `CallerContext` under `_librefang_caller` (for Rmcp/SSE) or as the `X-Librefang-Caller` HTTP header (for HttpCompat).\n\nSee `inject_caller_into_arguments()` for the Rmcp/SSE path. The taint scanner runs against the **original** agent-supplied arguments before injection, so a malicious agent can't hide data behind the `_librefang_caller` key.\n\n---\n\n## Taint Scanning (Outbound Credential Detection)\n\nBefore any arguments leave the process, the taint scanner walks every string leaf in the JSON tree to detect credentials and PII.\n\n### Entry point\n\n`scan_mcp_arguments_for_taint_with_policy(value, taint_policy, rule_set_registry, tool_name)` → `Option<String>` (redacted violation description).\n\n### How it works\n\n1. **Tool-level bypass**: If the tool's policy has `default = Skip`, scanning is skipped entirely.\n2. **Recursive walk** (`walk_taint`): Traverses objects, arrays, and string leaves. Recursion capped at `MCP_TAINT_SCAN_MAX_DEPTH` (64).\n3. **Sensitive key detection**: Object keys matching known credential names (`authorization`, `api_key`, `password`, `secret`, etc.) with non-empty string values are blocked regardless of value shape. This catches patterns like `{\"headers\": {\"Authorization\": \"Bearer sk-...\"}}` that the text heuristic misses.\n4. **Content-based scanning**: Each string leaf is checked via `detect_outbound_text_violation_rules_with_skip` from `librefang_types::taint`.\n5. **Per-path skip rules**: `McpTaintPolicy` can exempt specific JSONPath patterns (e.g., `$.tab_id`) from specific rules.\n6. **Rule-set downgrades**: Named rule sets referenced in the tool's policy can downgrade `Block` → `Warn` or `Log`. When multiple sets cover the same rule, the most permissive action wins (`Log` > `Warn` > `Block`).\n\n### JSONPath matching\n\n`jsonpath_matches(pattern, path)` supports:\n- Exact paths: `$.a.b`\n- Wildcards: `$.a.*`, `$.*`\n- Array wildcards: `$.items[*]` matches `$.items[0]`\n\n**Limitation**: Object keys containing `.` or `[` cannot be addressed precisely. Use broader patterns as a workaround.\n\n### Important security properties\n\n- Returned error strings contain only the JSON path and rule name — **never** the offending payload value.\n- The scanner fires on every rule, not just the first, so a `Warn` downgrade on rule A cannot mask an unauthorized rule B firing in the same payload.\n\n---\n\n## Transport Details\n\n### Stdio\n\nSpawns a subprocess with a sandboxed environment:\n\n- **Shell blocking**: `bash`, `sh`, `cmd`, `powershell`, etc. are rejected — servers must specify a runtime (`npx`, `node`, `python`).\n- **Environment sandboxing**: The subprocess does NOT inherit the parent environment. Only `SAFE_ENV_VARS` (PATH, HOME, NODE_PATH, etc.) and explicitly declared `env` entries are passed.\n- **Env var expansion in args**: `$VAR` and `${VAR}` references in args are expanded only for variables in the allowlist (safe system vars + declared env). Undeclared secrets like `ANTHROPIC_API_KEY` are never leaked.\n- **Tilde expansion**: Leading `~` in args is expanded to the home directory.\n- **Windows `.cmd` adaptation**: On Windows, `npx` is resolved to `npx.cmd` automatically.\n- **Stderr draining**: Child stderr is captured and logged at DEBUG level, capped at 100 lines of 256 bytes each. Draining continues past the cap to prevent pipe stalls.\n\n### SSE (Server-Sent Events)\n\nManual JSON-RPC 2.0 over HTTP POST:\n\n- `sse_initialize()` sends the MCP `initialize` handshake, validates the server's `protocolVersion` against `SUPPORTED_MCP_VERSIONS`.\n- `sse_discover_tools()` calls `tools/list`.\n- Response validation: Content-Type must be `application/json` or `text/event-stream`; JSON-RPC `id` in the response must match the request.\n- Does **not** declare `roots` capability (SSE is unidirectional).\n\n### Streamable HTTP\n\nUses the `rmcp` SDK's `StreamableHttpClientTransport`:\n\n- Supports `Mcp-Session-Id` for session management.\n- Advertises `roots` capability only for local URLs.\n- On 401, attempts OAuth metadata discovery and returns `\"OAUTH_NEEDS_AUTH\"` to defer to the API layer.\n\n### HttpCompat\n\nBuilt-in adapter for plain HTTP/JSON backends that don't speak MCP:\n\n- Tools are statically declared in config (no `tools/list`).\n- Path templates use `{param}` placeholders rendered from arguments.\n- Supports `GET`, `POST`, `PUT`, `PATCH`, `DELETE` methods.\n- Request modes: `JsonBody`, `Query`, `None`.\n- Response modes: `Text`, `Json`.\n- Caller context shipped via `X-Librefang-Caller` header.\n\n---\n\n## Security Features\n\n### SSRF Protection\n\n`check_ssrf(url, label)` is called for every HTTP-based transport. It:\n\n- Rejects non-`http(s)` schemes.\n- Rejects URLs with userinfo (`http://user:pw@host/`).\n- Blocks cloud-metadata endpoints: `0.0.0.0`, `169.254/16`, `100.64/16`, Azure IMDS, GCP/AWS metadata hostnames.\n- Unwraps IPv4-mapped IPv6 and NAT64 prefixes before re-checking.\n\nLoopback/RFC1918 addresses are **allowed** for MCP backend URLs (operator-configured) but blocked on the OAuth discovery/token-exchange path where hosts come from remote responses.\n\n### Bounded Response Reading\n\n`read_response_bytes_capped(response)` streams the HTTP body with a running counter, rejecting anything over 16 MiB (`MAX_RESPONSE_BYTES`). This prevents malicious servers from causing OOM via unbounded responses — the check is streaming, not buffered.\n\n### Argument Validation\n\n`validate_args_against_schema` provides a lightweight guard (not full JSON Schema validation):\n\n1. Rejects non-object arguments when the schema declares `type: \"object\"`.\n2. Rejects missing `required` fields.\n\nFull validation (types, patterns, enums, nested objects) is delegated to the MCP server.\n\n---\n\n## MCP Roots Capability\n\n`RootsClientHandler` implements `rmcp::ClientHandler` to declare filesystem root directories during the MCP `initialize` handshake. Paths are converted to `file://` URIs with proper percent-encoding and Windows drive-letter handling.\n\n- **Stdio**: Roots are always advertised (local subprocess).\n- **Streamable HTTP**: Roots advertised only for local URLs (`localhost`, `127.x.x.x`, `::1`).\n- **SSE / HttpCompat**: Roots are not applicable (no handshake or unidirectional).\n\n---\n\n## OAuth Integration\n\nThe `mcp_oauth` submodule handles:\n\n- **Metadata discovery**: Three-tier resolution (WWW-Authenticate header → RFC 8414 well-known → config fallback). Validates metadata endpoints against the Public Suffix List to prevent open redirect attacks.\n- **PKCE flow**: `generate_pkce()` creates verifier/challenge pairs; `generate_state()` and `generate_flow_id()` produce cryptographic nonces.\n- **Token storage**: `McpOAuthProvider` trait for loading/storing tokens (vault-backed).\n- **SSRF on discovery**: OAuth endpoints (from remote responses) get stricter SSRF checks than backend URLs.\n\nWhen a Streamable HTTP server returns 401, the connect flow extracts the `WWW-Authenticate` header via `extract_auth_header_from_error` and returns `\"OAUTH_NEEDS_AUTH\"` so the API layer can drive the browser-based PKCE flow.\n\n---\n\n## Hot-Reload Contract\n\n`TaintRuleSetsHandle` (`Arc<ArcSwap<Vec<NamedTaintRuleSet>>>`) is shared across all connected servers. The kernel owns a single swap and clones it into each `McpServerConfig`. On config reload:\n\n1. Kernel calls `handle.store(Arc::new(new_rules))`.\n2. The next `call_tool_with_caller` picks up new rules via `.load()`.\n3. The `.load()` snapshot is held for the entire argument-tree walk, so rules cannot change mid-scan.\n\n---\n\n## Integration Points\n\n### Called by the kernel\n\n- **`tool_runner::dispatch::execute_tool_raw`** → `is_mcp_tool()`, `resolve_mcp_server_from_known()`, `CallerContext::from_parts()`, `call_tool_with_caller()`\n- **`kernel::mcp_summary::render_mcp_summary`** → `normalize_name()`, `resolve_mcp_server_from_known()`\n- **`routes::mcp_auth::auth_start`** → `discover_oauth_metadata()`, `generate_state()`\n- **`routes::agents::get_agent_mcp_servers`**, **`tui::event::spawn_fetch_agent_mcp_servers`** → `resolve_mcp_server_from_known()`\n\n### Dependencies\n\n- `rmcp` — MCP protocol SDK (Stdio and Streamable HTTP transports)\n- `librefang_types` — `TaintSink`, `ToolDefinition`, config types\n- `librefang_http` — `proxied_client_builder()` for HTTP clients\n- `arc_swap` — Lock-free hot-reload for taint rule sets\n- `reqwest` — HTTP client for SSE and HttpCompat","media-processing":"# Media Processing\n\n# Media Processing Module\n\nThe `librefang-runtime-media` crate provides a provider-agnostic abstraction layer for media generation (image, TTS, video, music) and media understanding (image description, audio transcription, video analysis). It mirrors the architecture used by the LLM driver system: a trait-based interface with per-provider implementations, lazy-initialized caching, and configuration-driven URL resolution.\n\n## Architecture\n\n```mermaid\ngraph TD\n    subgraph \"Callers\"\n        TR[tool_runner/media.rs]\n        RT[routes/media.rs]\n    end\n\n    subgraph \"librefang-runtime-media\"\n        MC[MediaDriverCache]\n        MD[MediaDriver trait]\n        ME[MediaEngine]\n\n        MC -->|get_or_create| ELE[ElevenLabsMediaDriver]\n        MC -->|get_or_create| GEM[GeminiMediaDriver]\n        MC -->|get_or_create| OAI[OpenAIMediaDriver]\n        MC -->|get_or_create| MMX[MiniMaxMediaDriver]\n        MC -->|get_or_create| GTTS[GoogleTtsMediaDriver]\n        MC -->|get_or_create| GOAI[GenericOpenAICompatMediaDriver]\n    end\n\n    TR -->|resolve by provider or capability| MC\n    RT -->|resolve by provider or capability| MC\n    ME -->|STT/vision dispatch| WH[Whisper-compatible endpoints]\n    ME -->|STT/vision dispatch| GAPI[Gemini generateContent]\n    ME -->|STT/vision dispatch| ELSTT[ElevenLabs Speech-to-Text]\n```\n\n## Core Trait: `MediaDriver`\n\nDefined in `lib.rs`, the `MediaDriver` trait provides per-modality async methods with default implementations that return `MediaError::NotSupported`. Providers override only the methods they support.\n\n```rust\n#[async_trait]\npub trait MediaDriver: Send + Sync {\n    fn capabilities(&self) -> Vec<MediaCapability>;\n    fn is_configured(&self) -> bool;\n    fn provider_name(&self) -> &str;\n\n    async fn generate_image(&self, _request: &MediaImageRequest)\n        -> Result<MediaImageResult, MediaError>;\n    async fn synthesize_speech(&self, _request: &MediaTtsRequest)\n        -> Result<MediaTtsResult, MediaError>;\n    async fn submit_video(&self, _request: &MediaVideoRequest)\n        -> Result<MediaVideoSubmitResult, MediaError>;\n    async fn poll_video(&self, _task_id: &str)\n        -> Result<MediaTaskStatus, MediaError>;\n    async fn get_video_result(&self, _task_id: &str)\n        -> Result<MediaVideoResult, MediaError>;\n    async fn generate_music(&self, _request: &MediaMusicRequest)\n        -> Result<MediaMusicResult, MediaError>;\n}\n```\n\n### Capability Matrix\n\n| Provider | Image Gen | TTS | Video Gen | Music Gen | Auth env var |\n|---|---|---|---|---|---|\n| **OpenAI** | ✅ (DALL-E 3, gpt-image-1) | ✅ (tts-1, tts-1-hd) | — | — | `OPENAI_API_KEY` |\n| **Gemini** | ✅ (Imagen 3) | — | — | — | `GEMINI_API_KEY` or `GOOGLE_API_KEY` |\n| **ElevenLabs** | — | ✅ (multilingual_v2) | — | — | `ELEVENLABS_API_KEY` |\n| **MiniMax** | ✅ (image-01) | ✅ (speech-2.8-hd) | ✅ (Hailuo) | ✅ (music-2.5) | `MINIMAX_API_KEY` |\n| **Google TTS** | — | ✅ (Standard/WaveNet/Neural2) | — | — | `GOOGLE_API_KEY` or `GOOGLE_CLOUD_API_KEY` |\n| **Generic OpenAI-compat** | ✅ | ✅ | — | — | `{PROVIDER}_API_KEY` |\n\n### Error Handling: `MediaError`\n\n```rust\npub enum MediaError {\n    NotSupported(String),      // Modality not implemented by this driver\n    MissingKey(String),        // Required env var not set\n    Http(String),              // Network/transport failure\n    Api { status: u16, message: String },  // Provider returned non-2xx\n    RateLimit(String),         // Throttled by provider\n    ContentFiltered(String),   // Safety filter triggered\n    InvalidRequest(String),    // Bad input parameters\n    TaskNotFound(String),      // Unknown async task ID\n    Other(String),             // Catch-all\n}\n```\n\nAll error messages from provider responses are truncated to 500 bytes via `safe_truncate_str` before being surfaced, preventing oversized error payloads from propagating.\n\n## Driver Cache: `MediaDriverCache`\n\nA thread-safe, lazy-initializing cache backed by `DashMap`. It resolves base URLs from three sources in priority order:\n\n1. **Explicit `base_url` argument** to `get_or_create`\n2. **`provider_urls` map** (sourced from `config.toml` `[provider_urls]` section)\n3. **Driver's hardcoded default** URL\n\n### Key methods\n\n- **`get_or_create(provider, base_url)`** — Returns a cached `Arc<dyn MediaDriver>`. Cache key is `\"{provider}|{url}\"`, so different base URLs for the same provider produce separate instances.\n- **`detect_for_capability(capability)`** — Iterates the media provider list in preference order, returning the first driver that is both configured (API key present) and supports the requested capability.\n- **`load_providers_from_registry(providers)`** — Populates the provider list from `ProviderInfo` entries that declare `media_capabilities`. Built-in providers are always appended as fallback.\n- **`update_provider_urls(urls)`** — Hot-reloads URL overrides and clears the cache so drivers are recreated on next access.\n\n### Provider aliases\n\n`\"google\"` is aliased to `\"gemini\"` for URL resolution. Unknown providers with a configured `base_url` fall through to `GenericOpenAICompatMediaDriver`, which speaks the OpenAI API protocol using `{PROVIDER_UPPER}_API_KEY`.\n\n## Provider Implementations\n\n### ElevenLabs (`elevenlabs.rs`)\n\n**Capability:** Text-to-speech only.\n\n**Endpoint:** `POST {base_url}/text-to-speech/{voice_id}?output_format={format}`\n\nKey design points:\n\n- **Voice ID validation** (`validate_voice_id`): Every voice ID must be exactly 20 ASCII-alphanumeric characters. This closes a URL-path-injection vector since the voice ID is interpolated directly into the path. The constant `VOICE_ID_LEN` and the default `DEFAULT_VOICE_ID` (Rachel: `21m00Tcm4TlvDq8ikWAM`) must stay in sync.\n- **Error echo truncation**: Invalid voice IDs are echoed in error messages but capped at `VOICE_ID_ERROR_ECHO_MAX_BYTES` (64 bytes) to prevent a malicious 10 kB input from producing a 10 kB error string.\n- **Validation ordering**: Voice ID is validated *before* the API key is read. This ensures that when both are wrong, the agent sees the actionable `InvalidRequest` rather than a generic `MissingKey`.\n- **Speed handling**: ElevenLabs has no direct speed parameter; speed is approximated by adjusting `stability` in voice settings (lower stability for faster speech).\n- **Response size**: Audio responses are capped at 25 MB (`MAX_AUDIO_RESPONSE_BYTES`), checked both from `Content-Length` header and actual byte count.\n- **Output format parsing**: `parse_output_format` splits strings like `\"mp3_44100_128\"` into format and sample rate components.\n\n### Gemini (`gemini.rs`)\n\n**Capability:** Image generation only (Imagen 3).\n\n**Endpoint:** `POST {base_url}/v1beta/models/{model}:predict?key={api_key}`\n\n- API key is passed as a query parameter (`?key=`), read from `GEMINI_API_KEY` or `GOOGLE_API_KEY`.\n- Images are returned as base64 in `predictions[].bytesBase64Encoded`. Individual images exceeding 10 MB base64 are skipped with a warning.\n- Content filter detection: if `predictions[0].raiFilteredReason` is present and no images were returned, the error surfaces as `MediaError::ContentFiltered`.\n- `sampleCount` is capped at 4 per request.\n- Supported aspect ratios: `\"1:1\"`, `\"3:4\"`, `\"4:3\"`, `\"9:16\"`, `\"16:9\"`.\n\n### Google Cloud TTS (`google_tts.rs`)\n\n**Capability:** Text-to-speech only.\n\n**Endpoint:** `POST {base_url}/text:synthesize?key={api_key}`\n\n- Supports Standard, WaveNet, Neural2, and Studio voices via the `voice.name` parameter.\n- **SSML auto-detection** (`build_input`): If input text contains `<speak>`, it's sent as SSML directly. If it contains SSML-only tags (e.g., `<break`, `<prosody`) without a `<speak>` wrapper, the text is auto-wrapped. Otherwise, it's sent as plain text.\n- **Audio encoding mapping** (`map_audio_encoding`): `\"opus\"`/`\"ogg\"` → `OGG_OPUS`, `\"wav\"`/`\"pcm\"`/`\"linear16\"` → `LINEAR16`, everything else → `MP3`.\n- Speaking rate and pitch are passed directly through `audioConfig`.\n- Response audio is base64-encoded in the `audioContent` field; decoded with size pre-check (base64 length × 4/3 as an upper bound).\n\n### MiniMax (`minimax.rs`)\n\n**Capability:** All four modalities — the most complete driver.\n\n| Modality | Endpoint | Default model |\n|---|---|---|\n| Image | `POST /v1/image_generation` | `image-01` |\n| TTS | `POST /v1/t2a_v2` | `speech-2.8-hd` |\n| Video | `POST /v1/video_generation` + polling | `MiniMax-Hailuo-2.3` |\n| Music | `POST /v1/music_generation` | `music-2.5` |\n\n**Region awareness:** The China endpoint (`api.minimaxi.com`, note the extra \"i\") is auto-detected from the base URL. China prefers `MINIMAX_CN_API_KEY`; international prefers `MINIMAX_API_KEY`, with fallback to the other.\n\n**Error handling:** `check_base_resp` maps MiniMax status codes to typed errors:\n- `1002` → `RateLimit`\n- `1004` → `MissingKey`\n- `1026`/`1027` → `ContentFiltered`\n- `2013` → `InvalidRequest`\n\n**Audio encoding:** MiniMax returns audio as hex-encoded bytes (`\"output_format\": \"hex\"`), decoded via the `hex` crate. Duration, sample rate, and format are extracted from `extra_info`.\n\n**Video generation** uses an async submit/poll/result pattern:\n1. `submit_video` → returns a `task_id`\n2. `poll_video` → maps status strings (`\"Preparing\"`, `\"Queueing\"`, `\"Processing\"`, `\"Success\"`, `\"Fail\"`) to `MediaTaskStatus`\n3. `get_video_result` → fetches the `file_id`, then retrieves the download URL via `/files/retrieve`\n\n### OpenAI (`openai.rs`)\n\n**Capability:** Image generation and TTS.\n\n| Modality | Endpoint | Default model |\n|---|---|---|\n| Image | `POST /v1/images/generations` | `dall-e-3` |\n| TTS | `POST /v1/audio/speech` | `tts-1` |\n\n- Image responses are returned as `b64_json` by default; individual images exceeding 10 MB base64 are skipped.\n- TTS returns raw audio bytes (not base64), with a 10 MB size cap.\n- The `revised_prompt` field from DALL-E 3 responses is captured and returned.\n- Supports speed control via the `speed` parameter on TTS requests.\n\n**Generic OpenAI-compatible driver** (`GenericOpenAICompatMediaDriver`): Instantiated for unknown provider names that have a configured `base_url`. Allows integrating with any OpenAI-protocol-compatible service without writing a dedicated driver.\n\n## Media Understanding Engine (`media_understanding.rs`)\n\nSeparate from generation, `MediaEngine` handles consuming media: image description, audio transcription, and video analysis.\n\n### Construction\n\n```rust\nlet engine = MediaEngine::new(config);\n```\n\nConcurrency is bounded by a `Semaphore` initialized from `config.max_concurrency` (clamped to 1–8).\n\n### Provider Selection\n\nEach modality picks **exactly one** provider — no fallback cascade:\n\n- **Image description**: `[media] image_provider` config, or first detected from `ANTHROPIC_API_KEY` → `OPENAI_API_KEY` → `GEMINI_API_KEY`\n- **Audio transcription**: `[media] audio_provider` config, or first detected from `GROQ_API_KEY` → `OPENAI_API_KEY` → `GEMINI_API_KEY` → `ELEVENLABS_API_KEY` → `MINIMAX_API_KEY` → `FIREWORKS_API_KEY` → `TOGETHER_API_KEY` → `SILICONFLOW_API_KEY`\n- **Video description**: Gemini only (requires `GEMINI_API_KEY` or `GOOGLE_API_KEY`)\n\nWhen auto-detection is used, a warning is logged advising explicit configuration.\n\n### Audio Transcription Flow\n\nAudio transcription has the most complex pipeline:\n\n1. **Read audio bytes** from `MediaSource::FilePath` or `MediaSource::Base64`. URL sources are rejected.\n2. **Detect format** from MIME type (`mime_to_ext`) or source file extension. Falls back to `.wav`.\n3. **OGA transcoding**: Telegram voice notes arrive as `.oga`/`audio/oga`, which Whisper rejects. The `transcode_oga_to_ogg_opus` function shells out to `ffmpeg` to re-packetize the Opus payload into a standard Ogg container. stdin/stdout are piped (no scratch files), with a 30-second wall-clock timeout and explicit child kill + reap on timeout.\n4. **Dispatch to provider**:\n   - **Whisper-compatible** (groq, openai, minimax, fireworks, together, siliconflow): multipart POST with `file` + `model` + `response_format=text`\n   - **Gemini**: `generateContent` with inline base64 audio and a transcription prompt\n   - **ElevenLabs**: `POST /v1/speech-to-text` with multipart file upload\n\n### Security\n\nError messages from transcription providers are sanitized before being returned to the caller. The underlying `reqwest::Error` display can leak URLs (Gemini embeds `?key=` in the URL); these are logged at warn level but replaced with generic messages in the `Err` returned to the agent prompt.\n\n## Integration Points\n\nThe module is consumed by two main callers:\n\n- **`src/tool_runner/media.rs`** — Tool implementations (`tool_image_generate`, `tool_text_to_speech`, `tool_video_generate`, `tool_video_status`, `tool_music_generate`) resolve drivers via `get_or_create` (explicit provider) or `detect_for_capability` (auto-detect).\n- **`src/routes/media.rs`** — HTTP API routes (`list_media_providers`, `poll_video_task`, `resolve_driver`) for external consumers.\n\n## Adding a New Provider\n\n1. Create a new submodule (e.g., `replicate.rs`) implementing `MediaDriver`.\n2. Override the methods for supported modalities; leave unsupported ones as defaults (they return `NotSupported`).\n3. Add the provider to the `match` arm in `create_media_driver` in `lib.rs`.\n4. Add the provider name to the default `media_providers` list in `MediaDriverCache::new()`.\n5. If the provider uses a custom env var for auth, implement `api_key()` accordingly and return `false` from `is_configured()` when it's missing.","memory-storage-librefang-memory-src":"# Memory & Storage — librefang-memory-src\n\n# librefang-memory\n\nThe memory substrate for the LibreFang Agent Operating System. Provides a unified persistence layer over SQLite for structured data, semantic vector search, knowledge graphs, session history, and proactive (mem0-style) memory management.\n\nAll storage shares a single `r2d2` connection pool backed by one SQLite file in WAL mode. The module is consumed by the kernel, runtime, API routes, and the agent loop.\n\n## Architecture\n\n```mermaid\ngraph TD\n    subgraph \"MemorySubstrate (unified entry point)\"\n        direction LR\n        A[StructuredStore] B[SemanticStore] C[KnowledgeStore]\n        D[SessionStore] E[PromptStore] F[WorkflowStore]\n        G[UsageStore] H[IdempotencyStore]\n    end\n\n    Pool[r2d2::Pool&lt;SqliteConnectionManager&gt;] --> A\n    Pool --> B\n    Pool --> C\n    Pool --> D\n    Pool --> E\n    Pool --> F\n    Pool --> G\n    Pool --> H\n\n    I[ProactiveMemoryStore] --> A\n    I --> B\n    I --> C\n\n    J[ConsolidationEngine] --> Pool\n    K[decay::run_decay] --> Pool\n\n    B -->|delegates| L[VectorStore trait]\n    L -->|impl| M[SqliteVectorStore]\n    L -->|impl| N[HttpVectorStore]\n```\n\n## Module Layout\n\n| File | Purpose |\n|------|---------|\n| `substrate.rs` | `MemorySubstrate` — owns the connection pool, wires all sub-stores together |\n| `migration.rs` | Schema creation and migration ladder (v1–v41) |\n| `session.rs` / `session_store.rs` | Session persistence, FTS, JSONL mirroring |\n| `structured.rs` | Key-value store for agent state and config |\n| `semantic.rs` | Semantic memory with embedding-based recall (`SqliteVectorStore`) |\n| `http_vector_store.rs` | `VectorStore` impl delegating to a remote HTTP service |\n| `knowledge.rs` | Entity-relation knowledge graph |\n| `proactive.rs` | Unified proactive memory (search, add, auto-memorize, auto-retrieve) |\n| `consolidation.rs` | Memory deduplication and confidence decay |\n| `decay.rs` | TTL-based soft-deletion of stale memories |\n| `chunker.rs` | Text chunking with overlap for embedding |\n| `prompt.rs` | Prompt versioning and experiment management |\n| `namespace_acl.rs` | Namespace-scoped read/write guards |\n| `idempotency.rs` | Idempotency-key cache for state-creating POSTs |\n| `workflow_store.rs` | Workflow run persistence |\n| `usage.rs` | Token/cost usage tracking |\n| `roster_store.rs` | Agent roster storage |\n| `provider.rs` | Pluggable memory provider trait (`MemoryProvider`) |\n\n## Text Chunking — `chunker`\n\nSplits long documents into overlapping chunks suitable for embedding-based retrieval. The splitting cascade is:\n\n1. **Paragraph boundaries** (`\\n\\n`) — preferred, preserves coherent blocks.\n2. **Sentence boundaries** — when a single paragraph exceeds `max_size`. Recognizes `. ` / `.\\n`, `。`, `？`, `！`.\n3. **Hard character split** — last resort when a single sentence is still too long.\n\n```rust\npub fn chunk_text(text: &str, max_size: usize, overlap: usize) -> Vec<String>\n```\n\nOverlap is applied by prepending the last `overlap` characters of the previous chunk to the next one, joined by `\\n\\n`. If the overlap + new segment exceeds `max_size`, the overlap is dropped.\n\nInternally: `build_segments` → `split_sentences` → `split_by_char_limit` produces atomic segments, then `pack_with_overlap` greedily packs them into chunks.\n\nAll character counting uses `str::chars().count()` — Unicode-safe. The `char_boundaries` helper ensures hard splits never slice inside a multi-byte character.\n\n## Memory Consolidation — `consolidation`\n\n`ConsolidationEngine` runs periodic consolidation cycles that:\n\n1. **Decay confidence** of memories not accessed in 7 days, multiplying by `(1 - decay_rate)` with a floor of `0.1`.\n2. **Merge duplicates** — memories with >90% text similarity (Jaccard on lowercased words) are merged per-agent.\n\n### Merge Semantics\n\nWhen two memories are merged, the higher-confidence row (the *keeper*) absorbs the lower-confidence row (the *loser*) which is soft-deleted:\n\n| Field | Merge rule |\n|-------|-----------|\n| `confidence` | `max(keeper, loser)` |\n| `access_count` | Sum of both |\n| `metadata` | JSON object union; keeper wins key conflicts. Non-object payloads (arrays, strings, malformed) on either side cause the keeper to be preserved verbatim. |\n| `embedding` | Confidence-weighted average using a **running accumulated weight** (see below) |\n\n### Running Weighted Average for Embeddings\n\nA keeper that absorbs multiple losers tracks an accumulated weight that grows with each merge:\n\n```\nstep 1: accum_weight = keeper.confidence\n        merged = (keeper.emb × accum_weight + loser.emb × loser.conf) / (accum_weight + loser.conf)\n        accum_weight += loser.confidence\n\nstep 2: merged = (merged.emb × accum_weight + loser2.emb × loser2.conf) / (accum_weight + loser2.conf)\n        accum_weight += loser2.confidence\n```\n\nThis produces a true average over all absorbed vectors rather than a chain of pairwise blends biased toward the last loser. Dimension-mismatched losers are skipped (keeper bytes preserved verbatim). When the keeper has no embedding but the loser does, the loser's vector is adopted (asymmetric — some embedding is better than none).\n\n### Transaction Strategy\n\nA single outer transaction wraps every merge in a consolidation run. This collapses up to `MAX_MERGES_PER_RUN` (100) fsyncs into one. Per-pair atomicity (loser soft-delete + keeper update) is preserved because both writes land in the same transaction. If any step fails, the `?` propagation rolls the entire batch back; consolidation is idempotent, so the next run picks up where it left off.\n\n### Tenant Isolation\n\nMemories are grouped by `agent_id` before comparison. Cross-tenant merges never occur, even when content is identical. The `SELECT` in the merge loop filters `WHERE deleted = 0 AND agent_id = ?1`.\n\n## Time-Based Decay — `decay`\n\nScope-based TTL rules:\n\n| Scope | Behavior |\n|-------|----------|\n| `user_memory` | Never decays — permanent user knowledge |\n| `session_memory` | Soft-deleted after `session_ttl_days` of no access |\n| `agent_memory` | Soft-deleted after `agent_ttl_days` of no access |\n\n```rust\npub fn run_decay(pool: &Pool<SqliteConnectionManager>, config: &MemoryDecayConfig) -> LibreFangResult<usize>\n```\n\nDecay performs a **soft delete** (`deleted = 1`, `deleted_at = <unix timestamp>`) rather than a hard `DELETE`. Hard removal happens later via:\n\n```rust\npub fn prune_soft_deleted_memories(pool: &Pool<SqliteConnectionManager>, older_than_days: u64) -> LibreFangResult<usize>\n```\n\n`prune_soft_deleted_memories` reclaims rows (and their embedding BLOBs) that have been soft-deleted for longer than the specified window. Rows with `deleted_at = NULL` are ignored.\n\nTimestamp comparisons use `datetime()` on both sides so SQLite parses them properly rather than relying on lexicographic string comparison (which breaks across offset formats and fractional-second precision).\n\n## HTTP Vector Store — `http_vector_store`\n\nA `VectorStore` implementation that delegates all vector operations to a remote HTTP service, allowing external vector databases (Qdrant, Weaviate, custom microservices) without linking native clients.\n\n### API Contract\n\n| Method | Path | Request | Response |\n|--------|------|---------|----------|\n| POST | `/insert` | `{ id, embedding, payload, metadata }` | `{}` |\n| POST | `/search` | `{ query_embedding, limit, filter? }` | `[{ id, payload, score, metadata }]` |\n| DELETE | `/delete` | `{ id }` | `{}` |\n| POST | `/get_embeddings` | `{ ids }` | `{ \"<id>\": [f32, ...], ... }` |\n\n```rust\nlet store = HttpVectorStore::new(\"http://localhost:6333/collections/memories\");\n```\n\nTrailing slashes are stripped. All errors are mapped to `LibreFangError::Internal` with the HTTP status and response body.\n\n## Idempotency — `idempotency`\n\nSQLite-backed idempotency-key cache for state-creating POSTs. Shares the substrate connection pool so no separate database file is needed.\n\n- **TTL**: 24 hours (`TTL_SECONDS = 86400`)\n- **First-writer-wins**: `INSERT OR IGNORE` — concurrent writes under the same key silently keep whichever landed first.\n- **Self-trimming**: `lookup` deletes expired rows in place and reports them as a miss. `prune_expired` is called opportunistically by the middleware.\n\n```rust\npub trait IdempotencyStore: Send + Sync {\n    fn lookup(&self, key: &str) -> Result<Option<StoredRecord>, IdempotencyError>;\n    fn put(&self, key: &str, body_hash: &str, response: &CachedResponse) -> Result<(), IdempotencyError>;\n    fn prune_expired(&self) -> Result<(), IdempotencyError>;\n}\n```\n\n`SqliteIdempotencyStore` is the production implementation. The trait enables in-memory substitution for unit tests in the API crate. Schema is created by migration v34.\n\nPool exhaustion is tracked via `metrics::counter!(\"librefang_memory_pool_get_failed_total\")`.\n\n## Knowledge Graph — `knowledge`\n\nEntity-relation graph backed by SQLite. Supports:\n\n- `add_entity` — upsert with conflict resolution (updates name/properties on conflict)\n- `add_relation` — creates a typed, confidence-scored edge between two entities\n- `query_graph` — pattern matching against source/relation/target with a 100-row limit\n- `delete_by_agent` — transactional deletion of all entities and relations for an agent (relations deleted first to avoid orphans)\n- `has_relation` — existence check, resolving by both ID and name\n\nRelations can reference entities by either ID or name (the MCP tool uses names). The `query_graph` JOIN handles both:\n\n```sql\nJOIN entities s ON (r.source_entity = s.id OR (r.source_entity = s.name AND s.agent_id = r.agent_id))\n```\n\n### Corrupt JSON Handling\n\n`parse_entity` and `parse_relation` **do not** silently default corrupt `properties` blobs to empty maps. A parse failure returns `LibreFangError::Serialization` and logs the row ID, table, and column. This makes corruption visible in logs and API responses rather than disguising it as \"no properties.\"\n\n## Schema Migration — `migration`\n\nManages the SQLite schema from version 1 through 41. Current version constant: `SCHEMA_VERSION = 41`.\n\n### Ladder Execution\n\nEach step runs in its own transaction that bundles the DDL, an audit-row `INSERT INTO migrations`, and the `user_version` pragma bump. The `run_step!` macro wraps this:\n\n```rust\nmacro_rules! run_step {\n    ($version:expr, $migrate_fn:expr) => {\n        if current_version < $version {\n            let tx = conn.unchecked_transaction()?;\n            $migrate_fn(&tx)?;\n            set_schema_version(&tx, $version)?;\n            tx.commit()?;\n        }\n    };\n}\n```\n\n### Safety Checks\n\n1. **Downgrade refusal**: If `user_version > SCHEMA_VERSION`, migration aborts with a descriptive error — silently lowering `user_version` would cause subsequent ALTERs to corrupt the schema.\n\n2. **Ladder consistency**: Before any DDL runs, the system verifies that `MAX(migrations.version)` does not exceed `pragma user_version`. If it does, the ladder is in an inconsistent state (audit rows exist for unapplied DDL), and migration refuses to proceed with recovery instructions.\n\n3. **Audit-trail backfill**: After all steps complete, any missing audit rows are backfilled and a single `warn!` summarizes the rescue. This self-heals databases where earlier versions applied DDL without recording audit rows.\n\n### Notable Migrations\n\n| Version | Purpose |\n|---------|---------|\n| v1 | Core tables: agents, sessions, events, memories, structured_kv, pending_approvals |\n| v29 | Adds `deleted_at` column for decay soft-deletes |\n| v32 | Denormalized `sessions.message_count` for list performance |\n| v33 | Rebuilds `sessions_fts` with unicode61 tokenizer + backfill |\n| v34 | Idempotency-key cache table |\n| v35–36 | Tool-use ID and deferred execution persistence for ACP |\n| v37 | Workflow run persistence (replaces JSON file) |\n| v38 | Backfill `approval_audit.second_factor_used` for pre-TOTP databases |\n| v39 | Per-session model override |\n| v40 | Fold bolted-on `ALTER TABLE agents ADD COLUMN` calls into the ladder |\n| v41 | Composite indexes on `sessions(agent_id, updated_at)` and `audit_entries(agent_id, timestamp)` |\n\n## Proactive Memory — `proactive`\n\nUnified mem0-style API layer that sits atop the structured, semantic, and knowledge stores. Provides:\n\n- **Auto-memorize**: Hook that extracts memories from conversation turns\n- **Auto-retrieve**: Hook that injects relevant memories before response generation\n- **Deduplication**: Cross-chat dedup at the user level (configurable)\n- **Consolidation integration**: Delegates to `ConsolidationEngine`\n\nExposed types: `ProactiveMemory`, `ProactiveMemoryConfig`, `ProactiveMemoryHooks`, `ProactiveMemoryStore`, `MemoryExportItem`, `MemoryStats`.\n\n## Re-exports\n\n`lib.rs` re-exports the primary public API:\n\n```rust\npub use substrate::MemorySubstrate;\npub use session_store::SessionStore;\npub use workflow_store::{WorkflowRunRow, WorkflowStore};\npub use semantic::SqliteVectorStore;\npub use http_vector_store::HttpVectorStore;\npub use namespace_acl::{MemoryNamespaceGuard, NamespaceGate};\npub use proactive::{MemoryExportItem, MemoryStats, ProactiveMemoryStore};\npub use prompt::PromptStore;\npub use provider::{MemoryError, MemoryManager, MemoryProvider, NullMemoryProvider};\n```\n\nPlus type re-exports from `librefang_types::memory`: `MemoryFilter`, `MemoryItem`, `VectorSearchResult`, `VectorStore`, `ExtractionResult`, etc.\n\n## Integration Points\n\n**Kernel** (`librefang-kernel`): calls `run_migrations` at boot, uses `MemorySubstrate` for all persistence, invokes `decay::run_decay` and `prune_soft_deleted_memories` on scheduled intervals.\n\n**Agent Loop**: uses `ProactiveMemoryHooks` for auto-memorize/auto-retrieve, `Session` for conversation persistence.\n\n**API Routes** (`librefang-api`): uses `IdempotencyStore` for POST dedup, `ProactiveMemoryStore` for the memory management endpoints, `NamespaceGate` for ACL enforcement.\n\n**Metering** (`librefang-kernel-metering`): records `UsageRecord` entries for token/cost tracking.\n\n**Runtime** (`librefang-runtime`): uses `Session` for compaction decisions and message preparation.","memory-storage-librefang-memory-wiki-src":"# Memory & Storage — librefang-memory-wiki-src\n\n# librefang-memory-wiki\n\nA durable markdown knowledge vault for the LibreFang Agent OS. Where the memory substrate (`librefang-memory`) excels at nearest-neighbour vector search, this vault provides a navigable, human-auditable knowledge base that can also be opened directly in Obsidian or any Markdown editor.\n\nEvery page carries YAML frontmatter tracking **provenance** — which agent, session, channel, and turn produced each claim — so any reader can trace a fact back to its origin.\n\nThe vault is **off by default**. Operators opt in via configuration.\n\n## Architecture\n\n```mermaid\ngraph TD\n    Tool[wiki_write / wiki_get / wiki_search] --> Vault[WikiVault]\n    Vault --> FM[frontmatter module]\n    Vault --> Render[render module]\n    Vault --> Disk[Filesystem]\n    Disk --> Pages[\"&lt;topic&gt;.md\"]\n    Disk --> Index[index.md]\n    Disk --> Meta[\"_meta/compile-state.json<br/>_meta/backlinks.json\"]\n    Vault -->|read/write| Pages\n    Vault -->|rebuild on every write| Index\n    Vault -->|rebuild on every write| Meta\n```\n\n## Configuration\n\n```toml\n[memory_wiki]\nenabled = true\nmode = \"isolated\"            # isolated | bridge | unsafe_local\nvault_path = \"~/.librefang/wiki/main\"\nrender_mode = \"native\"       # native | obsidian\ningest_filter = \"tagged\"     # tagged | all\n```\n\n| Field | v1 behaviour |\n|---|---|\n| `enabled` | Must be `true` or the vault returns `WikiError::Disabled` on construction. |\n| `mode` | Only `\"isolated\"` is wired. `\"bridge\"` and `\"unsafe_local\"` return `WikiError::ModeNotImplemented`. |\n| `vault_path` | Optional. When unset, resolves to `<home_dir>/wiki/main`, where `home_dir` is the caller-supplied kernel home (not the env-derived `LIBREFANG_HOME`). |\n| `render_mode` | Controls cross-reference syntax: `\"native\"` emits `[topic](topic.md)`, `\"obsidian\"` emits `[[topic]]`. |\n| `ingest_filter` | Has no behavioural effect in v1 (all writes are accepted via explicit `wiki_write` calls). A non-default value logs a warning. |\n\n## On-Disk Layout\n\n```\n<vault_path>/\n├── <topic>.md                  # one page per topic\n├── index.md                    # auto-generated alphabetical index\n└── _meta/\n    ├── compile-state.json      # mtime + sha256 per page (last compiler run)\n    └── backlinks.json          # { target → [source, ...] }\n```\n\n### Page Format\n\nEach `<topic>.md` file is YAML frontmatter followed by Markdown body:\n\n```markdown\n---\ntopic: project-conventions\ncreated: 2026-05-06T10:30:00Z\nupdated: 2026-05-06T11:00:00Z\ncontent_sha256: 6a4f...\nprovenance:\n  - agent: agent_xyz\n    session: sess_abc\n    channel: cli\n    turn: 4\n    at: 2026-05-06T10:30:00Z\n---\n\nbody markdown ...\n```\n\n`content_sha256` is the SHA-256 of the body after stripping one trailing newline. The vault uses this alongside filesystem mtime to detect external hand-edits between compiler runs.\n\n## Module Structure\n\n### `error` — Error Types\n\n`WikiError` is the single error enum, returned as `WikiResult<T>`:\n\n| Variant | Meaning |\n|---|---|\n| `Disabled` | `enabled` is not `true` in config. |\n| `ModeNotImplemented(mode)` | `bridge` or `unsafe_local` requested; only `isolated` works in v1. |\n| `InvalidTopic { topic, reason }` | Topic fails validation (empty, too long, bad characters, reserved name). |\n| `BodyTooLarge { topic, size, cap }` | Page body exceeds the 1 MiB soft cap. |\n| `NotFound(topic)` | No `.md` file exists for the topic. |\n| `HandEditConflict { topic }` | Page was modified externally since the last compiler run; use `force = true` to preserve the edit. |\n| `Frontmatter { topic, source }` | YAML parse error in the frontmatter block. |\n| `Io { path, source }` | Filesystem I/O error. |\n\n`WikiError::io(path, source)` is a helper constructor for wrapping `std::io::Error` with the affected path.\n\n### `frontmatter` — YAML Frontmatter Parsing and Rendering\n\nHandles the split/parse/render cycle for page headers.\n\n**Types:**\n\n- **`ProvenanceEntry`** — Tracks who wrote a claim. Fields: `agent` (required), `session`, `channel`, `turn` (all optional), `at` (timestamp, required).\n- **`Frontmatter`** — Full header: `topic`, `created`, `updated`, `content_sha256`, `provenance` (list).\n\n**Key functions:**\n\n- `Frontmatter::default_for(topic)` — Synthesises a header with `created = updated = now`, empty provenance, empty hash.\n- `Frontmatter::hash_body(body)` — SHA-256 of the body with one trailing newline stripped. Normalises away editor trailing-newline differences.\n- `split(raw) -> (Option<&str>, &str)` — Separates a raw page into YAML block and body. Returns `(None, raw)` for pages without frontmatter, so hand-authored Obsidian pages still load.\n- `parse(yaml, topic) -> Result<Frontmatter>` — Deserialises the YAML block.\n- `render(frontmatter, body) -> Result<String>` — Serialises back to the on-disk `---\\n...\\n---\\n\\nbody\\n` format.\n\nThe split/render cycle roundtrips: `split(render(fm, body))` yields the same frontmatter and body.\n\n### `render` — Link Rendering\n\n`RenderMode` controls how cross-references between pages are written:\n\n| Mode | Output | Use case |\n|---|---|---|\n| `Native` (default) | `[topic](topic.md)` | Plain Markdown renderers |\n| `Obsidian` | `[[topic]]` | Obsidian / Logseq |\n\n**Authoring contract:** Callers always pass `[[topic]]` placeholders in body text. The vault rewrites them at flush time via `RenderMode::rewrite_links(body)`. This means the same body is portable across render modes without re-authoring.\n\n**`RenderMode::extract_links(body) -> Vec<String>`** — Extracts all cross-references from a body in link order. Recognises both `[[topic]]` (Obsidian/authoring form) and `[topic](topic.md)` (native form where visible text equals the target stem). This ensures the backlinks index is invariant under render-mode flips.\n\n### `vault` — Vault Store\n\n`WikiVault` is the main entry point. It manages the on-disk file collection, compile state, and backlinks.\n\n#### Construction\n\n```rust\n// From config (validates enabled, mode, resolves vault_path):\nWikiVault::new(&config, home_dir)?;\n\n// Direct (bypasses enabled check, used by tests and kernel after validation):\nWikiVault::with_root(root, render_mode, ingest_filter)?;\n```\n\nBoth constructors create the vault directory and `_meta/` subdirectory if they don't exist.\n\n#### Public API\n\n**`write(topic, body, provenance, force) -> WikiResult<WikiWriteOutcome>`**\n\nWrites a page. Steps:\n1. Validates the topic name.\n2. Checks body size against the 1 MiB cap.\n3. Acquires the write lock (Mutex serialises concurrent writes to the same vault).\n4. Loads compile state, reads the existing page (if any).\n5. **Hand-edit detection**: Compares on-disk mtime and body SHA-256 against the last compiler run. If either drifted and `force` is false, returns `HandEditConflict`. If `force` is true, preserves the external body and only appends provenance.\n6. Rewrites `[[link]]` placeholders to the active render mode (unless preserving an external edit).\n7. Appends the new `ProvenanceEntry` to the existing frontmatter (provenance is monotonic).\n8. Writes the page atomically (tmp file + rename).\n9. Updates compile state and rebuilds `index.md` and `backlinks.json`.\n\nReturns `WikiWriteOutcome` with the topic, file path, content hash, and whether an external edit was merged.\n\n**`get(topic) -> WikiResult<WikiPage>`**\n\nReads a single page. Returns `NotFound` if no file exists. On read, normalises CRLF to LF (handles Windows/git autocrlf) before splitting frontmatter. If the YAML block is malformed, falls back to a synthetic `Frontmatter::default_for(topic)` and logs a warning — the body remains accessible rather than bricking subsequent reads.\n\n**`search(query, limit) -> WikiResult<Vec<SearchHit>>`**\n\nCase-insensitive substring search across all page bodies and topics. Scoring:\n- Topic name match: +10.0\n- Body matches: `ln(1 + count)` — sub-linear weighting so long pages don't bury short topic-only hits.\n\nResults are sorted by score descending, then topic alphabetically. Each hit includes a 120-character snippet around the first match.\n\n**`backlinks() -> WikiResult<Vec<BacklinkEntry>>`**\n\nReturns all `source → target` backlink pairs from `_meta/backlinks.json`. Deterministic order (target ascending, source ascending).\n\n#### Topic Validation\n\nTopics must satisfy:\n- Non-empty, max 100 characters\n- Match `[a-zA-Z0-9_-]+`\n- Not equal to `index` (reserved for the auto-generated index)\n- Not start with `_` (reserved for vault metadata)\n\n#### Hand-Edit Safety\n\nThis is a core design invariant (issue #3329 acceptance criterion 4):\n\n1. Every successful `write` records the page's mtime (as nanoseconds since epoch) and body SHA-256 in `_meta/compile-state.json`.\n2. On the next `write`, the vault re-reads the file and compares the actual mtime and hash against the recorded values.\n3. If either differs, the file was edited externally (e.g., in Obsidian). Without `force`, the write is rejected with `HandEditConflict`.\n4. With `force = true`, the external body is preserved verbatim. Only provenance is appended and links are rewritten. `WikiWriteOutcome::merged_with_external_edit` signals this happened.\n\nThe dual mtime + hash check survives filesystems with coarse (1-second) mtime precision, because the hash diverges immediately on any content change.\n\n#### Atomic Writes\n\nAll file writes use the tmp-rename pattern: data is written to `<path>.tmp.write`, then `fs::rename`d into place. This prevents readers from seeing partially-written files.\n\n#### Concurrency\n\nA `Mutex<()>` serialises all writes within a single vault instance. Multiple threads can call `write` concurrently; they will queue. Provenance entries accumulate correctly because each write loads the current frontmatter, appends, and flushes.\n\n#### Compile State Rebuild\n\nEvery successful `write` triggers `rebuild_index_and_backlinks`, which:\n1. Iterates all `<topic>.md` files (skipping `index.md`).\n2. Rebuilds `index.md` — alphabetical list of topics with their `updated` timestamps.\n3. Rebuilds `_meta/backlinks.json` — maps each link target to its source pages.\n\nThis is O(n) in the number of pages, acceptable for the expected vault sizes in v1.\n\n## v1 Scope and Limitations\n\n**In scope:**\n- `isolated` mode only\n- Three builtin tools: `wiki_get`, `wiki_search`, `wiki_write`\n- `native` and `obsidian` render modes\n- Hand-edit safety with forced merge\n- Provenance tracking\n\n**Out of scope (tracked as follow-ups to #3329):**\n- `bridge` mode — reading shared artifacts from the memory substrate\n- `unsafe_local` mode — same-machine escape hatch for existing Obsidian vaults\n- Memory-event subscription — v1 ingests only via explicit `wiki_write` calls\n- LLM-assisted topic extraction — v1 requires explicit topic tags\n- Vector/FTS5 ranking in search — v1 uses naive substring matching","memory-storage":"# Memory & Storage\n\n# Memory & Storage\n\nThe persistence layer for the LibreFang Agent OS. It provides two complementary storage backends — one machine-optimised for semantic recall, one human-optimised for auditable knowledge — that together give agents durable, queryable memory across sessions.\n\n## Sub-modules\n\n| Sub-module | Role |\n|---|---|\n| [librefang-memory](librefang-memory-src.md) | Core memory substrate — a unified SQLite persistence layer (via `r2d2` pool, WAL mode) providing structured stores, vector search, knowledge graphs, session history, and proactive memory management (consolidation, decay). |\n| [librefang-memory-wiki](librefang-memory-wiki-src.md) | Durable Markdown knowledge vault with YAML frontmatter provenance tracking. Human-auditable, Obsidian-compatible, and opt-in. |\n\n## How they fit together\n\n```mermaid\ngraph LR\n    AgentLoop[Agent Loop] --> MS[Memory Substrate]\n    AgentLoop --> WV[Wiki Vault]\n    MS -->|chunker feeds| WV\n    WV -->|provenance references| MS\n    MS --> SQLite[(SQLite · WAL)]\n    WV --> Disk[(Markdown Files)]\n```\n\nThe **memory substrate** handles high-frequency, structured access — nearest-neighbour vector search, session state, prompt templates, idempotency checks, usage accounting. Everything flows through a single `r2d2` connection pool.\n\nThe **wiki vault** handles low-frequency, high-fidelity knowledge — long-form pages that agents write via `wiki_write` / `wiki_get` / `wiki_search` tools. Each page carries provenance frontmatter (agent, session, channel, turn) so any claim can be traced back to its origin. The vault detects human hand-edits and will not silently overwrite them.\n\nThe key bridge between the two is **chunking**: the memory substrate's `chunker` module produces the text segments that the wiki's `frontmatter` splitter consumes, ensuring consistent segmentation across both stores. Provenance entries in the wiki reference session identifiers held in the substrate, completing the traceability loop.\n\n## Typical cross-module workflow\n\n1. **Agent produces a claim** during a session tracked by `SessionStore`.\n2. **Short-term**: the claim is embedded and stored via `SemanticStore` for vector recall.\n3. **Long-term**: if the wiki is enabled, the agent calls `wiki_write`; the vault records provenance linking back to the session, and the `frontmatter` module uses the shared chunking logic to segment content.\n4. **Consolidation & decay**: the substrate's consolidation pass merges similar memories and decays stale ones, while the wiki retains its pages durably unless explicitly pruned.\n5. **Recall**: future sessions query `SemanticStore` for semantic matches or `wiki_search` for authored knowledge — the substrate answers \"what's similar?\" while the wiki answers \"what did we write down?\"","other-librefang-acp-tests":"# Other — librefang-acp-tests\n\n# librefang-acp Integration Tests\n\nEnd-to-end tests that verify the ACP (Agent Client Protocol) adapter's on-the-wire JSON-RPC behaviour without requiring a real LibreFang kernel or LLM provider.\n\n## Architecture\n\nEach test creates an in-memory duplex connection, runs `librefang_acp::run_with_transport` on the server side, and drives an `agent_client_protocol::Client` on the other. A `MockKernel` stub satisfying the `AcpKernel` trait provides deterministic canned responses.\n\n```mermaid\ngraph LR\n    Client[\"ACP Client<br/>(editor stub)\"]\n    Duplex[\"tokio::io::duplex<br/>(in-memory pipes)\"]\n    Server[\"run_with_transport<br/>(ACP adapter)\"]\n    Kernel[\"MockKernel<br/>(AcpKernel impl)\"]\n\n    Client <-->|JSON-RPC frames| Duplex\n    Duplex <-->|JSON-RPC frames| Server\n    Server -->|trait calls| Kernel\n    Kernel -->|broadcast/reverse-RPC| Server\n```\n\n## Test Harness\n\n### `MockKernel`\n\nA thread-safe stub implementing `AcpKernel`. Key fields:\n\n| Field | Purpose |\n|---|---|\n| `canned_events` | `Vec<StreamEvent>` drained by `send_prompt` — simulates LLM output |\n| `approval_tx` | `broadcast::Sender<ApprovalEvent>` — inject approval requests for round-trip tests |\n| `resolves` | Captures `(Uuid, ApprovalDecision)` pairs from `resolve_approval` calls |\n| `last_session_id` | Records the LibreFang session ID from the most recent `send_prompt` |\n| `fs_client` | Holds the `FsClientHandle` set at `initialize` time for reverse-RPC testing |\n| `terminal_client` | Holds the `TerminalClientHandle` set at `initialize` time for reverse-RPC testing |\n| `canned_history` | Message history returned by `fetch_session_history` — drives session/load replay |\n\nConstruction: `MockKernel::new(canned_events)` returns `Arc<MockKernel>` so it can be shared between the server task and test driver.\n\nHelper methods:\n\n- **`set_history(history)`** — populate canned session history\n- **`fs_client_handle()`** / **`terminal_client_handle()`** — retrieve the reverse-RPC handles after `initialize`\n- **`fire_approval(lf_session_id)`** — injects an `ApprovalEvent::Created` into the broadcast channel, returning the `Uuid` of the synthetic request\n\n### `duplex_pair()`\n\nCreates two `tokio::io::duplex` pipes and wraps them with `tokio_util::compat` to get `futures::AsyncRead` + `futures::AsyncWrite` pairs:\n\n```\nserver reads from a, writes to d\nclient reads from c, writes to b\n```\n\n### `recv<T>(sent: SentRequest<T>) -> Result<T, Error>`\n\nConverts a `SentRequest` into a `oneshot` channel and awaits the result. Required because the ACP client's request API is callback-based rather than directly `await`-able.\n\n### `poll_for<T>(f: FnMut() -> Option<T>) -> T`\n\nPolls a closure up to 40 times (25ms sleep between attempts, ~1s total) until it returns `Some`. Used to wait for handles that become available asynchronously (e.g., after `initialize` completes on the server).\n\n## Test Coverage\n\n### `initialize_and_prompt_emits_text_chunks_and_end_turn`\n\nVerifies the core prompt flow:\n\n1. Client sends `InitializeRequest` → asserts `agent_info.name == \"librefang\"`\n2. Client sends `NewSessionRequest` → receives a `session_id`\n3. Client sends `PromptRequest` with text content\n4. MockKernel feeds two `TextDelta` events followed by `ContentComplete` with `EndTurn`\n5. Asserts the client receives two `AgentMessageChunk` notifications with the concatenated text, and the prompt response has `stop_reason == EndTurn`\n\nUses `LocalSet` + `on_receive_notification` to capture session notifications.\n\n### `permission_round_trip_resolves_kernel_approval`\n\nVerifies the approval/permission reverse-RPC path:\n\n1. Initialize and create a session, then start a prompt (keeps the bridge active)\n2. Wait for `last_session_id` to appear on the kernel (via `wait_for_session_id`)\n3. Call `fire_approval` to inject an `ApprovalEvent::Created`\n4. The bridge converts this into a `session/request_permission` to the client\n5. Client handler responds with `allow_once`\n6. Assert the kernel's `resolve_approval` was called with `ApprovalDecision::Approved`\n\nThe client handler also asserts that the request carries exactly 4 permission options.\n\nHelper functions:\n- **`wait_for_session_id`** — polls `last_session_id` up to 1s\n- **`wait_for_resolve`** — polls `resolves` for a specific `Uuid`, panics if not found within 1s\n\n### `unknown_session_id_returns_invalid_params`\n\nError path test: sends a `PromptRequest` with a fabricated session ID (`\"does-not-exist\"`) without first calling `NewSession`. Asserts the result is an error.\n\n### `fs_read_text_file_round_trip`\n\nTests the filesystem reverse-RPC:\n\n1. Client initializes with `client_capabilities.fs.read_text_file = true`\n2. After `initialize`, pulls the `FsClientHandle` from the kernel\n3. Calls `handle.read_text_file(session_id, \"/tmp/hello.txt\", None, None)`\n4. The server-side bridge issues a `fs/read_text_file` request to the client\n5. Client handler asserts the path matches and responds with `\"canned editor content\"`\n6. Asserts the `FsClientHandle` returns the canned content\n\n### `terminal_run_command_round_trip`\n\nTests the full terminal lifecycle via `AcpTerminalClient::run_command`:\n\n1. Client initializes with `client_capabilities.terminal = true`\n2. After `initialize`, pulls the `TerminalClientHandle` from the kernel\n3. Calls `handle.run_command(\"echo\", vec![\"hello\"], Vec::new(), None, None)`\n4. The bridge issues four sequential requests to the client:\n   - `CreateTerminalRequest` → responds with `TerminalId(\"term-1\")`\n   - `WaitForTerminalExitRequest` → responds with exit code `0`\n   - `TerminalOutputRequest` → responds with `\"hello world\\n\"`, not truncated\n   - `ReleaseTerminalRequest` → responds with default\n5. Asserts the returned `AcpTerminalRunResult` has `output == \"hello world\\n\"`, `exit_code == Some(0)`, `truncated == false`, `signal == None`\n\n### `session_load_replays_history_to_client`\n\nTests session reconnection history replay (is
